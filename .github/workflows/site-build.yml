name: Site Build

on:
  pull_request:
    branches: ["source"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history supports plugins that derive dates from Git history.
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Test Stance validator
        run: bundle exec ruby -Itest test/stance_tag_validator_test.rb

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          # The stance validator writes its full grouped report here when it
          # fails, so the next step can show it without anyone opening the log.
          STANCE_VALIDATION_REPORT: stance-validation-report.txt

      - name: Publish validation report
        if: failure()
        run: |
          {
            echo '## Site build failed'
            echo
            if [ -s stance-validation-report.txt ]; then
              echo '```'
              head -c 60000 stance-validation-report.txt
              echo
              echo '```'
              echo
              echo 'Entry numbers are 0-based positions in the YAML list.'
              echo 'Reproduce locally with `bundle exec ruby bin/validate_stance.rb`.'
            else
              # Absent for failures the stance validator was not responsible
              # for: Liquid errors, gem issues, a failing unit test.
              echo 'Not a Stance data problem; see the failed step above.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
