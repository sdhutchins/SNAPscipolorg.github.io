- id: ga-q1
  question: >-
    Georgia is becoming a hub for data centers due to tax breaks, amenable
    regulations, and available land (Perdue, 2025). While data centers may grow
    the tech industry in Georgia, data centers also have environmental and
    health impacts, such as significant water and electricity usage, as well as
    noise pollution (Science for Georgia, 2026). How will you protect Georgian
    health and property values with data center legislation?
  tag:
    - Artificial Intelligence
    - Energy
    - Environment
    - Public Health

- id: ga-q2
  question: >-
    How will you ensure communities have meaningful opportunities to provide
    public comments that inform state and local decision making?
  tag:
