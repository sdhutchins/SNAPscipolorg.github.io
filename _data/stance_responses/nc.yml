    In general, I believe Raleigh should welcome innovation and the economic investment that comes with new technology, but growth cannot come at the expense of affordability, public health, or our natural resources. Before approving major data center development, local government should evaluate its full impact on our electricity and water systems and then still proceed cautiously as we investigate all of the details surrounding these projects, including who pays for necessary infrastructure upgrades and whether those costs could ultimately be passed on to residents.

    I would support clear, transparent standards with accountability for large-scale developments, including responsible water use, energy efficiency, environmental protections, and meaningful community engagement. We should also work with Duke Energy, Raleigh Water, regional governments, and state regulators to ensure that infrastructure keeps pace with growth.


    My approach is simple: if a development creates jobs and investment, that's good for Raleighites — but it should also make a fair contribution toward the infrastructure and resources it requires and not pass costs downstream nor irreversibly deplete important resources and pollute the environment.

