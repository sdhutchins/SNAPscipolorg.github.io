    Elected officials should not expect the public to trust science simply because we say, "the experts agree." Trust is earned through transparency, honesty, and consistency.

    I believe elected officials should work directly with scientists and public health professionals to explain not only what we know, but how we know it along what we still don't know. We should communicate uncertainty honestly rather than pretending every question has a simple answer.

    Just as importantly, scientists and government need to meet people where they are. That means listening to community concerns, engaging trusted local institutions, making information understandable, and being willing to correct mistakes when new evidence emerges.

    My role as an elected official would not be to be the scientist in the room. It would be to make sure scientists are heard, evidence is respected, and residents have clear, honest information they can use to make informed decisions.

