    Rising costs are the chief concern of nearly all of our residents. Measures to prevent these rises and promote lowering costs are the kitchen table issues that will drive voters out to the polls far more than the nebulous goal of “AI advancement,” or the desires of data center investors. With that, the deleterious effects of resource hungry data centers will have serious consequences to the people in my district with none of the benefits. It is my position that a moratorium on data centers be enacted in both the 52nd district and North Carolina as a whole for a minimum of one year, until all of the ecological studies can be completed, and the reviews of other communities outside of our state have been studied. However, I am not opposed to progress. If it can be proven that the data centers will not negatively impact the health of our residents and wildlife, the costs not be prohibitive, and iron clad protections for the residents be agreed upon when, not if, situations arise in the future that injury to persons or property are the fault of the data centers, I will consider the possibility of their installation and employment. This region has a very contentious history with big monied interests, most notably the Hamlet chicken processing plant fire, NC’s second worst industrial disaster in history resulting in 25 deaths in 1991, and the GenX pollution of the Cape Fear river basin. The people of this area are past the promises of outside organizations that inevitably make huge profits but disappear when people get sick, and their concerns lead me to err on the side of caution.

