    Government's core job here is the physical infrastructure: clean water, safe food, hospitals that stay open, and the capacity to respond when something goes wrong.

    On contamination, I am direct. The company that put a chemical in the water should pay to take it out — not the ratepayer. PFAS testing and treatment are expensive, and smaller water systems cannot absorb that cost alone. I support state cost-share for treatment upgrades paired with real financial responsibility for the manufacturers. The same principle applies to asbestos and lead remediation in older schools and housing.

    On preparedness, I speak from some experience. I serve on the board of Patriot Relief, a Cabarrus County-based nonprofit founded in the aftermath of Hurricane Helene to move volunteers and supplies into western North Carolina — and to keep showing up long after the news trucks left. What that work taught me is that the failure point is almost never good intentions. It is local capacity: water systems, communications, road access, and the ability to move people and material in the first seventy-two hours. That deserves standing investment and agreements signed before the storm, not a scramble afterward.

