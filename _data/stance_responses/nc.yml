    Our federal and state governments are cutting support for education. Wake County schools are already suffering from abysmal infrastructure, including leaking roofs, broken HVAC, and suspected mold. I will ensure that public schools get the funding they need to provide quality education to our students, including those with special needs. I will work to find ways to provide the necessary funds for all aspects of our schools, including buildings and equipment, support (salaries, benefits, training) for WCPSS teachers and other staff.


    Besides additional funding, one way to improve workforce preparedness is by engaging the community. Wake County has a phenomenal pool of educated people and especially retirees who want to give back to the community. I will work to advance community participation in education through programs such as Communities in Schools for mentoring students so that students whose families may lack college-educated adults can benefit from the experience and expertise of retirees, especially to enhance STEAM offerings across our schools.


    As I know from my own career, new technologies and business practices emerge in surprising ways. Therefore, I will ensure not only that Wake Tech has the resources, both staff and infrastructure, to keep its curricula up-to-date with new technology but also that it has offerings for adults to upskill themselves, especially in industries that are gaining prominence in the County. Even people who are currently employed may future-proof their employability by preparing for upcoming careers.


    A big challenge for Wake Tech students with children is child care and especially so for working adults, especially women and single parents. I will examine how to expand options for all, including childcare grants and universal preschool.


    I will seek to expand Wake Tech’s partnerships with public schools. For example, the Cooperative Innovative High Schools program enables students to earn a high school diploma while earning credits for an associate degree. I will seek to expand it from four schools currently by finding ways to support staff (for teaching and coordinating with outside stakeholders) and transportation solutions so they are viable for students without personal cars.


    I will seek to expand apprenticeship opportunities for students at local companies. I will foster closer relationships with leading employers of Wake Tech graduates, where they contribute financially, hire student interns, and provide experienced employees as adjunct teaching staff to bring real-world experience to guide students. Given the cost to a company of recruiting qualified employees, such support by them would be beneficial to them, not just to students.


    Broadband access for all and County libraries are crucial to workforce development. Not only do libraries level access to knowledge, they also provide computers for learning and job search and facilities to use for job interviews. I will try to ensure that libraries across the County have modern resources and new libraries are architected for all these essential purposes with agility in meeting future community needs.

