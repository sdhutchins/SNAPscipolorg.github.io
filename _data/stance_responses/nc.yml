    North Carolina cannot build a strong science and biotechnology workforce without first making the necessary public investments in education. As a legislator, I would support fully funding our public schools, strengthening STEM instruction, and ensuring that schools have the teachers, laboratory equipment, technology, and instructional resources needed to prepare students for careers in science, biotechnology, health care, and advanced manufacturing.

    I would also support increased state investment in community colleges so they can offer affordable, industry-aligned science and technical programs without shifting additional costs onto students. That includes funding for updated curriculum, modern equipment, faculty recruitment and retention, and short-term credential programs that respond directly to regional workforce needs.

    The state should also expand dual-enrollment opportunities, apprenticeships, internships, and partnerships among K–12 schools, community colleges, universities, and biotechnology employers. These programs should be available in rural communities as well as our larger metropolitan areas.

    Finally, I would support workforce-development incentives that require companies receiving state economic-development assistance to invest in local training, internships, and employment pipelines. If North Carolina is using public resources to attract science and biotechnology companies, those investments should also create clear educational and career opportunities for North Carolina residents

