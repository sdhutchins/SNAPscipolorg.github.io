  question: nc-q4
  primary_candidate: false
  response: |
    Trust cannot be demanded. It has to be earned.

    One of the most important things elected officials and scientists can do is distinguish scientific evidence from political authority.

    Science is a process for investigating questions. It develops through observation, experimentation, replication, criticism, and revision. Changing a conclusion when better evidence becomes available is not a weakness of science; it is one of its strengths.

    Public officials should communicate that process honestly.

    That means distinguishing what we know from what we believe is likely, acknowledging uncertainty, explaining competing interpretations when legitimate disagreements exist, and correcting mistakes openly.

    Whenever practical, the evidence underlying important public decisions should also be accessible. Data, methodology, assumptions, models, conflicts of interest, and limitations should be available for independent examination while appropriately protecting personal information and legitimate security concerns.

    I am particularly interested in the broader problem of evidence architecture: how modern systems can preserve provenance, integrity, and context so people can independently examine the evidence behind important claims and decisions.

    In an era of artificial intelligence, synthetic media, misinformation, and enormous volumes of information, simply telling citizens which sources they should trust will become increasingly ineffective. We need systems that make important claims more verifiable.

    Scientists can contribute by explaining their work in understandable language and engaging directly with communities. Elected officials can contribute by resisting the temptation to selectively invoke science only when it supports a preferred political outcome.

    The objective should not be unquestioning trust in government, politicians, institutions, or even scientists.

    It should be a society in which evidence is accessible, claims can be examined, institutions are accountable, and people have good reasons to trust the processes used to reach important conclusions.

