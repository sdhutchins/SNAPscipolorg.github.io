    Data centers must be responsibly regulated so that economic development does not come at the expense of the people who already live in our communities. I support clear standards governing where data centers can be located, including adequate distance from residential neighborhoods, schools, and environmentally sensitive areas.

    Before approving new data centers, communities should evaluate their impact on electricity demand, water usage, air quality, noise, infrastructure, and public health. Residents should not be forced to absorb higher utility costs because a large data center requires significantly more electricity or water.

    I also believe data center developers should be required to pay their fair share of the infrastructure and energy costs created by their projects. If their operations require expanded electrical capacity, water systems, roads, or other public infrastructure, those costs should not simply be passed along to residential customers and taxpayers.

    Economic development is important, but it must be responsible development. Any data center approval should include strong environmental protections, meaningful community input, transparency about projected water and energy consumption, and enforceable requirements that protect nearby residents from increased costs and environmental harm.

