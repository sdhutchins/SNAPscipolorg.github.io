    Government has a fundamental responsibility to protect public health and make sure people can live, work, and raise their families in safe communities. That means taking evidence-based action on issues ranging from vaccine access and disease prevention to environmental hazards such as PFAS, asbestos, contaminated water, and air pollution.

    I believe government should focus on three things: prevention, preparedness, and access. We should invest in public health infrastructure before a crisis occurs, make essential health resources accessible to people regardless of income or neighborhood, and communicate clearly during emergencies.

     At the same time, public policy should be grounded in the best available scientific evidence and implemented in a practical, transparent way. Local government cannot solve every public health challenge alone, but Raleigh can be a strong partner with Wake County, healthcare providers, schools, and state and federal agencies.

    Protecting public health isn't about government telling people how to live; it's about making sure everyone has a fair opportunity to live in a safe, healthy community.

