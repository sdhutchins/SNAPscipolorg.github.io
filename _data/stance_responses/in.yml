    The balance starts with an honest premise: PFAS are a class of chemicals engineered specifically for persistence. That property is what makes them useful in cookware, firefighting foam, textiles, and medical devices — and it is the same property that makes them accumulate in soil, water, and human tissue. Policy that pretends we can have the utility without managing the persistence is policy that fails on contact with the science.

    My framework rests on four principles:

    1. Health protection scales with exposure data, not political convenience. EPA's enforceable drinking water limits for PFOA and PFOS were a necessary floor, not a ceiling. Congress should fund the monitoring infrastructure — state labs, rural water systems, biomonitoring studies — that lets us set future limits on evidence rather than estimates. You cannot regulate what you refuse to measure.

    2. Testing and disclosure obligations belong on the manufacturer, not the public. The current system reverses that burden: a chemical enters commerce, communities get sick, and then taxpayers fund the epidemiology to prove it. A rational statute would require pre-market characterization of persistence, bioaccumulation, and toxicity for any new PFAS compound, with the data public and the cost borne by the party seeking to sell the product.

    3. Feasibility for manufacturers is real and should be addressed through phased substitution, not denial. For uses where safer substitutes exist and perform (many consumer textiles, food packaging, cosmetics), the phase-out timeline should be aggressive. For uses where no adequate substitute yet exists (certain medical devices, semiconductor manufacturing, specific firefighting applications), the policy should fund substitution research and set defined sunset dates rather than indefinite exemptions. "Essential use" is a legitimate category. "Essential forever" is not.

    4. Legacy contamination requires a liability regime, not a cleanup lottery. Communities in Indiana and across the country are already drinking, breathing, and farming PFAS they did not choose. Remediation costs should fall on the manufacturers who profited from the persistence, not on municipal water ratepayers who had no role in the decision. The polluter-pays principle is older than the chemistry.

    Where Congress should move specifically: fully fund EPA's PFAS testing and remediation grants, close the "new PFAS" loophole in TSCA that allows manufacturers to introduce replacement compounds with minimal review, require disclosure of PFAS content in consumer products, and extend CERCLA liability to the broader PFAS class rather than compound-by-compound. None of this is anti-industry — it's pro-market. A market cannot allocate risk it is not allowed to see.

    Through the Congress App, any specific vote I'd cast on PFAS legislation would be published with its fiscal breakdown and bound to the verified constituents of IN-09 before the vote. The science informs the position. The district confirms the vote.

