    A $24 million year-over-year decline in federal research funding to Indiana universities is not a budget line. It is graduate students who don't get recruited, early-career faculty who leave for industry or for other states, instruments that don't get purchased, and research programs — many of them agricultural, medical, and energy-focused — that lose continuity they cannot easily rebuild. Federal research dollars are patient capital. When you cut them, the damage shows up on a lag, and so does the recovery.

    My view, directly: these reductions are a strategic error, and reversing them should be a priority. Here's the reasoning and the policy framework.

    Why federal research funding matters, specifically for IN-09:

    Indiana University, Purdue, and the regional campuses that serve the 9th District conduct research in areas that map directly onto this district's economy and quality of life — agricultural science and crop genetics, rural health delivery, pharmaceutical development, materials engineering, water quality, and energy systems. The federal dollars that fund that work return to Indiana as patents, startups, extension services, trained workforce, and clinical capacity. Cutting the input doesn't save money. It transfers the economic benefit to other states and other countries that are still investing.

    The United States currently funds federal R&D at a lower share of GDP than it did during the Apollo era, and lower than several direct competitors — most notably China, which has been increasing its research investment at double-digit annual rates for over a decade. The question is not whether we can afford to fund research. It is whether we can afford not to.

    Policies I would support:

    1. Restore and stabilize baseline funding at NIH, NSF, DOE Office of Science, USDA NIFA, and NIST. These are the agencies whose grants reach Indiana universities most directly. Year-to-year volatility is almost as damaging as the headline cuts themselves — labs cannot plan multi-year research programs when the appropriation whipsaws. Multi-year authorizations with real floors would restore the predictability that makes long-horizon science possible.

    2. Protect indirect cost recovery. Recent proposals to cap indirect cost rates at arbitrary low levels sound like efficiency reforms. They are not. Indirect costs fund the facilities, administrative compliance, data infrastructure, and safety systems that make research possible. Capping them below true cost forces universities to subsidize federal research out of tuition — which raises costs for Indiana families — or to stop competing for federal grants entirely. Either outcome is worse than the status quo.

    3. Prioritize rural-serving and land-grant institutions in competitive grant structures. Indiana's land-grant and regional campuses serve populations and problems that elite coastal universities do not. Grant program design should reflect that — not through quotas, but through evaluation criteria that credit real-world deployment, extension capacity, and workforce impact alongside pure citation metrics.

    4. Tie funding growth to accountability, not to ideology. Research funding should be defended against both arbitrary cuts and arbitrary ideological restrictions on what can be studied. Peer review, replication standards, and open-data requirements are legitimate accountability mechanisms. Political filters on which questions scientists are allowed to ask are not. I would oppose both the cuts and the content restrictions, and I would say so on the floor regardless of which party was proposing which.

    5. Fund the training pipeline, not just the research. Graduate student stipends, postdoctoral fellowships, and early-career faculty startup packages are the leading indicators of American scientific capacity ten years out. The $24M decline hits those line items hardest and least visibly. Any restoration package should prioritize them.

    On the honest tradeoff:

    I am a fiscal conservative, and I do not believe every federal dollar is well spent. Research funding deserves scrutiny — specifically for duplication across agencies, for grants whose outputs never see the light of a replication study, and for administrative overhead that has grown faster than research output. Those are real problems and reform is warranted. But reform is not what the $24M cut represents. It represents retreat.

    The policy question is whether Indiana wants to be a state that produces the next generation of agricultural science, medical research, and energy innovation, or a state that imports those outcomes from somewhere else. I know which future I am running to build.

    Through the Congress App, any vote I would cast on an appropriations bill, authorization, or agency reauthorization affecting research funding would be published with its fiscal breakdown and bound to the verified constituents of IN-09 before the vote.

