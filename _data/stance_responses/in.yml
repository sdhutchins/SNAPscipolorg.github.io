    Data centers rightly serve as a focus and catalyst for the growing economic divide in America and in Indiana. Impossibly large, expensive, and secretive corporate structures going up in struggling communities. Frankfort, IN, where I live, just passed a resolution to allow DataOne to build one here. All this on the heels of SBA1 (legislation passed 2025) which cuts most communities property tax income from corporate entities in half, and it starts to feel like a conspiracy to force people to accept these new edifices or reduce available services.

    My plan to deal with these issues is multifaceted. First, a moratorium on data center construction until structural change in the process can be implemented. Second, they must provide all of their own power/additional for local community and a comprehensive water treatment plan with zero pollutants added to the environment, including light and sound. Third, commitments to pay and invest in the communities that they are entering.

