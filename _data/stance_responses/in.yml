    Indiana is at the leading edge of a national build-out: 59 operating data centers, 12 under construction, 27 more proposed. The economic opportunity is real. So is the risk — and the risk falls disproportionately on residential ratepayers, rural grids, and water tables that were not designed for this load profile. Policy has to hold both truths at once.

    On managing existing and new data centers, I support four mechanisms:

    1. Mandatory Community Benefit Agreements (CBAs) as a condition of siting. I've drafted the Community Data Benefit Act specifically for this. Any facility above a defined load threshold would be required to negotiate an enforceable CBA with the host community covering local hiring targets, workforce training commitments, infrastructure contributions, and measurable environmental performance. "Jobs created" is not a CBA. A signed, auditable agreement with clawback provisions is.

    2. Enforceable efficiency standards — specifically Power Usage Effectiveness (PUE) benchmarks. New facilities should be required to meet a defined PUE ceiling at commissioning, with scheduled tightening over the facility's life. Waste heat recovery for district heating, greenhouse agriculture, or adjacent industrial processes should be incentivized where geography permits. Heat is energy we already paid for; venting it to the sky is a policy failure, not an engineering one.

    3. Public dashboards for energy, water, and emissions. Any facility of material size should publish quarterly data on electricity consumption, water withdrawal, PUE, and renewable energy mix. Residents cannot evaluate a facility they cannot measure. This is the same transparency logic I apply to my own campaign finances.

    4. Ratepayer protection through cost-allocation reform at the state and federal level. This is the specific question on utility bills, and it deserves a specific answer.

    On mitigating utility cost burden for residents — the mechanisms that actually work:

    Separate rate classes for hyperscale load. Residential and small-commercial ratepayers should not subsidize transmission upgrades, generation capacity, or grid-hardening investments driven by data center demand. FERC and state utility commissions have the authority to require data centers to pay the full incremental cost of the infrastructure their load requires. Congress should reinforce that authority and close the loopholes that let hyperscale customers negotiate special rates whose costs get socialized onto households.

    "Bring your own power" requirements for new facilities above threshold. Several states are moving toward requiring large new loads to contract directly for new generation (renewable, nuclear, or firm) rather than drawing from existing capacity that was built for residential and small-business use. Indiana should adopt this standard. It aligns the economics: the entity creating the demand funds the supply.

    Water-use pricing that reflects aquifer impact. In regions where data centers draw from stressed aquifers, tiered pricing and withdrawal caps protect agricultural and residential users whose wells share the same water table.

    Transparency on utility rate cases. When a utility files for a rate increase driven by data center load, the filing should disclose, in plain language, what share of the increase is attributable to that load. Ratepayers deserve to know when they are being asked to subsidize corporate infrastructure.

    Why these steps: because the alternative — the status quo — is already playing out. Across the country, residential electricity rates are climbing in the same regions where hyperscale data center build-outs are concentrated. The economic benefit of the facility accrues to the operator and a narrow set of construction and operations jobs. The cost burden spreads across every household on the grid. That is a policy choice, not a market outcome, and Congress has the tools to change it.

    Indiana can be a leader in the AI infrastructure economy without turning residential ratepayers into involuntary investors. The two goals are compatible — but only if the rules are written before the concrete is poured.

    Through the Congress App, any specific vote I'd cast on data center or utility legislation would be published with its fiscal breakdown and bound to the verified constituents of IN-09 before the vote.

