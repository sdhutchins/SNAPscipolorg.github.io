    I'm not for or against data centers across the board but have called for a one-year moratorium on data centers to establish better standards for evaluating their impacts. They can bring jobs, investment, and infrastructure improvements, but they can also create problems with land use, energy demand, water consumption, and quality of life.

    Local residents and their elected officials should decide whether a data center is right for their community. To do that:

    1. The state should not block a community from welcoming a project or force one on a community that doesn't want it.
    2. Non-disclosure agreements that prevent elected officials from sharing information about proposed data center projects should be illegal. People deserve to know what's being proposed and how it could affect their community.
    3. Municipalities need better guidance on evaluating proposals. Companies should pay the additional costs their projects create, including electrical generation, transmission, and infrastructure, rather than shifting those costs onto existing utility customers. Communities also need clear answers about water use and its impact on local supplies.
    4. Environmental and regulatory oversight needs to continue after a data center begins operating, not end when the project is approved. Current oversight is inadequate.

