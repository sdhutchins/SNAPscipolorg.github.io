    My background is electrical engineering, which means two things for how I approach science in policy. First, I have the technical literacy to read primary sources — journal articles, agency technical reports, standards documents — without needing them pre-digested by a lobbyist or a cable news panel. Second, and more importantly, engineering teaches you that confidence should scale with evidence, not with volume. The loudest voice in the room is almost never the most informed one.  My process, in practice:  1. Start with primary sources, not summaries. For any science-adjacent policy question, I go to the underlying literature first — peer-reviewed journals, National Academies consensus reports, agency technical documents (EPA, NIH, NIST, DOE, CBO analyses). Press releases and advocacy summaries come later, if at all, and only as a check on whether the framing matches the data.  2. Weight the evidence hierarchy honestly. A single study is a data point. A meta-analysis is a signal. A National Academies consensus report is a settled position until new evidence displaces it. I try to be explicit — with myself and with constituents — about where on that hierarchy a given claim sits.  3. Cross-check with practitioners who have no stake in the policy outcome. Academic researchers, working engineers, clinicians, farmers, utility operators — people who deal with the physical reality of the issue daily. Their lived expertise catches the places where a clean study assumption breaks down in the field.  4. Separate the science from the value judgment. Science can tell you what a policy will do. It cannot tell you whether that outcome is worth the cost. I try to name that boundary out loud so constituents can distinguish "here's what the evidence shows" from "here's the value trade-off I'm asking you to weigh in on through the Congress App."  5. Update when the evidence does. This is the hardest part in politics, because flip-flopping is punished. But refusing to update when evidence changes is how we get bad policy that outlives its justification. I'd rather take the hit for changing my mind than govern on a position the data no longer supports.  An example of this process in action:  My position on large-scale data center siting evolved substantially over the last year. I started from a default pro-infrastructure stance — Indiana building the backbone of the AI economy is, in the abstract, a win for the state's economic future, and my engineering instinct is to welcome build-out.  What changed my view was reading the primary load-growth data: utility integrated resource plans (IRPs) filed with state commissions, FERC transmission queue data showing the scale of interconnection requests, and peer-reviewed analyses of PUE trends and water consumption at hyperscale facilities. The data showed a demand curve that residential and small-commercial grid infrastructure was never designed to absorb, with cost-allocation mechanisms that systematically shift the burden onto households.  Talking to utility engineers and municipal water managers in affected regions confirmed the picture: the problem wasn't the data centers themselves, it was the regulatory structure governing who pays for the infrastructure they require. That shifted my position from "welcome the build-out" to "welcome the build-out, but only with cost-allocation reform, mandatory community benefit agreements, and bring-your-own-power requirements first." The Community Data Benefit Act I've drafted is the direct output of that evidence-driven update.  The underlying value — Indiana should be a leader in advanced infrastructure — didn't change. The mechanism required to honor that value without harming the people already living here did.  That's the process. Primary sources, honest weighting, practitioner cross-checks, named value boundaries, and the willingness to update. Through the Congress App, every vote I'd cast on a science-related bill would carry the fiscal breakdown and the evidence base in plain English, so constituents can audit both the reasoning and the result.

