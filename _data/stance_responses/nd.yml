  response: |
    "I would support policies that strengthen tribal environmental capacity while respecting tribal sovereignty, priorities, and leadership. This work should be a partnership among governments, not a state-directed approach imposed on tribal nations.

    I would support state funding and technical assistance for tribal environmental departments, including water-monitoring equipment, laboratory access, land-management tools, and staff training. Funding should cover ongoing operations and maintenance, not just initial equipment purchases.

    I would also support grant-writing assistance and state matching funds where needed to help tribal nations access federal resources. EPA’s General Assistance Program provides a foundation for building tribal environmental programs, including water-quality monitoring capacity.

    Partnerships with tribal colleges, NDSU, and other research institutions could expand paid internships, training, and environmental science careers for tribal students. These partnerships should recognize Indigenous knowledge alongside scientific research, with tribal consent and control over sensitive information.

    I would advocate for early, meaningful consultation on projects affecting tribal lands, waters, and treaty rights, alongside voluntary agreements for monitoring, emergency response, and data sharing.

    These investments matter because protecting water, land, and public health requires sustained local expertise. My goal would be to help tribal nations build lasting capacity on their terms while strengthening environmental stewardship across North Dakota."

    KEYWORDS: Tribal sovereignty, government-to-government partnerships, environmental stewardship, tribal capacity building, water-quality monitoring, land management, infrastructure investment, technical assistance, equitable funding access, tribal colleges, workforce development, Indigenous knowledge, tribal data sovereignty, meaningful consultation, treaty rights, collaborative research

- candidate_first_name: Nyamal
  candidate_last_name: Dei
  state: nd
  race: State Senate
  district: 41
  party: Democratic
  question: nd-q6
  date: 2026-10-22
  response: |
    "State government should play an active role in funding independent research and ensuring reliable, publicly accessible data on geologic CO₂ storage. North Dakota already administers its Class VI permitting program, making strong oversight a state responsibility.

    I would support research partnerships with universities and qualified scientists to evaluate underground CO₂ movement, groundwater quality, pressure changes, potential seismic activity, and long-term containment. 
    
    Monitoring should establish baseline conditions before injection and continue through operations, closure, and the post-closure period.

    Public funding should support research that serves the public interest—not replace developers’ financial responsibilities. Federal Class VI requirements already include operator monitoring, reporting, and financial assurance for corrective action, plugging, post-injection care, and emergency response.

    I would support adequate regulatory staffing, independent verification of company data, conflict-of-interest disclosures, and accessible public reporting. Residents, landowners, and tribal nations should receive clear explanations of findings, uncertainties, and potential risks.

    Research should evaluate storage effectiveness and net climate benefits, rather than assume that injected CO₂ automatically equals avoided emissions. I would support enforceable response thresholds and authority to pause injection when evidence warrants.

    My priority is responsible innovation: protecting drinking water, respecting property rights, and ensuring taxpayers are not left with preventable long-term costs."

    KEYWORDS: Independent research, geologic CO₂ storage, public-interest science funding, groundwater protection, seismic monitoring, long-term containment, baseline data, transparent reporting, regulatory oversight, independent verification, financial assurance, developer accountability, net climate benefits, property rights, tribal consultation, taxpayer protections

