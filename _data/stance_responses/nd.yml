  party: Democratic
  question: nd-q8
  date: 2026-10-22
  response: |
    "I support investments that help North Dakota farmers remain productive, profitable, and resilient, while keeping producers involved in shaping agricultural policy.
    
    I would prioritize strong funding for NDSU agricultural research, Extension, and Research Extension Centers. Their work connects scientific research with practical solutions involving crop varieties, soil health, pest management, and production practices suited to North Dakota conditions.

    I would also support voluntary, incentive-based conservation programs, drought preparedness, and water infrastructure improvements. These investments should offer flexible options that reflect differences in soil, rainfall, and farm operations—not impose a one-size-fits-all approach.

    Scientific innovation should help farmers manage costs and risks. Precision agriculture can target fertilizer and other inputs where and when they are needed, improving efficiency and productivity. I would support on-farm demonstrations and cost-sharing opportunities that make useful technologies accessible to smaller and beginning operations.

    To strengthen competitiveness, I would support reliable rural roads, broadband, agricultural processing, and market-development efforts. I would also advocate for effective federal crop insurance and disaster assistance while strengthening state financial-management and marketing education.

    Research should remain independent, transparent, and guided by producer needs. My goal is to give farmers practical tools and economic opportunities while protecting the land and water that future generations will depend on."

    KEYWORDS: Agricultural research, farmer profitability, drought resilience, soil health, water conservation, precision agriculture, NDSU Extension, producer-led solutions, voluntary conservation, input cost management, rural infrastructure, market access, crop insurance, beginning farmers, sustainable productivity

- candidate_first_name: Nyamal
  candidate_last_name: Dei
  state: nd
  race: State Senate
  district: 41
  party: Democratic
  question: nd-q9
  date: 2026-10-22
  response: |
    "Scientific evidence and expert input should be a foundation of my policymaking process. Whether addressing healthcare, energy, infrastructure, manufacturing, or emerging technologies, I would seek the best available research, consult qualified experts, and listen to residents affected by those decisions.

    I would support access to independent scientific expertise, transparent legislative hearings, and disclosure of potential conflicts of interest. Scientific integrity guidance emphasizes transparent analysis and testimony from qualified experts to inform public decisions.

    Evidence should inform policy without replacing public accountability. I would weigh research alongside affordability, individual rights, community priorities, and practical implementation. I would distinguish between what the evidence indicates and the value judgments involved in choosing a policy.

    When communicating uncertainty, I would explain what we know, what remains unclear, how strong the evidence is, and what additional information could change my position. Clear communication should make the limitations underlying recommendations transparent.

    When evidence changes, I would explain what changed and why, rather than pretend earlier conclusions were certain. I would support regular policy reviews, measurable outcomes, and adjustments when warranted.

    My commitment is to make informed decisions, communicate honestly, correct mistakes, and remain accountable to North Dakotans—not selectively use research to defend predetermined positions."

    KEYWORDS: Evidence-based policymaking, scientific integrity, independent expertise, transparency, public accountability, community input, conflict-of-interest disclosure, clear communication, scientific uncertainty, evolving evidence, informed decision-making, measurable outcomes, policy review, adaptability

