    "Local communities should have a meaningful role in approving large infrastructure and technology projects. Residents deserve an opportunity to shape decisions that affect their neighborhoods, public services, environment, and economic future.

    I would support policies requiring early public engagement, accessible meetings, and clear information about proposed projects before approval. Local governments should retain appropriate decision-making authority, with reasonable timelines that provide certainty without sacrificing transparency or public participation.

    I would also support enforceable community benefits agreements that establish commitments to local hiring, small-business opportunities, workforce training, and neighborhood improvements. These agreements can help turn community priorities into measurable obligations.

