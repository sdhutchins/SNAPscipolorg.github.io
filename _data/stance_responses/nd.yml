    "I support stewardship policies that protect North Dakota’s land and water while sustaining agriculture, energy production, and rural livelihoods. Conservation and economic development should reinforce each other, with decisions grounded in science, property rights, and community input.

    For agriculture, I would support voluntary, incentive-based conservation, soil-health research, drought planning, and technical assistance through NDSU Extension and local soil conservation districts. USDA’s agricultural census tracks land-use practices alongside production and economic measures, providing useful information for evaluating these efforts.

    For energy development, I would support predictable permitting paired with enforceable environmental standards, groundwater monitoring, spill prevention, methane reduction, and reclamation requirements. Operators should provide adequate financial assurance so cleanup costs do not fall on landowners or taxpayers.

    Land-use planning should involve farmers, ranchers, local governments, and tribal nations early. I would prioritize responsible siting that limits unnecessary disruption of productive farmland, wildlife habitat, cultural resources, and existing communities.

    I would also support research, workforce training, and infrastructure investments that help natural resource businesses improve efficiency and develop additional revenue opportunities.

    My goal is practical, accountable development: supporting jobs and reliable energy today while maintaining productive land, clean water, and economic opportunities for future generations. Public investments should deliver measurable benefits."

