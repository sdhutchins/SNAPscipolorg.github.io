    Environmental stewardship requires more than spending money—it requires measuring results. My funding priorities are accountability-driven.

    First, make Climate Commitment Act dollars deliver measurable outcomes. Washington has invested billions through the Climate Commitment Act, yet recent emissions reductions remain well below the pace needed to meet our statutory goals. Funding should prioritize projects with the greatest verified emissions reductions per dollar, require independent performance reviews, and redirect money from programs that cannot demonstrate results.

    Second, remove the barriers to clean energy deployment. An investigation by ProPublica and Oregon Public Broadcasting found our state ranked dead last in renewable energy growth. Transmission, interconnection, and permitting have failed to keep pace, so I would prioritize funding for transmission upgrades, interconnection reform, and permitting capacity so clean-energy projects can actually be built.

    Third, protect Puget Sound. Fund stormwater projects targeting 6PPD-quinone—the tire-wear chemical University of Washington researchers found is highly toxic to coho salmon—along with culvert replacement, habitat restoration, and microplastics research. I also support strengthening, fully implementing, and enforcing Washington's Recycling Reform Act.

    Across every program, I would require transparent, public reporting of measurable outcomes. Good stewardship means knowing what every environmental dollar actually accomplished.
    
    KEYWORDS: Accountability, Puget Sound, Measurable Results

- candidate_first_name: Michael
  candidate_last_name: Rosen
