    Artificial intelligence presents both tremendous opportunity and real challenges. I understand why people are concerned about its effects on jobs, education, privacy, and security. Those concerns deserve thoughtful public policy, not dismissal.

    AI is also driving unprecedented demand for data centers. Simply saying “no” will not stop that demand—it will only move investment somewhere else. My priority is ensuring communities receive real benefits if these facilities are built. That means protecting existing ratepayers, requiring responsible use of water and land, and ensuring companies invest in local infrastructure, schools, emergency services, and the community tax base.

    The state also has a role to play. Smaller communities often lack the legal, technical, and negotiating resources needed to evaluate complex projects on equal footing. Washington should provide model agreements, technical expertise, and independent support so every community can negotiate from a position of strength.

    This demand also creates an opportunity to accelerate advanced nuclear technologies, including small modular reactors. My perspective is informed by conversations with local residents, utilities, farmers, educators, and technology leaders. We should embrace innovation while ensuring it strengthens—not overwhelms—the communities that host it. 
    
