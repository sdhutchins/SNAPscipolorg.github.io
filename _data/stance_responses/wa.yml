   When we pass big policy like the Climate Commitment Act, there are sometimes unintended consequences, and this is one of them. Our farmers and our agricultural lands are a prized resource, and we need to be better stewards of helping the people who grow our food actually succeed.
   
   I'd support eliminating any additional fuel charges on farmers, full stop. That exemption already exists in law, it's just not being honored the way it should be, with some fuel distributors charging surcharges up to 70 cents a gallon anyway. That needs to be fixed at the point of sale, not through a rebate program farmers have to chase down after the fact.
   
   Here's the bigger point I want to make. Farmers are the first environmentalists. Nobody has a bigger stake in healthy soil, clean water, and sustainable land than the people whose livelihood depends on it working for the next generation, too. We might need to work with them, nudge things along, and help them adopt more sustainable practices over time. But we shouldn't be making it harder or more expensive for farmers to do their jobs. We should be finding ways to make it easier, so we can keep our commitment to sustainability without treating our farmers like the problem.
   
