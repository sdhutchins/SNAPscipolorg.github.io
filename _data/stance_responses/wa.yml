    I support Washington's growing AI economy, but growth must not come at the expense of ratepayers, our water, or a reliable transition to cleaner energy. Four priorities:
    
    Growth should pay for new power. New hyperscale data centers should fund enough new clean generation to serve their electricity demand rather than simply relying on existing hydropower and increasing pressure for new fossil generation.

    No cross-subsidization. Large AI loads belong in a dedicated rate class bearing the full cost of the generation, transmission, and water infrastructure they require, backed by take-or-pay contracts. PSE rates are already up roughly 45% in two years. Households should never subsidize hyperscale demand.

    Transparency. Data centers should publicly report facility-level energy and water use annually. You cannot manage what you do not measure.

    End remaining subsidies. The Legislature repealed the sales-tax exemption for replacement server equipment but left the exemption for new construction. I would finish the job. Good Jobs First has documented that these programs cost states hundreds of millions annually while often delivering weak returns.

    Sources: JLARC tax preference reviews, UTC rate filings, Lawrence Berkeley National Laboratory's U.S. Data Center Energy Usage Reports, Good Jobs First subsidy research, and ProPublica's reporting on Washington's data center subsidies.
    
    KEYWORDS: Ratepayer Protection, Transparency, Accountability

