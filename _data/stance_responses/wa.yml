    Wildfire policy should be guided by science and updated as our understanding improves. One of the most valuable lessons I took from studying natural resource management was that forest management practices evolve, and public policy should evolve with them.

    My priorities are to reduce wildfire risk before fires start, strengthen community preparedness, and support rapid response when they do occur. That means investing in strategic thinning, prescribed burns where appropriate, fuel reduction, and restoring forests to conditions that are more resilient to wildfire. It also means improving early detection, supporting firefighters, helping communities create defensible space, and ensuring local governments have the resources to plan for emergencies.

    Success requires partnership between state agencies, tribes, private landowners, local governments, and the forest products industry. Healthy forests, resilient communities, and sustainable timber markets are complementary goals, not competing ones.

    Good wildfire policy isn’t static. We should continually evaluate new research and adopt best practices that reduce risk while protecting Washington’s people, forests, and economy. 
    
    KEYWORDS: Resilience, Prevention, Preparedness
    
