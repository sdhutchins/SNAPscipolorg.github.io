    Washington's fisheries policy should be guided by science and adapt as conditions change while protecting ecosystems and the communities that depend on them.

    First, invest in continuous scientific monitoring. Our shellfish industry adapted to ocean acidification because monitoring detected corrosive water early enough for hatcheries to respond—proof that monitoring pays. Expand measurement of ocean temperature, acidity, dissolved oxygen, stream flows, and species abundance. Make the data public and provide practical forecasts for fisheries, tribes, and shellfish growers.

    Second, restore habitat with measurable biological benefits—and finish what we've started. Washington is under a federal treaty-rights injunction to replace salmon-blocking culverts by 2030, has invested billions, and remains behind schedule. Prioritize the highest-benefit projects, alongside estuary restoration and stormwater treatment that reduces 6PPD-quinone, the tire-derived chemical shown to kill coho salmon.

    Third, manage adaptively. Harvest decisions should respond quickly to changing populations using the best available science and co-management with tribal nations, protecting long-term fisheries while avoiding restrictions unsupported by current data.

    Finally, help communities adapt through port infrastructure, selective fishing technology, workforce retraining, and aquaculture research.

    Washington has world-class scientific institutions. Our challenge is turning their research into faster decisions, measurable recovery, and better outcomes for fishing communities.
    
    KEYWORDS: Scientific monitoring, Salmon recovery, Adaptive management

