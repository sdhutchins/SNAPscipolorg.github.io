   Artificial intelligence isn't going away. The federal government has largely stepped back and taken a hands-off approach, even though the scientists who understand this technology best have raised real warnings. That leaves it to states like Washington to get this right.
   
   Data centers have an obvious appeal. They show up promising jobs and tax revenue. During construction that's true. They generate good, family-wage building trades work. But once construction wraps, what's left is a massive building that runs around the clock. It pulls enormous amounts of power off our grid. It uses a lot of water for cooling. And in many cases it drives up utility rates for everyone else on that system. Communities are increasingly finding that the long-term footprint doesn't match the short-term sales pitch.
   
   I've gone back and forth on whether this is a decision that belongs with individual communities or with the state legislature. My instinct is that local communities should have real say over what gets built where they live. But I also know that small towns and counties are often the ones being courted hardest by these projects, and they don't always have the resources to independently verify the promises being made to them about jobs, water use, or grid impact. A company with a slick presentation and a big number on a slide can be tough to push back on without outside expertise.
   
   That's where I think the state has a role to play. Not to override local decisions, but to make sure those decisions are informed ones. The state should require full and transparent accounting of water use, grid impact, and effect on ratepayers before a project moves forward. Independent, verified numbers, not projections from industry. Right now too many of these approvals are happening on hope and conjecture instead of facts, and that needs to change.
   
   KEYWORDS: local input, tax incentives, responsible growth, accountability, grid capacity, ratepayer protection, water usage 
   
