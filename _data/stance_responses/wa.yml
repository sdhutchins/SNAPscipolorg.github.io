   The Bear Gulch Fire is a warning we can't ignore. It burned over 20,000 acres and caused $42 million in damage, the worst fire on the Olympic Peninsula in nearly 75 years, in a year with close to 2,000 recorded fires statewide.
   
   Here's what's frustrating: we know what works. Since 2020, our state's wildfire program has added 151 firefighters, foresters, and forest health workers, restored nearly 89,000 acres of forest, and kept over 93% of fires to ten acres or less since 2022.
   
   And in 2025, the legislature cut $60 million from that exact program, right as the federal government eliminated $182 million in wildfire, flood, and landslide prevention funding for Washington. That's two levels of government pulling back at the same time our fire seasons are getting worse. The state restored its funding this year, but only through June 2027. That's not a real commitment, that's a countdown clock.
   
   I also think we have to be smarter about how timber and forest management fit into this conversation. A well-managed, actively thinned forest isn't just a revenue source, it's a wildfire mitigation tool. Overgrown, unmanaged forests are the ones that burn hottest and fastest. My approach is to maximize sustainable timber revenue and active forest management together, not treat forestry and fire prevention as separate conversations. Done right, smart forest management pays for itself while directly reducing the fuel that turns a small fire into another Bear Gulch.
   
   KEYWORDS: wildfire prevention funding, forest health management, sustainable timber harvest, federal budget cuts, fuel reduction

