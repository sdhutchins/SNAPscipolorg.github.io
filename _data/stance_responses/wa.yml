    Science literacy is not just knowing scientific facts—it is understanding how scientific knowledge is built, tested, and challenged. In an age of AI, social media, and misinformation, students need to know how to evaluate evidence, recognize uncertainty, and distinguish high-quality research from opinion. Right now, too many graduates leave school without those tools.

    Washington should continue strengthening STEM education while placing greater emphasis on the scientific method, statistics, data literacy, and critical thinking across K–12. Students should learn how to read graphs, interpret risk, identify common biases, evaluate sources, and understand why replication and peer review matter. Classroom learning should include more hands-on experiments and partnerships with Washington's universities, research institutions, technology industries, and local watershed and salmon-recovery projects, so students experience science as a process of discovery rather than memorization—and build a relationship with science in their own community.

    As a Washington-licensed nutritionist and attorney, I've seen how poor scientific reasoning can lead to costly mistakes in both health and public policy. My goal is not to teach students what to think, but how to evaluate evidence and reach sound conclusions. That is the foundation of both good science and a healthy democracy.
    
    KEYWORDS: Evidence evaluation, Critical thinking, Hands-on science

