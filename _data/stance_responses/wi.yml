    As a school board member, I’ve spent a lot of time looking at how Wisconsin funds public education, and I think we need to start by fixing the funding formula itself.

    For starters, we need to tie school revenue limits back to inflation. Schools face the same rising costs as everyone else, but their ability to keep up with those costs is determined by decisions made in Madison. That makes long-term planning incredibly difficult, particularly for smaller rural districts that don’t have much flexibility to begin with.

    We also need to fund special education as a sum-sufficient appropriation, meaning the state commits to covering the actual costs of providing legally required services rather than setting an arbitrary reimbursement amount. Right now, when the state doesn’t fully reimburse districts for special education, that money has to come out of the same budget that pays for everything else. That affects every student, not just those receiving special education services.

    We need to pay teachers adequately, too. We can’t expect to recruit and retain talented educators, particularly in rural communities, if we’re not willing to compensate them competitively. I’d support restoring stronger state investment in educator compensation and expanding pathways into teaching, including paid student teaching and programs that help people enter the profession without taking on enormous debt.

    I also think it’s time for a serious reevaluation of Wisconsin’s voucher program. We need to look at its long-term fiscal impact, transparency, accountability, and whether we’re creating parallel education systems that compete for limited public resources without being held to the same standards. If we’re spending public dollars, taxpayers deserve to know what outcomes those dollars are producing.

    I’d also like us to consider funding full-day 4K at 1.0 FTE. We know how important early childhood education is, and full-day programming can make a tremendous difference for working families. But districts need adequate funding to provide it without shifting costs onto their K-12 programs.

    For rural schools specifically, I’d support greater investment in shared services, broadband access, STEM programming, and partnerships with technical colleges and universities. A student’s ZIP code shouldn’t determine whether they have access to advanced coursework, career exploration, or hands-on science and technology education.

    And we don’t have to start from scratch. Wisconsin’s Blue Ribbon Commission on School Funding spent considerable time gathering input from educators, administrators, and communities across the state. I’d like to see us revisit those recommendations and have a serious conversation about implementing them.

    Ultimately, I think we need to stop treating public education funding as a series of temporary fixes and referendums. Our schools need a predictable, sustainable funding system that allows them to plan for the future, retain good educators, and give every child access to a quality education, regardless of where they live.

    KEYWORDS: Public education funding, inflation-adjusted revenue limits, sum-sufficient special education funding, teacher pay, educator recruitment and retention, voucher program reform, fiscal accountability, full-day 4K funding at 1.0 FTE, rural school funding, declining enrollment, sparsity aid, STEM education, broadband access, technical college partnerships, Blue Ribbon Commission on School Funding, equitable education access, sustainable school funding, property tax relief.

