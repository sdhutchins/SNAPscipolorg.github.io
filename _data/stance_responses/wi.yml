    My husband is an ICU physician, and I watched COVID nearly break him. I saw what happens when our healthcare system is overwhelmed, when medical professionals are pushed beyond their limits, and when public health becomes a political battleground instead of something we’re all working together to protect.

    I think the first thing we need to do is adequately fund public health. So much of what public health departments do is preventative, which means that when they’re doing their jobs well, most people don’t even notice. Disease surveillance, vaccination programs, public education, and outbreak response all require trained professionals and consistent funding. We can’t keep expecting local health departments to do more with less and then scramble to find resources when a crisis arrives.

    I’d also support policies that promote vaccination and improve access to primary care. One of the most important relationships a person can have when it comes to their health is with a trusted primary care provider. That’s where people can ask questions, address concerns about vaccines, and receive preventative care before problems become emergencies. We should be looking at ways to incentivize primary care practice, particularly in rural and underserved communities, and investing in the workforce needed to staff those practices.

    I also think we need to take healthcare workforce retention seriously. We lost an enormous amount of institutional knowledge and experienced medical professionals during and after COVID. We need policies that address burnout, support healthcare workers, and make it financially sustainable to practice medicine and provide nursing care in Wisconsin.

    For diseases like avian influenza, we also need strong coordination between public health officials, veterinarians, agricultural producers, and state agencies. Wisconsin’s agricultural economy depends on our ability to identify and respond to outbreaks quickly, and farmers need access to reliable information and resources without being treated as though they’re the problem.

    Finally, I think we need to rebuild trust in public health. That means communicating clearly, being transparent about what we know and what we don’t, and allowing scientific evidence to guide our decisions. It also means recognizing that people are more likely to listen when they have relationships with healthcare professionals they trust.

    Public health shouldn’t be something we only invest in during an emergency. It’s part of the infrastructure that keeps our communities functioning, and we need to start treating it that way.

    KEYWORDS: Fund public health, prevention over crisis response, trust your neighborhood scientist, vaccination access and education, primary care investment, rural healthcare access, healthcare workforce recruitment and retention, physician and nurse burnout, infectious disease surveillance, outbreak preparedness, avian influenza, agricultural biosecurity, One Health approach, public health transparency, evidence-based policy, rebuilding public trust, supporting frontline healthcare workers.

