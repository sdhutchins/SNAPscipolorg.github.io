    I trust experts. I think one of the more troubling developments in recent years has been the idea that someone’s personal opinion should carry the same weight as the conclusions of people who have spent their careers studying a subject.

    That doesn’t mean scientists are infallible or that we shouldn’t ask questions. In fact, questioning, testing, and revising our understanding as new information becomes available is the whole point of science.

    If elected, I would regularly consult scientists and subject matter experts when evaluating legislation, particularly in areas like public health, environmental protection, agriculture, energy, and emerging technologies. I’d look to peer-reviewed research, our universities, professional organizations, and the people doing this work in Wisconsin.

    I also think it’s important to bring scientists into the conversation early, while policies are being developed, rather than asking them to weigh in after decisions have effectively already been made.

    Ultimately, I don’t expect to be the smartest person in every room, and I don’t think legislators should pretend to be. My responsibility is to ask good questions, listen to people who know more than I do, understand the evidence, and use that information to make thoughtful decisions.

    KEYWORDS: Trust your neighborhood scientist, evidence-based policymaking, scientific expertise, peer-reviewed research, informed decision-making, respect for experts, scientific literacy, public trust in science, curiosity, intellectual humility, science-informed legislation.

