    I think we need to recommit to the Wisconsin Idea, and that starts with properly funding our university system instead of continuing to bleed it of resources.

    The whole premise of the Wisconsin Idea is that the work of our universities should benefit people throughout the state, not just those sitting in classrooms. That means research that helps farmers improve yields and protect soil and water, innovation that helps Wisconsin businesses develop new products, and educational opportunities that prepare people for jobs in growing industries.

    And historically, having a strong university system has been one of Wisconsin’s greatest economic development tools. Employers want to locate where they can find an educated, skilled workforce, where research and innovation are happening, and where their employees and their families have access to good educational opportunities. When we underfund our universities, we’re not just making it harder for students to get an education. We’re undermining one of the things that has helped attract and retain businesses in Wisconsin for generations.

    We already have tremendous resources through our universities, technical colleges, UW Extension, agricultural communities, and manufacturing workforce. I’d like to see us do a better job of connecting them.

    That means restoring stable funding for the Universities of Wisconsin, supporting agricultural and biotechnology research, and expanding partnerships between universities, technical colleges, employers, and labor organizations. I’d also support more paid apprenticeships, internships, and opportunities for workers to gain new skills without taking on significant debt.

    I particularly want to see us reinvest in UW Extension and applied research partnerships that help small and midsize farms access new technologies. That could mean finding new uses for agricultural byproducts, improving soil and water conservation, developing renewable energy technologies that work alongside existing agricultural operations, or helping farmers adopt innovations that might otherwise only be available to large corporations.

    And I want to make sure we’re not just investing in research and hoping the economic benefits eventually trickle down. We should be helping Wisconsin businesses turn that research into products and good-paying jobs here, with opportunities for workers and communities across the state to benefit.

    We have a long history of bringing education, agriculture, industry, and government together to solve practical problems. That’s what the Wisconsin Idea was built around, and I think it’s time we started treating it as a priority again.

    KEYWORDS: Wisconsin Idea, university funding, higher education investment, workforce development, employer attraction and retention, economic development, UW Extension, agricultural innovation, biotechnology, applied research, technical colleges, apprenticeships, skilled workforce, public-private partnerships, small and midsize farms, renewable energy, agricultural sustainability, research commercialization, good-paying jobs.

