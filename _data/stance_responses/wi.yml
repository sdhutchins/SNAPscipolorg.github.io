    Agriculture contributes tens of billions of dollars to Wisconsin’s economy annually and supports hundreds of thousands of jobs. My vision for Wisconsin agriculture is one where family farms are viable, rural communities are stable, and the state’s natural and energy resources strengthen each other over the long term.

    That means investing in cost-share programs that help farmers implement conservation practices without bearing the full financial burden alone, supporting research and extension services that give farmers the tools to adapt to changing conditions, and supporting workforce training programs and small grant programs that can help Wisconsin’s smaller farms stay on the cutting edge of innovations to improve their operations.

    I support the responsible expansion of nuclear energy as part of Wisconsin's clean energy future — including next-generation and small modular reactor technology — because reliable, carbon-free baseload power is essential to a grid that works for families and businesses.
    
    We need to advance geothermal energy development in Wisconsin as a proven, carbon-free baseload resource — because a resilient energy future requires a diverse portfolio of reliable clean power that isn't subject to weather variability or fuel supply disruptions.
    
    Additionally, we need to lift outdated barriers to energy development in Wisconsin.
    
    Finally, the state must improve its investment in our public K-12 schools, technical colleges, and university campuses to bolster the workforce and support the critical biotech research at the Universities of Wisconsin. The state should also continue to be a strong partner to efforts around the Biohealth Tech Hub, and its efforts to ensure Wisconsin is a leader in this sector for years to come.

