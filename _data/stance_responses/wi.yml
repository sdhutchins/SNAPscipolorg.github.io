    First, policies that relate to workforce development are implemented on three different governmental levels: local, state-wide, and federal. I believe most such policies should be implemented by local authorities, and state-wide when it makes sense. I’ve not studied this in depth--I’m willing to--but I don’t know of any workforce development policies that should be implemented by the federal government. As such, although I’m glad to participate in brainstorming and discussions about wise or foolish ways to proceed, I don’t think Congress should be voting on any workforce development issues. (Perhaps some safety requirements are so universally recognized they *could* be enforced federally, but if they are universally recognized, then each state should pass regulations that best fit their state workforces.) 

    Folks, this is not a wimpy answer from a slippery politician trying to avoid saying anything significant. This is an important distinction you don’t often hear a candidate make! 

    Read Article 1, sec. 8 of the US Constitution: Congress is delegated no power over workforce development.  Now read the 10th amendment. Our country will operate more efficiently if the federal government removes itself from areas it has no business being. It’s not just because they tend to muck things up; it’s because big power brokers don’t want to have to deal with every state legislature/educational institution to get their way. Instead, they buy up a few key members of Congress, and get laws passed the effectively routes $millions or $billions to their company, at the expense of smaller, local, businesses that are better suited to the unique workforce development needs of their local area. 

    That corruption needs to stop. Our current Congress doesn’t care about that corruption--they benefit from it.  But if we institute term limits on Congress, the career politicians won’t be able to stay, and citizen legislators--like I would be, like many of you readers would be--would not cow-tow to the big power brokers. 

    KEYWORDS: local, state, federal, 10th amendment, corruption

