    I support innovation in artificial intelligence and recognize its potential to improve education, health care, business, government efficiency, and economic development. However, innovation should not come at an unreasonable cost to Wisconsin families and communities.

    Large data centers should pay the costs associated with the electricity, water, transmission, and other infrastructure necessary to serve them rather than shifting those costs to residential and small-business ratepayers. Communities also deserve transparency regarding projected water and energy use, infrastructure needs, tax incentives, environmental impacts, permanent jobs created, and long-term economic benefits.

    My position is informed by the Wisconsin Public Service Commission (PSC), the U.S. Department of Energy (DOE), and national energy research. DOE reports that data centers consumed approximately 4.4% of U.S. electricity in 2023 and projects they could consume approximately 6.7% to 12% by 2028. The Wisconsin PSC has also recognized that some proposed data centers could become among the state's largest energy users and has addressed protections against shifting their costs to existing utility customers.

    Wisconsin can welcome AI innovation while requiring accountability, transparency, consumer protection, and measurable community benefit.

    KEYWORDS: Accountability | Affordability | Innovation

