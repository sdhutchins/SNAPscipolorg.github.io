    I think AI is here to stay, and I’d much rather see data centers developed responsibly here in Wisconsin than pushed somewhere else where there may be fewer protections for workers, communities, and natural resources.

    But I also think we’re moving awfully fast without having some pretty important conversations first.

    I’d support a temporary pause on new large-scale data center approvals while we bring together a bipartisan group of stakeholders to figure out what regulations make sense for Wisconsin. That conversation needs to include farmers, local governments, utility companies, labor organizations, environmental experts, technology companies, and the people who actually live in the communities being considered for these projects.

    We need to answer some basic questions. How much water will these facilities use? Who pays for the additional electrical infrastructure? What happens if a project closes after we’ve built infrastructure around it? What are the actual long-term economic benefits to the surrounding community? And how do we make sure local residents have a meaningful voice before decisions are made?

    I actually think this is part of a much bigger conversation about land use in Wisconsin. We’re seeing enormous proposals for data centers, solar farms, and other high-megawatt energy projects, sometimes involving thousands of acres. I understand the need for new energy infrastructure, but I also understand why farmers and rural residents are worried about losing productive agricultural land and changing the character of their communities.

    I’d like to explore creating a nonpartisan land use commission to look at these issues more comprehensively. Rather than evaluating every project in isolation, we should be thinking about where development makes sense, how projects interact with one another, and how we preserve Wisconsin’s agricultural heritage while meeting our future energy needs. I don’t think we should expect individual town boards to figure out all of these complicated issues on their own.

    As for AI itself, I generally support a human-in-the-loop standard, particularly when decisions affect people’s rights, healthcare, education, employment, or access to services. AI can be an incredibly useful tool, but it shouldn’t replace human judgment or accountability. People should know when AI is being used to make consequential decisions about their lives, and they should have a meaningful opportunity to challenge those decisions.

    My thinking has been informed by conversations with farmers and residents facing proposed energy developments, as well as research on data center energy demands, utility regulation, and AI governance.

    The International Energy Agency’s 2025 Energy and AI report documents the rapid growth in data center electricity demand and the particular challenges that concentrated demand can create for local power grids.

    The Wisconsin Public Service Commission’s own explanation of its regulatory authority makes clear that while it regulates the utilities serving data centers, it does not directly regulate the construction or operation of the data centers themselves. That distinction raises important questions about whether our current regulatory framework is adequate.

    And the National Institute of Standards and Technology’s AI Risk Management Framework provides useful guidance on transparency, accountability, and the importance of meaningful human oversight.

    I don’t think we have to choose between embracing new technology and protecting the things that make Wisconsin worth living in. But we do need to be thoughtful about how we move forward, and that means doing the work before we’ve committed ourselves to decisions we can’t easily undo.

    Sources:

    International Energy Agency, Energy and AI (2025):
    https://www.iea.org/reports/energy-and-ai

    Wisconsin Public Service Commission, The Public Service Commission and Data Centers:
    https://psc.wi.gov/Pages/AboutPSC/The-Public-Service-Commission-and-Data-Centers-.aspx

    National Institute of Standards and Technology, AI Risk Management Framework:
    https://www.nist.gov/itl/ai-risk-management-framework

    KEYWORDS: Human oversight, responsible AI development, data center regulation, temporary moratorium, nonpartisan land use commission, preservation of heritage farmland, local control, environmental protection, water conservation, utility ratepayer protections, transparency, public accountability, stakeholder collaboration.

