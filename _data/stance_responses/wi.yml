    I oppose hyperscale data centers in Wisconsin. Period.

    They use enormous amounts of water and electricity, eat up farmland, and can leave the rest of us paying higher electric bills. Too many of these deals are negotiated in secret, with non-disclosure agreements that keep the public in the dark. Then the state gives developers a sales tax break.

    I support a statewide ban on new hyperscale data centers. Smaller data centers should face simple rules: no secret deals, full disclosure of water and electricity use before approval, and developers should pay for any grid upgrades they require. I'd also repeal Wisconsin's data center sales tax exemption.

    I feel the same way about AI. If AI is used to make a decision affecting your rights, benefits, job, or freedom, a real person should be responsible, and you should be told AI was used.

    I've fought automated license plate cameras in my own community because unlimited surveillance is too easy to abuse.

    My campaign takes no corporate money. I don't owe these companies a thing.

    My positions come from Wisconsin's data center tax laws, MISO reports on electricity demand, and people in communities facing these projects.

    KEYWORDS:  Ban, Transparency, Accountability

