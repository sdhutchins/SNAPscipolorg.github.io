  candidate_last_name: Orlando
  state: nh
  race: US House of Representatives
  district: 2
  party: Republican
  question: nh-q3
  date: 
  response: |
    "I support practical, common-sense approaches focused on resilience and preparedness, strengthening flood infrastructure, improving drainage and dam maintenance, updating emergency response capacity, and encouraging smarter local land-use practices such as open-space developments that reduce runoff while still allowing needed housing. These solutions should be driven by local decision-making and protect private property rights rather than impose costly top-down mandates. I will work to secure federal infrastructure funding for New Hampshire so our state can invest in the roads, bridges, culverts, stormwater systems, and flood-control projects needed to better withstand these challenges. Bringing those resources home helps protect families, businesses, tourism, and agriculture without raising energy costs or expanding unnecessary regulation. Strong infrastructure and local control are the most effective ways to keep New Hampshire resilient and affordable."

    KEYWORDS: Flood resilience, infrastructure funding, emergency preparedness, local control, open space development, protecting outdoor industries

- candidate_first_name: Victor
  candidate_last_name: Orlando
  state: nh
  race: US House of Representatives
  district: 2
  party: Republican
  question: nh-q4
  date: 
  response: |
    "New Hampshire must secure affordable, reliable energy before expanding data centers or large-scale AI infrastructure. If electricity costs are already too high for families and small businesses, the economic case for data centers falls apart. I will prioritize energy abundance, supporting production, grid upgrades, and policies that lower rates, to strengthens our economy instead of shifting higher costs onto residents. Only when we have stable, affordable power should we talk about data centers. I also completely oppose Flock cameras and similar mass-surveillance systems. As artificial intelligence and data collection expand, we must protect privacy and civil liberties. Technology should create opportunity in manufacturing, healthcare, and education without turning into tools for constant tracking of law-abiding citizens. My focus is practical: lower energy costs first, support workforce training for new technical jobs, respect local control on siting, and defend personal freedom every step of the way."

    KEYWORDS: Affordable energy first, energy abundance, data centers, oppose Flock cameras, privacy, local control, workforce training

