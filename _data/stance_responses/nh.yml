- candidate_first_name: Carleigh
  candidate_last_name: Beriont
  state: nh
  race: US House of Representatives
  district: 1
  party: Democratic
  question: nh-q1
  date: 
  response: |
    "I support protecting our air, water and land-based resources from climate change, deforestation, and pollution. Our forests, mountains, coastline, and parks are what ensure our stateʼs vitality and drive our tourism industry. Safeguarding these resources requires a whole-of-government approach that holds corporate polluters accountable, supports people in making sustainable choices, and brings communities together to take action. Regulating AI and Big Tech is crucial to protecting our environment. I support a data center moratorium, so we can better regulate the usage of our water and land before more data centers are built. Corporate polluters must be held accountable for how their actions impact our state. Additionally, I support funding the UNH Water Resources Research Center, which researches issues like PFAS contamination and groundwater quality to keep New Hampshire's drinking water clean. We also must hold every corporation accountable for operating facilities and making products that have contributed to the degradation of our environment. Our parks, forests, and natural beauty should all be available for future generations. I will vote to fund and protect these areas."

    KEYWORDS: Quality, Accountability, Sustainability

- candidate_first_name: Carleigh
  candidate_last_name: Beriont
  state: nh
  race: US House of Representatives
  district: 1
  party: Democratic
  question: nh-q2
  date: 
  response: |
    "Vaccines are an area in which collaboration between scientists and policymakers matters most. Vaccines are one of modern medicine's great achievements, protecting communities from diseases like measles and COVID-19. We have clear data thanks to science on the public health benefits and safety provided by vaccines. I support New Hampshire’s current law requiring vaccinations for public school enrollment. In Congress, I will vote against efforts to roll back these laws and protections. In regards to vaccine policy, I will follow the expertise of scientists and public health researchers to guide my vote. The recent resurgence of measles, driven by declining vaccination rates, is a clear example of what happens when we ignore decades of scientific consensus and expert opinion. Vaccinations are vital to public health, and we must follow scientific evidence to guide policies that support and advance the health and wellbeing of every person that calls the United States home."

    KEYWORDS: Science advises policy 

- candidate_first_name: Carleigh
  candidate_last_name: Beriont
  state: nh
  race: US House of Representatives
  district: 1
  party: Democratic
  question: nh-q3
  date: 
  response: |
    "Living and serving in Hampton, I’ve felt climate change’s impacts on New Hampshire firsthand. Working on Hampton's Coastal Resilience Roadmap, funded through NOAA's Office for Coastal Management and NH's Coastal Program, taught me that small local teams often understand resilience better than Washington does. New Hampshire’s risk also goes beyond the coast. Reduced snowpack threatens winter tourism and impacts water supply. Communities around the state face severe flood risk from rivers that overflow their banks after storms that bring extremely heavy rainfall, an increasingly common occurrence. I'll fight to protect NOAA's Office for Coastal Management, the Coastal Zone Management Act, and Sea Grant, and I'll push to rewrite resilience grants so towns can actually use them. We must cut match requirements that disqualify the communities that need help most, and move toward predictable, formula-based funding. I support reforming the National Flood Insurance Program: modernized flood maps, protected affordability for working families already in floodplains, and fair pricing for new high-risk development."

    KEYWORDS: Local Funding, Leadership

- candidate_first_name: Carleigh
  candidate_last_name: Beriont
  state: nh
  race: US House of Representatives
  district: 1
  party: Democratic
  question: nh-q4
  date: 
  response: |
    "Our lives have already become beholden to the priorities and profits of technology corporations, and we never had a say in it; AI has put the problems created by an unregulated tech industry into hyperdrive. It is being used to deny people healthcare, replace workers, surveil communities, and make military decisions that should require human judgment. I support a moratorium on new data centers until companies are required to address and offset their impact on public health, water use, energy prices, and the environment. Alongside that pause, I want aggressive antitrust enforcement and real data privacy protections. New Hampshire is a private state, you can’t film people without consent, and AI shouldn't get a pass to surveil and profile us without it. We cannot trust Big Tech to regulate themselves. Before we let this revolution reshape manufacturing, healthcare, education, and transportation, I want to hear directly from educators and healthcare workers about where AI is helping, and where it is hurting. We must ensure that the prosperity created by new technology is shared by working families and not just the wealthy and well-connected."

    KEYWORDS: Big Tech Accountability

- candidate_first_name: Carleigh
  candidate_last_name: Beriont
  state: nh
  race: US House of Representatives
  district: 1
  party: Democratic
  question: nh-q5
  date: 
  response: |
    "I believe alternative energy is the future; for our climate, and for reducing our reliance on oil which has driven conflicts abroad. I support the vision behind the Green New Deal, a serious, national commitment to a clean energy economy. I support concrete steps to get us there like the Build Green, which invests in electrifying public transportation and cutting emissions nationwide. New Hampshire is too often the outlier in New England, blocking regional progress on clean energy and grid modernization instead of leading it. I want to change that. Offshore wind is a real opportunity for our Seacoast communities. I know small towns can’t build these things alone. In Congress, I’ll vote for federal investment and tax credits needed to bring the cost of wind, solar, and grid upgrades down far enough that towns can actually afford them, without raising local property taxes. This is also a job creation strategy. Wind and solar development means construction, engineering, and maintenance jobs that can't be outsourced, and grid modernization means union labor upgrading our infrastructure for decades. I want New Hampshire workers building this future, along with the other New England States."

    KEYWORDS: Clean Energy Leadership

- candidate_first_name: Cathleen
  candidate_last_name: Fountain
  state: nh
  race: State Senate
  district: 1
  party: Democratic
  question: nh-q1
  date: 
  response: |
    "I support protecting New Hampshire’s water, forests, open spaces, and public lands through responsible stewardship and science-based policymaking. Clean drinking water is especially important in rural communities where many residents rely on private wells. That is why I support strong environmental oversight to prevent contamination from landfill leachate, PFAS, and other pollutants. I believe we must balance economic development with the long-term protection of our natural resources. Our parks, lakes, forests, and conserved lands are vital to wildlife, recreation, tourism, and our quality of life. Decisions affecting these resources should be transparent, data-driven, and include meaningful community input. I also support clear standards for the siting, operation, monitoring, and closure of landfills to ensure communities and ecosystems are protected. As a legislator, I will work with environmental professionals, local leaders, and fellow lawmakers to preserve New Hampshire’s natural heritage while addressing environmental challenges in a practical and bipartisan way."

    KEYWORDS: Stewardship science-based

- candidate_first_name: Cathleen
  candidate_last_name: Fountain
  state: nh
  race: State Senate
  district: 1
  party: Democratic
  question: nh-q2
  date: 
  response: |
    "I believe public health decisions should be based on sound science, transparency, and informed consent. I do not support state mandates that remove an individual's ability to make healthcare decisions for themselves or their families. At the same time, I support ensuring that residents have access to accurate, unbiased information about vaccines so they can make informed choices in consultation with their healthcare providers. Collaboration between scientists, medical professionals, and policymakers is essential. Scientists provide research and evidence, while policymakers must weigh that information alongside public concerns, individual rights, and practical impacts on communities. Good policy requires open communication, transparency, and public trust. As a state legislator, my role is not to direct federal vaccine policy, but to support policies in New Hampshire that protect public health, respect individual liberties, and ensure health decisions are guided by credible scientific evidence and informed discussion."

    KEYWORDS: science transparency collaboration

- candidate_first_name: Cathleen
  candidate_last_name: Fountain
  state: nh
  race: State Senate
  district: 1
  party: Democratic
  question: nh-q3
  date: 
  response: |
    "I believe New Hampshire must take practical, common-sense steps to protect our communities, businesses, and infrastructure from the growing impacts of flooding and other natural disasters. Investing in resilient roads, bridges, culverts, and drainage systems can reduce damage, improve public safety, and save taxpayers money over the long term. I also support protecting wetlands, forests, and open spaces that naturally absorb floodwaters and help maintain water quality. These resources not only reduce flood risks but also support recreation, tourism, wildlife habitat, and our quality of life. The state should work with local communities, emergency management officials, scientists, and industry leaders to identify risks and prioritize cost-effective solutions. Whether preparing municipalities for severe weather, supporting affected businesses, or improving emergency response capabilities, planning ahead is far less costly than recovery after disaster strikes. My focus is on protecting people, property, and New Hampshire's natural resources through responsible planning, sound science, and practical investments that strengthen our resilience for the future."

    KEYWORDS: protecting infrastructure communities businesses

- candidate_first_name: Cathleen
  candidate_last_name: Fountain
  state: nh
  race: State Senate
  district: 1
  party: Democratic
  question: nh-q4
  date: 
  response: |
    "Artificial intelligence will affect many industries, but we need to approach it with caution as well as curiosity. Even many of the engineers and researchers who helped develop AI acknowledge that it can produce false information, unintended results, and biased outputs. While the people designing these systems use critical thinking, judgment, and accountability, AI itself does not. It can process information and recognize patterns, but it cannot replace human experience, common sense, or critical reasoning. I support innovation, but I also believe policymakers have a responsibility to ask hard questions before embracing new technologies on a large scale. The same applies to data centers. Many of the facilities being proposed across the country raise concerns about energy use, land use, natural resources, and long-term impacts on local communities. New Hampshire should establish clear guidelines that ensure transparency, environmental review, and meaningful local input before major projects are approved. My goal is to encourage responsible innovation while protecting our communities, natural resources, and quality of life for future generations."

    KEYWORDS: AI analytical infrastructure

