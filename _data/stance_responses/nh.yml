  response: |
    "Are we ready for the changes that are coming due to AI?  Our understanding of how AI will change life, and our social, economic and ethical preparation for these changes is not keeping pace with the technology. We are behind the curve. What is to be gained from AI?  Is it mostly for the financial profit of a few people?  What social goods will benefit everyone?  Who will control AI in the future? Should AI be open source for the use of the public?  If not, should the financial benefits of AI be set aside for the public to offset the costs of AI in terms of lost jobs and wages?  We need to ask these questions now. Large data centers have significant impact on local communities.  Water is drained from aquifers making nearby homes unlivable, noise exceeds healthy levels making life a constant source of stress, high use of electricity raises utility bills, the use of large on-site diesel generators to supplement energy needs creates local pollution and jeopardizes the health of people in the community. Local communities should have a say in whether they support a large data center in their town."

