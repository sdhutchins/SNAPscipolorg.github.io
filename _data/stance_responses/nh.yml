  response: |
    "The cheapest, cleanest and easiest source of electricity in the world is solar.  We should encourage adoption of solar and offshore wind for NH. Solar is winning. Solar energy was 75% of new energy in the world last year, and 50% in the US (with batteries making up an additional 30%).  NH gets only 1% of its electricity from solar, while surrounding states get over 15% and climbing. Every day in New England, we get 5x as much energy from solar as from the Seabrook power plant for most of the day. NH is far behind the region. Solar is inexpensive.  Why is the world adopting solar?  Solar is much cheaper than the lowest fossil fuel prices.  Its cost has dropped over 90% in the last 15 years and continues to drop. The remaining barriers are “soft costs” which we can address.  The cost of batteries has dropped over 80%. California releases almost as much electricity from batteries after sundown than is used in all New England. It is easy. Solar can be installed in a range of places, reducing the demand on the grid, the expense of upgrading the grid, and could create thousands of local jobs."

