- candidate_first_name: Victor
  candidate_last_name: Orlando
  state: nh
  race: US House of Representatives
  district: 2
  party: Republican
  question: nh-q1
  date: 
  response: |
    "I support practical, common-sense approaches that protect New Hampshire’s land, working farms, forests, and outdoor heritage while actually solving our housing shortage. One of the best tools we have is well-designed open space (or conservation) developments. These allow builders to cluster homes on a portion of a property while permanently protecting a significant share of the land as open space, trails, or working land. Done right, this approach preserves more open space than traditional large-lot zoning, keeps the rural character people love, and still delivers more housing. That combination lowers pressure on undeveloped land elsewhere and helps ease the housing crisis that is driving up property taxes and pricing young families out of their own communities. New Hampshire’s strength has always been balancing freedom, responsibility, and respect for the land. I will back policies that deliver more housing, more preserved open space, and lower costs for working families, not slogans that sound good but make both housing and conservation harder."

    KEYWORDS: Open space development, conservation subdivisions, housing + land preservation, private property rights, local control, working lands, housing

- candidate_first_name: Victor
  candidate_last_name: Orlando
  state: nh
  race: US House of Representatives
  district: 2
  party: Republican
  question: nh-q2
  date: 
  response: |
    "I believe vaccination should remain a personal medical decision made by individuals and parents in consultation with their doctors, not a decision forced by government. The proper role of government is limited: ensure that vaccines available to the public meet high standards of safety and efficacy, require transparent reporting of serious side effects, and protect the right of people to give informed consent. Beyond that, the government should not mandate vaccines, condition employment, education, or public life on vaccination status, or pressure people through mandates or penalties."

    KEYWORDS: Vaccine personal choice, medical freedom, informed consent, no vaccine mandates, vaccine safety oversight, individual liberty

