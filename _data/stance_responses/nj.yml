    NJ should welcome technological investment while ensuring data centers do not shift their environmental and infrastructure costs onto residents. I support requiring comprehensive environmental and infrastructure impact assessments before major data centers are approved, including impacts on electricity demand, water consumption, wastewater, traffic, and local grid capacity.
    Developers should pay their fair share of necessary infrastructure upgrades rather than relying on existing ratepayers. I would also support stronger energy-efficiency standards, renewable-energy requirements, water-reuse systems, and transparent reporting of energy and water consumption.
    State regulators should coordinate with utilities and municipalities to ensure projects do not compromise grid reliability or increase costs for families. Finally, communities should have meaningful opportunities for public input before approval. Economic development should go hand-in-hand with environmental responsibility, infrastructure capacity, and protecting New Jersey residents from unintended costs.

