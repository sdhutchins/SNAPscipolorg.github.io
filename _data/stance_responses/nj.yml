- candidate_first_name: Aristotle 
  candidate_last_name: Eliopolous
  state: nj
  race: US House of Representatives
  district: 8
  party: Independent
  question: nj-q1
  date: 2026-09-21
  response: |
    NJ's PFAS policies have had a measurable positive impact. That progress demonstrates that strong regulation, monitoring, and investment in clean water infrastructure can protect public health. I would build on New Jersey’s progress with a comprehensive “source-to-tap” strategy.
    First, expand PFAS monitoring in air, soil, groundwater, and surface water, particularly near industrial facilities, landfills, airports, fire-training sites, and wastewater facilities. Second, strengthen protections for private-well owners through testing, public notification, and financial assistance for filtration where contamination is detected. Third, hold responsible polluters accountable so taxpayers and ratepayers are not forced to bear cleanup costs when responsible parties can be identified.
    Finally, we should continue reducing PFAS at the source by restricting unnecessary uses of these chemicals in consumer and industrial products.
    Clean water should not depend on a family’s ZIP code or whether they rely on a public system or private well. New Jersey should continue the progress it has made while closing the remaining gaps in PFAS protection.

- candidate_first_name: Aristotle 
  candidate_last_name: Eliopolous
  state: nj
  race: US House of Representatives
  district: 8
  party: Independent
  question: nj-q2
  date: 2026-09-21
  response: |
    I would work in Congress to maintain strong, predictable federal funding for NIH, medical research, cancer research, and programs that expand access to healthcare. Federal investment is essential because it provides the scale and stability necessary for long-term research that individual states cannot replicate.
    At the same time, New Jersey should strengthen its own research infrastructure rather than relying exclusively on Washington. I support creating dedicated, predictable state funding for cancer and other high-priority health research, including the proposed increase in funding for the New Jersey Commission on Cancer Research from $1 million to $10 million.
    State funding should prioritize competitive research grants, pediatric and rare diseases, clinical trials, prevention, and communities historically underserved by medical research. I would also support partnerships between New Jersey universities, hospitals, biotech companies, and government to move discoveries from the laboratory into affordable treatments.
    Federal and state investments should complement—not replace—each other, ensuring New Jersey remains a national leader in medical innovation while delivering tangible benefits to patients and families.

- candidate_first_name: Aristotle 
  candidate_last_name: Eliopolous
