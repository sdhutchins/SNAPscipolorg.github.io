- candidate_first_name: "Da'shone"
  candidate_last_name: "Hughey"
  state: nj
  race: US House of Representatives
  district: "8"
  party: We the People
  date: 2026-08-27
  question: nj-q1
  response: |
    Yes. New Jersey’s policies addressing PFAS have made a meaningful difference, particularly the establishment of enforceable drinking-water standards. The decline in PFAS levels shows that strong regulation, monitoring, and enforcement can protect public health. But we cannot declare victory while PFAS contamination remains a concern in our air, soil, groundwater, and private wells.

    As Congressman, I would support a comprehensive PFAS strategy built on prevention, monitoring, accountability, and cleanup.

    First, we need stronger monitoring of drinking water, groundwater, and private wells, with transparent reporting so residents know what is in the water they depend on. Families using private wells should have access to affordable testing and assistance when contamination is discovered.

    Second, New Jersey must do more to identify and remediate PFAS contamination in soil and groundwater. Contaminated soil should not simply be moved from one community to another without appropriate safeguards.

    Third, we need greater attention to PFAS emissions and industrial sources. Protecting our water while allowing PFAS to enter the environment through air emissions or industrial processes is not a comprehensive solution.

    Finally, the polluter should pay whenever responsibility can be established. New Jersey taxpayers should not be forced to shoulder the full cost of cleaning up contamination created by companies that profited from these chemicals.

    I also support phasing out nonessential uses of PFAS when safer alternatives are available, while relying on sound science for essential uses where alternatives do not yet exist.

    The principle is simple: clean air, clean soil, and clean water should not be privileges—they are fundamental to healthy communities.

    This is where we need new thinking: using science, technology, transparency, and accountability to prevent contamination before it happens rather than waiting decades to clean it up. Protecting people's health must come before protecting anyone's bottom line.

- candidate_first_name: "Da'shone"
  candidate_last_name: "Hughey"
  state: nj
  race: US House of Representatives
  district: "8"
  party: We the People
  date: 2026-08-27
  question: nj-q2
  response: |
    Yes. I strongly support maintaining—and where possible increasing—federal investment in health and biomedical research in New Jersey. NIH funding is not simply a line item in a federal budget; it is an investment in our universities, biotech companies, researchers, patients, and New Jersey’s economy. In FY2025, NIH awarded approximately $465.4 million to New Jersey, supporting an estimated 5,806 jobs and $1.51 billion in economic activity.

    As Congressman, I would fight to protect competitive federal research funding and ensure New Jersey continues to receive its fair share. Research into cancer, cardiovascular disease, neurological disorders, and other serious illnesses saves lives while creating high-skilled jobs and strengthening our biotechnology economy.

    At the same time, I support strategic state investment as a supplement—not a replacement—for federal funding. New Jersey should establish dedicated, predictable funding for priority areas such as cancer research, prevention, emerging diseases, and medical innovation. I also support using a portion of existing tobacco-related revenues for cancer research, provided those funds are protected from being diverted to unrelated purposes.

    The state should also create competitive grants that connect universities, hospitals, biotech companies, and emerging researchers, with an emphasis on turning discoveries into treatments, companies, and jobs here in New Jersey.

    My approach is simple: Washington should not be the only source of investment in New Jersey's health future, but New Jersey should not have to carry the burden alone. We need a federal-state partnership that protects basic research, encourages innovation, and makes sure the benefits of that research reach patients and communities.

    This is part of New Thinking: invest in science not only because it is good medicine, but because it is good economic policy. New Jersey can be a national leader in biomedical research, innovation, and the creation of the next generation of healthcare jobs.

- candidate_first_name: "Da'shone"
  candidate_last_name: "Hughey"
  state: nj
  race: US House of Representatives
  district: "8"
  party: We the People
  date: 2026-08-27
  question: nj-q3
  response: |
    Yes. I support increased research and resources for youth mental health. When nearly half of our young people report experiencing persistent sadness or hopelessness, we have to treat that as a serious public-health and educational issue—not something we can ignore until a crisis occurs.

    New Jersey should invest in prevention, early intervention, and access to qualified mental-health professionals in schools. Students should not have to wait weeks or months to speak with a counselor when they are struggling. We need to work toward more appropriate student-to-counselor, psychologist, and social-worker ratios, particularly in communities where resources are limited.

    I also support expanding partnerships between schools, healthcare providers, universities, and community organizations so students can receive additional support when school-based resources are insufficient. Research should help us understand the causes of youth mental-health challenges—including academic pressure, social isolation, bullying, family economic stress, and the impact of technology and social media—and identify which interventions actually work.

    We should also provide educators with better training to recognize warning signs and connect students with appropriate professional support, while protecting student privacy and ensuring parents and families are appropriately involved.

    Most importantly, we need to stop treating mental health as separate from a young person's future. A student who is struggling emotionally may have difficulty learning, graduating, developing relationships, or preparing for the workforce.

    New Thinking means addressing problems before they become crises. If we want New Jersey's young people prepared for the future, we have to invest in the whole student—mind, education, skills, and opportunity.

    Our children are not just tomorrow's workforce. They are our future, and their well-being is an investment in the future of New Jersey.

- candidate_first_name: "Da'shone"
  candidate_last_name: "Hughey"
  state: nj
  race: US House of Representatives
  district: "8"
  party: We the People
  date: 2026-08-27
  question: nj-q4
  response: |
    New Jersey cannot afford to treat flooding and natural disasters as unexpected events. We need to move from a reactive approach—cleaning up after disasters—to a proactive strategy that prepares communities before the next storm arrives.

    As Congressman, I would support increased federal and state investment in modernizing stormwater systems, upgrading aging infrastructure, improving drainage, protecting critical facilities, and strengthening flood-prone roads and transportation networks. Communities should also have access to better emergency warning systems and faster disaster-response resources.

    I would make state scientists, hydrologists, engineers, and flood experts central to this process. Policy decisions about where and how we build should be guided by the best available science, including updated flood maps, rainfall projections, watershed data, sea-level trends, and information about how development affects stormwater runoff.

    I also support stronger coordination between federal, state, and local governments so that flood mitigation does not stop at municipal boundaries. Water does not recognize political boundaries, and neither should our planning.

    We should prioritize investments based on risk and vulnerability, giving particular attention to communities that repeatedly experience flooding and lack the resources to recover on their own. Federal disaster assistance should also focus more heavily on mitigation and rebuilding resilient infrastructure rather than simply replacing what was destroyed.

    This is New Thinking: don't wait for the next disaster to tell us where our infrastructure is vulnerable. Use science, technology, data, and expert knowledge to identify those vulnerabilities now and invest accordingly.

    Every dollar spent preparing a community before a disaster can save lives, protect businesses, and reduce the cost of rebuilding afterward. New Jersey deserves a disaster-resilience strategy designed for the future—not one based on the storms of the past.

- candidate_first_name: "Da'shone"
  candidate_last_name: "Hughey"
  state: nj
  race: US House of Representatives
  district: "8"
  party: We the People
  date: 2026-08-27
  question: nj-q5
  response: |
    Yes. New Jersey cannot claim to be preparing students for the future while too many students are leaving school without strong foundations in science, mathematics, technology, and critical thinking. The disparities in science proficiency—particularly in underserved communities—should concern all of us.

    As Congressman, I would support a statewide STEM education strategy built around three priorities: better teachers, earlier exposure, and hands-on learning.

    First, we need to rebuild the STEM teacher pipeline. That means expanding scholarships, loan-forgiveness programs, paid student-teaching opportunities, and alternative pathways for qualified professionals in science, engineering, technology, and mathematics to enter the classroom. We should also provide incentives for experienced STEM educators to teach in schools facing the greatest shortages.

    Second, STEM education should begin earlier and be available to every student, not just students in affluent districts. Students should have access to robotics, coding, engineering, laboratory science, artificial intelligence, and applied mathematics from elementary school through high school.

    Third, we need to move beyond teaching students to simply memorize information for standardized tests. Evidence-based learning means teaching students how to ask questions, evaluate information, conduct experiments, solve problems, and apply what they learn to the real world. Technology and AI should be used as tools to personalize instruction and give teachers better ways to identify where students need help—not as replacements for teachers.

    I would also support stronger partnerships among schools, universities, technology companies, and employers to provide internships, apprenticeships, mentorships, and hands-on STEM experiences that connect education to actual careers.

    The goal should not simply be higher test scores. The goal is to create a generation of problem-solvers capable of competing in the AI economy and creating the technologies of tomorrow.

    This is New Thinking: every child, regardless of their ZIP code, should have access to the knowledge, technology, teachers, and opportunities necessary to succeed.

    We cannot build the future with an education system designed for the past.

- candidate_first_name: "Da'shone"
  candidate_last_name: "Hughey"
  state: nj
  race: US House of Representatives
  district: "8"
  party: We the People
  date: 2026-08-27
  question: nj-q6
  response: |
    I support the growth of data centers and the technology economy, but New Jersey should not allow economic development to come at the expense of our environment, infrastructure, or taxpayers. The AI economy will require enormous computing capacity, and we need to make sure that growth is managed responsibly.

    I support requiring large data-center projects to undergo a comprehensive impact assessment before approval. That assessment should examine electricity demand, water consumption, wastewater, air emissions, noise, traffic, land use, and the impact on local roads and utility infrastructure.

    Data centers should also be required to pay their fair share of the infrastructure costs they create. Residents should not see higher utility costs or taxes because a private company needs to build a massive new facility. Where additional generation, transmission, water, roads, or other infrastructure is required, developers should contribute appropriately to those costs.

    I would also support stronger requirements for energy efficiency, renewable energy, battery storage, and waste-heat recovery, where technically and economically feasible. We should encourage data centers to operate increasingly on clean energy rather than allowing the growth of AI to become a reason for greater dependence on fossil fuels.

    Water is another critical concern. Data centers should disclose their water consumption and demonstrate that their operations will not jeopardize local water supplies, particularly during periods of drought or water stress.

    Finally, communities deserve a meaningful voice. Residents should have access to the environmental and infrastructure data used to approve these projects, and local governments should have the resources and expertise necessary to evaluate them.

    New Thinking means embracing innovation without abandoning responsibility. New Jersey should welcome the AI economy, but we should build it in a way that creates jobs, strengthens our infrastructure, protects our environment, and ensures that the public receives a fair return on the resources these facilities consume.

    We should not choose between technological progress and environmental responsibility. With smart policy, New Jersey can have both.

