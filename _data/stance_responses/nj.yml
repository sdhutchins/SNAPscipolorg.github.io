    New Jersey cannot build a 21st-century economy with a 20th-century STEM education system. My New Thinking philosophy is to prepare students for the world they are entering—not the world we inherited.
    I would propose a New Jersey STEM and Future Workforce Initiative with five concrete actions:
    1.	STEM Opportunity Grants: Direct federal and state funds to schools for robotics, AI, computer science, engineering labs, and hands-on science, prioritizing underserved districts.
    2.	STEM Teacher Corps: Provide scholarships, loan assistance, paid residencies, and competitive retention incentives for qualified math and science teachers.
    3.	Queriosity Learning Centers: Pilot centers that provide AI-assisted tutoring, robotics, VR, experimentation, and project-based learning after school and during summers. Successful models could be expanded statewide through public-school and community partnerships.
    4.	STEM Career Pathways: Require participating schools to develop partnerships with universities, manufacturers, technology companies, hospitals, laboratories, and apprenticeship programs.
    5.	Measure Results: Track science and math proficiency, teacher vacancies, STEM course enrollment, certifications, internships, and post-graduation outcomes—and redirect resources toward programs demonstrating measurable improvement.
    New Thinking means replacing passive learning with curiosity, experimentation, technology, and measurable results.
    Every New Jersey student should have the opportunity to become a creator of the future, not merely a consumer of it.

