    While state-level ratepayer protections are a starting point, federal and state policy must address systemic financial risk. I support national data center capacity audits to distinguish durable computing demand from speculative overbuilding. Furthermore, I advocate ending uncapped corporate sales-tax exemptions for data center hardware, enforcing binding "take-or-pay" energy contracts so tech corporations—not working families—pay for 100% of grid expansion, and mandating off-grid self-generation for high-density compute facilities.

- candidate_first_name: "Ryan Michael"
