    I would also require transparent reporting so residents can see the economic and environmental impacts of major facilities.
    New Thinking means building tomorrow's infrastructure without leaving today's communities with the bill.
    New Jersey should become a national leader in responsible AI infrastructure where innovation, economic opportunity, environmental stewardship, and community investment advance together.

