  question: nj-q3
  date: 2026-09-21
  response: |
    Yes. Youth mental health deserves both greater research and greater investment. Schools are often the first place where warning signs appear, yet New Jersey continues to face shortages of school counselors, psychologists, social workers, and other mental-health professionals. We need better data to understand which interventions work and where resources are most urgently needed.
    I support increasing federal and state funding for school-based mental-health services, with priority given to districts experiencing the greatest shortages and highest levels of student need. Schools should have sufficient counselors, psychologists, and social workers to provide early intervention—not simply respond when a crisis occurs.
    I would also support expanding school-based partnerships with licensed mental-health providers, telehealth options, and programs that connect students and families with affordable community-based care. Federal funding should help districts hire and retain qualified professionals, particularly in underserved communities.
    Prevention must also be part of the solution. Schools should provide age-appropriate education on mental health, stress management, substance-use prevention, and how to seek help, while protecting student privacy and parental involvement.
    Finally, I support continued research into youth mental health, including the effects of social media, bullying, academic pressure, and economic insecurity. Our goal should be a system that identifies problems early, provides accessible support, and ensures no child has to face a mental-health crisis alone.

- candidate_first_name: Aristotle 
  candidate_last_name: Eliopolous
  state: nj
  race: US House of Representatives
  district: 8
  party: Independent
  question: nj-q4
  date: 2026-09-21
  response: |
    New Jersey needs to invest in both prevention and preparedness as flooding becomes an increasingly costly threat to homeowners, businesses, and infrastructure. I support expanding federal and state funding for stormwater systems, drainage upgrades, flood-control infrastructure, green infrastructure, and voluntary buyouts in repeatedly flooded areas. New development should also meet stronger, forward-looking flood-resilience standards rather than relying solely on historical flood maps. New Jersey has already moved in this direction through its Inland Flood Protection Rule and recent resilience initiatives.
    State scientists and flood experts should be central to these decisions. They should regularly update flood maps and rainfall projections, identify vulnerable communities, evaluate proposed infrastructure projects, and ensure taxpayer dollars are directed toward projects supported by the best available science. New Jersey’s Division of Science and Research already provides scientific support for climate-resilience planning.
    We should also improve emergency-warning systems and provide small businesses and homeowners with resources to prepare before disasters occur. The goal should be simple: use science to anticipate flooding, invest before disasters happen, and protect lives, homes, businesses, and taxpayers.

- candidate_first_name: Aristotle 
  candidate_last_name: Eliopolous
