    NJ's PFAS policies have had a measurable positive impact. That progress demonstrates that strong regulation, monitoring, and investment in clean water infrastructure can protect public health. I would build on New Jersey’s progress with a comprehensive “source-to-tap” strategy.
    First, expand PFAS monitoring in air, soil, groundwater, and surface water, particularly near industrial facilities, landfills, airports, fire-training sites, and wastewater facilities. Second, strengthen protections for private-well owners through testing, public notification, and financial assistance for filtration where contamination is detected. Third, hold responsible polluters accountable so taxpayers and ratepayers are not forced to bear cleanup costs when responsible parties can be identified.
    Finally, we should continue reducing PFAS at the source by restricting unnecessary uses of these chemicals in consumer and industrial products.
    Clean water should not depend on a family’s ZIP code or whether they rely on a public system or private well. New Jersey should continue the progress it has made while closing the remaining gaps in PFAS protection.

