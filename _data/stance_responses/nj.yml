    The rapid expansion of data centers, with their enormous appetite for water and power, can exacerbate extant environmental problems. Much of the electricity used to power data centers is presently sourced from fossil fuels, directly contributing to climate change. Data centers often place heavy burdens on local municipal drinking water and nearby watersheds, especially in water-stressed regions. As water evaporates to cool computer servers it concentrates and leaves behind pollutants in wastewater. Chemicals used for system maintenance, heavy metals from degrading pipes and excessive nutrients are then discharged to watersheds or to the surrounding land, leaching into the soil and contaminating groundwater and local wells. Cooling systems can release heated water and air back into the environment. Releasing warm water into local bodies of water, drastically changes ambient temperature, which disrupts aquatic ecosystems. So I support a moratorium out of concern about the ability to regulate the industry.

