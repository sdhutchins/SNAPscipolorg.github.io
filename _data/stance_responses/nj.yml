    I would work in Congress to maintain strong, predictable federal funding for NIH, medical research, cancer research, and programs that expand access to healthcare. Federal investment is essential because it provides the scale and stability necessary for long-term research that individual states cannot replicate.
    At the same time, New Jersey should strengthen its own research infrastructure rather than relying exclusively on Washington. I support creating dedicated, predictable state funding for cancer and other high-priority health research, including the proposed increase in funding for the New Jersey Commission on Cancer Research from $1 million to $10 million.
    State funding should prioritize competitive research grants, pediatric and rare diseases, clinical trials, prevention, and communities historically underserved by medical research. I would also support partnerships between New Jersey universities, hospitals, biotech companies, and government to move discoveries from the laboratory into affordable treatments.
    Federal and state investments should complement—not replace—each other, ensuring New Jersey remains a national leader in medical innovation while delivering tangible benefits to patients and families.

