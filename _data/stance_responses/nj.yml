    New Jersey needs to move from disaster response to disaster prevention and resilience. My New Thinking philosophy is simple: if science can help predict flooding, government should act before communities suffer the damage.
    As a representative, I would pursue a New Jersey Flood Resilience Initiative with four priorities:
    1.	Map the risk: Create continuously updated flood-risk maps using rainfall, watershed, drainage, infrastructure, and sea-level data, with state scientists and hydrologists guiding decisions.
    2.	Fund prevention: Direct federal infrastructure and disaster-resilience dollars toward stormwater systems, drainage, dams, roads, bridges, wetlands restoration, and green infrastructure in the communities facing the greatest risk.
    3.	Protect property: Expand grants and low-interest financing for homeowners and small businesses to elevate buildings, install flood barriers, improve drainage, and relocate critical equipment above flood levels.
    4.	Improve response: Establish coordinated early-warning systems and require municipalities to maintain emergency flood-response plans based on current scientific data.
    I would also support accelerating federal disaster assistance after major floods while ensuring that prevention receives funding before disasters occur.
    State scientists, engineers, hydrologists, and flood experts should have a central role in setting priorities—not politics.
    New Thinking means using science to anticipate tomorrow's problems rather than simply paying to repair yesterday's damage.
    Protect lives. Protect property. Protect New Jersey's communities.

