- candidate_first_name: Shawn
  candidate_last_name: Johnson
  state: wy
  race: US Senate
  party: Libertarian
  question: wy-q1
  date: 2026-10-15
  response: |
    "Wyoming’s natural resources are central to our economy, our way of life, and our independence. We should not have to choose between conservation and economic growth. We can responsibly develop our resources while protecting the land, water, and wildlife we leave to future generations.

    In Congress, I will prioritize keeping public lands public, protecting public access, and working with local communities, ranchers, and state officials to improve federal land management. Decisions should reflect local knowledge, sound science, and the needs of the people who live and work here.

    I support responsible development of Wyoming’s energy and mineral resources, including oil, natural gas, coal, uranium, wind, and nuclear energy. America needs reliable, affordable energy, and Wyoming workers should have the opportunity to benefit from developing our resources without unnecessary federal interference.

    I will also support protecting water resources, maintaining wildlife habitat, and holding operators accountable for proper reclamation. Federal agencies should work with Wyoming communities rather than impose one-size-fits-all mandates from Washington.

    Our public lands should remain public, our resources should benefit Wyoming citizens, and our policies should balance responsible development with conservation so future generations can enjoy both a healthy environment and a strong economy."

- candidate_first_name: Shawn
  candidate_last_name: Johnson
  state: wy
  race: US Senate
  party: Libertarian
  question: wy-q2
  date: 2026-10-15
  response: |
    "I support data center development when it delivers lasting economic benefits to Wyoming without shifting costs to taxpayers, utility customers, or our natural resources. I do not support growth at any cost.

    Large data centers can bring investment, construction jobs, technical careers, and tax revenue. However, their electricity and water demands can be substantial. We must evaluate how each project affects grid reliability, water availability, and emissions before approving development.

    I would support requiring developers to demonstrate adequate power and water supplies, disclose expected resource consumption, and pay their fair share of necessary infrastructure upgrades so existing utility customers are not stuck with higher bills. Projects should use water-efficient cooling technology and pursue reliable, affordable energy sources while reducing environmental impacts.

    We must also examine long-term benefits, not just initial investment announcements. How many permanent jobs will be created? How much revenue will remain in Wyoming communities? Will local infrastructure and public services keep pace with growth?

    As a federal representative, I would support responsible innovation while protecting Wyoming's resources and economic independence. We should welcome investment that benefits our communities, but corporations should not receive a blank check at the expense of Wyoming families."

- candidate_first_name: Shawn
  candidate_last_name: Johnson
  state: wy
  race: US Senate
  party: Libertarian
  question: wy-q3
  date: 2026-10-15
  response: |
    "Wyoming students deserve a strong science education that prepares them for careers, informed citizenship, and the challenges of the future. I would prioritize improving science proficiency through hands-on learning, stronger teacher support, and greater access to laboratory equipment and technology, particularly in rural schools.

    Science education should emphasize critical thinking, scientific literacy, and the ability to evaluate evidence rather than simply memorize facts. Students should understand subjects such as biology, chemistry, physics, environmental science, and emerging technologies. Wyoming should also expand career and technical education opportunities connected to energy, agriculture, mining, water management, and other industries important to our state's economy.

    I would support giving local school districts and educators flexibility to adapt instruction to their students' needs while maintaining clear standards for measuring proficiency. We should evaluate student outcomes, identify gaps in resources, and direct assistance where it can make the greatest difference.

    As a federal representative, I would advocate for reducing unnecessary federal mandates, supporting rural education, and expanding access to science resources and workforce training. Education decisions should remain primarily with states, local communities, parents, and educators. Our goal should be to give every Wyoming student the knowledge and practical skills to succeed, regardless of where they live."

- candidate_first_name: Shawn
  candidate_last_name: Johnson
  state: wy
  race: US Senate
  party: Libertarian
  question: wy-q4
  date: 2026-10-15
  response: |
    "Wyoming’s health-care shortages require practical solutions, especially for rural communities where distance and limited provider availability can delay essential care. I would prioritize expanding access while reducing unnecessary barriers that make it difficult to recruit and retain health professionals.

    I would support expanding telehealth, strengthening rural clinics and hospitals, and improving access to mental-health services. I would also advocate for federal loan-repayment programs and incentives that encourage doctors, nurses, and behavioral-health professionals to practice in underserved communities. Expanding training opportunities and allowing qualified professionals to practice to the full extent of their training can help increase access without compromising patient safety.

    Science and evidence should guide these decisions. I would examine Health Resources and Services Administration shortage designations, provider vacancy rates, patient wait times, travel distances, health outcomes, and the cost-effectiveness of different programs. We should measure whether initiatives actually improve access and adjust them when they do not.

    As a federal representative, I would work to make federal health programs more flexible, reduce unnecessary administrative burdens, and support locally driven solutions. Every Wyoming resident should have a reasonable opportunity to obtain timely, quality care, regardless of where they live."

- candidate_first_name: Shawn
  candidate_last_name: Johnson
  state: wy
  race: US Senate
  party: Libertarian
  question: wy-q5
  date: 2026-10-15
  response: |
    "I opposed an across-the-board cut of this magnitude without a clear, evidence-based assessment of its consequences. The University of Wyoming is a critical investment in our state's future, educating our workforce, conducting research, and supporting industries ranging from agriculture and energy to health care and engineering.

    That does not mean the university should be exempt from financial accountability. I support reviewing administrative costs, evaluating academic programs, and measuring outcomes to ensure taxpayer dollars are spent effectively. However, budget reductions should be targeted and justified, not imposed without adequately considering their effects on students, faculty, research, and rural communities.

    State support should prioritize quality instruction, student services that improve retention and graduation, research that benefits Wyoming, and programs that address workforce shortages. Decisions should be guided by graduation rates, employment outcomes, research impact, program costs, and demonstrated needs across the state.

    As a candidate for federal office, I recognize that the university's state appropriation is ultimately a decision for Wyoming's Legislature. My role would be to support appropriate federal research partnerships and workforce initiatives while advocating for responsible budgeting. We should demand accountability from our university while recognizing that higher education is an investment in Wyoming's long-term economic strength."

