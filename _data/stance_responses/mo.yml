    "Throughout my career, I've deferred to expert opinion rather than my own assumptions — that's how good decisions get made, whether in a courtroom or in Congress. If elected, I'll seek out scientific opinions on all sides of an issue before voting on policy that affects public health, agriculture, technology, or the environment. Science doesn't always speak with one voice, and I think that's a strength, not a weakness — hearing from experts across the spectrum leads to better, more informed policy. Missourians deserve a representative who listens to the evidence, not one who ignores it or cherry-picks it to fit a predetermined conclusion."

