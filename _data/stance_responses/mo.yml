  primary_candidate: true
  response: |
   "Rural health care access is one of the most serious issues facing Missouri. When a county has no hospital, every emergency becomes more dangerous, and every routine health need becomes harder and more expensive. I support policies that strengthen rural hospitals, expand access to primary care, and make it easier for communities to recruit and retain doctors, nurses, mental health providers, and emergency medical personnel. Incentivize cities to build hospitals to reduce this gap may be reviewed.
    At the federal level, I would support targeted rural health funding that actually reaches local providers, not just large systems. I also support expanding telehealth where it makes sense, improving broadband access, protecting rural EMS services, and reducing regulatory barriers that make it harder for small clinics and hospitals to operate. We also need to address prescription drug costs, insurance costs, and the shortage of providers serving rural areas.
    My goal is simple: people in rural Missouri should not have to drive an hour or more just to receive basic care, emergency care, mental health care, or maternal health services."

- candidate_first_name: Grayson B
  candidate_last_name: Hunt
  state: mo
