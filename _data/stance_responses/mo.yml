    "AI is the future whether we like it or not, and Missouri should get out in front of it rather than fall behind. Data centers bring real economic benefits — jobs, investment, and a stake in a growing industry. But growth can't come at the expense of everyday Missourians. I'll support commonsense restrictions to make sure data center development doesn't strain local power grids, drive up utility costs, or drain water resources that families and farmers depend on. Privacy protections also need to keep pace with the technology. The goal is balance: welcome the industry and the jobs it brings, while making sure it's a good neighbor to the communities it operates in."

- candidate_first_name: Matthew R
