  response: |
    "Government schools are failing children in our community in a wide variety of metrics and this includes science literacy. This is unacceptable and cannot continue. We need to transition to a privatized education system and allow our students to be lifted up by competing teachers and schools. Students and families should have freedom of choice in selecting their school which includes the right to eschew schools that are not meeting student needs. Free market incentives, innovations, and competition, particularly in our new digital age, would transform our education system and make the United States the global leader in science education."
  
- candidate_first_name: Nathanael
  candidate_last_name: Schultz
  state: mo
  race: US House of Representatives
  district: 6
  party: Republican 
  question: mo-q1
  date: 
  primary_candidate: true
  response: |
    "Nathanael Schultz believes rural hospitals and emergency rooms are essential infrastructure for Missouri communities. As hospitals continue to close across rural America, Congress should prioritize keeping emergency care available close to home. Schultz supports expanding targeted federal funding for rural emergency rooms, similar to proposals that would help stabilize access to emergency care in underserved communities.
    Schultz also believes protecting Medicare and Medicaid begins with restoring accountability to these programs. Nathanael Schultz supports deporting individuals who are in the United States illegally and ensuring taxpayer-funded health care resources are reserved for those who are legally eligible. In addition, Schultz will work to eliminate fraud, waste, abuse, and bureaucratic inefficiency so providers receive funding more efficiently and more of every taxpayer dollar reaches patient care rather than administrative overhead.
    For Nathanael Schultz, the goal is straightforward: preserve access to quality health care in rural Missouri while ensuring federal health care programs are financially sustainable, accountable, and focused on serving the American people."
  
- candidate_first_name: Nathanael
  candidate_last_name: Schultz
  state: mo
  race: US House of Representatives
  district: 6
  party: Republican 
  question: mo-q3
  date: 
  primary_candidate: true
  response: |
    "Nathanael Schultz supports American leadership in artificial intelligence, but not at the expense of Missouri families, farmers, or taxpayers. AI is a strategic technology with the potential to strengthen national security, improve medicine, and drive economic growth. However, that does not justify subsidizing every proposed data center or asking rural communities to bear the costs while others reap the benefits.
    Schultz believes the federal government should end policies that use taxpayer dollars to subsidize private data center development through grants, financing, or infrastructure incentives without demonstrating a clear public benefit. Before federal support is provided, projects should prove they will create meaningful long-term jobs, protect private property rights, preserve productive farmland where practical, safeguard water and electric reliability, and leave local communities better off than they were before.
    Nathanael Schultz also believes Congress has a responsibility to protect Americans' privacy as AI capabilities continue to advance. AI should never become a tool for mass surveillance or the erosion of constitutional liberties. Innovation and individual freedom must advance together.
    For Nathanael Schultz, the balance is simple: encourage American innovation, protect national competitiveness, and ensure Missouri communities—not Washington bureaucrats or special interests—have the final say in developments that will shape their future."
  
- candidate_first_name: Nathanael
  candidate_last_name: Schultz
  state: mo
