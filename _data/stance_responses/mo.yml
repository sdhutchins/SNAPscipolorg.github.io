- candidate_first_name: Fred
  candidate_last_name: Wellman
  state: mo
  race: US House of Representatives
  district: 2
  party: Democratic
  question: mo-q1
  date: 
  response: | 
    "No Missourian should have to drive two counties, wait months for an appointment, or risk bankruptcy because they got sick. But that is where we are when Washington cuts Medicaid, lets ACA subsidies expire, and leaves rural hospitals to fend for themselves. I will fight to restore and make permanent the enhanced ACA premium tax credits, protect Medicaid and the Affordable Care Act, and stop policies that force rural hospitals to cut services or close their doors.
    I saw how quickly a health system can be pushed to its limits when I served as Chief of Staff at the NewYork-Presbyterian Ryan F. Larkin Field Hospital during COVID. Rural hospitals are essential infrastructure and major employers in communities across Missouri. I will fight for reliable reimbursement for rural providers, stronger community health centers, maternity care, mental-health care, EMS, telehealth, and the broadband infrastructure that makes telehealth possible.
    We also have to lower costs across the system. I will support expanded Medicare drug-price negotiation, an insulin cap, stronger oversight of pharmacy benefit managers, protections against medical debt, and prior-authorization reform so insurance companies cannot delay or deny doctor-ordered care. And we need to train and retain more doctors, nurses, mental-health professionals, and first responders through rural residency programs, loan repayment, and local training partnerships."

- candidate_first_name: Fred
  candidate_last_name: Wellman
