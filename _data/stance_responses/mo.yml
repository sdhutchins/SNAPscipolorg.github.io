  question: mo-q4
  date: 
  response: |
    "In my training as an attorney, I believe that any time we have a complicated scientific subject that we want to understand in the courtroom, when individuals' lives are often on the line, we want to bring in expert witnesses, often scientists, to explain the subject, to give their opinion and to help us understand the complicated scientific subject. I would refer to scientists often when deciding how to vote on policy. I believe scientists are essential to consult with on issues of environmental protections, criminal justice, and many aspects of military technology and national security. The input and advice of scientists would be invaluable to me in making policy decisions."
  
