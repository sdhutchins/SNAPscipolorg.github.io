    "There are social costs in terms of neighbors’ increased distrStatet of policy makers when their decision-making around data centers is opaque. There is social cost to bStateinesses, which are seen by some as being adversarial to local interests, predatory, or exploitative; conversely, there are potential benefits from the economic revenue of data centers that could be of benefit to local communities, as well as the benefit of low-latency computing power. There are material costs in the infrastructure that would need to be developed in order for data centers to be of benefit to everyone, particularly our rural communities. However, environmental risks concern most of the people I have spoken with, whether that is noise, water pollution, water consumption, utility costs (with its attendant need for infrastructure growth) or perceived changes in local community culture. As a mediator by training, my perspective is to find common ground and bring all parties to the table to make sure everyone is heard, everyone’s concerns are addressed, and everyone is treated fairly and appropriately under the law. Any new laws mStatet strike the balance between the needs of individuals, bStateinesses, and the community writ large. In my ideal world, any data center infrastructure would confer benefit to communities, not jStatet the individual bStateiness owners."

