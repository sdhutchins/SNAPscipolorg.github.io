    "I plan to vote for policies that reduce regulation, get government out of the way, and make rural hospitals more viable from a business perspective."

- candidate_first_name: Andy
  candidate_last_name: Maidment
  state: mo
  race: US House of Representatives
  district: 6
  party: Libertarian
  question: mo-q2
  date:
  response: |
    "The government has no business picking winners and losers. If there is profit to be made, and there is in agriculture, then investment and ingenuity will follow. Trying to force this results in bad policies that do the opposite. Just look the amount of land that is poorly conditioned for row crops that are under row crops thanks to farm and ethanol subsidies. And we wonder why we're running out of beef. We do not need new legislation to make this happen. Legislation and regulation will only discourage the entrepreneurial spirit that built this country."
    
- candidate_first_name: Andy
  candidate_last_name: Maidment
  state: mo
  race: US House of Representatives
  district: 6
  party: Libertarian
  question: mo-q3
  date:
  response: |
    "Missouri is already at the forefront of making large users of electricity and water pay for their increased capacity, at least where those industries are in the private sector. I cannot speak to what is happening under municipal utilities. New data centers are a good driver of economic development, but they should always pay for themselves. If a tax incentive can be used to lure one, then the tax rate is too high and should be lowered and made equal for everyone. Privacy certainly is an issue, but the question is nuanced. There is all the world of difference between voluntarily sharing some of your data with a technology company and having your data collected by government agents (or the companies they hire), collated, run through AI, and used to determine if you're committing a crime."

- candidate_first_name: Andy
  candidate_last_name: Maidment
  state: mo
