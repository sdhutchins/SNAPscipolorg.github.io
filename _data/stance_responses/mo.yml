  district: 6
  party: Libertarian
  question: mo-q4
  date:
  response: |
    "Generally I wouldn't, since nearly all legislation and funding today isn't even authorized by the Constitution. But I do know to seek out advice from experts in areas where I am a layman. I am in information technology but some aspects are not my forte. While I am quite versed in weapons from serving as a soldier, there are some aspects I would still be unclear on. In most matters, I can easily decide if the Federal government should even be involved, but if it actually should I'll likely need assistance."

