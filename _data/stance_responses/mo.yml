    "I strongly support continuing to grow Missouri's agtech industry. For 20 years, I worked as a trial lawyer representing Monsanto, including its subsidiaries Climate Corp. and Precision Planting, giving me firsthand knowledge of how agricultural science and technology drive Missouri's economy — $93.7 billion in output and over 456,000 jobs is not something to take for granted. I'll support continued investment in agricultural research, ag science education, and technical training so Missourians — not just outside companies — are the ones developing and benefiting from the next generation of agtech innovation. Missouri should be a national leader in agricultural science, and that means investing in the people and institutions that make it possible."

- candidate_first_name: Matthew R
