  response: |
    "If elected, I would consult scientists, researchers, medical professionals, engineers, farmers, local officials, and affected citizens depending on the policy issue. Science should inform policy, but policy also has to consider cost, liberty, ethics, local impact, and real world implementation.
    I do not believe science should be treated as partisan. Good data, peer reviewed research, and expert testimony can help lawmakers avoid emotional or politically convenient decisions. At the same time, elected officials should ask hard questions, compare evidence, and make sure scientific recommendations are transparent and accountable.
    For health policy, I would seek input from doctors, public health professionals, rural providers, and patient advocates. For agriculture, I would consult farmers, university researchers, veterinarians, and soil and water experts. For energy, AI, infrastructure, and environmental issues, I would rely on engineers, economists, utility experts, and environmental scientists. My approach would be evidence informed, locally grounded, and accountable to the people of Missouri."
  
- candidate_first_name: Grayson B
  candidate_last_name: Hunt
