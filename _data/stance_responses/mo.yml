  question: mo-q2
  date: 
  primary_candidate: true
  response: |
    "Yes I would. Agriculture is a backbone of Missouri’s economy, especially in southwest Missouri, and we should support innovation that helps farmers, ranchers, producers, and rural communities remain competitive. Agtech can help improve yields, conserve water, reduce input costs, improve animal health, strengthen supply chains, and keep Missouri agriculture strong for the next generation.
    That said, support for agtech should not mean replacing family farms with corporate control or forcing expensive technology onto producers who cannot afford it. My focus would be on practical innovation that helps Missouri producers.
    I support education and scientific training tied to agriculture, including workforce training, technical education, university research, soil and water science, animal science, veterinary pipelines, and precision agriculture. Missouri students should have a clear path into good paying careers in agriculture, food production, conservation, and rural technology. Science should serve the people doing the work, and in Missouri, that means supporting the farmers and families who feed this state and this country."

- candidate_first_name: Grayson B
  candidate_last_name: Hunt
  state: mo
  race: US House of Representatives
  district: 7
  party: Republican 
  question: mo-q3
  date: 
  primary_candidate: true
  response: |
    "AI has benefits, including medical research, logistics, manufacturing, cybersecurity, agriculture, and small business efficiency. Missouri should not ignore innovation. However, new data center construction also raises many serious concerns, especially in Southwest Missouri, where residents are already dealing with rising utility costs, water concerns, land use issues, noise, and infrastructure strain.
    My position is that data centers should not receive blank checks, special treatment, or incentives if they increase electric rates, strain local water supplies, or provide limited long term local jobs.I think they should be limited in size and limited in certain consumption levels. Any project should be required to prove its impact on water use, power demand, grid reliability, local taxes, land use, and utility rates before approval, and should be by the voters.
    I would support transparency requirements, local control, environmental review, and protections to ensure residents are not subsidizing private corporate infrastructure through higher bills. Innovation does matters, but Missouri families should not pay the price for projects that mainly benefit large tech companies."

- candidate_first_name: Grayson B
  candidate_last_name: Hunt
  state: mo
