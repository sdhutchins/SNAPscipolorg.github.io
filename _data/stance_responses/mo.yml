    "STEM is the future for our students, and Missouri's schools need to treat it that way. Throughout my career, I've seen firsthand what science and technology can do to improve the everyday lives of Missourians — from agriculture to healthcare to the courtroom. That means our K-12 standards should give students real hands-on exposure to science early, not just textbook memorization, and build stronger connections between classrooms and Missouri's own science and tech industries — AgTech, healthcare, and beyond. If we want the next generation of Missourians competing for these jobs, we have to invest in the science education that prepares them for it. Science literacy isn't just an academic goal — it's an economic one."
  
- candidate_first_name: Grayson B
  candidate_last_name: Hunt
  state: mo
