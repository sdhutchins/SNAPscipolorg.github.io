    "I am a strong believer in facts and science, so I would want to refer to the experts of their fields when making decisions. For example, for agricultural policy I would want to partner with and learn from the MU extensions and make sure that federal policy changes have the highest and best impact for what makes the most sense in Missouri. An issue I see is the topic of glyphosate used at a large scale. We see politicians like Sam Graves working to remove clean water protections and in support of Bayer getting immunity from cancers caused by glyphosate use, so he is willing to take an anti-science approach to policy if he gets enough money from large corporate ag interests who tell him what to do. I am here first and foremost to do good work for the people of north Missouri, and I will not sell them out to large corporate interests in the same way our current elected officials do. You do not have to be a chemical scientist to see the cancer catastrophe unfolding in Iowa, and here in north Missouri we have many rivers which feed polluted water down into our state. We need to balance industrial agricultural production with long term health for people and the environment."

