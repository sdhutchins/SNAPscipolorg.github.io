  response: | 
    "I have worked in healthcare for more than 15 years, so I understand that access to healthcare means very little if the care a person needs is an hour away, there are not enough providers, or they cannot afford it. I support protecting and strengthening rural hospitals and clinics, expanding telehealth and broadband access, and growing Missouri's healthcare workforce. We should strengthen incentives such as loan repayment and training opportunities that encourage doctors, nurses, mental health professionals, and other healthcare providers to practice in rural and underserved communities. I also support protecting Medicaid and expanding the use of mobile and community-based healthcare so care can reach people where they live. We also need to make better use of nurse practitioners and physician assistants, especially in communities struggling with provider shortages, while maintaining appropriate standards for quality and patient safety. Where someone lives should not determine whether they can see a doctor, receive prenatal care, access mental health services, or get emergency care when they need it. Rural Missourians deserve access to quality healthcare close to home."

- candidate_first_name: Shereka
  candidate_last_name: Barnes
  state: mo
  race: State Senate
  district: 34
  party: Democratic
  question: mo-q2
  date: 
  response: |
    "Yes. I support continuing to grow agtech businesses in Missouri and making sure Missourians have the education and scientific training needed to be part of this growing industry. Agriculture is important to our economy, our rural communities, and something even more basic—making sure families have food on the table. As a working mom, I know what it is like to stretch a grocery budget and rely on programs like free and reduced-price school meals to help make sure my children were fed. That experience is one reason food security is personal to me. Programs like SNAP and school meals are important for families who are struggling, but we also have to look at the entire system that gets food from Missouri farms to our tables. As a former educator, I want our students to see the opportunities that exist in agriculture, science, technology, research, engineering, and skilled trades. We should invest in education and training that prepares Missourians for those jobs while listening to farmers and scientists about how new technology can improve productivity, protect our land and water, and keep Missouri agriculture strong. For me, supporting agriculture means supporting our farmers, creating opportunities for our students and workers, and making sure Missouri families have access to the food they need."
  
- candidate_first_name: Shereka
  candidate_last_name: Barnes
  state: mo
  race: State Senate
  district: 34
  party: Democratic
  question: mo-q3
  date: 
  response: |
    "I recognize that artificial intelligence and data centers can bring new technology, investment, and jobs to Missouri. I am not against innovation, but I believe we need strong guardrails to make sure that growth does not come at the expense of the families and communities where these facilities are built. Data centers use significant amounts of energy and water. The company building and operating the data center should be responsible for paying the energy costs and additional infrastructure costs created by its facility. Those costs should not be passed on to families and communities through higher utility bills or taxes. We also need to understand the impact on our water, electrical grid, land, environment, and the health and well-being of the surrounding community. I believe we should listen to scientists and other experts, but we also need to listen to the people who live there. Everyone deserves a voice at the table. If Missouri is going to welcome these projects, they should provide real benefits to Missourians, including good-paying union jobs and workforce opportunities. We can support innovation while protecting our families and communities, but that requires transparency, accountability, community input, and strong guardrails."

- candidate_first_name: Shereka
  candidate_last_name: Barnes
  state: mo
  race: State Senate
  district: 34
  party: Democratic
  question: mo-q4
  date: 
  response: |
    "I believe in listening to the experts. As an elected official, I will never pretend that I know everything about every issue that comes before me. My responsibility is to ask questions, listen, learn, and make the most informed decision I can for the people I represent. When legislation involves healthcare, the environment, agriculture, technology, public health, or other areas where scientific knowledge is important, I would seek input from scientists and professionals who have expertise in that specific field. I would want to understand the research, the evidence behind it, and the possible short- and long-term effects of the policy. I also believe scientists should have opportunities to testify before legislative committees and be part of policy discussions. I will listen to the people who will be directly affected by a decision as well. For me, good leadership is not about being the smartest person in the room. It is about being willing to listen to people who know more than you do, ask the right questions, look at the evidence, and then make a decision that is in the best interest of the people you serve."

- candidate_first_name: Shereka
  candidate_last_name: Barnes
  state: mo
  race: State Senate
  district: 34
  party: Democratic
  question: mo-q5
  date: 
  response: |
    "As a former educator and current school board member, I believe science literacy is about much more than passing a test. Students learn when they have opportunities to see, touch, question, explore, and understand how what they are learning connects to the real world. I support strong K-12 science and STEM education with more hands-on learning opportunities. That means experiments, labs, technology, engineering projects, robotics, environmental science, and opportunities for students to learn directly from scientists, healthcare professionals, engineers, farmers, and others working in STEM careers. I also believe exposure matters. Every child, regardless of their ZIP code or their family's income, should have an opportunity to experience STEM education and see the careers that are available to them. A student may discover a passion or career they never knew existed simply because someone gave them the opportunity to experience it. We also need to give our teachers the training, resources, and classroom materials they need to make those opportunities possible. I want our students learning to ask questions, think critically, examine evidence, solve problems, and understand how science is part of their everyday lives."

