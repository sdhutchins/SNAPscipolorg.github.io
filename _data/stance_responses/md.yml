    "Remove state from RGGI (Greenhouse Gas Initiative);  free up local energy generation through low-cost, reliable energy, especially through natural gas.  Work to speed up and facilitate nuclear power plant development.  Repeal legislation that restricts and limits gas-based energy use, such as by mandating elimination of gas-fueled cars.  Restrict bad energy generation through large-scale taxing for solar and wind.  Reject the whole "climate change" crisis argument against CO2."

