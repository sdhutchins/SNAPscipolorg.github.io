  response: |
    "I hear from neighbors every day that the cost of living is just too high – especially when it comes to their energy bills. That’s why, a month into office, I joined my Maryland colleagues in formally requesting the Maryland Public Service Commission (PSC) rescind the BGE utility rate increases that took effect in 2025 and stop future increases for the duration of the year. I am a proud co-sponsor of H.R. 7977, the Energy Bills Relief Act that reinstates clean energy tax credits, provides financial assistance to families, cracks down on price gouging, and holds data centers accountable for their fair share – all to lower costs, increase reliability, and ensure our electric grid can meet rising demands.  This past July, I joined my Maryland colleagues in calling on the Federal Energy Regulatory Commission (FERC) to ensure Marylanders are not forced to bear skyrocketing electricity costs due to increasing energy demand from out-of-state data centers. I’ve also used my committee assignments to further renewable energy generation and storage – fighting for commonsense permitting reform on the House Natural Resources Committee and putting pressure on the Department of Defense to double-down on renewables on installations through my seat on the House Armed Services Committee. As this Administration continues to prioritize corporations over consumers, I am committed to fighting for affordable and sustainable energy for Marylanders."

- candidate_first_name: Sarah
  candidate_last_name: Elfreth
  state: md
  race: US House of Representatives
  district: 3
  party: Democratic
  question: md-q2
  date: 2026-09-08
  response: |
    "As the representative for over 45,000 federal employees, the daughter of civil servants, and a member of the Labor Caucus, protecting the federal workforce and our agencies has been a priority from day one. The first bill I introduced in Congress was the first-ever bipartisan anti-DOGE bill, the Protect Our Probationary Employees (POPE) Act. I spent my first year in Congress meeting with federal employee unions and researchers from Maryland’s world-class NIH, NASA, NIST, facilities and more to find ways to support workers and preserve scientific progress amid the sledgehammer of DOGE. Federal workers and their expertise are the backbone of our economy, and we all do better when the civil service is strong and focused on delivering services for our constituents. We must also diversify and grow Maryland’s economy. That’s why I’ve worked to attract light manufacturing and shipbuilding to the District through partnerships with public industry and successfully transferring surplus, underutilized federal property to the Maryland Economic Development Corporation. I have also been a consistent and strong proponent of alternate post-secondary paths for students not pursuing 4-year degrees. Robust investment in Career and Technical Education (CTE) and pre-apprenticeship programs in high schools – specifically those that strengthen the pipeline to registered apprenticeships and union jobs – are core tenets of an opportunity economy in which every American can participate and thrive."

- candidate_first_name: Sarah
  candidate_last_name: Elfreth
  state: md
