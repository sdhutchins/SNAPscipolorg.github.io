  date: 2026-09-09
  response: |
    "There's been a huge drop in Congressional hearings drawing on the knowledge of experts in various fields. This allows lobbyists and special interests to cut deals behind the scenes. Given my own background -- a major in applied math and logic and computation from Carnegie Mellon University, with significant study in the philosophy of science -- I would delight in talking with various scientists to ensure the best possible policy making process. People are waking up to the threat of Flock cameras, but this is the tip of the iceberg. Antony Loewenstein in The Palestine Laboratory show how Israel has used technology of death and surveillance against the Palestinian people -- and how this acts as an incubator for rolling out those horrible uses of technology against others. Individuals from Israel's Unit 8200, the analogue to our NSA, have gotten into various Big Tech firms, which pose their own threats -- like Oracle and Palantir, working with ICE and other agencies. Scientists must live up to their responsibility, mindful of documents little known today like the Russell-Einstein Manifesto, which stated: "There lies before us, if we choose, continual progress in happiness, knowledge, and wisdom. Shall we, instead, choose death, because we cannot forget our quarrels? We appeal as human beings to human beings: Remember your humanity, and forget the rest. If you can do so, the way lies open to a new Paradise; if you cannot, there lies before you the risk of universal death."


- candidate_first_name: Sam
  candidate_last_name: Husseini
  state: md
  race: US House of Representatives
  district: 4
  party: Green
  question: md-q7
  date: 2026-09-09
  response: |
    "Government funding should be based on actually advancing science and serving humanity, not reflecting military or corporate interests. The NIH and USAID doubtless fund good initiatives, but they also backed horrific ones, like efforts to make pathogens more deadly. This dangerous lab work—euphemistically called "gain of function"—likely led to the Covid pandemic. This cost millions of lives and trillions of dollars. And it comes from a whole structure of dangerous lab work. This was clear with the false flag anthrax attacks after the 9/11 attacks 25 years ago. The anthrax letters were labeled "Death to America / Death to Israel / Allah is Great" and there was massive propaganda that tried to tie them to Iraq. But scientists like Barbara Hatch Rosenberg found that the anthrax actually came from Fort Detrick here in Maryland or an allied lab. Congress incredibly never investigated this attack upon it. The fear this fostered led to Cheney/Bush ramming through the attacks on Afghanistan and Iraq, the so-called PATRIOT Act and ICE. The anthrax attacks ironically led to a vast INCREASE in more dangerous lab work. As a journalist, I've written extensively about this: husseini.substack.com. I've also seriously investigated the Ebola 2014 outbreak which likely originated in US labs in Kenema, Sierra Leone. Those labs were headed by scientists named Robert Garry and Kristian Andersen who would sign a widely cited propaganda article claiming Covid couldn't have come from a lab."

- candidate_first_name: Steve
  candidate_last_name: Patten
  state: md
  race: State House of Delegates
