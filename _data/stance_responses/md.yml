  response: |
    "Maryland’s future depends on giving students meaningful opportunities to succeed in science, technology, engineering, and mathematics (STEM), regardless of their zip code or family income. If elected, I will support fully implementing the Blueprint for Maryland’s Future while strengthening hands-on STEM programs, career and technical education, apprenticeships, dual enrollment, and partnerships between schools, community colleges, universities, and Maryland employers. The Blueprint already emphasizes college and career readiness and connections between students and employers. I will work to expand STEM opportunities in underserved and rural communities, invest in teachers and classroom resources, and ensure students have access to modern technology and laboratories. For community-college students, I will support clearer transfer pathways, stronger advising, and expanded transfer scholarships so students can move efficiently into four-year programs. Maryland’s 2+2 Transfer Scholarship is an important model. Finally, I will protect college affordability and expand financial-aid opportunities so a student’s financial circumstances do not determine their ability to pursue a STEM career."

