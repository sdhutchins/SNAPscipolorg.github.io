  response: |
    "A strong STEM pipeline starts long before college. I support stronger math, science, and computer-science instruction in K–12 schools, hands-on laboratory learning, and partnerships that expose students to engineering, health care, cybersecurity, advanced manufacturing, and the skilled trades. We should expand career and technical programs, apprenticeships, and dual-enrollment opportunities so students can earn real credentials and college credit before graduation. Maryland also needs a smoother community-college-to-university pathway. I would strengthen and simplify transfer agreements so students do not lose credits unnecessarily, and protect programs such as Maryland’s 2+2 Transfer Scholarship that help community-college graduates complete bachelor’s degrees. College affordability matters, but so does value: state aid should help students complete degrees and credentials connected to real workforce needs. The goal should be multiple respected pathways—university, community college, apprenticeship, or skilled trade—each capable of leading to a good career."

- candidate_first_name: Eliott
