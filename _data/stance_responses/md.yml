    "Maryland must build an economy that is resilient, diverse, and provides opportunity for workers at every education and skill level. The loss of nearly 25,000 federal jobs in 2025 shows the danger of relying too heavily on one sector. If elected, I will support investments in small businesses, manufacturing, clean energy, healthcare, agriculture, cybersecurity, and emerging technologies. I will also work to attract businesses that create good-paying jobs while strengthening Maryland-owned businesses. Workforce development must meet people where they are. I will support expanded apprenticeships, career and technical education, community-college programs, and paid job training that connect workers directly with employers. A four-year degree should not be the only path to a good career. I will also fight for fair wages, affordable housing, and access to childcare and transportation so workers can afford to live where they work. Maryland’s economy is strongest when every worker has a path to opportunity."

