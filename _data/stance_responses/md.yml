    "Our district has shoreline on the Patapsco and Magothy rivers, plus creeks like Bodkin, Rock and Stoney. Anne Arundel has more than 40,000 septic systems, so I'd make state grants easier to get for upgrades that cut their pollution roughly in half, or for connecting to sewer where it's available. I'd fund natural shorelines made of plants and marsh instead of walls where they work, and fix stormwater problems in older neighborhoods where flooding is worst. Parks like Downs Park and Fort Smallwood Park are part of why we live here, and the state money set aside for parks and open land should be spent on parks and open land. I'd support oyster restoration and trees along our streams, and I'd keep decisions about how neighborhoods grow in local hands."

