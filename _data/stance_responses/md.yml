  district: 6
  party: Green
  question: md-q6
  date: 2026-08-19
  response: |
    "To ensure evidence and rigorous scientific findings directly inform my policymaking process, I will establish independent advisory panels comprised of scientists, public health experts, engineers, and local community stakeholders. These panels will conduct open technical reviews and environmental impact assessments on all major legislative proposals, ensuring decisions are grounded in objective research rather than corporate or partisan interests. I will also mandate transparent data-sharing and public reporting metrics for federal and state programs to evaluate outcomes and continuously adapt policies based on empirical results. By fostering direct collaboration with research institutions, federal scientific agencies, and regional experts, we can implement forward-thinking solutions that serve the long-term public interest and protect our planet."

- candidate_first_name: Moshe
  candidate_last_name: Landman
  state: md
  race: US House of Representatives
  district: 6
  party: Green
  question: md-q7
  date: 2026-08-19
  response: |
    "To drive innovation and advance federal science funding, I support reallocating wasteful government expenditures—such as cutting $500 billion annually from bloated defense spending—to directly fund civilian research and public interest technologies. My platform prioritizes federal investments in zero-emission green technologies, clean energy grid modernization, public health systems, and regenerative agricultural sciences. By pairing research grants with public-private partnerships, we can commercialize breakthrough discoveries in renewable energy, ecological restoration, and medical science while protecting intellectual investments from corporate monopolization. Ultimately, steering federal research dollars toward sustainable solutions will foster nationwide economic growth, tackle the climate crisis, and ensure Maryland remains a national hub for scientific innovation."

