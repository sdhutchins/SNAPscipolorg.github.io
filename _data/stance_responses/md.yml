    "The key to job growth and a healthy economy begins with proper education for independent thinking, self-reliance, and basic skill knowledge in reading and math.  For this, the whole system of public education needs to be transformed away from "social engineering", and towards basic academic skills.  Offer more choice and opportunity for practical trade skills that prepare for useful, productive life in society.  Restrict student loan debt without credible accountability for repayment through the involvement of private banks."

