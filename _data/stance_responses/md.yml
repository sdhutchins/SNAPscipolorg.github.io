  question: md-q4
  date: 2026-09-08
  response: |
    "I am a proud graduate of our country’s public school system and will continue to advocate for robust STEM education and opportunities in our K-12 and post-secondary institutions for all students who are interested in learning. I especially understand the critical need to support pathways for students not traditionally participating in STEM fields. In FY 2026, I delivered over $1 million in community project funding to the Chinese American Parent Association of Howard County (CAPA)’s STEM Forward program. These federal dollars have expanded STEM education efforts in Howard County and connected young students to educational programming around coding, earth sciences, robotics, and engineering. Annually, our Congressional office also hosts the Congressional App Challenge, a nationwide middle and high school STEM competition that recognizes and encourages the STEM talent in our District. I have also advanced STEM education priorities through the annual National Defense Authorization Act, securing a provision directing the Department of Defense to partner with academic institutions to train the next generation of cybersecurity leaders. H.R. 6631, the Establishing Cyber Security Educational Programs at Academic Institutions Act, builds on this work by partnering federal cyber agencies, including the NSA and U.S. Cyber Command, with leading universities like the University of Maryland to educate and train future cybersecurity leaders."

- candidate_first_name: Sarah
