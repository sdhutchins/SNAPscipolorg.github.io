    "Strong support for concept of "my body, my choice", which means that all public policy should enable individual choice of doctor and medical services.  Again, proper early learning for self-reliance and practical life skills will remove need for extensive medical intervention for mental health and chronic disease therapies later on.   Schools need to support only helathy, natural food programs.  Choice and competition in public education is important component to support parental involvement and responsibility to assure guidance in making wise medical and personal health decisions later on."

