  question: md-q6
  date: 2026-09-10
  response: |
    "I believe good policymaking begins with recognizing what you do not know. When an issue comes before me where I have limited knowledge or experience, my first step is to seek out people who understand it. That means reviewing credible research and data, consulting subject-matter experts, and listening directly to the people who will be affected by the policy. I want to hear from scientists, engineers, physicians, educators, farmers, business owners, tradespeople, local officials, and others with relevant knowledge depending on the issue. Just as importantly, I want to hear from people in Carroll County who live with the practical consequences of the decisions made in Annapolis. As a legislator, I would also use the nonpartisan research and analysis available through Maryland’s Department of Legislative Services and testimony presented during the legislative process. Scientific evidence should play an important role in policymaking, but evidence does not eliminate the need for judgment. Policymakers must also consider costs, unintended consequences, individual liberty, and local circumstances. My approach is to ask questions, seek reliable evidence, listen to knowledgeable people and those directly affected, and then make the best-informed decision I can."

- candidate_first_name: Steve
