    "Maryland families and small businesses should not have to pay higher electric bills to accommodate large industrial energy users. If elected, I will work to make energy more affordable, reliable, and sustainable. I will support policies requiring data centers and other large energy users to pay the full cost of the generation, transmission, and grid upgrades they require, rather than shifting those costs to residential ratepayers and small businesses. I will also support expanding renewable energy, battery storage, geothermal, solar, and energy-efficiency programs to increase supply, strengthen reliability, and reduce long-term costs. I want to expand low-interest financing so homeowners, farmers, and businesses can invest in energy systems that reduce their dependence on the grid. Finally, I will advocate for reforms to the PJM energy market and oppose development that places unreasonable demands on Maryland’s electric grid. Economic growth should not come at the expense of Maryland families."

