  response: |
    "Public health policy should be driven by outcomes. I support expanding access to evidence-based addiction treatment, medication-assisted treatment, naloxone, recovery services, and behavioral-health care while improving follow-up after overdoses so people are not simply stabilized and sent back into the same crisis. Maryland’s own data show that overdose disparities remain severe, including disproportionately high rates among older Black men, so resources should be targeted using real local data rather than one-size-fits-all programs. I would support telehealth, mobile crisis services, and incentives to place mental-health professionals in underserved and rural communities. I also support stronger school-based mental-health partnerships and better coordination among hospitals, local health departments, first responders, and treatment providers. Every program receiving public money should be evaluated for measurable results. If a program is not reducing overdoses, shortening treatment wait times, or improving access to care, we should fix it or redirect the funding."

- candidate_first_name: Eliott
