    "Bills went up because of a regional power auction that raised prices sharply, two old power plants near us that BGE customers are paying to keep open until as late as 2029, and data centers using power faster than we can add it. When families pay for power lines built for someone else, it's like being asked to split the check for a dinner you didn't eat. This year's utility relief law makes data centers pay for their own upgrades, and I'd make sure families don't end up paying those costs if a data center leaves. I'd also permanently stop utilities from raising rates based on money they haven't spent yet, since the current pause ends in April 2027. And I'd speed up solar and battery projects and help seniors and families with the highest bills lower their energy use."

