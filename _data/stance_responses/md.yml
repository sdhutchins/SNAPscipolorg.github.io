  question: md-q1
  date: 2026-09-10
  response: |
    "Maryland needs an energy policy built around affordability, reliability, and abundance. For too long, the State has reduced reliable in-state generation while increasing mandates and costs, leaving Maryland increasingly dependent on electricity generated elsewhere. I would support restoring and expanding reliable in-state generation through an all-of-the-above strategy that includes nuclear power, including small modular reactors, natural gas, and renewable sources where they are economically and operationally viable. I would also review taxes, fees, and mandates that unnecessarily increase consumers’ electricity bills and oppose policies that prematurely retire reliable generating capacity. Data centers present both economic opportunities and significant energy challenges. They should not be permitted to place enormous new demands on an already constrained grid while shifting the resulting generation, transmission, and infrastructure costs to Maryland families and existing businesses. Large-load users should bear the costs they create, and I support policies that encourage data centers to provide or contract for new dedicated generation, including co-located natural gas or nuclear power. Maryland should welcome innovation and economic development, but new demand should be accompanied by new supply. Increasing generation while protecting existing ratepayers is essential to making electricity more affordable and reliable."

- candidate_first_name: Steve
  candidate_last_name: Patten
  state: md
  race: State House of Delegates
  district: 42C
  party: Republican
  question: md-q2
  date: 2026-09-10
  response: |
    "Maryland has benefited enormously from its proximity to the federal government and institutions such as NIH, NASA, and NIST, but our economy should not be overly dependent on federal employment or spending. We need a stronger, more diverse private-sector economy that can create opportunity regardless of changes in Washington. That begins with making Maryland a more competitive place to start, grow, and operate a business. We should reduce unnecessary regulatory barriers, maintain reliable and affordable energy, exercise fiscal discipline, and encourage investment in industries where Maryland has significant strengths, including biotechnology, cybersecurity, advanced manufacturing, agriculture, energy, and technology. Workforce development must also recognize that a four-year college degree is not the only path to a successful career. I support stronger partnerships among employers, community colleges, career and technical education programs, and apprenticeship programs so students and workers can gain skills that lead directly to available jobs. Maryland should expand opportunities to earn while learning and make it easier for workers to retrain as industries change. Economic growth should create pathways for scientists and engineers, skilled tradespeople, technicians, healthcare workers, entrepreneurs, and workers entering the workforce without a college degree. The goal should be a Maryland economy with more opportunities and more pathways to reach them."

- candidate_first_name: Steve
