  response: |
    "At every opportunity, I've condemned and fought President Trump’s reckless DOGE cuts to our expert civil service and their life’s work – including at the National Institutes of Health, National Science Foundation, Department of Energy National Labs, and other higher education and federally funded institutions right here in Maryland. I am in full support of restoring and increasing the funding for these programs and their vital research. Weeks into President Trump’s second term, I joined the Maryland Delegation in demanding that the Administration reverse their decision to cut medical research in Maryland and nationwide. On the House Armed Services Committee and through government funding bills, I’ve delivered hundreds of millions of federal dollars to scientific innovation through the National Defense Authorization Act (NDAA), including $723 million for the Energy Resilience & Conservation Investment Program (ERCIP) and $220 million for Readiness and Environmental Protection Integration (REPI), both pivotal to strengthening resilience and infrastructure. Through appropriations requests, I’ve also secured funding for high school STEM education, invasive species research in the Chesapeake Bay, space exploration missions at JHU’s Applied Physics Lab, and more. I am working every day in Washington to champion our institutions and ensure all Americans can continue to access the critical, often life-saving scientific work of our strong, hardworking, merit-based federal workforce."

