    "Maryland has tremendous scientific and technological assets, including world-class universities, research institutions, federal laboratories, and a highly skilled workforce. State policy should help create an environment where those strengths can produce new discoveries, businesses, jobs, and opportunities. I support targeted public investment in scientific research and innovation when there is a clear public purpose, particularly foundational research, research partnerships, and infrastructure that can produce benefits beyond what individual companies are likely to fund on their own. Government can also help connect universities, community colleges, research institutions, entrepreneurs, and private industry so promising ideas have pathways from research to practical application. At the same time, government funding should not be measured simply by how much money is spent. Programs should have defined objectives, transparency, appropriate oversight, and measurable results. Wherever possible, public investment should leverage rather than replace private investment. Maryland should encourage innovation by combining responsible research investment with affordable energy, a skilled workforce, reasonable regulation, and a competitive business environment that allows discoveries made here to become businesses and jobs here."

