    "Maryland lost more federal jobs in 2025 than any other state, and many of those workers are our neighbors near Fort Meade and BWI, as well as my own daughter who lost her job at the FDA. The state's long-term plans for biotech and research jobs are smart, but they don't help a mom who lost her federal job this spring and has a mortgage due now. What's missing is a bridge from the job someone lost to the job that's open today. I'd fund job training at Anne Arundel Community College designed with real employers, the kind that has been shown to raise people's pay for years, and add apprenticeships to reach Maryland's goal of 60,000 by 2030. I'd also help people with security clearances find defense and cyber jobs quickly, and treat child care as part of the plan, because a parent can't take a job without it."

