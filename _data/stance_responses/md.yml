  response: |
    "I’ve spent my entire career working to move faster, bolder, and smarter on environmental restoration. Protecting our environment is not only the right thing to do, but it’s also critically important for the thousands of Marylanders who earn their living on the Chesapeake Bay. As Vice Ranking Member of the House Natural Resources Committee, I am focused on building a clean energy future, tackling rising tides, and expanding access to public lands for all. My first bill to pass the House was the bipartisan MAWS Act to tackle invasive blue catfish and save our blue crabs, oysters, and rockfish. This year, I introduced the Maryland Whole Watershed Program Federal Partnership Act, a bill that would build on the Whole Watershed Act I passed during my time in the State Senate. In just two years, we’ve seen real progress from the Whole Watershed Program – from marsh restoration to combating invasive species in the Baltimore Harbor to addressing stream erosion in Hagerstown and more. But our state and local partners can’t do this work alone, and this new federal legislation will empower the EPA to collaborate with them to support needed restoration projects across the Chesapeake Bay Watershed. In the State Senate, I sponsored the Great Maryland Outdoors Act to address acquisition, accessibility, and equity in our state parks. In Congress, I co-sponsored the bipartisan Great American Outdoors Act 250 while fighting partisanship and Park Service cuts to protect our public lands."

- candidate_first_name: Sarah
  candidate_last_name: Elfreth
  state: md
