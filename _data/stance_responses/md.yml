    "I was the first in my family to finish college and I have two adult children who pursued STEM careers, and I want that to be normal for Maryland kids. I'd protect the $60,000 starting teacher pay and add bonuses that research shows help keep math and science teachers. Kids who score well in math should go into advanced classes automatically, and when North Carolina and Dallas did that, many more Black and Hispanic students took advanced math. With the Smithsonian Environmental Research Center here in Anne Arundel, let's get kids outside doing real science on the Bay. I'd copy a New York program that nearly doubled community college graduation rates with advisers and help with books and transportation, and make sure credits count toward a student's major at four-year schools. And I'd protect Maryland's college grants for families who need them and help every high school senior fill out the financial aid form."

