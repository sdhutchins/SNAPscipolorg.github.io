  response: |
    "I would build evidence into the policymaking process instead of using it only after a position has already been chosen. For major legislation, I would review nonpartisan fiscal and policy analyses, agency data, peer-reviewed research when available, and testimony from qualified subject-matter experts. I would also seek input from the people directly affected, because data can show what is happening while residents and frontline professionals can explain why. When scientific evidence is uncertain or experts disagree, I would be transparent about that uncertainty rather than presenting assumptions as settled fact. I also support stronger use of legislative audits, program evaluations, and measurable performance goals so lawmakers can determine whether policies are actually working after they pass. Good policymaking requires being willing to change course when credible evidence shows that a program is ineffective, too costly, or producing unintended consequences."

