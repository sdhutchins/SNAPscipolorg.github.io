  date: 2026-09-08
  response: |
    "Public health must be accessible to every Marylander, regardless of income, race, or where they live. If elected, I will prioritize expanding access to affordable mental and behavioral healthcare, especially in rural and underserved communities. Maryland is already investing in rural health, including expanding behavioral health services, telehealth, and the healthcare workforce. I will support integrating mental health and substance-use treatment into primary care, expanding community-based crisis services, and improving continuity of care after hospitalization. Maryland’s behavioral health strategy emphasizes evidence-based practices, improved data, and coordinated care. I will also support strengthening local health departments and community organizations that address food security, transportation, preventive care, and other social determinants of health. Finally, I will advocate for better recruitment and retention of healthcare professionals, particularly in underserved areas. Mental healthcare is essential to long-term well-being, and every Marylander deserves access to quality care when they need it."

- candidate_first_name: Michael
  candidate_last_name: Eckels Jr.
  state: md
