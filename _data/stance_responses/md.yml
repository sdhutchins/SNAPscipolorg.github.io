- candidate_first_name: Jason
  candidate_last_name: Jobe
  state: md
  race: State House of Delegates
  district: 1A
  party: Democratic
  question: md-q1
  date: 2026-09-03
  response: |
    "My position is a firm ""No"" on new data centers and similar projects until developers are open and transparent with the communities and can provide compelling, independently reviewed evidence that they can—and will—take responsibility for their impact. That means binding plans to pay for power-grid and water-system upgrades, protect local water supplies, and cover long-term environmental costs. Communities and local businesses should not subsidize private data centers through higher utility bills or public incentives. I will oppose state support for projects that cannot meet those standards. If developers want Maryland communities to accept the risks, they must prove the public will receive clear, lasting benefits."

- candidate_first_name: Jason
  candidate_last_name: Jobe
  state: md
  race: State House of Delegates
  district: 1A
  party: Democratic
  question: md-q2
  date: 2026-09-03
  response: |
    "Maryland’s greatest economic asset is its people: their knowledge, practical skills, experience, and ability to work together. We should protect federal research jobs while building an economy that can survive changes in Washington. I support apprenticeships, community-college programs, help for small businesses, manufacturers and contractors, and turning Maryland research into Maryland businesses. Remote work can unlock significant opportunities in Western Maryland. With dependable broadband, shared workspaces, and sensible state-employment policies, residents can compete for technology, research, and other well-paying jobs without leaving their communities. Not every job can be remote, but many can. In addition to expanding the labor pool, state employees can better connect with and serve the communities they represent by living there, if they so choose."

- candidate_first_name: Jason
  candidate_last_name: Jobe
  state: md
  race: State House of Delegates
  district: 1A
  party: Democratic
  question: md-q3
  date: 2026-09-03
  response: |
    "Rural residents should not have to travel hours or wait months for basic care. We have to stop undercutting the services and programs that provide funding for our rural hospitals, clinics and medical organizations. I also support mobile clinics, school-based services, telehealth, stronger behavioral-health crisis response, and incentives for medical and mental-health professionals to practice in underserved areas. Opioid-settlement money should fund prevention, treatment, harm reduction, and long-term recovery programs with publicly reported results. Maryland should also support responsible medical AI that helps clinicians detect illness earlier, reach rural patients, and reduce paperwork. Technology should support medical judgment—not replace doctors or weaken patient privacy."

- candidate_first_name: Jason
  candidate_last_name: Jobe
  state: md
  race: State House of Delegates
  district: 1A
  party: Democratic
  question: md-q4
  date: 2026-09-03
  response: |
    "For over 20 years, Garrett County has been demonstrating a model worth building on. Local FIRST LEGO League programs connect elementary education, mentoring, robotics, and real achievement under the goal “All Kids—STEM Ready.” The sponsorship of local schools and businesses has funded much of the program but more importantly, it has and continues to strengthen and encourage social engagement, connections and lasting relationships. We should recognize, encourage and support this relationship. Maryland should support that kind of hands-on learning with teacher training, equipment, transportation, summer programs, and paid work experience. We must also bring Garrett College, Allegany College of Maryland, Frostburg State University, and other Western Maryland institutions fully into statewide academic and research partnerships. Students should be able to share courses, join research projects, transfer credits cleanly, and reach a bachelor’s degree without wasting time or money."

- candidate_first_name: Jason
  candidate_last_name: Jobe
  state: md
  race: State House of Delegates
  district: 1A
  party: Democratic
  question: md-q5
  date: 2026-09-03
  response: |
    "Western Maryland's water, forests, farms, parks, and open spaces are part of our identity and our economy. Communities have the right to voice and vote on proposals that impact them and their way of life. I support protecting drinking water and watersheds, maintaining parks and trails, conserving important habitat, and keeping farms and working forests economically productive. Decisions should use sound science while respecting property rights and local knowledge. Residents, farmers, businesses, and local governments and nature lovers of every variety need a real voice early in the process—not after decisions have already been made. We need to be responsible stewards, working to conserve and protect our natural resources while supporting recreation, tourism, agriculture, and the people who care for the land."

- candidate_first_name: Jason
  candidate_last_name: Jobe
  state: md
  race: State House of Delegates
  district: 1A
  party: Democratic
  question: md-q6
  date: 2026-09-03
  response: |
    "I earned an M.S. in Computer Science and spent 20 years working as a software engineer in Northern Virginia’s defense industry. That experience taught me to ask direct questions: What does the evidence show? What assumptions are being made? What can fail? How will we measure results? For major technical issues, I will seek input from universities, community colleges, agencies, local professionals, and affected residents. I will also explain the evidence and reasoning behind my positions whenever possible. Expert knowledge matters, but so does local experience. Good policy needs both."

- candidate_first_name: Jason
  candidate_last_name: Jobe
  state: md
  race: State House of Delegates
  district: 1A
  party: Democratic
  question: md-q7
  date: 2026-09-03
  response: |
    "Federal science funding supports far more than scientists. It supports technicians, tradespeople, teachers, suppliers, startups, and entire communities. I will work with Maryland’s congressional delegation, universities, federal facilities, and employers to defend stable research funding. At the state level, I support matching funds, partnerships with small businesses, and programs that turn publicly funded discoveries into Maryland businesses and jobs. Johns Hopkins is already doing serious work in medical AI and precision medicine. Maryland should consider a collaborative model similar to Mayo Clinic’s—connecting clinical expertise, protected data, researchers, and technology partners. Western Maryland colleges, healthcare providers, students, and patients must be part of that network, not an afterthought."

- candidate_first_name: Seth
  candidate_last_name: Funk
  state: md
  race: State House of Delegates
  district: 1C
  party: Democratic
  question: md-q1
  date: 2026-09-05
  response: |
    "Highest costs are from generation and transmission. As a Delegate I would attack those two costs by targeted investment into renovation for transmission and bringing new generation online rapidly. Community solar canopies for parking lots, public walkways, and the rooftops of public buildings are the most useful and applicable for my district. I'd also look to continue and expand support for homeowner solar. Rapid and widespread usage of this will lower the need for large transmission projects that cut across farmland, and improve reliability. I am open to wind power, however I have not found any information that leads me to believe it would be effective in my district and I believe Maryland as a whole is more suited for solar. I am open to nuclear energy, particularly SMRs and other advanced reactors, and would support proposals to advance this technology in Maryland with emphasis on safety.  I have pledged to sign onto the bipartisan data center moratorium; speaking with my constituents, they are very worried about the rapid expansion combined with the lack of clear answers on how to adjust for energy, land, and water use. I believe Maryland's greatest potential "industrial base" should be in technological advancement and development, and I would look to use Maryland's resources to support that effort from the way we educate our children to what we base our economy on. We must ensure that in this we install robust practices that serve everyday working people."

- candidate_first_name: Seth
  candidate_last_name: Funk
  state: md
  race: State House of Delegates
  district: 1C
  party: Democratic
  question: md-q2
  date: 2026-09-05
  response: |
    "I spoke of community solar, nuclear construction and research development, and building a tech-based economy that serves Maryland and its everyday people. We should invest heavily in job training, connections, multi-stage planning, and ensuring our farthest communities receive these as well. Community solar is a perfect example. Multiple roles and education levels will be utilized in the preparation, construction, deployment, and maintenance of these projects. Having these widespread ensures far out communities like Western Maryland also receive the boons in this. There have been calls here for a nuclear plant, which would also bring the multi-stage and multi-level opportunities. I've also pledged to support united labor and collective bargaining, as well as trade schools to support these projects long term. We can't build an economy for high-level education alone; we must build for every level of a project to see true results."

- candidate_first_name: Seth
  candidate_last_name: Funk
  state: md
  race: State House of Delegates
  district: 1C
  party: Democratic
  question: md-q3
  date: 2026-09-05
  response: |
    "Rural healthcare is among the first to be cut when budget crisis occur. I've committed to fighting those cuts, as well as expand telehealth and mental health care. I've proposed a Western MD Rural Health Program that would tuition forgiveness and job placement to students who pledge to serve here at least 10 years. I've pushed mobile medical teams that can respond to the elderly, people with disabilities, or without reliable transportation to attend to their medical needs. For substance abuse, Washington County lacks enough housing and programs to serve people who need to be removed from situations that hinder their will to be clean. I will push for specifically community housing for people in substance abuse programs that will remove them from the harmful environment and connect them with resources, jobs, and support systems. Getting users our of the situations that encourage substance use and into pro-social systems that work with them to get clean is the best method for addressing the crisis."

- candidate_first_name: Seth
  candidate_last_name: Funk
  state: md
  race: State House of Delegates
  district: 1C
  party: Democratic
  question: md-q4
  date: 2026-09-05
  response: |
    "I would need to see information as to why they are not transferring/completing their programs. Addressing college affordability at the State level would be difficult without federal assistance. I would not have been able to attend college without a Pell Grant, a federal program. To address affordability, we should look to combat the high fees and costs associated with many STEM programs that discourage or prevent low-income individuals from enrolling. We should also look to incorporate the humanities, especially ethics (especially with AI rapidly evolving), social impact, and how to utilize to benefit communities rather than exploit. Right now technology is heavily associated with an elite class and their corporations that want to exploit communities for their labor but not give them anything in return. Focusing on courses, programs, and connections that emphasize bettering our communities rather than raiding them would interest more people."

- candidate_first_name: Seth
  candidate_last_name: Funk
  state: md
  race: State House of Delegates
  district: 1C
  party: Democratic
  question: md-q5
  date: 2026-09-05
  response: |
    "Land-trusts and community involvement with development, focusing on denser neighborhoods and limiting over-development, programs for cleaning and maintaining nature areas, as well as community gardens and green spaces. All of this paired with community solar and sustainable energy practices. Western Maryland natural beauty must be protected, for its own sake and the sake of our people. Limiting over development and using least-intrustive-methods is a top priority for me."

- candidate_first_name: Seth
  candidate_last_name: Funk
  state: md
  race: State House of Delegates
  district: 1C
  party: Democratic
  question: md-q6
  date: 2026-09-05
  response: |
    "I prefer direct and open channels with the scientific community to advise me. I'd encourage frequent conversations on the top priorities for the communities and how I can use my role to assist. My office will always be open to ensure legislation is evidence based."

- candidate_first_name: Seth
  candidate_last_name: Funk
  state: md
  race: State House of Delegates
  district: 1C
  party: Democratic
  question: md-q7
  date: 2026-09-05
  response: |
    "Government has an important role to play in science funding to pressure scientific funding to benefit the State and its people as a whole, rather than a strict profit motive. As the "lobbyist" of its people, I'd support investment into innovation that seeks to address the needs of every day people, be that jobs, quality of life, etc. I'm very supportive of utilizing public funds for scientific advancement, so long as that advancement benefits the whole rather than only a small part."

- candidate_first_name: Eliott
  candidate_last_name: Herneker
  state: md
  race: State House of Delegates
  district: 34A
  party: Republican
  question: md-q1
  date: 2026-09-07
  response: |
    "Maryland families should not be forced to subsidize massive new electric loads while their own bills keep rising. I would push the Public Service Commission to strictly enforce Maryland’s new large-load rate protections so data centers and other very large users pay the full costs they create for generation, transmission, and grid upgrades. Not residential ratepayers. I also support stronger transparency around projected demand and grid impacts before major projects are approved. Maryland needs more reliable in-state generation and a balanced energy strategy that keeps existing dependable capacity online while expanding cost-effective clean energy, storage, and grid modernization. I support rooftop, parking-lot, and brownfield solar before sacrificing productive farmland. I also believe local communities must retain a meaningful voice over data-center siting. My test is simple: energy policy should lower costs, improve reliability, and make the users creating extraordinary new demand pay their fair share."

- candidate_first_name: Eliott
  candidate_last_name: Herneker
  state: md
  race: State House of Delegates
  district: 34A
  party: Republican
  question: md-q2
  date: 2026-09-07
  response: |
    "Maryland cannot replace tens of thousands of lost federal jobs with one industry or with programs that only benefit people with four-year degrees. I would focus on growing a broader private-sector economy in advanced manufacturing, cybersecurity, life sciences, skilled trades, logistics, health care, and emerging technology. That means making Maryland easier and less expensive for employers to invest in, supporting small businesses, and connecting displaced workers to jobs where their existing skills transfer. I would expand paid apprenticeships, career and technical education, community-college partnerships, and employer-led credential programs so people can enter good-paying careers without taking on unnecessary debt. For workers with advanced degrees, Maryland should do more to retain scientists, engineers, and researchers affected by federal cuts by connecting them with universities, startups, and Maryland-based employers. Economic growth should be measured not just by announcements, but by whether working families actually see better jobs, higher take-home pay, and real opportunity."

- candidate_first_name: Eliott
  candidate_last_name: Herneker
  state: md
