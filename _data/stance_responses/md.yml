  date: 2026-09-08
  response: |
    "I believe good policymaking should be guided by facts, research, and the experiences of the people we serve, not ideology or political pressure. If elected, I will establish an informal advisory network of scientists, researchers, healthcare professionals, educators, environmental experts, economists, and community leaders who can provide objective expertise on major legislation. I will also regularly consult Maryland’s universities, community colleges, public agencies, and independent research organizations. Before supporting major legislation, I will seek evidence on its expected costs, benefits, environmental impacts, and effects on Maryland families and businesses. When scientific evidence is uncertain or evolving, I will acknowledge that uncertainty and support policies that can be evaluated and adjusted as new evidence becomes available. I will also hold community listening sessions and make research and supporting data accessible to constituents. My commitment is simple: listen, learn, follow the evidence, and remain accountable to the people of District 35A."

- candidate_first_name: Michael
