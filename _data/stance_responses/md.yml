    "Maryland has a major advantage in research, medicine, cybersecurity, aerospace, and advanced technology, and we should turn more of that research into Maryland jobs and companies. I would support stable, competitively awarded state research funding where there is a clear public benefit, while protecting taxpayers through measurable goals, independent review, and transparency. I would also support programs that help universities and researchers commercialize discoveries, including partnerships with Maryland startups and employers. Existing efforts such as TEDCO’s Maryland Innovation Initiative show how the state can help move promising university research toward real products and businesses. I would prioritize fields where Maryland already has strong institutions and workforce advantages, while ensuring smaller companies and researchers have a fair opportunity to compete. Government should not pick political favorites, but it can create the conditions for high-value research, innovation, and private investment to stay and grow here."

- candidate_first_name: Sarah
  candidate_last_name: Elfreth
  state: md
