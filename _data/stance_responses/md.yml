  response: |
    "Strategic public investment in science drives economic growth and keeps Maryland competitive. When we lift others, we all rise. Decisions are made by those who show up, and Maryland must proactively invest to translate academic discovery into thriving local businesses. With federal research agency budgets facing real instability, our state must protect its innovation ecosystem and expand technical opportunities across all regions. In Annapolis, I will champion three concrete science funding priorities: Expand TEDCO Commercialization and Regional Hubs: I will support strengthening TEDCO and the Maryland Innovation Initiative to bridge the gap between university labs and startup commercialization. Furthermore, I will advocate for state capital investments in shared wet labs, maker spaces, and computing incubators across Frederick County and Western Maryland so local entrepreneurs can innovate without prohibitive overhead costs. Protect and Modernize the Small Business R&D Tax Credit: Early-stage research ventures operate on tight margins. I support raising the statutory cap on Maryland's refundable Research and Development Tax Credit, specifically increasing the set-aside for small businesses and tech startups. Multiply Federal Innovation Awards: I will back state matching grant programs for Maryland small businesses that win competitive federal SBIR/STTR grants, helping local innovators scale their operations and create high-wage technical jobs right here in Maryland."

