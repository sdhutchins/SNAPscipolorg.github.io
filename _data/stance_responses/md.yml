  question: md-q4
  date: 2026-09-10
  response: |
    "A strong STEM pipeline begins by giving students opportunities to discover science, technology, engineering, and mathematics early and then providing multiple pathways to turn those interests into careers. Maryland should strengthen hands-on STEM learning, career and technical education, dual enrollment, apprenticeships, and partnerships among local schools, community colleges, universities, and employers. Students should be able to see how what they learn in the classroom connects to real careers in fields such as engineering, healthcare, cybersecurity, advanced manufacturing, agriculture, and energy. Community colleges are especially important. Maryland should make transferring credits to four-year institutions as predictable and seamless as possible so students do not lose time or money repeating coursework. We should also expand opportunities for students to earn college credits or industry-recognized credentials while still in high school. Finally, success should be measured by student outcomes, not simply by how much Maryland spends. State policy should give local school systems flexibility to develop programs that reflect their students, communities, and regional workforce needs while maintaining high academic standards."

- candidate_first_name: Steve
  candidate_last_name: Patten
  state: md
