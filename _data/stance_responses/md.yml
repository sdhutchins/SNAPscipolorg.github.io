- candidate_first_name: Moshe
  candidate_last_name: Landman
  state: md
  race: US House of Representatives
  district: 6
  party: Green
  question: md-q1
  date: 2026-08-19
  response: |
    "As a candidate for Congress in Maryland's 6th District, I will tackle rising electricity bills by championing a comprehensive Green New Deal to transition our power grid fully to clean, renewable energy while eliminating reliance on volatile fossil fuels. To prevent surge prices and peak-demand strain caused by the rapid expansion of regional data centers, I support enforcing strict energy efficiency standards and requiring major technology infrastructure projects to fund or directly source their own zero-emission renewable energy generation. By making robust federal investments in public-private green infrastructure, we can stabilize long-term energy prices, upgrade our transmission grid, and lower utility burdens for Maryland families and small businesses. Ultimately, achieving net-zero greenhouse gas emissions through rapid clean energy development will build a resilient energy economy that protects consumers while safeguarding our air, water, and environment."

- candidate_first_name: Moshe
  candidate_last_name: Landman
  state: md
  race: US House of Representatives
  district: 6
  party: Green
  question: md-q2
  date: 2026-08-19
  response: |
    "To counter federal job losses and revitalize Maryland’s economy, I will drive public-private partnerships aimed at achieving 100% full employment across our state. My plan focuses on creating sustainable, well-paying local jobs by investing heavily in green technology, infrastructure, universal healthcare systems, and regenerative agriculture. By enforcing a fair tax system that rebuilds the middle class and reallocating bloated federal defense spending into domestic priorities, we can fund workforce development and vocational transition programs for impacted federal workers. This comprehensive approach ensures that individuals across all education levels and skill sets—from technical researchers to tradespeople and service workers—have access to secure, dignified employment that supports long-term economic prosperity."

- candidate_first_name: Moshe
  candidate_last_name: Landman
  state: md
  race: US House of Representatives
  district: 6
  party: Green
  question: md-q3
  date: 2026-08-19
  response: |
    "To address Maryland's deep health disparities and strained infrastructure, I support implementing a universal healthcare system that will save an estimated 100,000 lives and $500 billion in costs annually. By eliminating financial barriers to care, this system ensures every resident—regardless of income or location—gains immediate access to comprehensive physical, behavioral, and mental health services. My platform prioritizes expanding funding for community-based mental health and addiction programs to directly tackle the opioid crisis and bridge the gap in underserved rural and minority communities. Additionally, by redirecting excess defense spending toward domestic public health infrastructure and environmental remediation—such as cleaning our air, water, and food—we can eliminate the root environmental causes of chronic illness and build healthier, more resilient communities."

- candidate_first_name: Moshe
  candidate_last_name: Landman
  state: md
  race: US House of Representatives
  district: 6
  party: Green
  question: md-q4
  date: 2026-08-19
  response: |
    "To build a robust education pipeline for Maryland's youth, I support fully funding K-12 public education with a dedicated emphasis on hands-on science, technology, and environmental education that inspires early interest in STEM fields. I advocate for strengthening federal investments and partnerships between local school districts, community colleges, and universities to establish seamless transfer pathways and dual-enrollment STEM programs. To ensure college affordability and protect students from shifts in federal financial aid, I support expanding federal grants and subsidizing higher education and technical vocational training. Furthermore, by reallocating excess federal defense spending toward domestic education and public workforce initiatives, we can ensure equitable STEM learning opportunities for students across all economic backgrounds."

- candidate_first_name: Moshe
  candidate_last_name: Landman
  state: md
  race: US House of Representatives
  district: 6
  party: Green
  question: md-q5
  date: 2026-08-19
  response: |
    "To protect and restore our district's natural resources, I support preserving at least 30% of our public lands and waters for nature and wildlife conservation. My platform prioritizes cleaning up our air, water, food systems, polluted mines, and brownfield sites to reverse environmental degradation and safeguard public health. Through holistic, regenerative agricultural practices, we can save local farmland, establish community food forests nationwide, and enhance soil and water quality across the district. By fully integrating these land management goals into a Green New Deal, we can expand green infrastructure, protect open-space preserves and parks, and ensure sustainable resource management for future generations."

