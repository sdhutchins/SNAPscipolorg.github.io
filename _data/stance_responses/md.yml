  district: 3
  party: Democratic
  question: md-q6
  date: 2026-09-08
  response: |
    "No legislator can do this work alone. I rely on partners throughout the legislative process because I can never be the subject-matter expert on every topic my office takes on. Good policymaking must be grounded in facts, evidence, and the expertise of those who understand the issues best. Representing Maryland – home to leading scientists, researchers, universities, and federal institutions – my staff and I regularly meet with leaders from JHU Applied Physics Laboratory, the U.S. Naval Academy, Goddard Space Center, Walter Reed Medical Center, and more to hear about their research and challenges. I host Environmental Roundtables that also give me regular feedback on conservation, land management, fisheries science, renewable energy and more. These visits and conversations often produce our best ideas for legislation and funding. I also regularly rely on nonpartisan resources like the Congressional Research Service (CRS), Government Accountability Office (GAO), and federal agencies to evaluate policies. When DOGE planned to cancel NOAA’s cloud storage service, risking decades of digitally stored data, I introduced the NOAA Data Preservation Act to safeguard research crucial to our decision-making. As scientific institutions and research funding face unprecedented attacks, Congress must protect those producing this critical research. I will continue to preserve scientific integrity, support federal research, and ensure evidence, not political headwinds, guides policymaking."

