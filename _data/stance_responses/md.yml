    "I support protecting Maryland’s natural resources while allowing responsible growth that respects local communities. As a Sierra Club-endorsed candidate, I am committed to protecting the farmland, forests, waterways, parks, and open spaces that make District 35A special. If elected, I will support increased funding for land preservation, agricultural conservation, parks, and restoration of streams and wetlands. I will also support farmers with conservation practices that protect our soil and waterways while keeping family farms economically viable. Development must be planned responsibly, with consideration for impacts on water quality, wildlife, traffic, and surrounding communities. I support preserving connected forests and sensitive environmental areas rather than unnecessary development and habitat fragmentation. I also want residents to have greater access to parks, trails, and waterways for recreation and environmental education. Protecting the Chesapeake Bay and its tributaries must remain a priority. Protecting our land and water today is an investment in the health, economy, and quality of life of future generations."

- candidate_first_name: Michael
