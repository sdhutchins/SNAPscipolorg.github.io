    "My husband and I have helped our parents through serious health problems, so I know how much depends on the system working. For addiction, I'd put opioid settlement money into what works: medicines that cut the risk of a fatal overdose by more than half, Narcan, and walk-in help at fire stations through Anne Arundel's Safe Stations. I'd keep the 988 crisis line and telehealth, and fund community health workers who help families get care. When new federal Medicaid work rules start in January 2027, Maryland should make it easy to stay covered, because when Arkansas tried this, 18,000 people lost coverage, mostly over paperwork. I support the state board that can limit what's paid for expensive prescriptions, because no one should have to ration medicine. And I treat gun violence as a health issue, which is why my Survivor Medical Debt Shield Act would spare survivors the medical bills."

