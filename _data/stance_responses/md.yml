  date: 2026-09-10
  response: |
    "Carroll County’s open space, farmland, waterways, and rural character are among our greatest assets, and protecting them should be done in partnership with the people who live and work on the land. I support continued investment in voluntary agricultural land preservation programs, which have helped Carroll County preserve more than 81,000 acres while respecting private property rights. Protecting productive farmland also supports our agricultural economy and helps preserve the character of our communities. Water resources require responsible long-term stewardship as well. State and local policy should protect drinking water, streams, groundwater, and watersheds using sound science, while working cooperatively with farmers, landowners, municipalities, and conservation organizations rather than relying unnecessarily on one-size-fits-all mandates. I also support maintaining parks and public open spaces for recreation and future generations. Decisions involving land use, conservation, and development should remain primarily local, where officials and residents best understand the needs, resources, and character of their communities. Good stewardship means balancing conservation, property rights, agriculture, recreation, and responsible economic growth."

- candidate_first_name: Steve
  candidate_last_name: Patten
  state: md
