  district: 3
  party: Democratic
  question: md-q3
  date: 2026-09-08
  response: |
    "The cuts to Medicaid, SNAP, the ACA, and Medicare through the President’s Big Ugly Law have had devastating consequences across our communities, and I fully support the expeditious repeal of these harmful cuts. I believe that health care is a human right. I have co-sponsored legislation like the Restoring Essential Healthcare Act to ensure Americans have protected access to the high-quality, low-cost medical treatments they need in the face of the President’s cuts. As we work towards this end goal, I will work towards lowering costs and never stand for policies that threaten to or restrict access to affordable health care for working families. As one of the youngest women serving in Congress, women’s health care decisions are not abstract – they are personal. I do not support policies that threaten or restrict access to FDA-approved birth control or reproductive health care. I firmly believe reproductive health care choices are a fundamental human right, and I also believe that no government should warrant control over those personal decisions. In the Maryland Senate, I proudly voted to expand access to reproductive healthcare and co-sponsored a constitutional amendment to enshrine reproductive freedom as a fundamental right in Maryland’s Constitution. On Capitol Hill, I have co-sponsored legislation like the Women’s Health Protection Act to codify the protections once afforded by Roe v. Wade and ensure every Marylander has the freedom they deserve."

- candidate_first_name: Sarah
