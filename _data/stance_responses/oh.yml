    Government can have a legitimate role in supporting basic scientific research, particularly where the potential public benefit is substantial but the long time horizon or uncertain commercial return makes private investment difficult.

    That does not mean every research proposal or technology initiative deserves taxpayer funding. Public money is limited, and funding decisions should be transparent, competitive, and evaluated against clearly defined objectives. I would prioritize basic research, public health and safety research, and projects addressing genuine public needs over subsidies designed primarily to benefit individual companies or favored industries.

    I would also distinguish between funding research and funding commercialization. As discoveries move closer to commercially viable products and services, private investment should increasingly assume the financial risk rather than taxpayers.

    Most importantly, government-funded research should be subject to meaningful oversight and measurable outcomes. Taxpayers should be able to see where their money went, why a project was selected, what was accomplished, and whether continued funding is justified.

    Supporting scientific discovery and demanding fiscal accountability are not competing ideas. We can do both.
    
