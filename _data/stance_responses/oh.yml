    The first priority is ratepayer protection. I'd back legislation requiring large data centers to pay the full cost of the grid upgrades and generation they trigger, with FERC and state regulators enforcing it. Ohio's energy prices are up 34% since 2022, so families are already feeling the strain. Proposals to make data centers "pay their own way" have drawn support on both sides of the aisle, and I'd build on that.
    Second, I'd push for transparency. Large facilities should publicly report energy, water use, and emissions, so communities and regulators are working from real data.

    Third, I'd oppose rolling back environmental standards for data centers and the power plants that serve them, and I'd favor faster permitting for transmission, grid storage, and new clean and firm power. That is how we add capacity without raising pollution or costs.

    Fourth, I'd end blanket tax subsidies and tie any federal incentive to measurable local benefits and efficient water use.

    Finally, Washington should support local decision-making, not override it. Communities are pausing projects because they lack information, and federal standards can supply a reliable baseline. The aim is to keep investment and jobs in Ohio while making sure the public isn't left paying the bill.

