    Scientific evidence and expert input should play an important role in policymaking. Ohio is home to outstanding universities, medical institutions, researchers, engineers, and innovators whose work contributes every day to the progress of our state and society. As a legislator, I would seek out that expertise and use the best available evidence to understand both the challenges we face and the likely consequences of the policies we consider.

    I also believe policymakers should approach science with humility. Science is a process of discovery, and our understanding can change as new evidence emerges. When there is uncertainty or legitimate disagreement, government should be transparent about it. We should clearly communicate what we know, what we do not know, and why we are making a particular decision based on the information available.

    Good policymaking means listening to experts while also considering the experiences of affected communities, economic realities, individual rights, and ethical considerations. When credible new evidence emerges, we should be willing to reconsider our assumptions and adjust policy accordingly.

    Trust is built by being honest with people, not by overstating certainty.

