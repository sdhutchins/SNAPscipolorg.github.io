    Scientific evidence and technical expertise should play an important role in policymaking. Good decisions require good information, and elected officials should actively seek expertise from people who understand the subjects affected by legislation.

    But expertise should inform policy, not replace policymaking. Scientific evidence can help us understand what is happening, what may happen, and the likely consequences of different choices. Elected officials must still weigh costs, benefits, individual rights, constitutional limits, and the effects those choices have on the people they represent.

    Just as importantly, government should be honest about what we do not know. Science is a process of inquiry, testing, challenge, and revision, not a declaration that every question has been permanently settled. When evidence is uncertain, conflicting, or evolving, public officials should say so plainly. They should explain what the evidence shows, what assumptions are being made, and where legitimate uncertainty remains.

    Transparency builds far more public trust than overstating certainty. I would rather tell Ohioans what we know, what we don't know, and why I made a decision than ask them to simply trust the government.

