    Government should play a central role in research, especially where the payoff is too uncertain, too long-term, or too widely shared for private markets to fund on their own. Basic science, early-stage medical research, and foundational technologies like the internet and GPS all began this way, and private industry then built on them. In Congress, I'd support stable, predictable funding, because sudden cuts or delays waste years of work and drive talented researchers elsewhere.
    Ohio has a lot at stake, with major research universities, medical centers like the Cleveland Clinic, and a manufacturing base that turns discoveries into products. I'd back programs that link these together, including regional innovation hubs and partnerships with community colleges to train the technical workforce.
    When evaluating investments, I'd prioritize four outcomes: scientific quality, judged through independent peer review instead of politics; public benefit, such as better health outcomes, energy reliability, and national security; economic return, including jobs, new companies, and commercialized technology in places beyond the coasts; and workforce development. I'd also demand transparency, with results and spending reported publicly and unproductive programs ended.
    Not every project succeeds, and that is the nature of research. I'd judge the overall portfolio, not single failures, and explain that clearly to taxpayers.

