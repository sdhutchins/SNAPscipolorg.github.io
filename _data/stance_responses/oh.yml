    Ohio should welcome technological investment and the economic opportunities created by AI and data centers, but growth should occur on a level playing field. Not through special treatment that shifts costs onto taxpayers, ratepayers, or local communities.

    My approach would be straightforward: allow markets to respond to increased demand for electricity, water, and infrastructure while requiring large users to bear the costs their operations create. Existing residents and businesses should not see higher taxes or utility costs because government offered incentives or infrastructure commitments to attract a politically favored industry.

    I am particularly skeptical of industry-specific tax exemptions, subsidies, and negotiated arrangements that are not transparent to the public. If an investment makes economic sense, government should not need to hide its true cost or socialize its infrastructure demands.

    Environmental and resource concerns should be addressed through clear, consistently applied rules based on measurable impacts. Not arbitrary political preferences about which technologies deserve approval.

    Ohio can support innovation without choosing winners and losers. Reliable infrastructure, transparent government, protection of property rights, and fair competition provide a much stronger foundation for sustainable economic growth than corporate subsidies.

