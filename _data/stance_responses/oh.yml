    I believe government has an important role in supporting scientific research and innovation, particularly when that research improves public health, strengthens our economy, protects our environment, and creates opportunities for future generations. Investments in research at universities, medical centers, and technology institutions can lead to better treatments, new industries, and good-paying jobs for Ohioans. When evaluating these investments, I would prioritize measurable public benefits, including improvements in healthcare outcomes, advancements in agricultural and manufacturing technology, energy reliability, environmental protection, and workforce development. I would also look at whether these investments create opportunities for rural communities and ensure that the benefits of innovation reach working families, not just large corporations or major research institutions. Public funding must come with transparency, accountability, and responsible oversight. Taxpayers deserve to understand how their money is being spent, what goals are being pursued, and whether those goals are being met. I would support funding decisions guided by credible scientific evidence, competitive research opportunities, and clear measures of success. Ultimately, scientific research should help solve real-world problems and improve people's lives. I want Ohio to remain competitive in innovation while ensuring that public investments deliver meaningful benefits for our communities and future generations.

