    I would support policies that require data center developers to pay their fair share of the energy and water infrastructure their projects require, rather than shifting those costs onto Ohio families and small businesses. I would also support greater transparency around projected electricity demand, water consumption, environmental impacts, and the public incentives offered to these companies. Local communities deserve a meaningful voice in decisions that affect their future. Residents should have access to accurate information and opportunities to ask questions before major projects move forward. I would also support strong, science-based standards for water conservation, noise, and environmental protection, along with regular monitoring to ensure companies follow through on their commitments. Economic development should mean more than attracting large companies. It should mean creating lasting opportunities, protecting our natural resources, and making sure the people who already call Ohio home benefit from that growth. My approach would be to encourage innovation while holding developers accountable, protecting consumers, and putting the long-term interests of Ohio communities first.

