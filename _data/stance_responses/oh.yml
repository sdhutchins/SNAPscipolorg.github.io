    Ohio's universities, research institutions, and businesses benefit from attracting talented people who contribute to scientific discovery, technological innovation, and economic growth. International students and researchers, particularly in STEM fields, play an important role in our state's workforce and help strengthen our ability to compete in a changing global economy. While immigration and visa policy are primarily federal responsibilities, Ohio can take steps to support its universities, research institutions, and employers as they navigate changes in federal requirements. I would support working with these institutions to identify workforce shortages, strengthen partnerships between universities and Ohio employers, and expand opportunities for Ohio students to pursue education and careers in science, technology, engineering, and mathematics. I also believe Ohio should work to retain the talent educated in our state by encouraging research partnerships, internships, and career opportunities that help graduates contribute to our communities. At the same time, we must ensure that students and researchers understand applicable legal requirements and have access to accurate information as federal policies evolve. My priority would be to protect Ohio's ability to innovate, support our universities and employers, and build a strong domestic workforce while recognizing the valuable contributions international students and researchers make. Ohio should be prepared to respond to workforce challenges with practical solutions that keep our state competitive and create opportunities for Ohioans.
