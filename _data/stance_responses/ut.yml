  response: |
    "I'm not running for Congress. I'm running for Utah House of Representatives. I'm all for getting as much federal funding as we can. If I was in Congress, I would have to consider the needs and potential impacts for the funding. Ultimately, I lean towards being conservative in spending since we are 40 trillion in debt and about to default in all areas. Our spending is a problem and so some of these projects would be shuffled to the back."

- candidate_first_name: Kim
  candidate_last_name: James
  state: ut
  race: State House of Delegates
  district: 8
  party: Democratic
  question: ut-q1
  date: 2026-10-24
  primary_candidate: false
  response: |
    "Global climate change is the underlying reason why there's less snowmelt for the Colorado River, and we as a society must face up to our responsibility to decrease negative human impacts on the earth's climate. Hydropower is better than burning fossil fuels, so there are reasons to value water in Lake Powell sufficient to generate electricity. Just like societies must live within their financial means, we must also live within our environmental means. We can't keep growing our populations in the desert. Agricultural and municipal water rights are only as valuable as the actual water in the river. Rights can't be over-promised and must be reduced according to reality. Native peoples should have first rights to the water that was theirs first."

- candidate_first_name: Kim
  candidate_last_name: James
  state: ut
  race: State House of Delegates
  district: 8
  party: Democratic
  question: ut-q2
  date: 2026-10-24
  primary_candidate: false
  response: |
    "The work that U of U professor Dr. Kevin Perry (aka Dr. Dust) is doing should be supported, as it informs us all of the risks we are and could be experiencing on the Wasatch Front. Also, the work of BYU professor Dr. Ben Abbott is bringing light to the desperate plight of the Great Salt Lake. The Utah Legislature needs to ensure that their research is well funded. Also, the Utah Rivers Council must be heeded; i.e., the Utah Legislature must stop funding the Bear River Development Project when it is more than clear that we need more water to reach the GSL, rather than divert it for more agriculture and municipal use."

- candidate_first_name: Kim
  candidate_last_name: James
  state: ut
  race: State House of Delegates
  district: 8
  party: Democratic
  question: ut-q3
  date: 2026-10-24
  primary_candidate: false
  response: |
    "I'm in favor of widespread use of vaccinations that have been proven over decades to eliminate deadly and harmful diseases. Of course, there may be some individuals who, for medical reasons, may need to avoid particular vaccinations. But the vast majority should be required to receive standard childhood vaccinations. To counter concerns about vaccination side effects, perhaps we need to do a better job of communicating the positives. That might require better funding for public relations campaigns."

- candidate_first_name: Kim
  candidate_last_name: James
  state: ut
  race: State House of Delegates
  district: 8
  party: Democratic
  question: ut-q4
  date: 2026-10-24
  primary_candidate: false
  response: |
    "I don't agree that Utah should pursue an "all of the above" energy strategy. Climate change is happening, and we need to address it urgently. That means we must reduce our use of fossil fuels as fast as possible. We must ramp up our use of solar, wind, and geothermal power as fast as possible. Hydropower is good, when there is enough water. While nuclear power doesn't produce carbon emissions, it certainly creates terrible risk of radiation of water, air, and soil, and thus the radiation poisoning of humans and animals in our state. There is no long-term solution to nuclear waste. It seems foolhardy to create something that we know will be a problem for thousands of years. Besides that, nuclear is far too expensive and slow to develop. We must put our governmental (taxpayer) resources into technologies that are more sure and more immediate.  The idea of creating construction and electrical jobs by quickly embracing the current federal and state administrations' zeal for data centers and nuclear power is misguided. These boondoggles are not going to be good long-term investments in our communities."

- candidate_first_name: Tynley
  candidate_last_name: Bean
  state: ut
  race: State House of Delegates
  district: 29
  party: Utah Forward Party
  question: ut-q1
  date: 2026-10-25
  primary_candidate: false
  response: |
    "Because agriculture, specifically alfalfa, is the number one user of water in this region, I would support grants encouraging farmers to switch crops to more water-friendly options (like Kernza or sainfoin), and more water-friendly irrigation systems (like subsurface drip irrigation), and have more flexibility for leasing agriculture water rights during dry years. We also need improved monitoring and forecasting so we know what water will be available. I would implement mandatory cuts to usage based on Lake Powell's elevation levels, and prioritize the highest public value uses, such as drinking water and hydropower."

    KEYWORDS: Alfalfa, Irrigation, Hydropower

- candidate_first_name: Tynley
  candidate_last_name: Bean
  state: ut
  race: State House of Delegates
  district: 29
  party: Utah Forward Party
  question: ut-q2
  date: 2026-10-25
  primary_candidate: false
  response: |
    "The Great Salt Lake is crucial to the Utah economy and the situation we're facing must be addressed aggressively. Monitoring is crucial so we know how big the problem is and if the solutions we're trying are working. We need air particulate sensors and soil samples. We need to model the lake and watershed. We need air alerts and dust forecasts and to educate the public on how to protect themselves during dust events. 

    In addition to figuring out how much it will cost to save the lake, we need to investigate the cost of NOT fixing the lake so we know what's at stake and can properly prioritize our resources.  We need health research to see the long-term effects of the air quality on the residents. 

    I would implement a color code system that the public can easily understand: green is 4198, yellow is 4195, orange is 4192, and red is anything below that. There would be different water restrictions imposed at each level so we all work together to save the lake."

    KEYWORDS: Monitoring, Prioritize, Restrictions

- candidate_first_name: Tynley
  candidate_last_name: Bean
  state: ut
  race: State House of Delegates
  district: 29
  party: Utah Forward Party
  question: ut-q3
  date: 2026-10-25
  primary_candidate: false
  response: |
    "First, I would listen to families about why they are hesitant to get vaccines and try to address their specific concerns. I would have trusted spokespeople like doctors and nurses answer questions. I would publish the local data about vaccination/exemption rates alongside outbreak counts by area so parents can see the risks and results. I would expand vaccine access by having in-school clinics for those who want shots."

    KEYWORDS: Listen, Trust, Data

- candidate_first_name: Tynley
  candidate_last_name: Bean
  state: ut
  race: State House of Delegates
  district: 29
  party: Utah Forward Party
  question: ut-q4
  date: 2026-10-25
  primary_candidate: false
  response: |
    "I think we need to pursue all possible sources of power, with an emphasis on those that are kinder to the environment. Geothermal could be used more aggressively in Utah. In Utah, specifically, we need to be especially careful about the water problem, as the drying up of the Great Salt Lake is an existential crisis, and should not be risked for the sake of power generation. I believe data centers should pay for their own power infrastructure, so the burden doesn't fall on households."

    KEYWORDS: Environment, Geothermal, Infrastructure

- candidate_first_name: Josh
  candidate_last_name: Smith
  state: ut
  race: State Senate
  district: 6
  party: Utah Forward Party
  question: ut-q1
  date: 2026-10-25
  primary_candidate: false
  response: |
    "The Colorado River’s shares were set in a wetter century. Each state’s share should be kept but expressed as a percentage of the water actually flowing, so every state shares shortages fairly. A portion needs to be reserved for the river itself for the surrounding ecosystems. 

    We need to invest in fixing leaks and modernizing irrigation through voluntary, paid programs, so farms can conserve without losing their water rights. Savings have to be real, measured as reduced consumption rather than just less diversion, and half of every gallon saved should go back to the river.

    Growing communities and industry must prove long-term supply and use less than the land they replace. Tribal nations’ water rights are legal obligations Utah must honor. All use needs to be tracked and published so Utahns can see it’s working."

- candidate_first_name: Josh
  candidate_last_name: Smith
  state: ut
  race: State Senate
  district: 6
  party: Utah Forward Party
  question: ut-q2
  date: 2026-10-25
  primary_candidate: false
  response: |
    "We can’t manage what we don’t measure so we need to make monitoring permanent and public.  We need to finish all Dust Observation stations, keep real-time data public, and test dust for heavy metals so Utahns know what they’re breathing.

    I’d also protect lake and watershed science: stream gauges, groundwater, lake elevation, and brine and ecosystem monitoring, plus tracking of where conserved water actually ends up. Progress should be measured in water reaching the lake, not press releases.

    Utah needs about 800,000 more acre-feet a year to reach a healthy level, so conservation, water rights for the lake, and growth that doesn’t cancel savings remain the core strategy."

- candidate_first_name: Josh
  candidate_last_name: Smith
  state: ut
  race: State Senate
  district: 6
  party: Utah Forward Party
  question: ut-q3
  date: 2026-10-25
  primary_candidate: false
  response: |
    "Measles is dangerous and preventable, and this outbreak is as much a trust problem as a medical one. I'd start by listening. Most hesitant parents aren't anti-science; they're worried about their kids and tired of being talked down to. I'd hold open conversations with local pediatricians, rural health departments, and faith leaders, answer the same questions honestly each time, and be upfront about both the strong safety record and the rare real risks.

    On policy, I'd keep school immunization requirements and the exemption education step. Informed consent only works when families get real information, and schools need to know who is unprotected when an outbreak hits. I'd oppose weakening it. I'd require plain-language public reporting on cases, exemptions by area, and vaccine side effects so nobody feels information is being hidden."

    KEYWORDS: Education, Avalability [sic]

- candidate_first_name: Josh
  candidate_last_name: Smith
  state: ut
  race: State Senate
  district: 6
  party: Utah Forward Party
  question: ut-q4
  date: 2026-10-25
  primary_candidate: false
  response: |
    "We need power that is reliable, affordable and clean. Geothermal, hydropower, and nuclear are firm, low-emission sources and should play a leading role. Modern nuclear reactors are promising but still not fully vetted we need to ensure a strong safety review, waste planning, and community consent. Solar and wind, paired with storage, are the fastest and cheapest additions. Natural gas is a reliability bridge, and coal should phase down as replacements come online, not before.

    Data centers should pay their own way. Require large users to fund the grid upgrades and generation they trigger, with independent oversight so families' rates don't rise. Require non-evaporative cooling, public reporting of water and power use, and less water than the land they replace. Cap campus size and require real notice and local approval. Encourage flexible-load deals so data centers cut use during grid peaks and bring new clean generation with them."

- candidate_first_name: Matt
  candidate_last_name: MacPherson
  state: ut
  race: State House of Delegates
  district: 26
  party: Republican
  question: ut-q1
  date: 2026-10-25
  primary_candidate: false
  response: |
    "Water will decide what Utah looks like in 50 years. On the Colorado River, Utah has to negotiate in good faith with the other basin states and the tribes, and use real hydrology, not the optimistic numbers we've leaned on for decades. Everyone who uses the river has to give something. For farmers, I'd rather pay them to conserve voluntarily than force them off their land. In cities like mine, we can do a lot more with water-wise yards and fixing leaky pipes. I used to live in Las Vegas, and my first business as a teenager was tearing out grass park strips and putting in desert landscaping. Programs that help homeowners do the same thing here could make a real difference. Tribal water rights need to be honored. Industry has to step up too. Data centers can be built with closed-loop cooling that reuses the same water. The older evaporative designs burn through huge amounts of it, and Utah shouldn't accept that. I also support keeping our streamflow and snowpack monitoring funded, because every one of these decisions depends on knowing how much water we actually have."

    KEYWORDS: Conservation, Cooperation, Good Data

- candidate_first_name: Matt
  candidate_last_name: MacPherson
  state: ut
  race: State House of Delegates
  district: 26
  party: Republican
  question: ut-q2
  date: 2026-10-25
  primary_candidate: false
  response: |
    "West Valley City and Magna sit downwind of the lake. When the wind kicks up dust off the dry lakebed, it lands on us. I have asthma, so air quality is personal for me, and I take it seriously. This is about my own health and my family's, not politics. I support steady funding to monitor lake levels, salinity, brine shrimp, birds and dust. I'd especially like to see more air sensors on the west side, closest to the exposed lakebed, so people can check what they're breathing and the state knows where to focus. To get more water into the lake, I support voluntary water leasing and upstream conservation, and state agencies and developers should have to account for the lake before they sign off on new water demands. West-side communities have taken the brunt of this and should have a real voice in the decisions."

    KEYWORDS: Great Salt Lake, Clean Air, Monitoring

- candidate_first_name: Matt
  candidate_last_name: MacPherson
  state: ut
  race: State House of Delegates
  district: 26
  party: Republican
  question: ut-q3
  date: 2026-10-25
  primary_candidate: false
  response: |
    "I've watched this outbreak closely as a dad of three. Trust in public health declined sharply after COVID and is now at all-time lows nationally. Rebuilding that trust is paramount. That's why I worked closely with our public health agencies on HB 294, which reined in some of the expanded powers they used during COVID while protecting the emergency powers they need to keep the public safe. Parents asking questions about vaccines aren't the enemy. Most of them want the same thing I do: healthy kids who stay in school. The best messengers are people families already trust, like their own doctor or the school nurse, not politicians. The state should make shots easy to get and affordable at health departments, clinics and pharmacies, with information in Spanish and the other languages spoken here. Our health departments also need the tools to spot outbreaks early and tell people plainly what's going on. I support parental rights. COVID taught us that mandates did real damage, so if we want vaccination rates back up, we have to start with education and support."

    KEYWORDS: Trust, Access, Parents

- candidate_first_name: Matt
  candidate_last_name: MacPherson
  state: ut
  race: State House of Delegates
  district: 26
  party: Republican
  question: ut-q4
  date: 2026-10-25
  primary_candidate: false
  response: |
    "I'm for all of the above. Natural gas and our existing plants keep the grid steady right now, and we should keep them running while we add solar, wind, geothermal, hydropower and storage. Advanced nuclear is worth exploring carefully. My test is whether it keeps power reliable and bills affordable without making our air worse. When I served on the House public utilities committee, I pressed PacifiCorp hard on the policies and programs that have pushed Utah rates up. Many of those costs came from problems in neighboring states, like poor forest management, and Utah families shouldn't be stuck paying for them.

    On data centers, my focus is on the rules. A big one can pull as much power as a city. That cost, including grid upgrades, should fall on the data center, not on families' monthly bills. They should use efficient technology like closed-loop cooling, report how much water they use, and go through real local review instead of getting fast-tracked. That's a big part of why I'm working on MIDA reform for 2027. Decisions this big about land, water and power should answer to the people who live with them."

    KEYWORDS: Reliability, Affordability, Accountability

