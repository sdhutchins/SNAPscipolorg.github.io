  date: 2026-10-24
  primary_candidate: false
  response: |
    "I support all of the above. I support the free market approach. I don't pick which source should be used. I won't make Solyndra type mistakes. We need energy and we need to increase our capacity in all areas."

- candidate_first_name: John
  candidate_last_name: Taylor
  state: ut
  race: State House of Delegates
  district: 14
  party: Republican
