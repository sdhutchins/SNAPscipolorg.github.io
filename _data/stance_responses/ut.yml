- candidate_first_name: Rebecca
  candidate_last_name: Winsor
  state: ut
  race: State House of Delegates
  district: 75
  party: Democratic
  question: ut-q1
  date: 2026-10-25
  primary_candidate: false
  response: |
    "First I think we need to adjust for the decreased flow of the Colorado, there is just not the same amount of water that flows downstream. Second, I think we need to look at how pulling from the river and the tributaries have effected the biosphere around the river system. Third, we need to address the inequality of previous water allocations to indigenous people and the Mexican people. There is not enough water to meet everyone's needs and protect the river systems, that's a fact. It has to start with water conservation, pulling to much water from the system is counter productive and leads to less water overall, a healthy river system creates and conserves more water due to natural dams and vegetation. I  would support polices those concerns."

    KEYWORDS: Conservation, Biosphere, Equality

- candidate_first_name: Rebecca
  candidate_last_name: Winsor
  state: ut
  race: State House of Delegates
  district: 75
  party: Democratic
  question: ut-q2
  date: 2026-10-25
  primary_candidate: false
  response: |
    "Refilling the Lake would be my top priority. I respect the needs of farmers and communities upstream, still the Lake effects the entire state and to me it is a case of the good of the many over the welfare of the few. I would invest in helping farmers transition to better irrigation methods, encourage and support crop diversity and away from a primarily alfalfa focus. Refilling the lake will solve much of the dust problem. Also we could start making people pay for the water they use as opposed to including it in property taxes, having to pay for it would change how people used water. I would fund monitoring to how the reclamation was going. I am well aware that the problems of the lake are complicated and because I live in St. George am not as up to date as I would be."

    KEYWORDS: Crop diversity, Conservation, Montoring [sic], Complicated

