  response: |
    "I question the emphasis on building Hyperscale data centers, I believe at the rate of innovation will move faster than the Data Centers can be built, so why are we rushing their construction? I think that nuclear energy is a possibility but I think in Eastern Utah the plans to build 423 is premature. As a resident of Southern Utah I am intimately aware of what happens when things go wrong. Geothermal is something we could look at more. I would like to move away from fossil fuels by investing in renewables. I believe that science is on the break of an energy breakthrough that will make fossils fuels unprofitable. I don't support data centers use of water in a desert that is already in a major drought."

