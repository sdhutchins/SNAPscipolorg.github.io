    "Education is important so everyone can make their own informed decision however the choice will always remain with the parent in consultation with their primary care provider. Covid destroyed the American trust and I have several family members permanently injured by it due to being forced. I will never allow government to force vaccinations. Education and choice are the only paths forward."

- candidate_first_name: John
  candidate_last_name: Taylor
  state: ut
  race: State House of Delegates
  district: 14
  party: Republican
