    "Utah needs an affordable, reliable, and diverse energy supply that supports working families, manufacturing, technological innovation, and economic growth. No single energy source can meet every need, so I support an all-of-the-above approach guided by reliability, affordability, environmental performance, and technological progress.

    Coal and natural gas can provide dependable power, while solar, wind, geothermal, and hydropower can contribute where they are practical and cost-effective. Advanced nuclear energy deserves serious consideration because it offers reliable, low-carbon electricity, provided safety, waste management, and project costs are responsibly addressed.

