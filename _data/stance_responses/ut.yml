- candidate_first_name: Wayne
  candidate_last_name: Woodfield
  state: ut
  race: State Senate
  district: 21 
  party: Utah Forward Party
  question: ut-q1
  date: 2026-10-18
  primary_candidate: false
  response: |
    "We have been undisciplined as a society with water conservation, and agriculture is the primary consumer of water in Utah. Urban growth is responsible for a small amount of our water use, but the bulk of water in Utah is used by agriculture. That is where we can recognize the biggest gains in water conservation. Water rights are property rights and they need to be honored, but we can create strong incentives for farmers to conserve water with water buy-back programs, and invest in agricultural sciences to create more water efficient crops and efficient water delivery mechanisms to help farmers use less water. I am also interested in the concept of "water markets" which have been used to some effect in arid countries to allow water rights to be bought and sold on the open market using demand-based pricing."

    KEYWORDS: Conservation, Agriculture, Incentives

- candidate_first_name: Wayne
  candidate_last_name: Woodfield
  state: ut
  race: State Senate
  district: 21
  party: Utah Forward Party
  question: ut-q2
  date: 2026-10-18
  primary_candidate: false
  response: |
    "I would first like to try not to be resigned to defeat on the drying of the Great Salt Lake, and get some guaranteed inflow of water returned to the lake. In the meantime, I am in favor of funding for the the sciences, and for grants to our colleges and universities, to study the effects of the dry lake bed, and attempt to mitigate those harms. Studies have shown that every dollar well spent on the sciences comes back to us twofold in societal benefit and real economic returns.  It's easy to see how that would be the case here by mitigating health care costs."

    KEYWORDS: Investment, Research, Inflow

- candidate_first_name: Wayne
  candidate_last_name: Woodfield
  state: ut
  race: State Senate
  district: 21
  party: Utah Forward Party
  question: ut-q3
  date: 2026-10-18
  primary_candidate: false
  response: |
    "Sadly, much of the vaccine skepticism in recent years has been driven by our nation's leadership. Instead of encouraging our citizens to get vaccinated, they have actively sown seeds of doubt. Vaccines should remain voluntary as a matter of personal human rights, but as leaders, we can return to science-backed messaging that assures the public that vaccines are safe, effective, and beneficial. We can lead with intelligence and by example."

    KEYWORDS: Science, Example, Intelligence

- candidate_first_name: Wayne
  candidate_last_name: Woodfield
  state: ut
  race: State Senate
  district: 21
  party: Utah Forward Party
  question: ut-q4
  date: 2026-10-18
  primary_candidate: false
  response: |
    "All viable sources of energy should be pursued if data shows that they are viable. Again, our current national leadership has pushed us further away from an energy future that relies on diverse forms of energy production, and has instead pushed us backwards to an antiquated energy production model that relies mostly on non-renewable fossil fuels. Utah's dry and sunny deserts provide a prime opportunity for solar power, and we have many windswept corridors that are prime spots for wind power. Coal and natural gas still have a role to play, but only as part of the broad mix.  It is not the government's role to protect the coal industry.

     That said, data centers need to be constructed responsibly, where sufficient water already exists, and in proportion to energy infrastructure, not jumping ahead of it. Utah may not be the place, based on water supply alone."

    KEYWORDS: Water, Renewable

- candidate_first_name: Wayne
  candidate_last_name: Woodfield
  state: ut
  race: State Senate
  district: 21
  party: Utah Forward Party
  question: ut-q5
  date: 2026-10-18
  primary_candidate: false
  response: |
    "I am not a federal candidate, but I will say that if I were, I would re-invest in the sciences. Our current administration's pullback from the sciences has been heartbreaking for me, has set us back in our progress as a country, and is jeopardizing our place in the world as an innovative nation." 

- candidate_first_name: John
  candidate_last_name: Taylor
  state: ut
  race: State House of Delegates
  district: 14
  party: Republican
  question: ut-q1
  date: 2026-10-24
  primary_candidate: false
  response: |
    "The demands for water on the growth for Washington County are increasing but because of shrinking water, the Lake Powell Pipeline project has stalled. I have to push for our fair rights to the water for our state but I realize that we have structural challenges that are irreversible if we hit dead pool in the reservoir. States need to come to the table and negotiate the needs again.  Down stream states really need to assess if their growth is sustainable with increasing water needs and potential power challenges. Lower states really need to be considering these challenges and setting up Nuclear and other forms of power because this is at least withing [sic] their control. If they remain heavily dependant [sic] on redervour [sic] power, they may find themselves in dire situations. As for their water needs, that is more unpredictable. As we increase our water needs from upper and lower states, we see increasing burden and pressure and dependency on one source of water which makes everyone vulnerable. California could even consider desalinization measures to alleviate pressure on water demands which could allow less pressure from upstream.  I'm willing to work and do our part if I see down stream states doing practical, common sense solutions to mitigate risks."

- candidate_first_name: John
  candidate_last_name: Taylor
  state: ut
  race: State House of Delegates
  district: 14
  party: Republican
  question: ut-q2
  date: 2026-10-24
  primary_candidate: false
  response: |
    "51,000 acres of phragmites consumes the entire outflow of the Jordan River for over 9 months. We need flow to the lake to help it. I'm willing to fund spraying Phragmites, russian olives, etc. which could help. When I met with the Farm Bureau Association, I was pleased to see how much they are doing to help the lake and they really are trying to do their part. There are common sense things we can do but I will never appropriated money just to do studies, etc. That has been abused. We all know the mitigation opportunities so money should go to priority projects that tangibly increase the flow to the lake."

- candidate_first_name: John
  candidate_last_name: Taylor
  state: ut
