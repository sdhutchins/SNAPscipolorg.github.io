  response: |
    "I strongly support vaccination. Vaccines are among our most effective public health tools, and preventing outbreaks of diseases like measles is a responsibility I take seriously.

    Parents deserve respectful, honest answers to their questions. I would listen to their concerns and work with pediatricians, university researchers, and trusted community leaders to explain vaccine benefits, known risks, and safety monitoring. Respecting concerns does not mean treating misinformation as equally credible as established medical evidence. Elected officials should help build public trust in vaccination.

    As a state legislator, I would support:

    1. Strong school and childcare vaccination requirements, with appropriate medical exemptions. I would oppose efforts to weaken these protections. Children who cannot be vaccinated for medical reasons deserve to attend school safely.

    2. Affordable, convenient access to recommended vaccines through community clinics, mobile services, and evening appointments. Cost, transportation, or work schedules should not prevent families from protecting their children.

    3. Dependable funding for local health departments to provide vaccination, testing, disease surveillance, exposure notifications, and rapid outbreak response.

    4. Clear public communication about vaccine safety and effectiveness, including transparent discussion of rare adverse reactions and how they are investigated.

    5. Medically guided outbreak precautions, including temporary exclusion of exposed students without evidence of immunity when necessary, with support to continue their education.

    My approach is to lead with empathy and be clear about the science. Vaccination protects individuals and helps protect infants, people with weakened immune systems, and others who are especially vulnerable. We should make that protection accessible and defend it."

