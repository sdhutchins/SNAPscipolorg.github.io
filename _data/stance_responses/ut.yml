    "Utah needs a diverse energy mix that keeps power reliable and affordable while protecting our air, water, and communities. I’m open to nuclear, natural gas, solar, wind, geothermal, hydropower, and other technologies, but each source should be evaluated on cost, reliability, emissions, water use, waste, and long-term impacts. Coal and natural gas may continue to play a role during the transition, but we should keep expanding cleaner generation and storage.

    Data centers deserve special scrutiny because of their enormous electricity and water demands. Utah already requires some large data centers to report water use, and state law requires large-load customers to cover certain grid-upgrade costs rather than shifting them to other ratepayers.

    I would support stronger upfront disclosure of projected power and water needs, independent review of impacts on utility rates and local infrastructure, conservation and water-reuse requirements, and meaningful public input before major projects move forward.

    My goal is simple: welcome economic development, but do not make Utah families subsidize it through higher power bills, depleted water supplies, or degraded air quality."

    KEYWORDS: Diverse energy mix, Protect our air/water/communities 
