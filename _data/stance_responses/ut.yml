- candidate_first_name: Kandee
  candidate_last_name: Myers
  state: ut
  race: State Senate
  district: 21
  party: Utah Forward Party
  question: ut-q1
  date: 2026-10-26
  primary_candidate: false
  response: |
    "I grew up in Arizona, in the Sonoran Desert around Tucson, and the Colorado River and Lake Powell have mattered to me since I was 16 years old. If you live in Tucson, you learn that water is life. So I don’t see this as an abstract policy debate. I would support policies that start from the river’s real hydrology, not paper promises. The 1922 Compact gave out more water than the river actually carries, and climate change has made that gap worse. Any new agreement should be based on the best available science. My priorities would be: fair, shared cuts. Every state, Upper and Lower Basin, should contribute during shortages. That includes Utah. Cuts should be clearly defined in advance. Help for farmers, not just demands. Agriculture uses most of the river’s water. I support paying farmers fairly to conserve and funding efficient irrigation. I am concerned about new developments and would want proof they have a long-term water supply. I support water recycling, reuse, turf replacement, and conservation-based pricing in our cities. This is important to me. Honoring tribal water rights. Tribal nations hold senior rights that I believe may have been ignored, I need to learn more. I am worried about the Colorado River, the Grand Canyon, and the Delta.
    
    It seems smart to protect Glen Canyon Dam and plan better for a lower Lake Powell. I would  reject water-hungry projects that send more water out of an already stressed river. I believe the way to balance competing needs is to be honest about how much water we really have, to share the sacrifice fairly, and to listen to scientists, tribes, and the communities that depend on this river."

- candidate_first_name: Kandee
  candidate_last_name: Myers
  state: ut
  race: State Senate
  district: 21
  party: Utah Forward Party
  question: ut-q2
  date: 2026-10-26
  primary_candidate: false
  response: |
    "Growing up in Tucson taught me that water can disappear, and when it does, the land and the air change with it. Many washes in Tucson no longer see water the way they did when I first moved there in 1978. The Great Salt Lake is now facing that same reality, and the dust blowing off its dry lakebed is a huge public health concern. My first priority would be science we can trust. We cannot solve a problem we are not measuring. I would support steady, long-term funding, not one-time grants, for: Dust and air quality monitors close to the shoreline and in the neighborhoods most affected, so we know when dust comes from the lake, which communities are at most risk, and who is breathing it, especially people with asthma or lung disease, the elderly, and people experiencing homelessness. Watershed monitoring, including stream gauges, groundwater, and tracking how much water actually reaches the lake. I have read that this is critical, and I have more to learn. Public data that anyone can see, plus dust forecasts and alerts. This would not only protect the public but help us come together as a community. Utah is stronger when we work together. Second, I would support getting more water to the lake. This means stable funding to lease water from willing farmers and water users, conservation in our cities, and making sure water that is saved actually reaches the lake instead of being used somewhere else. Third, I would support helping communities adapt. We need to find ways to protect people from poor air quality, and create task forces focused on helping the public understand how we can all use less water in Utah. In the 1970s and 1980s, Tucson made a major shift in landscaping, removing grass and thirsty plants and replacing them with native plants and rock. This is commonly called xeriscaping. It is still beautiful and uses far less water. Tucson was proactive, and Utah can be too. I believe the way forward is to fund the science, listen to the experts, and act before the damage becomes permanent."

    KEYWORDS: Tucson, Proactive, Protect public, Bring public together, Experts first, Science, Health, Community, Conservation, Action, Tucson's example

- candidate_first_name: Kandee
  candidate_last_name: Myers
  state: ut
  race: State Senate
  district: 21
  party: Utah Forward Party
  question: ut-q3
  date: 2026-10-26
  primary_candidate: false
  response: |
    "When it comes to public health, I believe in listening first. Most parents who have questions about vaccines love their children and want to keep them safe. Respect, honest information, and trusted local voices will matter to those who feel shamed or judged. As an elected official, I would: Meet people where they are. I would work with local doctors, nurses, pharmacists, school nurses, and faith and community leaders, who are often the most trusted messengers in their own neighborhoods. The public deserves clear, science-based answers about vaccine safety, including what the research shows and how safety is monitored. Another important key is making vaccines easy to get. That means free or low-cost shots, clinics in schools and rural areas, evening and weekend hours, and outreach in more than one language. Measles is one of the most contagious diseases we know, and Utah’s outbreak shows what happens when vaccination rates fall. I would support strong, steady funding for public health departments, so they can track outbreaks, test, and respond quickly. I would also make clear, public data available on outbreaks and school vaccination rates, so families can make informed choices. But vaccines are only one part of the picture. People cannot protect their health if they cannot afford to see a doctor. I believe Utah’s health care system needs to be rebuilt so that every Utahn has affordable, quality coverage. Massachusetts showed it can be done. Its reform, signed by former Governor Mitt Romney, brought nearly everyone in the state under coverage. I would welcome the chance to learn from Governor Romney and the people who built the Massachusetts plan. I would like Utah to study MA's model and build our own version, one that lowers costs, expands access in rural communities, and puts prevention first. A healthier, insured population is better protected against outbreaks too. I also believe the federal government has an important role. Diseases do not stop at state lines, and states cannot do this alone. Our national health agencies should be led by qualified physicians and public health experts, and vaccine recommendations should come from independent scientists, not politics. I would support leaders who restore that trust. I believe the way forward is to follow the science, respect the people we serve, and protect our children and our most vulnerable neighbors."

    KEYWORDS: Listening first, Respect, Data, Public easy access, Former Governor Mitt Romney, Science-based answers, Restore trust

- candidate_first_name: Kandee
  candidate_last_name: Myers
  state: ut
  race: State Senate
  district: 21
  party: Utah Forward Party
  question: ut-q4
  date: 2026-10-26
  primary_candidate: false
  response: |
    "Living in Tucson taught me two things about energy: the desert sun is one of our greatest resources, and water is never something to take for granted. Both lessons apply to Utah today. Energy mix. I support an “all of the clean, reliable options” approach, guided by science and cost, not politics. Solar, wind, and geothermal should grow fastest. Utah has world-class sun and geothermal resources, and they use little or no water. Paired with battery storage, they can keep the lights on and lower bills. Hydropower will stay important, but as Lake Powell drops, we cannot count on it the way we once did. Advanced nuclear deserves careful study. Careful study. I am open to it if it is proven safe, has a clear plan for waste, uses little water, and does not leave taxpayers or ratepayers with the bill. Natural gas can serve as a bridge while we build cleaner power, but not as our long-term plan. Coal should be phased down responsibly, with real support for workers and communities in places like Emery and Carbon counties, who powered Utah for generations. Grid reliability. I would support investment in transmission, storage, and a modern grid that can handle extreme heat and wildfire risk, with costs shared fairly. Data centers. My approach is simple: pause, learn, then decide. If data centers are a good idea today, they will still be a good idea in six months or a year, when we have better data. I would support: Water comes first. Large data centers should report their water and power needs before construction and every year after, with the data made public. No secret deals. Residents deserve to know who is proposing a project and how big it is before it is approved, not after. Data centers pay their own way. Utah families should not see higher power bills to cover the cost of serving hyperscale users. My motto will always be, EVERY voice at the table. Local communities, farmers, tribes, and scientists should be heard before decisions are made. I am not convinced Utah’s desert is the right home for every water- and power-hungry data center. Good policy does not need to be rushed. Utah deserves time."

    KEYWORDS: Energy mix: solar/wind/geothermal/battery storage/hydropower/advanced nuclear (cautious but open), Natural gas as a bridge, Data centers: pause/learn/decide, Utah deserves time

- candidate_first_name: Kristin
  candidate_last_name: Meyer
  state: ut
  race: State House of Delegates
  district: 50
  party: Democratic
  question: ut-q1
  date: 2026-10-26
  primary_candidate: false
  response: |
    "We can’t promise water that isn’t there. I support managing the Colorado River around the best available science, including a warmer climate and the possibility of prolonged drought. Our goal must be to bring consumption into balance with available supply while rebuilding a reserve for difficult years.

    As a state legislator, I would support:

    1. Clear conservation commitments before we reach a crisis. Utah should work toward a negotiated agreement with measurable reductions and predictable actions as river flows and reservoir levels change. If voluntary programs fall short, the agreement should provide for additional reductions consistent with water rights and interstate obligations. We should not wait until hydropower or essential water deliveries are threatened.

    2. Paying for verified water savings. I support voluntary, compensated agreements that help farmers reduce consumption through approaches suited to their land, crops, and livelihoods. Funding should include measurement and protection of the saved water. Installing more efficient irrigation equipment does not automatically mean more water remains in the river.

    3. Requiring cities and industry to share responsibility. I would support reducing unnecessary outdoor irrigation, repairing leaks, and requiring major new developments and industrial projects to demonstrate reliable water supplies under drought conditions. Conservation gains should not automatically become permission for additional consumption. Public incentives should not encourage projects that worsen our water deficit.

    4. Treating tribal nations as governing partners. Tribal rights must be honored, and tribes must help shape decisions about the river’s future. I support infrastructure investment that makes reliable drinking water accessible. A tribe’s lack of infrastructure should never be treated as permission to assume its water will remain available to others.

    5. Protecting the river’s health. Agreements should account for water quality, habitat, recreation, and the communities whose livelihoods depend on a functioning river. I would support public reporting and independent review of whether conservation programs deliver their promised results.

    Balancing these demands does not mean imposing identical cuts on everyone. It means protecting essential household needs, respecting tribal rights, supporting agricultural communities through change, and holding large users accountable. Utah should defend its interests while accepting responsibility for keeping the entire river system viable."

- candidate_first_name: Kristin
  candidate_last_name: Meyer
  state: ut
  race: State House of Delegates
  district: 50
  party: Democratic
  question: ut-q2
  date: 2026-10-26
  primary_candidate: false
  response: |
    "Protecting the Great Salt Lake is a public health responsibility. Families deserve to know what is in the air they breathe, and our response should be guided by independent science.

    Utah needs a funded plan to restore the Great Salt Lake, with clear milestones and accountability. Monitoring is essential, but its purpose must be to guide action that gets water to the lake and protects people.

    I would prioritize five things:

    1. Set measurable recovery commitments. I would support a science-based recovery schedule with annual water-delivery targets, public reporting, and required corrective action when conservation commitments fall short. Targets should account for drought and warming, so our plan does not depend on unusually wet winters.

    2. Fund water that actually reaches the lake. I would support a dedicated, ongoing state appropriation for water leases, voluntary purchases from willing sellers, and verified reductions in water consumption. Farmers should be compensated fairly for participating. Agreements must protect that water along its route to the lake. Conservation dollars intended for lake recovery should be evaluated by additional water delivered, not simply equipment installed or money spent.

    3. Make every sector contribute. Agriculture, cities, and industry must share responsibility. I would support reducing unnecessary turf irrigation, helping farmers adopt practices that demonstrably reduce consumption, and requiring major new water users to disclose their impacts. I would oppose new diversions or public subsidies for projects that undermine the lake’s recovery.

    4. Sustain independent scientific monitoring. Utah needs reliable funding for university researchers and public agencies to measure streamflows, groundwater, water consumption, lake levels, salinity, and ecological health. Dust monitoring should identify sources, particle sizes, metals, and community exposure. Findings should be publicly accessible and used to direct restoration and health protections.

    5. Protect families now. I would fund timely dust alerts, air filtration in schools and childcare centers, assistance for vulnerable households, and targeted dust control where evidence shows it is needed. Communities with the greatest exposure should receive priority.

    We should measure success by water reaching the lake, recovering ecosystems, and reduced exposure to harmful dust. Families deserve immediate protection and a state government committed to fixing the conditions putting them at risk."

- candidate_first_name: Kristin
  candidate_last_name: Meyer
  state: ut
  race: State House of Delegates
