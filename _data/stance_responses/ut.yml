  response: |
    "The Colorado River is being asked to provide more water than the system can reliably sustain, so long-term policy has to focus on conservation, accurate measurement, and shared responsibility.

    For Utah, I would support expanding agricultural water-efficiency programs, compensating farmers for voluntary conservation and temporary water leasing, and protecting conserved water from simply being consumed somewhere else. Agriculture is essential, so farmers should be partners in conservation, not expected to carry the burden alone.

    Growing communities and industry also need to do their part. New development should demonstrate a reliable water supply, and large industrial users should disclose projected water demand and conservation plans. We should also expand water reuse, drought-tolerant landscaping, leak reduction, and municipal efficiency.

    Tribal nations must have a meaningful seat at the table as sovereign governments.

    Finally, we need flexible agreements that reflect actual river conditions and protect both communities and the river system itself. Everyone who benefits from the Colorado River has a responsibility to help sustain it for the long term."

    KEYWORDS: Partner with agriculture/industry/Tribal Nations

