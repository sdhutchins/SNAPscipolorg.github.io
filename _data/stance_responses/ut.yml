    "I would prioritize sustained funding for science, monitoring, and public-health protection around the Great Salt Lake.

    Utah is already expanding dust monitoring through the Utah Dust Observation and Research Network, with about 23 monitoring stations planned statewide, many positioned to measure Great Salt Lake dust and distinguish it from other regional sources. I would support maintaining and expanding that network, along with research on dust composition, arsenic and other contaminants, lakebed “hot spots,” groundwater, wetlands, and watershed inflows.

    I would also support continued partnerships with Utah universities, USGS, and state agencies to study how dust affects respiratory and cardiovascular health, especially for children and other vulnerable populations.

    For communities, we need real-time public alerts, better exposure mapping, and targeted assistance for schools, outdoor workers, and residents during severe dust events.

    But monitoring alone is not enough. The long-term solution is getting more water to the lake. Dust mitigation can be extremely expensive, so conservation, water leasing, and protecting inflows should remain central to reducing the exposed lakebed in the first place."

    KEYWORDS: Monitor, Study, Research, Protect

