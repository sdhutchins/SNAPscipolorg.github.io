    "Utah must pursue a Colorado River agreement that protects our water security, respects state authority, and recognizes the legitimate needs of agriculture, growing communities, tribal nations, industry, and the environment. Water is essential to our economy and way of life, and managing it responsibly requires cooperation rather than political finger-pointing.

    I support science-based water planning, improved conservation, investments in efficient irrigation, water reuse, leak reduction, and infrastructure that helps communities get more value from every gallon. Federal and state officials should work with all seven basin states and tribal nations toward fair, enforceable agreements that account for drought, population growth, and long-term climate conditions.

