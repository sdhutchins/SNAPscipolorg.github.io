    "My approach would start with listening, accurate information, and trusted local relationships. Public-health officials are most effective when they work with parents, physicians, schools, faith leaders, and other trusted community voices rather than simply telling people what to do. CDC guidance specifically recommends early engagement with communities that have lower vaccination rates and working through trusted local messengers.

     At the same time, elected officials have a responsibility to protect public health. Measles is highly contagious, and the CDC identifies two doses of the MMR vaccine as the best protection against infection and complications.

    I would support strong disease surveillance, adequately funded local health departments, accessible vaccination clinics, clear public communication, and rapid outbreak response. I would also maintain evidence-based school immunization requirements while preserving legitimate medical exemptions and ensuring families understand the consequences of exemptions during an outbreak.

    The goal should not be to shame people who have questions. It should be to make trustworthy information and preventive care easy to access while protecting children, schools, and communities from preventable outbreaks."

    KEYWORDS: Trusted local relationships, Preventable outbreaks

