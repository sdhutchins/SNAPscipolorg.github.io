    I totally support capping the institutional portion of federal grants. Too many institutions rip us off when they are already tax exempt and already own the buildings. We all know this.
    I want to increase the proportion of K Series grants. And I want the K Series spread geographically because there are unfair institutional clusters. 
    I support a COOL IDEA that is part of my GREEN FUTURE INITIATIVE where we have crowdsourced input on grants with people who are vetted and credentialled as moderators. I would like this crowdsourced brain to bring vitality and local interests to the grantmaking process, and I want people to be able to literally invest directly in some of the research with opportunity to have small investments if research ends up being monetized. It is not fair that taxpayers pay for the research, but yet the top-down and ossified structural process creates the paradigm for the "sexy" research and the taxpayers have no say on what is important to them. This would not be a "wild west" but would be a geek friendly discussion portal with investment opportunities. I would like tax dollars to be able to be directed towards a particular project from "my" taxes. I pay for it, yet I cannot read it without buying the journal access, and I can't profit from the eventual monetization. That can change. 
    When people have access to the information, when people can access grants, and learn more about research, we have a massive public pressure for research that matters. 

