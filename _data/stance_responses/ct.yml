    I have environmental credentials. In elementary school, I started the "Pollution Patrol." I was only 12 when I built my first passive solar window heater that worked very well, by the way.
    Every region has unique and local environmental issues. That is why I am proposing the GFI, or Green future Initiative.
    Everyone can see that the GND is the great green grift. It has been an excuse for cronies to get billions of dollars with absolutely zero plan of action and absolutely zero outcomes analysis. Suddenly the senator's brother in law has a new green business. Suddenly Stacy Abrams gets 2 billion for a new initiative that doesn't even have a business plan. Disgusting,
    The GFI is crowdsourced, as I mentioned above. I intend to create "Sustainability Zones" that can produce local needs for water, energy, and food in their unique ecosystem. This can become a closed loop for national security in the event of supply chain disruption, and can also bring farm to table food sustainability, linking to my plans for both mental health and the promotion of nutrition without agrichemicals and without trucking and flying food from all over the place. Local, local, local. This will promote local business, local farms, and local involvement instead of a big money dump on a politically connected "green business."
    How do I accomplish this? This is a secure server, regionally developed and linked to local universities and experts. It will be local people, voluntarily working together with passion and oversight, to request local grants and to create what they want to see. I have spoken with a number of persons who are deeply passionate about naturalizing, about heirloom seed preservation, about urban gardening, about food sovereignty, and the like. 
    Best of all, there is OUTCOME ANALYSIS. I am done with policies that do not produce evidence or proof of concept after billions get poured in. That is a massive waste. Outcomes must be built in. 
    Another point that brings mental health with the GFI is the opportunity for community engagement and volunteering.
    I think that creating a better environment should be fun and voluntary, and it should not hurt the most vulnerable among us. 
    A healthy world is a world where we are not forced, divided, controlled, robbed, blamed, or disempowered. 

