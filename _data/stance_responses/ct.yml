  response: |
    When the federal government cuts CDC funding, dismantles vaccine advisory infrastructure, and politicizes outbreak response, states have to fill the gap. Connecticut should treat public health as core infrastructure.

    As governor, I would strengthen the state's own capacity: sustained funding for local and district health departments, and close partnership with the research resources we have right here in Connecticut, whether that is UConn, Yale, or any of our higher education institutions. Modernized disease surveillance and data systems would let us detect outbreaks early instead of reacting late.

    My record backs this up. I led the fight to eliminate the religious exemption for school vaccinations, one of the hardest public health votes in recent memory. We need to keep following the evidence, and the new frontier is HPV and preventable cancers. Connecticut should lead on vaccination and screening programs that stop cancers before they start.

    I would also deepen regional partnerships with neighboring states on stockpiles, lab capacity, and shared guidance. The federal government no longer appears interested in letting data determine the best course of action. Connecticut must stay committed to it, and to being a trusted messenger with the public, explaining that science always evolves and acting on new insights as the data provides them.

    Public health only works when people can afford to use it. Expanding access to primary care, paid sick leave, and safe housing means building an economic system that serves everyone. 

- candidate_first_name: Josh
  candidate_last_name: Elliott
  state: ct
  race: Governor # must match one of the options!
  party: Democratic # must match one of the options!
