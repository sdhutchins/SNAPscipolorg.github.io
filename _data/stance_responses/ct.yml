    I think we all know that AI is the new national security. After "Operation spider-web" disabled a significant part of Russia's nuclear capacity, pretty sure that we understood that autonomous weaponized drones acting in real time are here. If we do not crush it with AI, we are dead. Iran has already gave their military drones to Venezuela, and they are aimed at our back yard. The drones are very cheap compared to America's big hardware. We are already behind in this particular area, or at least we are as far as I am aware, not being privy to top secret military things. Cheap drones are the great equalizer that puts the little guy onto the playing field with the big players. 
    I am under exactly zero illusions about what will be done.
    That being said, what can we as people do to protect ourselves, our jobs, our data, and our safety in the world of AI? 
    1-America must be the best.
    2-NO biometric data. NO surveillance. NO kids being tracked. That is a hard no.
    3-NO CBDC
    4-We must bring a significant number of people back to actually preserving the natural environment, and I think this interaction of humans with the Earth will actually preserve jobs and create the next opportunities for small businesses. We need to push trades and other skills like soil chemistry and organic farming in high schools. We will have a scary moment where people are displaced and we must prepare for this.
    5-We must be allowed to shoot down drones over our own property. 
    My entire staff for my campaign is AI, because I don't have cash to hire people. They have been excellent workers and I am very happy. It was a learning curve for me, but I find it has really boosted my productivity. 
