    Connecticut’s research universities, like UConn and Yale, are the economic engines of our state. When federal funding falters, Connecticut must step up through direct state investment and smart public-private partnerships. We recently approved $35 million in grant research funding for Uconn and Uconn health to fill in from cuts from the Trump Administration, and we will continue to do so. 

    We have to be creative. We have implemented matching grants and venture capital initiatives—like Connecticut Innovations— that have been very successful. The goal is to keep these institutions moving forward, bringing new ideas, and sparking new startups.

    This research then connects with the state’s core economic strengths: bioscience, green energy, and advanced manufacturing. We have programs like the Technology Incubator Program, that ensures that breakthroughs made in Connecticut labs turn into businesses that stay in Connecticut. They in turn create the kind of highly skilled jobs we need, and give us the edge to keep our state at the forefront of global innovation. We don't just want to train the best minds; we want them building their futures right here.

