    As a physician and an epidemiologist with multiple fellowships, I am not worried about Hantavirus and Ebola outbreaks. I am worried about the weaponization of these viruses and others. I did pandemic gaming and also bioterror training. I have been dismayed by the politicization of public health that has been going on and I am a voice of reason and common sense.
    I am very happy with the new emphasis on chronic disease and nutrition. I am disappointed that not as much has happened on these issues in the first year and a half of the administration. I am extremely focused on prevention, and my second fellowship is boarded with the American Board of Preventive Medicine. I am extremely concerned about the cognitive science being used without knowledge or consent to make food products and electronic products physically addictive. This literally changes neurobiology and I am not down with that. I am also virulently opposed to agrichem lobby interests and will consistently seek policies that use the European proof of safety standard. 
    I personally have a raft of public health policies partially based on my new book (Addiction Proof Your Kids) which is using evidence and neuroscience to prevent excess mental illness and addiction. Trump has not done enough with this new policy.
    The WHO has its problems. So does the CDC. I am not in favor of completely disengaging from the WHO, despite their kowtow to the PRC. Cutting CDC administrative bloat is fine. 
    I am pro vaccine, but I also am in favor of informed consent. I am trying hard to regain the trust that was lost when people failed to notify us about the change in manufacture process of the covid vaccine. That was not okay. I am also not okay with demeaning or insulting patients as many of my colleagues have done. Highly inappropriate. Trust is information and honesty. I am not in favor of using infant bodies for public health initiatives when that infant is not at risk for the disease in question. (See hep B day zero)
    I believe mental health is the most important preventive frontier and we know that the two hit hypothesis creates space for intervention. Pro health behaviors cannot occur without mental health. The same can be said for pro-social behaviors. I want to fully develop a program for the prevention of mental illness, or else the tsunami of mood disorders are going to come and overwhelm our healthcare system, mark my words.

