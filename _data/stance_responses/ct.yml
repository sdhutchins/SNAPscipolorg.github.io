    Environmental protection in Connecticut is a matter of health and economic justice. The communities living closest to legacy industrial pollution, highways, and peaker plants are working families in cities like New Haven, Bridgeport, and Hartford, and they carry the asthma rates and health costs to prove it.

    My priorities start there. I would fully fund DEEP so permits, inspections, and enforcement actually happen, and strengthen Connecticut's environmental justice law so overburdened communities have the power to say no to new pollution sources. Brownfield remediation should accelerate, turning contaminated sites into housing and open space instead of leaving them fenced off for decades.

    On coastal flooding, Connecticut needs a serious climate resilience program: state investment in flood protection for shoreline towns, updated building and zoning standards, and concrete planning about where we build. Every dollar spent on resilience saves multiples in disaster recovery.

    It's easy to say we are a small state and we don't matter. Our size should make us nimble, the most forward-thinking state on the environment in the country. Decades of misinformation from big energy has perverted the conversation. It's time to be brave in the face of that misinformation and make the big investments we need to leave a livable planet for the next generation.

    Air quality is a regional fight. Much of our pollution blows in from upwind states, and Connecticut should press that case through the courts and regional compacts while cutting our own emissions.

