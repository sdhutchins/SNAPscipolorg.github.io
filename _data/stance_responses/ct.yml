    Connecticut has one of the strongest public health infrastructures in the nation, and we will continue to lead regardless of shifts in Washington. To address emerging threats like Hantavirus or Ebola, we are ready to take the lead if needed, with state-level surveillance and rapid response. Our Department of Public Health (DPH) can rely on our world-class health institutions here, from UConn Health to Yale.

    I have worked to strengthen our local health departments, expand healthcare access, and protect public health. After the Trump administration tried to cut more than $150 million of our public health funding, we want to be ready for any challenges that might arise. We have invested in our state public health laboratory to ensure we have cutting-edge diagnostic capabilities right here in Connecticut. 

    Above all, we know, public health is built on  trust; After the pandemic, we learned being honest, transparent, and explaining clearly and plainly what is needed is critical. I will continue our transparent, data-driven communications to combat misinformation. 

