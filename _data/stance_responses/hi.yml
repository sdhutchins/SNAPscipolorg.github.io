    "I fully support renewable energy incentives, and opposed SB3125 which placed a cap on the solar energy tax credits. This does not make sense for our state to have a goal of 100% renewable by 2045 and harming this credit at the same time. 

    I would support using liquefied natural gas as a component of our energy portfolio, but also think we should diversify our energy supply to include biofuels and biochar from green waste more. Expanding our tax incentives to renewable energy plants would be a good move with stipulations that these plants are set to export to the grid at peak hours and after sundown to balance the solar production window and contribute to more firm renewable sources."
    
