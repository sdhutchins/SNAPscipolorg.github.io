  response: |
    "I believe that we need to approach this from a civil engineering standpoint at the local level since Hawaii is harmed by, and cannot stop alone, climate change impacts by ourselves and must prepare for it. I would like to make use of subject matter experts and qualitative interviews to develop Bayesian statistics about areas most likely in Hawaii to be affected and address those areas first and work with residents to begin whatever infrastructure or built environment changes need to be done. I also think that we need to have policies at the international level that coordinate our environmental policies so that the response to climate change is global and uniform."

    KEYWORDS: One Health, resilence, sustainability, stewardship, technology

