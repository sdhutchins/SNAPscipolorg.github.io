- candidate_first_name: Stevie Kathryn # titles and middle names go here
  candidate_last_name: Chung # used for alphabetical sorting
  state: hi
  race: Local County Races [All] # must match one of the options!
  county_race: Maui County Council # feel free to remove if not applicable
  party: Non-partisan # must match one of the options!
  question: hi-q1
  response: |
    "The role they should play is near primary. When I say that I am all in on net zero energy goals, I mean tackling more ethical and sustainable energy plans that act to protect and sustain future generations from their basic needs becoming an overpriced commodity. The federal government and private companies want to put us into a chokehold where we cant seek sustainable alternatives while the fuel shortages are already hitting us where it hurts. All the while wind moves, water rushes, hydrogen reacts, and many other forms of energy have been used to create clean perpetual energy in the climates that suit them, with the battery power to store them. I see no reason why we can't have these solutions here on Maui in spite of the corperations that seek to prevent them."
    
    KEYWORDS: clean, free, renewable, ethical, sustainable
  
- candidate_first_name: Stevie Kathryn # titles and middle names go here
  candidate_last_name: Chung # used for alphabetical sorting
  state: hi
  race: Local County Races [All] # must match one of the options!
  county_race: Maui County Council # feel free to remove if not applicable
  party: Non-partisan # must match one of the options!
  question: hi-q2
  response: |
    "Hard and soft infrastructure are a delicate balance. Without planting natives onto the shorelines, the beaches will continue to erode instead of grow. If the dunes dont become restored, tsunamis and typhoons will continue to tear away at the coastline. They put in hard infrastructure with concrete flood basins but the refugee camp got flooded anyhow. If we're not doing the proper restoration efforts, the island will never become resilient to the natural disasters. I also am pushing for architectural methods that are more sustainable, cost effective, and organic in shape to take on any force of wind thrown at it. Think Arcosanti, cob housing, cellular lightweight concrete and fibreglass. Homes that are engineering marvels built to last generations." 
    
    KEYWORDS: the climate is underprotected and deeply threatened

