#candidate4_response
- candidate_first_name: Misty
  candidate_last_name: Cluett
  state: hi
  race: State House of Representatives
  district: 17 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Republican
  question: hi-q1
  response: |
    "Hawaiʻi’s test for any energy source should be simple: does it lower bills, keep the lights on and commerce moving, and is it safe for the communities that host it, especially the keiki. 

    Hawaiʻi’s families already pay the highest rates in the nation. Oil, solar, wind, geothermal, and liquefied natural gas should all be allowed to compete, provided they meet minimum standards for health, safety and environmental impact. None should be locked in or locked out by special interests. It's time to make the people's interests the only interests. 

    I support an all-of-the-above policy with health and safety first, cost-benefit analysis before new mandates, lights on goals, and research on storage and geothermal rather than subsidies. The 2045 renewable mandate should be a goal, not a blank check."

    KEYWORDS: Safe power, reliable power, affordable power

- candidate_first_name: Misty
  candidate_last_name: Cluett
  state: hi
  race: State House of Representatives
  district: 17 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Republican
  question: hi-q2
  response: |
    "Hurricanes Lala and Lowell showed what happens when maintenance is already behind. Lala took down poles and transmission lines on Hawaiʻi Island in August. Lowell did the same on Kauaʻi in September, where distribution poles past their useful life failed, roads washed out where breakwalls were dilapidated or missing, and a month later some communications lines are still on the ground.

    The same standard has to cover every island. Kauaʻi is served by the electric cooperative, KIUC. Hawaiʻi Island, Oʻahu, Maui, Lānaʻi, and Molokaʻi are served by the Hawaiian Electric companies. All of them answer to the Public Utilities Commission, and the commission follows statutes the House writes.

    I will require each utility to publish pole age, last inspection, and failure rate, and to fund replacement of equipment past its service life, before the PUC approves a rate increase or sets storm costs aside for later recovery. Damage to an asset already beyond its service life should not be billed to customers a second time. Management pay should follow that schedule: replacements done, incentives paid; replacements missed, incentives withheld.

    State money for county roads and breakwalls should work the same way. An inspection and a public repair schedule come before the check. Children are safer when the infrastructure is properly maintained so that it doesn't have as high a failure rate when stressed."
    
    KEYWORDS: better maintanence
  
- candidate_first_name: Misty
  candidate_last_name: Cluett
  state: hi
  race: State House of Representatives
  district: 17 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Republican
  question: hi-q3
  response: |
    "Other counties should follow the substance of Hawaiʻi County Bill 170. A hospital server room or a bank’s data closet is not the same thing as an industrial campus built to train artificial intelligence models. The bill draws that line. Ordinary data processing can stay in the zoning code. Large AI data centers should not.

    These facilities do not belong on Hawaiʻi’s grids. Each island is electrically isolated. Rates are already the highest in the country because most of the power is still imported oil. A data center that runs around the clock would add a load the system does not have, and the members would pay for the upgrade. Water is the same problem. These plants need a steady supply for cooling. That water is already spoken for by drinking, farming, and firefighting."
    
    KEYWORDS: No AI Data Centers in Hawaii

- candidate_first_name: Misty
  candidate_last_name: Cluett
  state: hi
  race: State House of Representatives
  district: 17 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Republican
  question: hi-q4
  response: |
    "A little more than 40 percent proficiency in math and science is a classroom result, not a budget result. In 2023–24 the Department of Education spent $22,670 per student, $19,583 of it state and local. Counted another way, Hawaiʻi public schools received about $26,100 per student, roughly $5,100 above the national average. Another appropriation will not teach a child to multiply or to read a lab question.

    What I support is a return to the basics, and a way for parents to leave a school that will not teach them. Early grades need phonics and arithmetic, practiced until the student has them. Middle and high school need real algebra and real science, with the score published by school so a family can see what it is getting. Discipline belongs in that list. A classroom that cannot keep order cannot teach STEM.

    Money should follow the student. If a charter, private, or another program is actually producing proficiency, the dollars go there. The Department of Education does not get a blank check because it is the default. Competition creates value.

    AI does not belong in math and science instruction. Students have to be able to do the work without it. A computer-lab elective is a different thing, and a school can offer one. It is not a substitute for a teacher.

    Extracurricular STEM is a school and family job: clubs, fairs, and apprenticeships where a teacher or a parent will run them. The House should not build a new program to simulate that. Equitable access starts with every school teaching the same fundamentals, and with parents free to choose the one that does."
    
    KEYWORDS: school choice

- candidate_first_name: Misty
  candidate_last_name: Cluett
  state: hi
  race: State House of Representatives
  district: 17 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Republican
  question: hi-q5
  response: |
    "People have to be able to get there: airports, harbors, and roads are the system. I would not require airlines to buy a particular fuel, drivers to buy an electric vehicle, or counties to build rail. If a technology is cost prohibitive, and the neighbor islands cannot justify the use or cost, then it is not a valid transportation policy.

    Passengers are limited to planes, and freight is stuck going through Young Brothers which is the only operator for bulk cargo between the islands. Airfare has increased significantly over the last several years, and the Public Utilities Commission approved a 25.75 percent rate increase for YB in 2026, and state law now allows further increases of up to 5 percent a year. Competition is the check on that. I would support another operator that can meet the safety rules, so shippers are not stuck with one option. We need competition to bring prices down.

    The Superferry had a false start in 2009. Whale strikes and invasive species were argued, but what mitigation efforts were weighed? And how are whale strikes and invasive species handled by Young Brothers; could that be applied to a ferry? What about weighing these concerns against the flights that could be replaced by the ferry? I think we need to take a new look at this strategy to bring in more options to drive prices down."
    
    KEYWORDS: Superferry, Need competition

