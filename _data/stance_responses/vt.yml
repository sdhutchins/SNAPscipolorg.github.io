- candidate_first_name: Wayne
  candidate_last_name: Laroche
  state: vt
  race: State House of Representatives
  district: 5
  party: Republican
  question: vt-q3
  date: 
  response: |
    "To begin with...who says flood risk is increasing?  Just because we have a sequence of floods in recent years does not necessarily mean that things have changed that much over the past 1000 years.  A lot of propaganda has been spewed in the last 30-40 years about climate change.  When that happens, follow the money...look for the motive.  There are written historical records of many floods prior to the installation of stream flow gages beginning about 1900.  There is a reason that so few covered bridges remain.  So, our stream records are barely 100 years old. We should not be focusing on things we can not control...after all "the weather" is a classic.  We should focus on problems we can solve.   Our cities and villages have been build in the flood plains, often on the banks of the stream.  Stream channels have been straightened, stream bank vegetation has been removed, gravel extracted, channels narrowed by bridges, road and railroad building.  We need to incrementally continue to fix these problems as opportunities and money allow.  We need to take actions that actually make a difference.  Take the 3-acre rule for impervious surfaces, for example.  The stated purpose for this rule was -- to reduce phosphorus run-off.  I argue: there is no source of phosphorus on roofs, parking lots or roadways...unless someone spreads something on those surfaces.  This law is costing a great deal of money, achieving little or nothing positive while diverting money that could be spent on more effective practices.  In my opinion, Hype got us that rule...sound science is disrespected.  Our environmental "advocates" have provided us with a whole string of environmental hype and crisis over the 30-40 years with political solutions that were costly and did not work.  Just look at the issue of PCBs in schools.  Millions spent to find out that we can't afford to tear down every school in the state and rebuild them...so, we stop testing.  Science just might indicate that this issue should be treated as a Risk Management Issue with protocols and methods developed to effectively mitigate the risk...understanding, that monitoring is needed and that there is no such thing as zero risk."

    KEYWORDS:

- candidate_first_name: Wayne
  candidate_last_name: Laroche
  state: vt
  race: State House of Representatives
  district: 5
  party: Republican
  question: vt-q4
  date: 
  response: |
    "Once again Vt looks to jump in with both looking to block an emerging technology instead of looking for benefits and waiting to see how bigger richer states proceed.  It is impossible for us to foresee where this technology will lead.  It will take at least a beginning of a track record before we can better judge where the path might go.  One thing for sure -- It is headed somewhere and will not be stopped.  We can get on the train or stand in front of it.   As far as energy goes, our politicians have made questionable decisions in the past...again pushed by the hype of those same so-called environmentalists and uninformed/misinformed citizenry. Our decisions should be well informed via testimony from a broad array of technical and knowledgeable people...not just a few select, like minded folks. Or those with matching private agendas. Of course, this all presumes that our elected officials can objectively make good decisions and policy.  Judge for yourself how that has been going."

    KEYWORDS: 

- candidate_first_name: Wayne
  candidate_last_name: Laroche
  state: vt
  race: State House of Representatives
  district: 5
  party: Republican
  question: vt-q5
  date: 
  response: |
    "Our politicians shut down VT Yankee.  Again, all hype.  No, real technical or financial reasons that I am aware of.  We are going to need more electricity.  Our transmission system is aging and not robust enough.  We have no significant hydropower to develop, we could be burning more wood (yes, our forests are aging, our age-structure and diversity has been limited by historical forest and land-use practices, once again the has been hype for "old growth" which is well and good, however, if our forests are not managed well...fuel will eventually reach levels where...once again, our forests will burn like they did in the past.  Maybe, better to burn a little for electricity?)  Coal is not popular,  Gas might be feasible, but distribution issues will remain. The future will be with nuclear energy.  I have no doubt at this point.  The technology has been rapidly advancing.  Small, modular nuclear plants are designed for safety, don't use water for cooling, have, close to zero emissions and could be dispersed and placed in such a way as to allow growth despite our aging transmission system. Check out Valar Atomics and other companies developing microreactors. Once again, I would advise a close look before jumping in with both feet."

    KEYWORDS: 

