    “Vermont’s environment supports our economy, public health, agriculture, tourism, and quality of life. I support environmental policies grounded in science and measurable results. I support sustained funding for Vermont’s Clean Water Initiative to reduce phosphorus and stormwater runoff, upgrade wastewater infrastructure, restore wetlands and stream buffers, and help farmers implement conservation practices. I support continued implementation of Vermont’s PFAS restrictions, expanded testing of drinking water and contaminated sites, and holding polluters responsible for cleanup costs. I also support funding environmental research and monitoring through the Agency of Natural Resources, UVM, and other research partners, particularly for water quality, soil health, forests, invasive species, and flood resilience. Vermont should continue supporting Current Use, conservation easements, and technical and financial assistance that help farmers and forestland owners protect soil, water, and wildlife habitat. These policies should use scientific data to measure results and direct limited state resources toward programs that demonstrably improve Vermont’s environment." 

