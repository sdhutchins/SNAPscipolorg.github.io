    “AI can improve healthcare, education, manufacturing, and state services, but Vermont should establish strong safeguards as its use expands. I support strengthening Vermont’s Division of Artificial Intelligence and requiring transparency, privacy protections, human oversight, and testing for bias when AI is used by state government or for consequential decisions affecting Vermonters. I support workforce development through Vermont State University, career and technical education centers, and employers to prepare workers for AI-related jobs and help those affected by automation. Schools should teach responsible AI use and digital literacy while protecting student data. I oppose the development of large-scale data centers in Vermont. Their enormous electricity demands could strain our grid, increase infrastructure needs, and conflict with Vermont’s energy and environmental goals. I would support legislation establishing strict limits on large data centers and preventing their energy and infrastructure costs from being passed on to Vermont ratepayers. Vermont should embrace useful AI technology without sacrificing affordability, environmental stewardship, or local control." 

    KEYWORDS: responsible AI, AI transparency, consumer protection, data privacy

