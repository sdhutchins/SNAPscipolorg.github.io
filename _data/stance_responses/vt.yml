    “My energy priorities are affordability, reliability, and responsible renewable development. Alternative energy should play a major role in Vermont’s future, but the transition must lower costs for households and businesses rather than create additional financial burdens. I support Vermont’s Renewable Energy Standard and cost-effective, responsibly sited solar, existing and small-scale hydropower, geothermal energy, battery storage, and community renewable projects. I also support grid modernization and weatherization, with greater access for low- and middle-income Vermonters. These investments can create jobs for electricians, lineworkers, HVAC and heat-pump technicians, solar installers, engineers, and construction workers. I support expanding career and technical education, Vermont State University programs, and apprenticeships that connect Vermonters directly with these jobs. Energy policy should reduce household costs, maintain a reliable grid, protect our environment, and keep more energy dollars and jobs in Vermont." 

    KEYWORDS: energy affordability, renewable energy, energy reliability

