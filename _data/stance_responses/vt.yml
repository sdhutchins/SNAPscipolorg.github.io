- candidate_first_name: Natalie 
  candidate_last_name: Cashen 
  state: vt
  race: State House of Representatives
  district: 
  party: Democratic
  question: vt-q3
  date:
  response: |
    “Vermont needs to invest in resilience before disasters occur, not simply pay to rebuild afterward. I support fully implementing the Flood Safety Act, including stronger floodplain standards, river-corridor protections, wetland restoration, and improved dam safety. I support funding municipal projects that replace undersized culverts, strengthen roads and bridges, restore floodplains, and protect water and wastewater systems. I also support voluntary buyouts for repeatedly flooded properties and incentives for communities to adopt stronger flood-resilience standards. Vermont should implement its Resilience Implementation Strategy by prioritizing nature-based flood protection, resilient infrastructure, and improved early-warning systems. I also support UVM Extension and state programs that help farmers and foresters adapt to changing rainfall, growing seasons, pests, and forest conditions. For communities dependent on skiing and other winter recreation, Vermont should support economic diversification and four-season outdoor recreation. These investments can reduce disaster costs while protecting our homes, working lands, businesses, and local economies." 

    KEYWORDS: flood resilience, Flood Safety Act, river-corridor protection

