  response: |
    "Science and research at our premier institutions are some of the largest economic drivers in the state. We need to promote and celebrate those programs, not denigrate them or threaten them with funding cuts. I have also done considerable work trying to increase access to maternal and reproductive healthcare across the state which fundamentally requires increasing the availability of doctors and research to implement that access and those programs."
    
- candidate_first_name: Erin
