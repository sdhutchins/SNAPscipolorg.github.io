    "I would define the goal and the measures of success before a policy passes, and I would build in a reporting schedule and a review date. In the Air Force we debriefed every mission: what did we intend, what happened, why, and what do we change. I would bring that habit to state policy, using the Legislative Fiscal Office, the Legislative Performance Audit Office, interim studies, and data systems like the Nebraska Statewide Workforce and Educational Reporting System. Evidence that would prompt me to revise a policy includes results that fall short of the stated targets, unintended consequences, new research that contradicts the original basis, and costs that outweigh the benefits."

    KEYWORDS: Intention, Evidence, Measured

