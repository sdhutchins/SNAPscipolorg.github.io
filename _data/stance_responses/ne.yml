  date: 2026-09-28
  response: |
    "Government’s primary focus should be on improving citizens’ quality of life. I think many political leaders focus only on improving their own lives. 

    We should be making big investments in science, research, innovation, and STEM workforce development. We are behind where we should be in supporting these areas, and we need to catch up quickly. Of course, it would be great if the federal government would stop enacting policies that make this type of investment more difficult. Legislators at both the state and federal level need to get to work making people’s lives easier and better. There is a palpable lack of progress on legislation that most citizens clearly agree on. Inaction seems to be the status quo at both the state and federal levels. "

