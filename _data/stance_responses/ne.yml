  response: |
    "The purpose of the Nebraska DHHS should be pretty simple: take care of Nebraskans who need assistance and make sure the programs we are paying for actually work. That means protecting children, supporting people with disabilities, helping families in need, providing access to health care, supporting mental health care for all, and making sure our most vulnerable citizens aren't being underserved. 

