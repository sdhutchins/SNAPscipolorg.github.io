    "I plan to create an advisory committee of scientists, experts, first responders, community volunteers, and previously affected victims of natural disasters. Through these people we will find the ways and means to mitigate and prevent future disasters. Learning from other states and nations can show us the causes and potential solutions to these dangerous situations. We also need state and federal resources to combat disasters. Having the funds on hand to match with federal money is key to succeeding. Through cannabis revenue and corporate tax reform we will start creating a safer environment for our citizens by supplying the funds needed to improve our emergency response systems. We must not rely on others to come save us. I will incentivize volunteer training programs and completion of FIMA independent study courses that prepare our citizens to activate in times of emergency."
    
