  response: |
    "If AI were only being used to cure cancer or solve other longstanding real-world problems, I’d be hugely pro-AI. However, our current AI landscape has some clear problems that invite a conversation around guardrails. Many people have unwittingly used AI to such an extent that their reasoning ability suffers. The heads of these companies don’t have the public’s best interest in mind. The AI industry needs strong regulation on its development and use, and it needs it immediately. Furthermore, data centers need regulations to ensure they don’t use more than their share of power and water. They should only be built with a significant amount of public input, and each community should have the power of denial. While there is a national security imperative to ensure we keep up with countries like China around this technology, we must also exercise caution."
    
