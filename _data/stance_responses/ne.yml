    "NIH and NSF grants have led to all sorts of amazing breakthroughs and developments over the years that we too often take for granted, and those federal funds should continue to flow. Still, accountability is critical to ensure all those funds actually deliver what they’re supposed to. In general, federal funding for research is essential to the long term health and competitiveness of our country—government investment is often the only way to take big swings and achieve large breakthroughs."
    
    KEYWORDS: Future, health, research

- candidate_first_name: Dan
  candidate_last_name: Osborn
