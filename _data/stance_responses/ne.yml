    I am also concerned about the rapid expansion of data centers. They can place enormous demands on electricity, water, land, and local infrastructure while communities may see relatively little long-term employment in return. I support strict reporting requirements, meaningful local review, protection of water and energy resources, and requiring developers to pay the infrastructure and decommissioning costs their projects create rather than shifting those costs onto residents and other ratepayers.

