- candidate_first_name: Mark
  candidate_last_name: Cohen
  state: ne
  race: US House of Representatives
  district: 3
  party: Independent
  question: ne-q5
  date: 2026-08-25 
  response: |
    "I earned an advanced degree (LL.M.) in agricultural law. For many years the Dept. of Agriculture provided funding for programs that have proven successful for decades. It has funded valuable research. We should fully fund the Dept. of Agriculture and allow it to develop policies based on scientific evidence. We should also fund grants to universities and others best positioned to decide what works best in a particular area. A “one size fits all” policy on an issue is not always appropriate. Many regulations are burdensome on small operations, and Congress should recognize that and carve out exceptions. Farmers and ranchers should play an important role in developing policy."
    
    KEYWORDS: Funding, Participation

- candidate_first_name: Mark
  candidate_last_name: Cohen
  state: ne
  race: US House of Representatives
  district: 3
  party: Independent
  question: ne-q6
  date: 2026-08-25 
  response: |
    "My answer largely incorporates what I have written in response to other questions. The federal government must play a strong role in protecting Americans and America’s natural resources. A Republican, Theodore Roosevelt, recognized the importance of conservation. Another Republican, President Nixon, created the EPA and said, “Restoring nature to its natural state is a cause beyond party and beyond factions.” We are the stewards of this Earth. It should not be a partisan issue. I would protect funding for agencies such as NOAA and the National Center For Atmospheric Research."
    
