- candidate_first_name: Cindy
  candidate_last_name: Chatt
  state: ne
  race: State Legislature
  district: 16
  party: Non-partisan
  question: ne-q12
  date: 2026-10-15
  response: |
    "I believe scientific research plays a critical role in developing good public policy. Too often, scientific findings and expertise are dismissed because they don't align with political opinions or agendas. We need to respect the research and have honest discussions about what it tells us.

    There are many policy decisions, from healthcare and agriculture to education and environmental issues, where scientific evidence should help guide our decisions. That doesn't mean we ignore economic impacts, ethical considerations, or the needs of our communities. It means we start with facts and then have thoughtful discussions about how best to move forward.

    I believe good policy comes from asking questions, listening to experts, considering different perspectives, and being willing to make decisions based on evidence rather than simply reinforcing what we already believe."

    KEYWORDS: Evidence, Integrity, Objectivity
    
- candidate_first_name: Cindy
  candidate_last_name: Chatt
  state: ne
  race: State Legislature
  district: 16
  party: Non-partisan
  question: ne-q13
  date: 2026-10-15
  response: |
    "I believe science and research can and should play a leading role in Nebraska's future. We already have tremendous strengths in agriculture and medical research, including the innovative work being done at the University of Nebraska Medical Center. These are areas where Nebraska has an opportunity to continue leading, not only through scientific advancements, but also through economic development.

    Investing in research means investing in our state's future. Leading researchers attract grant funding, bring talented individuals and their families to Nebraska, create jobs, and open the door for new businesses and industries. The economic impact extends well beyond the universities and research facilities themselves.

    I would prioritize funding that builds on Nebraska's strengths in agricultural innovation and medical research. I would like to better understand existing programs, such as the Nebraska Research Initiative, Academic Research and Development Grants, and state funding for biomedical research, including how they are currently funded and opportunities to strengthen them. We should evaluate these investments not only for their scientific contributions, but also for their potential to attract additional funding, support innovation, and create long-term economic opportunities for Nebraska."

    KEYWORDS: Innovation, Investment, Opportunity
    
- candidate_first_name: Cindy
  candidate_last_name: Chatt
  state: ne
  race: State Legislature
  district: 16
  party: Non-partisan
  question: ne-q14
  date: 2026-10-15
  response: |
    "I believe collaboration between state government, universities, private industry, and nonprofit organizations can help us develop solutions more efficiently and bring innovations to market faster. Each brings different strengths, resources, and perspectives to the table.

    Universities and government agencies may lead scientific research, while private industry can help turn discoveries into practical applications. Nonprofit organizations can help identify community needs, connect partners, and ensure research addresses real-world challenges.

    From an economic development perspective, these partnerships can attract investment, create jobs, and open doors for new businesses and industries in Nebraska. However, I also believe we must recognize the value of research that doesn't have an immediate economic benefit. Today's research may lay the groundwork for discoveries we cannot yet imagine.

    By encouraging collaboration and supporting both basic and applied research, Nebraska can strengthen its scientific community, accelerate innovation, and create opportunities for future generations."

    KEYWORDS: Collaboration, Discovery, Progress
    
- candidate_first_name: Cindy
  candidate_last_name: Chatt
  state: ne
  race: State Legislature
  district: 16
  party: Non-partisan
  question: ne-q15
  date: 2026-10-15
  response: |
    "I believe the Legislature has a responsibility to balance the state budget, but we also have a responsibility to invest in Nebraska's future. Continued cuts to education, including higher education, come with long-term consequences that we cannot afford to ignore.

    Our universities do more than educate students. They attract talented faculty and researchers, bring grant funding into our state, develop our workforce, and drive innovation. Reducing their funding threatens not only educational opportunities but also our ability to grow Nebraska's economy.

    We need to look carefully at our spending priorities, identify efficiencies where possible, and evaluate the long-term economic impact of our budget decisions. I don't believe across-the-board cuts are the answer. We should also be looking at ways to grow our economy and expand our tax base rather than relying solely on spending reductions.

    As someone who works in economic development, I see education and research as investments in our future. We need a balanced budget, but we also need a vision for growing Nebraska, not simply reducing what we spend."

    KEYWORDS: Education, Commitment, Growth
    
- candidate_first_name: Cindy
  candidate_last_name: Chatt
  state: ne
  race: State Legislature
  district: 16
  party: Non-partisan
  question: ne-q16
  date: 2026-10-15
  response: |
    "I believe science, research, innovation, and STEM workforce development are essential to Nebraska's economic future. As I've emphasized throughout my responses, Nebraska has tremendous strengths in agriculture and medical research that provide opportunities for continued growth.

    Investing in research and developing a skilled workforce helps attract businesses, create jobs, and bring talented individuals and families to our state. These investments also help grow our tax base, generating additional revenue to support the infrastructure, education, healthcare, and services that make our communities stronger.

    I believe we need to look at these investments as part of a larger economic development strategy. We should encourage collaboration between universities, government, and private industry while ensuring that students have opportunities to develop the skills needed for tomorrow's jobs. We also need to create opportunities for those students to stay in Nebraska and build their careers and families here.

    Ultimately, a stronger economy gives us more resources to invest in our communities and improve quality of life. That is how I believe we move Nebraska forward."

    KEYWORDS: Talent, Prosperity, Community
    
- candidate_first_name: Cindy
  candidate_last_name: Chatt
  state: ne
  race: State Legislature
  district: 16
  party: Non-partisan
  question: ne-q17
  date: 2026-10-15
  response: |
    "I believe good public policy should be based on facts and research, and that responsibility doesn't end once legislation is passed. We need to continually evaluate whether policies are achieving their intended outcomes.

    My background in research, analytics, and economic development has taught me the importance of setting measurable goals, tracking results, and being willing to make adjustments along the way. We should look at the data, listen to those directly impacted by a policy, and consider whether we are seeing the results we intended.

    If the evidence shows that a policy is working, we should continue supporting it. If it isn't achieving its goals, is creating unintended consequences, or new research suggests a better approach, we need to be willing to make changes.

    I don't believe changing course should be viewed as a failure. It demonstrates a willingness to learn, adapt, and make better decisions. Ultimately, the goal should be effective policy, not simply defending a decision because it has already been made."

    KEYWORDS: Accountability, Evidence, Adaptability 

