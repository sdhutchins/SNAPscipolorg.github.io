- candidate_first_name: Colby L.
  candidate_last_name: Woodson
  state: ne
  race: State Legislature
  district: 28
  party: Non-partisan
  question: ne-q12
  date: 2026-09-29
  response: |
    "Scientific evidence should meaningfully inform both the development and evaluation of public policy, but it should also be examined critically. I would want to understand which academic discipline is informing the analysis, the methodology behind the findings, the degree of uncertainty involved, and whether funding sources or institutional affiliations could reasonably influence how conclusions are framed. That does not mean dismissing evidence because of who produced it; it means asking enough questions to understand what the evidence actually establishes and where its limits are.

    When scientific evidence must be weighed alongside economic, ethical, and other policy considerations, I would approach that balance pragmatically. Legislators rarely make decisions in circumstances where every consideration points in the same direction. The practical question is often what can realistically be accomplished, improved, or prevented within a legislative session while accounting for the costs, consequences, and competing interests involved. Scientific evidence can help establish what is happening and what the likely effects of different choices may be, but elected policymakers still have to make judgments about priorities, tradeoffs, and what is workable in practice."

    KEYWORDS: Evidence informed, constructively skeptical, implementation minded.
    
- candidate_first_name: Colby L.
  candidate_last_name: Woodson
  state: ne
  race: State Legislature
  district: 28
  party: Non-partisan
  question: ne-q13
  date: 2026-09-29
  response: |
    "My vision is for Nebraska to maintain strong scientific and research capacity while keeping state-supported research attentive to the communities and conditions in which that work is being conducted. The intellectual framing of a research project should not be considered in isolation from Nebraska’s geography, economy, or the material well-being of households and communities that may ultimately be affected by its findings.

    To the extent state funding plays a role, I would prioritize programs that combine strong research with a demonstrated interest in issues that extend beyond academia itself. That does not necessarily mean requiring a public-private partnership or an immediate commercial application. It means valuing research that remains engaged with the broader world around it, whether through agriculture, water, public health, infrastructure, energy, economic conditions, or other areas where scientific work can contribute to the long-term well-being of the state."

    KEYWORDS: Community oriented funding, dialogue based communication, transparent assumptions.
    
- candidate_first_name: Colby L.
  candidate_last_name: Woodson
  state: ne
  race: State Legislature
  district: 28
  party: Non-partisan
  question: ne-q14
  date: 2026-09-29
  response: |
    "Partnerships can be valuable when they bring different kinds of knowledge and capacity to problems with clear relevance to Nebraska communities. State government, universities, industry, and nonprofit organizations each have different perspectives and resources that can strengthen research, particularly in areas such as agriculture, water, public health, energy, infrastructure, and workforce development.

    At the same time, I would not treat formal partnerships as a prerequisite for worthwhile research. The broader goal should be to encourage scientific work that remains engaged with the economic, geographic, and material conditions of the state and creates meaningful connections between research institutions and the communities around them."

    KEYWORDS: Clearly defined problems, locally grounded research, strong research standards.
    
- candidate_first_name: Colby L.
  candidate_last_name: Woodson
  state: ne
  race: State Legislature
  district: 28
  party: Non-partisan
  question: ne-q15
  date: 2026-09-29
  response: |
    "The Legislature has an important role in supporting public higher education, but funding decisions should also reflect the demographic realities facing universities. Nebraska, like much of the country, is confronting smaller youth cohorts over the long term, and higher education institutions need to plan for that change rather than assume that historical staffing and program structures can simply continue indefinitely. Even if state appropriations kept pace with inflation, questions about staffing levels, program demand, and institutional organization would remain legitimate.

    Enrollment should therefore be one factor in evaluating academic programs, but it should not be the sole deciding factor. Programs facing low enrollment should have a fair opportunity to demonstrate their value, adjust their structure, recruit students, or address the underlying reasons for declining participation before elimination is considered. The goal should be thoughtful adaptation rather than indiscriminate cuts.

    I would also distinguish more clearly between research-intensive career paths and programs primarily preparing students for employment outside academia. Nebraska should preserve strong research capacity, particularly where it serves areas of importance to the state, while ensuring that graduates are prepared for the range of careers they are actually likely to enter. Students pursuing research careers should have a clear pathway into advanced academic and research work, while other programs should maintain strong connections to professional and industry opportunities."

    KEYWORDS: Enrollment conscious, career focused, programmatically adaptive

- candidate_first_name: Colby L.
  candidate_last_name: Woodson
  state: ne
