  response: |
    "Energy policy, to me, is really about taking care of people, keeping bills stable, keeping the lights on, and making sure our communities stay strong for the long haul. In my public‑service work, I’ve always leaned on clear evidence and practical decision‑making, and that’s how I look at public power too.

    Research from places like the Department of Energy and the National Renewable Energy Laboratory shows that when utilities modernize their infrastructure, outages drop and efficiency goes up. Studies from the Electric Power Research Institute back this up: a mix of reliable resources, including sustainable ones, makes the grid stronger without driving costs out of reach.

    So my priorities are pretty straightforward. Keep the grid resilient. Invest in upgrades that actually improve reliability. Use data, not trends, to guide resource choices. And make sure we’re supporting the local workforce so the jobs tied to energy stay in our community.

    I’ve always believed public power works best when decisions are transparent, evidence‑based, and centered on the people who pay the bills. That’s the approach I’ve taken throughout my career, and it’s the approach I bring to energy policy.

    Policy making in public power, to me, starts with evidence‑based decision‑making and transparent governance so people can see how and why choices are made. It’s about smart risk mitigation, solid regulatory compliance, and practical long‑term resource planning that keeps the grid reliable. Good policy also leans on load forecasting and asset management to stay ahead of future needs. And because public power is tied directly to community well‑being, it includes workforce development, local economic resilience, ratepayer affordability, and community impact analysis so decisions support both stability and trust."
    
- candidate_first_name: Carol
  candidate_last_name: Blood
  state: ne
  race: Nebraska Public Power District
  district: Omaha Public Power District
  party: Non-partisan
  question: ne-q33
  date: 2026-09-29 
  response: |
    "Energy policy, to me, is about giving ratepayers a reliable grid without locking them into one narrow path. I’ve always believed a broad energy portfolio is the smartest way to keep costs stable and protect the long‑term health of public power. Renewables like wind, solar, hydropower, geothermal, and even emerging biofuels are becoming more affordable and more dependable every year, and the research backs that up — especially from places like the Department of Energy and NREL. At the same time, nuclear remains a steady, zero‑carbon baseload resource, and natural gas still plays a role in meeting peak demand as we transition. My view is simple: no single source can do everything, and ratepayers are better off when we balance proven baseload with cost‑effective green energy.

    The policies I support reflect that balance. I’m for expanding renewables, modernizing the grid so it can handle new technologies, and using evidence‑based planning to decide when and how different resources fit into the mix. I’m also for keeping reliability front and center, because sustainability doesn’t mean much if the power isn’t there when people need it. Public power works best when we stay practical, stay transparent, and keep ratepayers first.

    I look at energy policy through evidence‑based decision‑making, resource diversification, cost‑effective sustainability, resilience planning, and ratepayer affordability so we can build a reliable, modern grid that uses a broad mix of green and traditional resources without losing sight of what people actually need."
    
- candidate_first_name: Carol
  candidate_last_name: Blood
  state: ne
  race: Nebraska Public Power District
  district: Omaha Public Power District
  party: Non-partisan
  question: ne-q34
  date: 2026-09-29 
  response: |
    "When I think about data centers, I start with the same things I always do: keeping the grid reliable, keeping rates fair, and protecting the land and water we all depend on. Nebraska’s energy system is strong, but the demand coming from data centers and other big industries is going to push it hard. I believe OPPD can handle that growth, but only if we plan honestly and use solid evidence to guide every decision. Research from DOE and NREL shows that meeting large new loads takes real investment in transmission, grid modernization, and a diversified energy portfolio, especially cost‑effective green energy.

    And I’ll say this plainly: I’m not interested in socializing the costs while privatizing the benefits. Residential customers shouldn’t be subsidizing massive corporate expansion. If data centers want to be here, they need to pay their fair share for the infrastructure they require and be transparent about their impacts on water, land, and emissions.
    
    My approach is practical ,build resilience, expand clean energy, require fair cost‑sharing, and use scientific evidence to understand the true impacts. Growth can be good, but only if it protects ratepayers and the environment at the same time.

    I look at data‑center growth through evidence‑based decision‑making, resource diversification, grid resilience, environmental impact analysis, and ratepayer affordability so we can meet rising demand without socializing costs or compromising water, land, or long‑term reliability."

- candidate_first_name: Dr. Jeremy
  candidate_last_name: Heneger
  state: ne
  race: State Legislature
  district: 41
  party: Non-partisan
  question: ne-q12
  date: 2026-09-28 
  response: |
    "For me, scientific evidence will be the primary source for making policy decisions. I have spent my career focused on the benefits of educational assessment data for making educational policy decisions. Relying on data and scientific evidence is far more important than relying on gut feelings, which is how many educational decisions were made in the past. Legislation should not be different. Lawmakers must set aside personal feelings and/or beliefs to make the best policy decisions for the public we serve. 

    I would also rely on experts to provide testimony and/or evidence when considering legislation. From outside the Unicameral, I have noticed a distinct disregard among many Senators for scientific evidence and expertise. Legislators cannot be experts in everything and should strongly consider the evidence presented by experts. 

    A Senator’s moral code and/or religious beliefs matter, but that code or those beliefs should be informed by scientific evidence when available. The public good is more important than an individual’s beliefs or code."

    KEYWORDS: Primary Source, Expertise, Public Good
    
- candidate_first_name: Dr. Jeremy
  candidate_last_name: Heneger
  state: ne
  race: State Legislature
  district: 41
  party: Non-partisan
  question: ne-q13
  date: 2026-09-28
  response: |
    "Scientific research often stimulates the economy and provides a significant return on state investments. Budget cuts to the University System and to areas like biomedical research are terrible and short-sighted. These cuts may help balance the budget in the short term, but they hurt the state’s economy in the long run. It is important for Nebraska to be a leader in research and innovation. Leading in these areas helps the economy grow and helps fight brain drain. 

    I don't know much about state programs connected to Nebraska’s science strengths, but I am eager to learn more. I will fully support those programs that allow us to lead. I see these programs as ways to improve society, which is something we should all want and invest in. 

    We should look for other ways to balance the budget instead of cutting scientific research that will benefit the economy in the long run. Raising taxes on the ultra-wealthy or one-time taxes on extreme wealth are better ways to balance the budget than cutting funding for important research and programs."

    KEYWORDS: Investment, Priority, Fight Brain Drain
    
- candidate_first_name: Dr. Jeremy
  candidate_last_name: Heneger
  state: ne
  race: State Legislature
  district: 41
  party: Non-partisan
  question: ne-q14
  date: 2026-09-28
  response: |
    "State government should be eager to partner with universities, industry, and nonprofits to strengthen scientific research. These types of partnerships allow us to accomplish more together than we can alone. Often, these partnerships also multiply impact and benefits. Partnerships offer real potential, and I love finding new solutions to existing problems. One of the best ways to tackle problems is to partner with like-minded groups. 

    I stand ready to partner on legislation that can bolster scientific research. I am eager to engage potential partners and find ways to strengthen Nebraska."

    KEYWORDS: Stand Ready, Partnerships, Potential
    
- candidate_first_name: Dr. Jeremy
  candidate_last_name: Heneger
  state: ne
