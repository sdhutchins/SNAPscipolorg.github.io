    "Farmers and farming have gotten exponentially better over the years at being sustainable, and we should continue to incentivize that trend. The best federal policies for agriculture’s success still remain opening new demand markets: expanding ethanol use, increasing foreign ag trade, and investing in research for new markets for crops here at home. Farmers are innovative, and good federal policies will reward them for the sustainable practices they’re already utilizing. The best land steward is always going to be the farmer themselves, and the government should create policies that recognize those achievements and spur new ones."
    
    KEYWORDS: Land stewardship, conservation, demand

