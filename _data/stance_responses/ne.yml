  party: Non-partisan
  question: ne-q15
  date: 2026-09-28
  response: |
    "I mentioned before that cutting research is a mistake, and we should be finding other ways to balance the state’s budget. Funding our public universities is an investment in our State’s future and our children’s future. 

    Raising taxes on the ultra-wealthy, or imposing one-time taxes on extreme wealth, are better ways to balance the budget than cutting funding for the public university system. 

    The Legislature has an obligation to ensure our public universities are strong and can support the learning and research needed to propel us into the future. Today’s leaders are not future-focused, which is a theme of my campaign. We need leaders who are helping prepare our institutions, education system, and people for a promising future. Right now it feels like the future we were promised will only be available to the ultra-wealthy and the politicians they bought along the way. 

    The promising future should belong to all Nebraskans and all Americans, and I will fight for this reality when in the legislature."

    KEYWORDS: Investment, Future Focused, Promise

