  response: |
    "There is no silver bullet in our current budget crisis, but I do know that we only undermine our future stability and success if we continue to erode our university funding. At the same time, the university system can do a lot more to support the professors and researchers who inspire students and provide opportunities rather than continuing to spend a disproportionate amount of their funding on administration. There is absolutely a balance to be found, and we can get there by recognizing the critical role the university system plays in our long-term success."
    
