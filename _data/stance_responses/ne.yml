  response: |
    "Ideally, policy should only be passed with a known evaluation criterion in mind. Also, the evaluation timeline should be established before enacting the policy. Too often, we pass policies without knowing what measurable metrics we will use to understand the policy's effectiveness, and this is a poor way to run government programs. 

    We should review evidence of policy effectiveness regularly to determine whether the policy needs to be revised. We should also watch for unintended consequences when evaluating policy. 

    I will work to include evaluation criteria and a timeline in legislation. This will help us be on a path of continuous improvement."

