    "Although many of these decisions are made at the federal level, a Regent can play an important role in advocating for the University of Nebraska through our congressional delegation. My experience working in Congress, the Nebraska State Capitol, and the White House has taught me the value of building relationships across all levels of government to address complex challenges. I would bring this collaborative, “whole-of-government” approach to advancing NU’s priorities. I also see opportunities to strengthen these partnerships through state trade missions, connecting the university’s research, talent, and innovation with national and international opportunities."

    KEYWORDS: affordability, fiscal responsibility, experience

- candidate_first_name: Dr. Jeremy 
  candidate_last_name: Hosein
  state: ne
