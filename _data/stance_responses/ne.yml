  response: |
    "Research universities are the engines of economic development, scientific discovery, and workforce readiness. My approach to funding and oversight focuses on fiscal responsibility, structural efficiency, and value-driven advocacy.

    Through these investments, my goal is to drive research excellence, including goals like rejoining the Association of American Universities, while remaining grounded in our land-grant mission. We will target research that solves real-world challenges, such as advancing agricultural technology, expanding healthcare and legal access, among others.  Crucially, we will integrate research with workforce needs through industry partnerships and apprenticeships, ensuring every student is AI-ready and equipped to launch high-value careers that grow our regional economy.  I also hope to deliver a long-term vision for our university, much like Missouri is doing with their proposal for a new nuclear research reactor.  I believe Nebraska could be home to a quantum computer, helping to tackle challenges from 3D protein modeling for drug discovery, cybersecurity with our partnerships at StratCom, and more. We need to dream big to find our next inflection point."

    KEYWORDS: affordability, fiscal responsibility, experience
    
- candidate_first_name: Dr. Jeremy 
  candidate_last_name: Hosein
  state: ne
  race: University Board of Regents
  district: 1
  party: Non-partisan
  question: ne-q19
  date: 2026-10-02
  response: |
    "Modernizing higher education requires breaking down silos between universities, government, industry, and non-profits. The greatest opportunity lies in partnerships that align academic research with regional economic priorities such as agricultural technology, natural resource conservation and management, rural healthcare, and more. 

    By partnering directly with private enterprise and non-profit organizations, we can embed paid apprenticeships and internships directly into degree programs. This reduces the financial burden on students while ensuring they graduate with practical, career-ready skills.

    Furthermore, we should engage philanthropic partners and business leaders to build an “NIL for Academics,” using joint investments to recruit top-tier faculty, student scholars, and world-class researchers. Shared investments in research infrastructure and tech transfer will accelerate commercial startups, keep patents local, and drive regional job growth.

    Finally, state government and non-profit partnerships can expand K-12 STEM outreach, creating clear pathways for young learners into higher education. Together, these cross-sector collaborations ensure public universities deliver measurable value, keep talent in our state, and solve our biggest real-world challenges."

    KEYWORDS: affordability, fiscal responsibility, experience
    
- candidate_first_name: Dr. Jeremy 
  candidate_last_name: Hosein
  state: ne
  race: University Board of Regents
  district: 1
  party: Non-partisan
  question: ne-q24
  date: 2026-10-02 
  response: |
    "I believe the University of Nebraska must be managed with fiscal discipline while recognizing that its mission extends beyond that of a business. As a land-grant institution, NU must meet Nebraska’s critical and strategic needs. I opposed cuts to meteorology, for example, given our state’s exposure to severe weather and reliance on agriculture. To strengthen long-term financial sustainability, we should consolidate administrative leadership, reduce overhead, and break down departmental silos to prioritize collaboration, interdisciplinary learning, educators, researchers, and students. Transparent and shared governance and responsible university executive compensation can build public trust and strengthen state and federal support. Finally, we should leverage private philanthropy to create an “NIL for Academics,” attracting exceptional faculty, researchers, and student scholars to Nebraska. Strengthening the partnership between athletics and academics would allow donors to academics to meaningfully participate in athletic benefits, much like the Vanderbilt model. We cannot allow academics to atrophy while the athletic enterprise thrives. We are one university, and we rise and fall together."

    KEYWORDS: affordability, fiscal responsibility, experience

