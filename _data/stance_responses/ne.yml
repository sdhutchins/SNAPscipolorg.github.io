  response: |
    "Making STEM education more affordable requires practical solutions that reduce student debt while preparing graduates to meet Nebraska’s workforce needs.

    First, we should streamline the transfer of community college credits and recognize relevant industry certifications and technical experience.  This would reduce the cost of education at NU. Additionally, we should lower the cost of online learning with flexible scheduling to attract nontraditional students such as career changers, military veterans, and full-time working parents.  With the enrollment cliff approaching, we need creative thinking and new ideas to expand enrollment and grow the NU brand across the country (and world).  

    As previously mentioned, partnering with Nebraska businesses to expand paid apprenticeships and internships that integrate real-world experience into STEM curricula creates a workforce pipeline and can also reduce the financial burden of students.. 

    My “NIL for Academics" plan would tie philanthropy to attract and retain exceptional students through scholarships.  I believe this could be coupled with expanding loan repayment assistance for graduates who commit to working in Nebraska in critical fields and locations across the state like we do in healthcare."

    KEYWORDS: affordability, fiscal responsibility, experience

- candidate_first_name: Chris
  candidate_last_name: Anderson
  state: ne
  race: State Legislature
  district: 20
  party: Non-partisan
  question: ne-q12
  date: 2026-10-04
  response: |
    "I treat scientific evidence as the starting point for policy, not an afterthought. With 31 years in the Air Force, as an Acquisitions officer, combat aviator, US Central Command Central Asia Analyst, and US Strategic Command Chief of current nuclear operations, I saw decisions with enormous consequences based on tested data, rigorous analysis, and honest accounting of what we did and did not know. Later, as a business development executive every claim I made had to be backed by measurable performance. I would bring that discipline to the Legislature. For any bill, I want to know what problem it solves, what the best peer-reviewed research says about whether the approach works, who produced that research, and how we will measure results afterward. I would rely on the Legislative Fiscal Office, the University of Nebraska, and independent experts in agriculture, water, health, and education, and I would want the evidence behind a bill to be public so Nebraskans can see it for themselves. Where evidence is thin, I favor pilot programs and built-in evaluation.

    Evidence tells us what is true and what is likely to happen. However, it does not tell us what we ought to value. Economic cost, ethics, and the proper role of government are legitimate parts of every decision, and legislators should be open about where the science ends and the value judgment begins. I will not hide a preference behind science, and I will not ignore sound science because the answer is inconvenient. When uncertainty is high, I weigh how reversible a decision is and how severe the downside could be.  At the end of the day, I lean towards caution when the consequences would be irreversible."

    KEYWORDS: Discipline, Patience, Data
    
- candidate_first_name: Chris
  candidate_last_name: Anderson
  state: ne
  race: State Legislature
  district: 20
  party: Non-partisan
  question: ne-q13
  date: 2026-10-04
  response: |
    "Over the next decade I want Nebraska to be known as a state that turns research into results for the people who live here. Our strengths are clear: agriculture and water, biomedical research at UNMC, and national security research through the National Strategic Research Institute, which the University of Nebraska hosts for U.S. Strategic Command. Having served at STRATCOM, I understand what that partnership means for the mission and for Nebraska. Few states have anything like it. I would prioritize state programs that produce measurable, usable evidence for Nebraska decisions, especially groundwater and water quality monitoring and agricultural research that helps producers conserve water and manage nitrogen. I would also ask state agencies and the university what is working before deciding where new dollars go, so funding follows results rather than habit."

    KEYWORDS: Results, Measurable, Listening
    
- candidate_first_name: Chris
  candidate_last_name: Anderson
  state: ne
  race: State Legislature
  district: 20
  party: Non-partisan
  question: ne-q14
  date: 2026-10-04
  response: |
    "Nebraska already shows what works. The University's partnership with STRATCOM, UNMC's research and clinical enterprise, and agricultural extension all connect research to real needs. In 15 years on the industry side of defense technology, I learned that the best partnerships start with a clearly defined problem and a customer who will use the answer. State government should say plainly what it needs solved, whether that is water quality, health data, or workforce shortages. Universities supply the research, industry supplies scale and commercialization, and nonprofits supply reach and community trust. I would pair these partnerships with paid internships and apprenticeships so students gain experience in Nebraska, and I would protect academic independence by requiring that research results be published. I would also connect them to K-12 schools, so students in every part of the state can see a path from the classroom to a research career. I went through public schools myself, and I know how much that early exposure matters."

    KEYWORDS: Nonprofits, Public/Private, Community
    
- candidate_first_name: Chris
  candidate_last_name: Anderson
  state: ne
  race: State Legislature
  district: 20
  party: Non-partisan
  question: ne-q15
  date: 2026-10-04
  response: |
    "The Legislature has a core responsibility to fund the University of Nebraska, which drives the state's research, its health care workforce, and its agricultural science. I am concerned that appropriations have not kept pace with inflation and that departments such as statistics and earth and atmospheric sciences have been eliminated. Those fields underpin crop forecasting, severe weather preparedness, and data-driven policy, and capacity once lost is slow and expensive to rebuild. I would support stable, multi-year funding so the university can plan, paired with accountability: clear measures of research output, workforce results, and efficiency, and close scrutiny of administrative overhead before core academic and research programs. Balancing the state budget requires tradeoffs. I would approach it the way I approached large programs in the Air Force: protect the capabilities the mission depends on, question everything else, and measure the return."

    KEYWORDS: Balance, Accountability, Predictable

