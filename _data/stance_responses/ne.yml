  response: |
    "In my experience working on legislation at the Nebraska Legislature, it is always best to go to the experts when developing, honing, and voting on any piece of legislation. Additionally, I have spent years fighting against legislation that disregards evidence and data in favor of strictly moral considerations such as those policies that seek to limit access to both reproductive healthcare and gender-affirming care."
    
