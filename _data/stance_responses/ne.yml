  question: ne-q14
  date: 2026-10-15
  response: |
    "First and foremost, stop funding cuts to the universities. Rather, we need to promote funding for the whole spectrum of education in our schools and support partnerships across the sectors mentioned so that students can continue to develop their skills in science and we can keep those students here in Nebraska with good opportunities that allow them to utilize their skills and pursue their goals. The state government's job is to help promote those partnerships with funding, not standing in the way of these programs because they don't fit a separate morality-based legislative agenda."
    
