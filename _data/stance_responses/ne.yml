- candidate_first_name: Sara
  candidate_last_name: Kohen
  state: ne
  race: Nebraska Public Power District
  district: Omaha Public Power District
  party: Non-partisan
  question: ne-q32
  date: 2026-10-08 
  response: |
    "I’m running for OPPD’s Board of Directors to provide affordable and reliable electricity and make sure that OPPD puts people first. The right approach balances both immediate and long-term needs so that OPPD can protect the best interests of the people it serves. 

    The cost of living has increased faster than people’s paychecks. Politicians in Washington have enacted policies that have raised the cost of just about everything, squeezing Nebraska families and making it difficult to make ends meet. I’ll work to keep rates as low as possible while protecting reliability and planning for our future.

    As a mom, I care deeply about the world that my kids are growing up in and that they’ll inherit from us. Meeting environmental goals will help protect our community’s long-term health, safety, and economic vitality and reduce risks posed by climate disruption. These risks affect OPPD’s ability to provide affordable and reliable power, such as through storms that take out power lines and extreme heat that strains the electric grid’s capacity. 

    Fortunately, we now have more options than ever for clean, affordable, and reliable electricity. I support a balanced approach that considers all important priorities and looks toward the future."

    KEYWORDS: Affordable, reliable, balanced
    
- candidate_first_name: Sara
  candidate_last_name: Kohen
  state: ne
  race: Nebraska Public Power District
  district: Omaha Public Power District
  party: Non-partisan
  question: ne-q33
  date: 2026-10-08
  response: |
    "Affordability, reliability, speed to build, and health and environmental impacts are all important factors that should be considered when looking at the energy mix. I support adding more affordable, reliable, and clean electricity. We now have more options than ever before to do this. For example, utility-scale solar power is now the cheapest and fastest way to get new energy on the grid. This is important at a time when we’re experiencing enormous growth in demand for electricity, coupled with long delays in the equipment needed to run fossil fuel power plants. Of course we still need baseload power—power that’s available all the time, even when the sun isn’t shining and the wind isn’t blowing. The right mix of power generation balances these needs.

    In an emergency situation, the priority has to be on meeting people’s immediate power needs. In general, though, the right approach is a balanced one that considers all important priorities and looks toward the future. We need to keep an open mind about the mix of power generation, take advantage of advances in technology, and look to form new partnerships to help OPPD be the best possible utility for its customers."

    KEYWORDS: Affordable, reliable, balanced
    
- candidate_first_name: Sara
  candidate_last_name: Kohen
  state: ne
  race: Nebraska Public Power District
  district: Omaha Public Power District
  party: Non-partisan
  question: ne-q34
  date: 2026-10-08
  response: |
    "Data centers can use enormous amounts of electricity and other resources.  I will work to increase transparency and accountability and protect regular Nebraskans. The first step is to make sure that OPPD is transparent about how much electricity data centers are using and how the cost of providing this electricity is allocated. I will demand that data center companies pay their fair share and not cause rates to go up for other customers. I also will work within OPPD and with partners in state and local governments to push for a comprehensive approach that protects households and small businesses from potential negative effects related to electricity demand, utility bills, water usage, public health, noise and air pollution, and more."

    KEYWORDS: Transparency, accountability, fairness

