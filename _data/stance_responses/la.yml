  question: la-q6
  response: |
    Louisiana should put its energy experience to work developing more ways to deliver affordable, reliable power. Solar, wind, and other renewables deserve a fair opportunity where they make economic and practical sense. My test is straightforward: Will it lower costs, keep the lights on, create good jobs, and protect the community? As your senator, I will support research, workforce training, and investment in a stronger electric grid. I would also support energy efficiency and weatherization programs that help families reduce their bills. New power generation needs to be planned alongside transmission, storage, and reliable service during extreme weather. Farmers and other landowners deserve fair contracts and clear information before agreeing to energy projects. Communities deserve meaningful input, environmental protections, and enforceable plans for cleanup when facilities close. Louisiana workers have helped power this country for generations. They should have opportunities to build its energy future, with affordable electricity for the families and businesses here at home.
