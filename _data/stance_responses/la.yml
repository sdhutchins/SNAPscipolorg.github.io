    As a farmer, I understand that technology can make us more productive and create new opportunities. But we have to ask a basic question: who benefits, and who pays?
    Data centers require enormous amounts of electricity and water. And its families, small businesses, and farmers should not get stuck paying for a technology company’s power plants, transmission lines, or water infrastructure. As your senator, I will fight for public disclosure of water and energy use, independent environmental review, and requirements that developers pay the full cost of serving their facilities. I am firmly against secret deals or nondisclosure agreements that keep residents in the dark about decisions affecting their communities. We should also prepare Louisiana workers for construction and permanent jobs, while protecting workers whose livelihoods are threatened by automation. Before approving public incentives, communities deserve honest numbers about permanent jobs, public costs, and environmental impacts. Economic development should improve life for the people who live here.

