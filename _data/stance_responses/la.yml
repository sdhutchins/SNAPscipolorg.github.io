  response: |
    I see renewable energy playing an important role in Louisiana’s future, especially if we make decisions around what families can afford. People need reliable electricity and a monthly bill they can manage. Louisiana has the opportunity to build a more diverse energy economy that includes solar, wind, and other technologies where they make practical and financial sense. Each project should be evaluated honestly, including the cost of transmission, storage, and maintenance. Families deserve clear evidence of how an investment will affect their bills. In Congress, I would support investment in clean energy, a stronger electric grid, and energy storage. I would also support weatherization and efficiency programs that help families lower their energy use. Better insulation and more efficient heating and cooling can make a real difference, particularly for people living in older homes. Renters and lower-income households need access to those savings, too. These investments should create opportunities for Louisiana workers. Our energy workforce has valuable experience, and I would support paid training and apprenticeships that help workers move into new roles without leaving their communities or taking on unaffordable debt. Development also has to respect landowners and the people living nearby. Communities deserve meaningful input, clear environmental protections, and accountability for any public money invested. I want Louisiana to remain an energy leader while giving families more affordable options. That means supporting projects that can demonstrate lasting savings, reliable service, good-paying jobs, and cleaner air and water.

