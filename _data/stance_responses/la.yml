  response: |
    Protecting Louisiana’s coast means protecting people’s homes, livelihoods, and history. It also means protecting fisheries, ports, and infrastructure that the whole country depends on. As your senator, I would fight for dependable federal funding for coastal restoration and hurricane protection. We need a combination of restored marshes and barrier islands, sediment diversion, shoreline protection, stronger levees, and better drainage. We also need to fund mitigation - elevating homes and protecting roads, drinking water systems, and other essential infrastructure. Projects should follow the best available science, with clear public accounting of their costs, benefits, and results. Fishers, coastal residents, and Tribal communities deserve a seat at the table before decisions are made, along with honest answers about how projects could affect their livelihoods. I will support key levee projects such as well to protect our coastal communities.

- candidate_first_name: Jamie
  candidate_last_name: Davis
