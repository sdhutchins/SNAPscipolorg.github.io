    Energy costs are squeezing families, and we should be using every affordable source, including the ones in our own backyard. A 2015 LSU study found real potential for geothermal energy in Union Parish, particularly from hot fluids already being produced from existing oil and gas wells. Projects like that stall for lack of funding and infrastructure. I’d push for federal investment in them, and for job training and direct support so oil and gas field workers can move into the new energy jobs without losing their livelihoods. Louisiana’s power is still mostly natural gas, and a more diverse mix keeps costs steadier.

- candidate_first_name: Jamie
  candidate_last_name: Davis
