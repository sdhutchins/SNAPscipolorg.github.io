  response: |
    Our waterways feed our farms, our economy and our families, and we need to be able to trust them. As water warms, storms get heavier, bacteria and harmful algae become more of a threat, or new pollutants including PFAS affect more of the water here in Louisiana we need to take proactive steps to protect our environment. I’d fight for federal funding for regular testing, and for clear warning signs on lakes and waterways when there’s a risk. Too many Louisiana families have already lost loved ones, including a child, to water-borne illness. I’d also push for infrastructure funding so levees, drainage and water systems in our communities are maintained before disaster hits, not after.

