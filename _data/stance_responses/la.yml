    Public trust in science is built when funding decisions are made on merit and not politics. I’d work with researchers, including the ones at our universities and extension programs, and I’d invite them to testify and brief Congress directly. I would support putting a merit-based grant review process into federal law, so funding follows the quality of the research and its benefit to the public. If funding becomes unpredictable, we risk driving a generation of scientists and their work out of this country. 

