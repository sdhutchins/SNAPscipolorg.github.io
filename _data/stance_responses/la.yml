  question: la-q1
  response: |
    Data centers can bring investment, construction jobs, and long-term economic opportunities to Louisiana, but they also create concerns about electricity demand, water usage, infrastructure, and environmental impacts. We need responsible development, transparency, and strong oversight to ensure communities benefit economically while protecting Louisiana’s natural resources and quality of life.

- candidate_first_name: Priscilla
  candidate_last_name: Gonzalez
  state: la
  race: US House of Representatives 
  district: 3
  party: Democratic 
  question: la-q2
  response: |
    Louisiana’s coast is our first line of defense against hurricanes, and protecting it must remain a federal, state, and local priority. I support fully funding proven coastal restoration, rebuilding wetlands and barrier islands, using sediment wisely, strengthening levees, and expanding natural buffers. We also need resilient infrastructure and assistance for communities facing repeated flooding. Louisiana’s Coastal Master Plan provides a science-based framework, and current plans include marsh creation, dredging, barrier-island restoration, and flood-risk reduction. ([coastal.la.gov][1]) As a leader, I would fight for federal resources, accountability, and timely completion of these projects because protecting our coast means protecting our homes, livelihoods, culture, and economy.

- candidate_first_name: Priscilla
  candidate_last_name: Gonzalez
  state: la
  race: US House of Representatives 
  district: 3
  party: Democratic 
  question: la-q3
  response: |
    Louisiana’s rivers, lakes, bayous, and wetlands are essential to our economy, our environment, and our way of life. If elected to Congress, I will work to protect and restore these vital waterways by supporting funding for water-quality monitoring, wastewater and drinking-water infrastructure, wetland restoration, and stronger enforcement against pollution. I will also work with federal, state, and local officials to address aging water systems and ensure communities have access to safe, reliable drinking water. We must hold polluters accountable while supporting the industries and communities that depend on Louisiana’s waterways. I will advocate for federal resources for coastal restoration, flood protection, and projects that improve water quality, while making sure taxpayer dollars are used responsibly and transparently. Protecting Louisiana’s water is not a partisan issue—it is about protecting our families, our economy, our wildlife, and future generations.

- candidate_first_name: Priscilla
  candidate_last_name: Gonzalez
  state: la
  race: US House of Representatives 
  district: 3
  party: Democratic 
  question: la-q4
  response: |
    Yes. Elected officials have an important role in helping the public understand and trust credible scientific information, especially when decisions affect public health, the environment, infrastructure, and our economy. That role is not to tell scientists what conclusions to reach, but to make sure scientific expertise is heard and communicated honestly. If elected, I would work with scientists, universities, public-health experts, engineers, environmental researchers, and other qualified professionals when developing policy. I would support public forums and accessible explanations of scientific findings so constituents can ask questions and understand how evidence is being used in government decisions. I also believe transparency is essential: we should distinguish established facts from areas where scientists are still studying the evidence, acknowledge uncertainty when it exists, and correct misinformation with facts rather than politics. My goal would be to make science a resource for better decision-making while respecting the public’s right to ask questions and expect accountability from their elected officials.

- candidate_first_name: Priscilla
  candidate_last_name: Gonzalez
  state: la
  race: US House of Representatives 
  district: 3
  party: Democratic 
  question: la-q5
  response: |
    Community-based institutions such as K–12 schools and community colleges can play a critical role in strengthening science, research, and innovation across Louisiana. If elected to Congress, I would support policies that give students greater access to hands-on science education, technology, laboratories, and career and technical training, regardless of where they live or their family’s income. I would support increased federal investment in STEM programs, modern laboratory and technology infrastructure, teacher training, and partnerships between schools, community colleges, universities, local businesses, and research institutions. Community colleges can also provide affordable pathways into high-demand fields such as engineering, healthcare, environmental science, energy, cybersecurity, and advanced manufacturing. Louisiana’s students should not have to leave their communities to find opportunity. By strengthening our schools and community colleges, we can prepare students for good-paying careers, support local research and innovation, and build a stronger workforce for the future.

- candidate_first_name: Priscilla
  candidate_last_name: Gonzalez
  state: la
  race: US House of Representatives 
  district: 3
  party: Democratic 
  question: la-q6
  response: |
    Alternative energy should be part of Louisiana’s energy future, alongside the oil and natural gas industries that remain important to our state’s economy. My priority would be making sure families and businesses have access to reliable, affordable energy while supporting innovation and protecting Louisiana’s workers and communities. If elected to Congress, I would support responsible investment in solar, wind, energy efficiency, battery storage, and other technologies that can expand Louisiana’s energy options. I would also support research and workforce development that allows Louisiana workers to participate in emerging energy industries rather than having opportunities created elsewhere. Louisiana has an opportunity to use its natural resources, existing energy expertise, and skilled workforce to compete in a changing energy economy. Federal policy should encourage innovation, maintain reliability, protect consumers from unnecessary cost increases, and ensure that South Louisiana communities and workers share in the economic benefits of new energy development.

- candidate_first_name: Lindsay
  candidate_last_name: Garcia
  state: la
  race: US House of Representatives 
  district: 6
  party: Democratic 
  question: la-q1
  response: |
    I’m skeptical of the push to build more data centers in Louisiana. A multibillion-dollar announcement doesn’t answer the questions families deserve answers to: How many permanent jobs will local residents actually get? What happens to their electricity bills? And what will these facilities mean for their water, land, and health? Construction jobs can bring meaningful income, but we have to look at what remains once construction ends. We also have to weigh any economic benefits against public subsidies and the cost of expanding power, water, and other infrastructure. Working families should never be left carrying the financial risk for some of the wealthiest companies in the world. I’m especially concerned about the demand for electricity, potential water use, and pollution associated with additional power generation. Louisiana communities deserve clean air, safe drinking water, and reliable, affordable utilities. Residents need independent assessments, full transparency, and a meaningful say before projects move forward. There are privacy concerns, too. As companies expand their ability to store and process information, people deserve clear protections over how their personal data is collected, used, and shared, along with accountability when those protections are violated. Nationally, data centers support AI and other digital services, but that growth raises serious questions about who benefits and who bears the costs. Greater corporate investment doesn’t automatically translate into better livelihoods, particularly when the technologies being developed can also displace workers.

- candidate_first_name: Lindsay
  candidate_last_name: Garcia
  state: la
  race: US House of Representatives 
  district: 6
  party: Democratic 
  question: la-q2
  response: |
    Protecting Louisiana’s coast means protecting people’s homes, livelihoods, and ability to stay in the communities they love. Families shouldn’t have to wonder whether the next hurricane will take everything they’ve worked for. I would fight for sustained federal funding to restore wetlands, rebuild barrier islands, and strengthen the natural buffers that help protect coastal communities. That work needs to go hand in hand with maintaining levees, improving drainage, and investing in flood protection. We need to fund maintenance for the long term, too. Restoration decisions should be guided by science and shaped by the people who live and work along the coast. Fishermen, tribal communities, local residents, and small-business owners deserve a meaningful voice from the beginning. Projects need careful review of their effects on fisheries, salinity, and local livelihoods, with public monitoring and adjustments when necessary. I would also support funding to elevate homes, strengthen public infrastructure, improve evacuation routes, and keep flood insurance affordable. Lower-income families and smaller communities need help accessing those resources before disaster strikes. For residents facing repeated flooding who want to relocate, voluntary buyouts should provide fair compensation and practical help finding a safe place to live. People deserve choices that respect their finances, family ties, and community history. In Congress, I would push for reliable coastal funding and clear accountability for how that money is spent. Every year we delay leaves families exposed and makes the work ahead more difficult.

- candidate_first_name: Lindsay
  candidate_last_name: Garcia
  state: la
  race: US House of Representatives 
  district: 6
  party: Democratic 
  question: la-q3
  response: |
    Clean water is a basic responsibility of government. In Louisiana, the health of our rivers and lakes affects what comes out of our faucets, whether our fishing businesses survive, and whether families can safely enjoy the places they grew up visiting. In Congress, I would fight for federal investment to repair aging drinking water and wastewater systems, especially in rural and underserved communities. Small towns often know what needs fixing but lack the funding and staff to get it done. They need help accessing resources before a system fails. I would also support strong enforcement of clean water protections and hold polluters accountable for cleaning up the damage they cause. Residents deserve accessible, independent water testing, public results, and timely notification when contamination is found. A family should never have to find out about a water problem through a neighbor’s Facebook post. Protecting our waterways also means addressing what washes into them. I would support restoring wetlands and streamside vegetation, improving stormwater management, and helping farmers adopt practices that reduce fertilizer runoff and soil erosion. Those efforts should include financial and technical assistance so farmers can protect the water while keeping their operations viable. For major industrial and energy projects, I would push for transparent review of their effects on water supplies, including the combined impact of facilities operating near the same communities. But reviewing the risks is only part of the responsibility. I support strengthening the EPA’s funding, staffing, and enforcement authority so it can investigate violations, enforce protections, and hold polluters accountable. Companies responsible for contamination should pay for the cleanup and measures needed to protect affected communities, with ongoing monitoring to ensure the damage is actually addressed. Those costs should never be left to residents and taxpayers. Residents, fishermen, and tribal communities deserve a meaningful voice in these decisions and clear answers when their water is threatened. Short-term economic gains cannot justify lasting harm to people’s health, livelihoods, and drinking water. Louisiana’s waterways sustain families and entire local economies. Protecting them has to be an everyday commitment, backed by funding, oversight, and action when something goes wrong.

- candidate_first_name: Lindsay
  candidate_last_name: Garcia
  state: la
  race: US House of Representatives 
  district: 6
  party: Democratic 
  question: la-q4
  response: |
    Yes. Elected officials have a responsibility to seek out credible scientific evidence, understand it, and explain how it informs our decisions. That also means being honest about what we don’t know and being willing to change course when the evidence changes. As an educator, I know people need room to ask questions without being dismissed. Trust grows when experts explain their work in plain language, listen to people’s concerns, and acknowledge uncertainty. Officials undermine that trust when they cherry-pick findings to defend a decision they’ve already made. In Congress, I would seek input from researchers at Louisiana’s universities, public health professionals, coastal scientists, and other relevant experts when developing legislation and reviewing major projects. I would also bring scientists into community conversations so residents can ask questions directly about issues affecting their water, health, property, and livelihoods. Scientific expertise and local knowledge both matter. A fisherman who has watched a waterway change over decades or a neighborhood reporting recurring flooding deserves to be heard. Those observations can help researchers identify questions that need closer study. I would push for publicly funded research to be accessible and for funding sources and potential conflicts of interest to be disclosed. People should be able to see the evidence behind a recommendation and understand why I made a particular decision. My job would be to weigh that evidence carefully, explain the tradeoffs, and remain accountable to the people affected.

- candidate_first_name: Lindsay
  candidate_last_name: Garcia
  state: la
  race: US House of Representatives 
  district: 6
  party: Democratic 
  question: la-q5
  response: |
    As a former educator, I see schools and community colleges as essential to building Louisiana’s scientific talent. A child’s opportunity to explore science shouldn’t depend on their ZIP code or whether their school can afford lab equipment. K–12 schools give students the foundation to ask questions, evaluate evidence, and understand the world around them. Teachers need the time, resources, and support to make that learning meaningful. In Congress, I would support federal investment in science labs, reliable broadband, classroom materials, and professional development, along with teacher recruitment and retention in communities struggling to fill positions. I would also support partnerships that connect schools with Louisiana’s universities, community colleges, and scientists. Students could investigate local water quality, study flooding, or learn how coastal restoration works. Seeing science applied to something happening in their own neighborhood can make a career in research feel within reach. Community colleges are especially important because they serve recent graduates, working parents, and adults preparing for a new career. They can train the laboratory technicians, healthcare workers, and environmental monitoring specialists who help turn research into practical work. I would support affordable tuition, modern equipment, paid internships, and clear transfer pathways into four-year science and engineering programs. Those opportunities need to be accessible to students who can’t afford to work for free or travel far from home. Partnerships with employers should lead to recognized credentials and good-paying jobs, with skills that remain useful as industries change. Too many of our young people feel they have to leave Louisiana to build a future. I want us to give them reasons to stay: a strong education, good-paying jobs, and opportunities to build a life in the communities they call home.

- candidate_first_name: Lindsay
  candidate_last_name: Garcia
  state: la
