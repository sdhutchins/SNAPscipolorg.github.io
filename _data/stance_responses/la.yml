    Louisiana has lost roughly 2,000 square miles of land since the 1930s, and that leaves our families and property more exposed to every hurricane. Louisiana already has a 50-year Coastal Master Plan, and the 2029 update is being developed now. The problem is funding and follow-through. In Congress I would fight to fully fund and speed up the plan’s projects, increase restoration grants, and coordinate with the federal agencies that have to approve and build much of this work. Protecting the coast protects homes, fishing, working families and our national energy infrastructure. 

