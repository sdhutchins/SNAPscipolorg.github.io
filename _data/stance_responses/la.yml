  question: la-q5
  response: |
    A child should be able to grow up in Louisiana, get a strong education, and find meaningful work here. Our public schools and community colleges are essential to making that possible. I would support federal funding for well-equipped science classrooms, hands-on learning, and training that helps teachers bring research into their lessons. Students should have opportunities to study the science around them, from agriculture and water quality to coastal restoration and energy. Community colleges can connect that learning to good-paying careers through affordable credentials, apprenticeships, and partnerships with universities and local employers. I would support Pell Grants, paid training opportunities, and programs that help working adults gain new skills. We should also expand access to research experiences for rural students and students from families who cannot afford unpaid internships. Louisiana needs scientists and engineers. We also need skilled technicians, electricians, water system operators, and other workers who put scientific knowledge to use every day.

- candidate_first_name: Jamie
  candidate_last_name: Davis
  state: la
  race: US Senate 
