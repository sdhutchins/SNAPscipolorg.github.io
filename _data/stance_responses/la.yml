    These schools are where our next scientists, farmers and technicians start. I’d increase federal grants and subsidies for science, technology and career programs at rural and low-income schools, and I support tripling Title I funding for low-income and rural schools. None of it works without enough teachers, and Louisiana has a teacher shortage. Raising teacher pay has to be part of the plan, because students who want to learn need someone in the classroom to teach them. 

