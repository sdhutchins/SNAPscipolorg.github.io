  response: |
    I support finding alternative sources of clean energy including wind, solar, hydroelectric, and geothermal to help with affordability and sustainability. For decades, we have relied on fossil fuel industries and not actively shifting more into renewable sources of energy that will help provide a path to sustainability. We should make investments in offshore wind and other diversified energy development in the Gulf, so that Louisiana’s coastal funding is not permanently tied to a single, finite industry. I believe we need to commit to a variety of safe options for renewable and resistant energy sources with job retraining and skill programs as well as support those working in local commercial fishing and seafood industries by making investments in energy efficient technology to help them do their jobs well and safely. 

