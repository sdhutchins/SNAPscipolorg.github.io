    Data centers can bring jobs and tax revenue, but right now communities carry the risk while the companies make the decisions. With more than 20 already in Louisiana and many more on the way, we shouldn’t be learning the costs after the buildings go up. I support creating new federal standards for how data centers development should be conducted. Communities should get advanced notice into how the lives of their friends and family will be changed. The companies should report their water and energy use publicly. Independent, nonpartisan studies, not studies paid for by the industry, should examine the impact on local water and on electric bills before approval. Congress also has to make sure families aren’t stuck paying higher utility costs to power someone else’s server farm. I fully support economic growth but too often I have seen firsthand how the people of this district have been left behind after companies leave.

