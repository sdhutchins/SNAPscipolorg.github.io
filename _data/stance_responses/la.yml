  question: la-q3
  response: |
    On a farm, you learn quickly that water connects everything. What happens upstream matters to the family drinking water downstream and the fisherman making a living along the coast. I would fight for federal investment to repair aging drinking water and wastewater systems, just as I did in the town of St. Joseph, especially in rural communities that cannot afford those projects alone. I would also support consistent enforcement of clean water protections. Companies should be responsible for the pollution they cause, and residents should have access to timely, understandable water testing results. I also support voluntary conservation programs that help pay for cover crops, vegetated buffers, and better fertilizer management. Those practices should be developed with farmers and agricultural researchers so they work on the ground. I would also work with other states to reduce pollution moving down the Mississippi River. Louisiana cannot solve an entire watershed’s problems by itself.

