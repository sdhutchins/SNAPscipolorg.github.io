  district: 1
  party: Democratic 
  question: la-q5
  response: |
    Community-based institutions like K-12 schools, community colleges, and non-profit organizations in the congressional district and state are vitally important to strengthening science and research. Building interest in science and research begins in our classrooms at the primary and secondary level and through hands-on learning opportunities and field programs because these are the spaces that allow young individuals to ask questions and develop passion and curiosity. I believe it is important that addressing needs for jobs in the energy, climate, health, and technology sectors comes from building a foundation within our educational spaces. After 17 years in Louisiana classrooms, I've seen what happens when students get hands-on, inquiry-driven science. It can allow them to further engage and believe they belong in those fields.  I have also seen how often students with disabilities, English language learners, and students in under-resourced schools are left out of that opportunity. Policy-wise, I support federal funding for STEM programs and science pipelines that work for all kids with a universal design for learning approach. We also need funding that helps pay for things like science materials, labs, and strong science teacher training and professional learning. I also would advocate for funding and support for partnerships between local colleges or universities and employers in science-related fields. 

