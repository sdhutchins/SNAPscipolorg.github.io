   Renewables should be the backbone of Nevada's energy future, not a side project. We have some of the best solar in the world, and every megawatt we generate here is money that stays here instead of going to out of state gas markets. 
   I would support pairing solar with battery storage so it works after sundown, faster permitting for projects on already disturbed land, and expanding community solar so renters and people who cannot put panels on a roof can still benefit. Rooftop solar customers should get fair credit for the power they send back, and I would oppose any effort to weaken net metering. Affordability has to be the test for every policy. That means holding NV Energy accountable when it asks for rate increases, protecting low income customers, and making sure the cost of new generation for big industrial users lands on those users and not on households. 
    Keywords: solar and storage, net metering, affordability

