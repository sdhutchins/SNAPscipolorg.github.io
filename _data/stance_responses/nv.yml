   Data centers are welcome in Nevada, but not on the current terms. A trillion dollar industry does not need giveaways from a state that cannot fully fund its schools. I would require every proposed data center to submit independent, verifiable projections of its water and electricity use before permitting, with penalties if actual use blows past them. 
   Companies should be required to be water neutral through recycling and offsets, and they should pay the full cost of the new generation and transmission they need so residents are not subsidizing them on their power bills. 
   I would end or tightly condition tax abatements and direct that revenue toward education. Planning should be regional, not project by project, so the state sees the cumulative demand instead of being surprised by it. If a company meets those conditions, it brings good jobs and investment. If it cannot, it should build somewhere else.
    Keywords: accountability, water neutral, no giveaways

