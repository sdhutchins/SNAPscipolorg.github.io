   Extreme heat kills more Nevadans than any other weather event, and the people it kills usually have the fewest options. I would support an enforceable state heat standard for outdoor and indoor workers with rest, shade, and water requirements, and real penalties for employers who ignore it. 
   I would fund cooling centers with extended hours and transportation to reach them, and stop utility shutoffs during extreme heat so seniors and families are not sitting in 115 degree homes over a late bill. 
   I would invest in tree canopy and cool pavement in the neighborhoods with the least shade, which are almost always the lowest income ones. Schools need working air conditioning and heat plans for recess and sports. And the state should track heat related deaths and hospitalizations the way we track any other public health threat, so we can see whether what we are doing is working.
    Keywords: worker protections, cooling access, public health

