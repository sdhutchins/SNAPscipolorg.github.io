   My mom was a public school teacher, so I know what it looks like when a classroom is asked to do more with less. The numbers tell us Nevada kids are not getting the science education they deserve, and the fix starts with the adults in the room. I would support competitive pay and retention bonuses for STEM teachers in hard to staff schools, paid residency and mentoring programs so new science teachers stay past year three, and alternative licensure pathways for working scientists and engineers who want to teach. 
   I would fund hands on lab time and updated materials so science is something students do, not just read about. And I would push to fund K-12 at the national average and require that new revenue, including from industries getting tax breaks, actually reaches classrooms and teacher paychecks. 
   We should measure what works, keep what works, and stop funding what does not. 
    Keywords: teacher pay, STEM pipeline, classroom funding

- candidate_first_name: Ryan
  candidate_last_name: Hampton
  state: nv
  race: State Assembly
  party: Democratic
  question: nv-q2
  date: 2026-09-11
  primary_candidate: false
  response: | 
   Water decides whether Southern Nevada has a future. I follow the science, and the science says we are pulling more groundwater than nature puts back in too many basins. 
   I would support requiring current hydrological data for any new large withdrawal, closing over appropriated basins to new permits, and fully funding the State Engineer and groundwater monitoring so we actually know what is in the ground. I would keep investing in what has worked in Las Vegas, which is conservation, turf removal, and recycling nearly all of our indoor water. 
   On balancing demands, I start from a simple rule. Families and public health come first, and any industry that wants Nevada's water has to show it can be water neutral or close to it. Agriculture deserves a fair transition with voluntary buyouts and support for less water intensive crops, not a cliff. 
   And the Colorado River negotiations are not over, so Nevada has to keep leading from a position of responsible use. 
    Keywords: groundwater, conservation, water neutral

