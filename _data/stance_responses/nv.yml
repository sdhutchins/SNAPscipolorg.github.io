    I would support evidence-based policies that strengthen science instruction while holding schools and the district accountable for outcomes. First, we should ensure teachers have access to high-quality, standards-aligned STEM curriculum, laboratory equipment, hands-on learning, and meaningful professional development. Research from national assessments indicates that higher-performing students are more likely to have access to adequate science resources. 
