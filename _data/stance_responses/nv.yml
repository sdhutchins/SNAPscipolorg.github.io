    "Paul Casey — JD Candidate for CCSD Trustee District G
    Nevada’s extreme heat is a serious safety issue, particularly for children, seniors, low-income families, and people who work outdoors. As a CCSD Trustee, my responsibility would be to focus on what we can control: protecting students and employees on school campuses while using taxpayer resources responsibly.

    CCSD already has heat-safety procedures requiring access to water and shade, monitoring students for heat stress, and limiting strenuous outdoor activities during the hottest parts of the day. I would support strengthening those practices where necessary, including adequate hydration, shaded play and waiting areas, well-maintained air conditioning, and clear protocols for modifying or postponing outdoor activities during dangerous conditions.

    I would also support prioritizing shade structures, trees, reflective roofing, and other practical improvements when schools are constructed or renovated. These investments can improve student safety while potentially reducing long-term cooling costs. 

    For vulnerable families, schools can also serve as trusted points of education and communication about heat safety and available community resources.

    My approach is practical: protect our children, support our employees, maintain safe facilities, and spend taxpayer dollars on solutions that produce measurable results—not politics."
    Keywords: Protection, solutions, cost effevtive

