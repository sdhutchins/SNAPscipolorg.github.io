   Nevada has always been a mining state, and lithium gives us a real chance to lead the clean energy economy instead of watching it happen somewhere else. But we have seen what happens when extraction comes first and the science comes later, and the communities left holding the bill are usually rural and tribal. I would support requiring independent environmental and hydrological assessments before permits are issued, not after, with real weight given to those findings. 
   Companies should post full reclamation bonds up front, meet water limits based on the actual basin, and consult meaningfully with affected tribes and communities. I would also support updating Nevada's royalty and tax structure so the state gets a fair return on resources that belong to all of us. Science should not be a box to check. It should decide where mining happens, how much water it can use, and what the company owes when it leaves. 
    Keywords: independent assessments, reclamation, fair return

