    "Nevada’s mineral resources, particularly lithium, are an important economic asset and give our state a unique role in America’s energy and technology supply chains. I support developing these resources responsibly while protecting the water, ecosystems, and communities that make that development possible.

    We should strengthen Nevada’s “Lithium Loop” by investing not only in extraction, but also battery manufacturing and recycling. Recovering lithium and other valuable materials from used batteries can reduce waste, extend the value of finite mineral resources, and create additional Nevada jobs.

    Because Nevada is the nation’s driest state, water use must be central to mining decisions. I support encouraging lower-water extraction and processing technologies, including direct lithium extraction where scientifically and geologically appropriate, alongside water recycling and conservation.

