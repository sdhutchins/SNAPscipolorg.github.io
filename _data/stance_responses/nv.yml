    "Paul Casey — JD Candidate for CCSD Trustee District G
    Nevada should pursue a balanced energy strategy that welcomes renewable energy while keeping electricity reliable, affordable, and accessible. 

    Solar is a natural opportunity for Nevada, given our abundant sunshine, but I do not believe we should put all of our energy future into one source. We should encourage a diverse energy portfolio, including solar, geothermal, energy storage, and other reliable generation technologies.

    Policies should encourage private investment and innovation rather than unnecessarily increasing costs for taxpayers and ratepayers. Any renewable-energy policy should be evaluated based on reliability, affordability, long-term costs, and measurable benefits.

    I also believe Nevadans who invest their own money in rooftop solar should be treated fairly. Nevada’s existing net-metering system allows customers to receive credits for excess electricity returned to the grid. 

    I support a transparent system that fairly compensates customer-generated power while also ensuring that customers who do not have solar are not unfairly burdened with costs they did not create.

    As a CCSD Trustee, my direct responsibility is education, not statewide energy regulation. However, I would support energy-efficiency improvements in CCSD facilities where they make financial sense, including efficient HVAC systems, lighting, and potentially solar and battery storage where the numbers demonstrate a responsible return on investment.

    My principle is simple: embrace innovation, protect affordability, maintain reliability, and make decisions based on results—not ideology." 

    Keywords: Innovation,  affordability, results reliability

