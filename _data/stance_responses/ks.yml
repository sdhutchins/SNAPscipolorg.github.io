- candidate_first_name: Katy
  candidate_last_name: Tyndell
  state: ks
  race: US House of Representatives
  district: 4
  party: Democratic
  question: ks-q1
  date:
  response: |
    "Facts matter. When I’m making a decision, I want to hear from the scientists and experts who understand the issue, but I also want to hear from the Kansans who will live with the consequences of that decision. At the same time, elected officials have a responsibility to consider the economic impact of policies, ethical questions, and the real-world experiences of the people they represent.
    
    Scientific evidence should help us understand the problem and the consequences of the choices in front of us. Then it is our job as policymakers to make decisions that protect people, strengthen our economy, and make sense for the communities we represent. I also believe we need to restore trust in public institutions by communicating honestly, acknowledging uncertainty when it exists, and refusing to politicize scientific evidence. My approach will be grounded in facts, accountability, and common sense."

    KEYWORDS: Evidence-Based Policy; Scientific Expertise; Transparency; Accountability; Public Trust; Economic Impact; Practical Solutions

- candidate_first_name: Katy
  candidate_last_name: Tyndell
  state: ks
  race: US House of Representatives
  district: 4
  party: Democratic
  question: ks-q2
  date:
  response: |
    "I strongly support sustained federal investment in scientific research through agencies such as the NIH and NSF. These investments support research at Kansas universities, hospitals, and institutions while helping our country remain competitive in medicine, agriculture, engineering, aviation, energy, and emerging technologies.
    
    These dollars don’t just stay in a laboratory. They support Kansas jobs, help our universities compete for talented researchers and students, and turn new discoveries into businesses, products, and technologies. I want more of that investment coming to Kansas. Kansas should be competing for more of these opportunities, not fewer.
    
    I would oppose arbitrary cuts or political interference that undermine peer-reviewed research. At the same time, taxpayers deserve accountability, transparency, and confidence that federal research dollars are being administered responsibly. We can be responsible stewards of public funds while continuing to invest in the discoveries that improve lives and strengthen America's long-term economic competitiveness."

    KEYWORDS: Research Funding; Higher Education; Innovation; Economic Competitiveness; Kansas Universities; Accountability

- candidate_first_name: Katy
  candidate_last_name: Tyndell
  state: ks
  race: US House of Representatives
  district: 4
  party: Democratic
  question: ks-q3
  date:
  response: |
    "Science, research, and innovation should be central to Kansas's economic future. We already have tremendous strengths in aviation and advanced manufacturing, agriculture and bioscience, health care, energy, and engineering. Investing in research and innovation can help those industries grow while creating new opportunities for Kansas workers and entrepreneurs.
    
    That means connecting universities, community and technical colleges, employers, researchers, and workforce programs so Kansans can develop the skills needed for emerging jobs. It also means investing responsibly in infrastructure—from broadband and transportation to energy and water systems—that allows businesses and communities to compete.
    
    When we use taxpayer dollars to support economic development, Kansans should be able to see the return: good jobs, stronger communities, a broader tax base, and infrastructure that serves more than one company or project. Innovation should help Kansas compete while making it more affordable and attractive for people to build their lives here."

    KEYWORDS: Innovation; Workforce Development; Advanced Manufacturing; Aviation; Agriculture; Research; Infrastructure; Good-Paying Jobs; Accountability

- candidate_first_name: Katy
  candidate_last_name: Tyndell
  state: ks
  race: US House of Representatives
  district: 4
  party: Democratic
  question: ks-q4
  date:
  response: |
    "Kansas understands severe weather. Tornadoes, floods, wildfires, drought, extreme heat, and winter storms can threaten lives, farms, businesses, and entire communities. Preparing for these events should be driven by the best available science and by close coordination with the people responsible for responding when disasters occur.
    
    I would support strong partnerships among federal agencies, state and local emergency managers, universities, meteorologists, engineers, first responders, utilities, agricultural experts, and community leaders. Scientific forecasting and risk analysis should inform decisions about infrastructure, emergency planning, water management, wildfire prevention, and disaster mitigation.
    
    We should also invest before disaster strikes when evidence shows that mitigation can reduce future damage and costs. When disasters do occur, federal assistance should be timely, effective, and accessible. We know severe weather is part of living in Kansas. Our job is to use the information and technology available to us to prepare earlier, warn people faster, build more resilient communities, and make sure help is there when disaster strikes."

    KEYWORDS: Disaster Preparedness; Severe Weather; Climate Resilience; Emergency Management; Mitigation; Infrastructure; Scientific Expertise; First Responders

- candidate_first_name: Katy
  candidate_last_name: Tyndell
  state: ks
  race: US House of Representatives
  district: 4
  party: Democratic
  question: ks-q5
  date:
  response: |
    "Kansas agriculture feeds families here at home and around the world, and farmers need effective tools to protect crops and maintain productivity. At the same time, Kansans deserve clean, safe drinking water, and we have a responsibility to protect our rivers, lakes, groundwater, and public health.
    
    I support a science-based approach that evaluates chemicals according to their actual risks, uses, concentrations, and environmental impacts rather than adopting one-size-fits-all policies. We should invest in research, water-quality monitoring, precision agriculture, conservation practices, and technical assistance that help producers reduce runoff and use fertilizers and crop-protection products efficiently.
    
    Farmers need to be part of developing these solutions. Washington shouldn’t dictate practices without understanding what they mean on the ground. We should give producers better information, tools, and incentives to reduce runoff and protect water while allowing them to keep their operations productive. Where scientific evidence demonstrates a serious public-health or environmental risk, regulators should act transparently and responsibly to address it."

    KEYWORDS: Clean Water; Agriculture; Pesticides; Fertilizers; Precision Agriculture; Conservation; Public Health; Science-Based Regulation; Farmer Partnerships

- candidate_first_name: Katy
  candidate_last_name: Tyndell
  state: ks
  race: US House of Representatives
  district: 4
  party: Democratic
  question: ks-q6
  date:
  response: |
    "Measles is highly contagious, but it is also preventable. Our response should begin with making sure families have access to accurate information, routine preventive health care, and proven vaccines.
    
    I support strong partnerships among federal, state, and local public-health agencies, health-care providers, schools, and communities to identify outbreaks quickly and respond based on established medical evidence. That includes effective disease surveillance, adequate laboratory capacity, rapid communication with affected communities, and resources for local health departments to conduct outbreak investigations and protect people at greatest risk.
    
    We also have to recognize that public trust has been damaged. Telling people simply to ‘trust the experts’ isn’t enough. Public-health officials need to answer questions honestly, explain the evidence clearly, and make reliable information easy for parents and families to find. Finally, public-health decisions should be guided by qualified medical and scientific experts rather than political pressure."

    KEYWORDS: Vaccination; Disease Prevention ; Local Health Departments; Disease Surveillance; Medical Evidence; Public Trust

- candidate_first_name: Katy
  candidate_last_name: Tyndell
  state: ks
  race: US House of Representatives
  district: 4
  party: Democratic
  question: ks-q7
  date:
  response: |
    "AI and data centers can bring investment and jobs to Kansas, but growth cannot come at the expense of existing ratepayers or the reliability of our electric and water systems. Large new users should bear an appropriate share of the infrastructure costs their projects create rather than shifting those costs onto Kansas families and small businesses.
    
    I support rigorous planning for energy and water demand, transparent utility regulation, and investments that strengthen grid reliability and expand generation and transmission capacity. Kansas should also encourage data centers to improve energy and water efficiency and locate projects where infrastructure and resources can responsibly support them.
    
    Kansas has an opportunity to pair technological growth with our strengths in affordable and diverse energy production. I want Kansas to attract data centers and other technology investments, but Kansas families should not see their utility bills go up to subsidize them. If a project creates significant new demand for electricity, water, or infrastructure, those costs need to be part of the deal from the beginning."

    KEYWORDS: Energy Reliability; Water; Ratepayer Protection; Infrastructure; Energy Efficiency; Responsible Growth; Sustainability

- candidate_first_name: Katy
  candidate_last_name: Tyndell
  state: ks
  race: US House of Representatives
  district: 4
  party: Democratic
  question: ks-q8
  date:
  response: |
    "Artificial intelligence has enormous potential to improve productivity, health care, agriculture, manufacturing, education, and countless other fields, but public policy needs to keep pace with the technology.
    
    I support a federal framework for AI that encourages American innovation while establishing meaningful protections for privacy, cybersecurity, intellectual property, consumers, and children. People should know when consequential decisions are being made using AI, and companies should be accountable when their systems cause harm or misuse personal information. We should also invest in education and workforce training so Kansans can benefit from the jobs and opportunities AI creates.
    
    For data centers, I support responsible development that protects ratepayers and considers demands on electricity, water, land, and infrastructure before incentives are awarded. Kansas should welcome technological investment when it produces real economic benefits, but public subsidies and infrastructure commitments should be transparent and accountable to taxpayers.
    
    I want America leading the world in AI, but being first cannot mean being careless. We can encourage innovation while still protecting people’s privacy, their work, their intellectual property, and their ability to know when AI is being used to make important decisions about them."

    KEYWORDS: Innovation; Privacy; Cybersecurity; Intellectual Property; Workforce Development; Consumer Protection; Accountability
    
