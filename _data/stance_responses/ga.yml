  response: |
    Setting hard limits on data center water consumption, and predicating any tax credits on going above and beyond those requirements is a way to stop the bleeding.  I support laws that promote green energy and local generation as much as possible to reduce our reliance on fossil fuels, but that is a longer term solution.  In the short term, we need to ensure that people are protected from extreme heat exposure.  That could include delaying certain sports seasons for youth, and ensuring that cooling centers are available during the hottest months.

