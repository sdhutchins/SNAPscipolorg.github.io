    Healthcare in Georgia is a full-on crisis, in nearly every conceivable way.  Medicaid expansion would help, but with the hardest cuts to Medicaid from HR1 coming next year, it is probably too late.  I am open to any ideas from any source, from a mystery "free market" solution, to a state-run exchange with a state-run public option, to a full Medicare For All solution at the state level, and anything in between.  We have let this get to crisis levels, and it is only getting worse by the day.

