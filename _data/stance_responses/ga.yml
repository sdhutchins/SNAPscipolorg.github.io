  response: |
    Georgia is one of ten FoodNet states, CDC's active surveillance system for foodborne illness. In July 2025, CDC cut the pathogens FoodNet requires states to track from eight to two, and Cyclospora was one of the six dropped. That doesn't cause outbreaks, but we find them later, after more people are sick. I'd fund the Department of Public Health and the state lab to keep full active surveillance of all eight, and fund enough inspectors to trace an outbreak to its source quickly.

