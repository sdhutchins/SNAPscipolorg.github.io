  response: |
    I will start by repealing the current state tax credits1.  Beyond that, the state should set standards for water consumption, and perhaps offer tax credits for reaching certain "stretch goals".  As far as power, at a bare minimum, legislation should ensure that residents do not foot the bill for infrastructure improvements, and datacenter owners should be incentivized to use green energy sources as much as possible.  Local residents should have final say on location and whether datacenters are allowed in their communities at all.  Ideally that should be done through local representatives, but if requiring referendums is necessary, so be it. 

