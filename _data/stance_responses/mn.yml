    “We need to ensure that addiction resources are following best practices. Reducing overdoses requires an availability of things like Narcan, availability of patient centered treatment, and funding the social work that helps address root causes for addiction. In my experience as an EMT, addiction and overdoses are linked with poverty or a need that isn't met like lacking healthcare. We need to ensure we are able to provide good paying jobs and healthcare that allows our community members to build a life without the crutch of addiction.” 
    
    KEYWORDS: Public Health is Community Health

