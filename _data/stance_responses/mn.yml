  state: mn
  race: State House of Representatives
  district: 43B
  party: Democratic
  date: 2026-10-02
  question: mn-q3
  response: |
    “Clean drinking water is a fundamental right. As an environmental scientist, the fact that 21 Minnesota community water systems exceed federal PFAS standards is an urgent public health crisis. These bioaccumulative "forever chemicals" cause cancers, immune dysfunction, and developmental harm. No family should worry about whether their tap water is safe.

    Addressing this contamination demands bold, science-based action:

    Defend Amara’s Law: Protect the phase-out of non-essential PFAS by 2032. I will fight corporate lobbying to delay deadlines, add exemptions, or narrow chemical definitions. Prevention is our most cost-effective tool.

    Enforce "Polluter Pays": Remediating drinking water and wastewater will cost billions. I will champion legislation holding chemical manufacturers and polluters financially liable so working families and local ratepayers do not shoulder cleanup costs.

    Fund Municipal Infrastructure: Secure state bonding and dedicated grants to help local utilities install advanced filtration—like granular activated carbon and reverse osmosis—without hiking utility bills.

    Expand Testing & Set Strict Limits: Provide state-funded testing for private wells, increase landfill and biosolid monitoring, and direct the MPCA to establish enforceable industrial discharge caps that regulate PFAS as an entire chemical class.

    I will always put public health over corporate polluters.” 
    
    KEYWORDS: Prevention, remediation, oversight

