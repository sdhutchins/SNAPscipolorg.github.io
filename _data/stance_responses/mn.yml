    “Data centers are important infrastructure for our increasingly digital economy, including artificial intelligence, but Minnesota should understand their full impact before committing significant public resources to them. I support rigorous review of major projects' electricity demand, water consumption, environmental impacts, effects on the electrical grid, and potential costs to residential and small-business ratepayers. Large data centers should pay their fair share of infrastructure costs rather than shifting those costs onto existing customers, and developers should be transparent about expected energy and water use. I also support incentives and requirements that encourage water reuse, efficient cooling, clean energy, and other technologies that reduce environmental impact. The goal should not be to reject innovation, but to make sure Minnesota gains the economic benefits of new technology without quietly socializing its costs.” 
    
    KEYWORDS: Innovation, Sustainability, Accountability

