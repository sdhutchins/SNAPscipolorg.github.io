  party: Democratic
  date: 2026-09-10
  question: mn-q2
  response: |
    “Mining can contribute to Minnesota’s economy and support good-paying jobs, but it must never come at the expense of clean water, public health, or the long-term vitality of surrounding communities. I support a rigorous, science-based permitting process that evaluates the full cumulative impact of a project—not just its projected economic benefits—and includes meaningful consultation with tribal nations, local governments, workers, and residents.
    Any mining project should be required to meet the strongest available environmental standards, demonstrate adequate financial assurance for cleanup and long-term monitoring, and provide a credible plan for closure, reclamation, and treatment of contaminated water. I would support independent scientific review, transparent disclosure of environmental data, strong groundwater and surface-water monitoring, and enforceable penalties for violations. Permits should be denied or withdrawn when a project cannot demonstrate that it will protect the watershed over the long term.
    I would also support investments in watershed restoration, emergency-response capacity, and economic diversification so communities are not dependent on a single industry. Tribal sovereignty, treaty rights, environmental justice, and the rights of future generations must be central to these decisions. Mining policy should protect both workers and the water and land on which Minnesota communities depend.” 
    
    KEYWORDS: Clean water; Responsible mining; Environmental protection

- candidate_first_name: Amáda Márquez
