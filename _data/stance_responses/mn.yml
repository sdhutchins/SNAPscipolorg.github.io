- candidate_first_name: Karla
  candidate_last_name: Hult
  state: mn
  race: State Senate
  district: 50
  party: Democratic
  date: 2026-10-02
  question: mn-q1
  response: |
    “As a longtime journalist, I know how valuable expertise is when tackling complex problems. My instinct is to listen to multiple perspectives before forming a position, and I would prioritize connecting directly with scientists.

    We need scientists now more than ever as we face rapid advances in AI, a changing climate, and threats to our natural resources. Before voting on related policy, I would seek briefings from independent researchers, consult agency staff and advisory boards, and read the underlying evidence. I would also ask where uncertainty remains; honest answers about what we don't know matter as much as what we do.

    Case in point: I frequently mention a promising partnership with the University of Minnesota's new AI Hub, which aligns education, research, and external partnerships under one strategy. Not everyone there may represent the traditional definition of scientist, but its leaders offer exactly the expertise needed to weigh AI's harms and benefits.

    To be clear: science can tell us what is likely to happen, but not always what we should do. Weighing cost, fairness, and community values is an elected official's job, and I'll do it with the best evidence in hand.” 
    
    KEYWORDS: Listening. Evidence. Accountability.

- candidate_first_name: Karla
  candidate_last_name: Hult
  state: mn
  race: State Senate
  district: 50
  party: Democratic
  date: 2026-10-02
  question: mn-q2
  response: |
    “I oppose overturning the ban. This decision shows why we must listen to scientists on complex environmental questions.

    My friend, meteorologist Paul Douglas, wrote in his January Star Tribune editorial, "I am not anti-mining... I am a proponent of responsible mining." But on the BWCA's future, he concluded, "The data isn't encouraging." I agree.

    The Boundary Waters watershed is a fragile ecosystem and the foundation of a vital tourism economy. I would support:

    •        Permanent legal protection for the watershed, so it can't be reversed with a single vote
    •        Independent, science-based water-quality monitoring
    •        Strict financial assurance requirements so taxpayers never foot the bill for cleanup
    •        Responsible mining in places that don't put wilderness water at risk

    I will base every decision on verified information from scientists. I will also engage directly with the people who live and work around the Boundary Waters, including Ely-area residents, outfitters and resort owners, and Tribal Nations. I think it's critical that all voices be heard on this controversial issue, particularly with such a valuable resource, and the tourism sector that depends on it, at stake.” 
    
    KEYWORDS: Legacy. Responsibility. Respect.

- candidate_first_name: Karla
  candidate_last_name: Hult
  state: mn
  race: State Senate
  district: 50
  party: Democratic
  date: 2026-10-02
  question: mn-q3
  response: |
    “I approach this issue as a journalist, 3M daughter, and concerned Minnesotan. I also believe this issue requires ongoing conversation based on fairness, equity, and –  most importantly – science, beginning with one fundamental truth: every Minnesotan deserves safe drinking water. The science is clear: PFAS are harmful at very low levels. I support the DFL approach of stopping PFAS at the source and protecting people now.

    First, I oppose the federal rollback. The EPA has proposed rescinding limits on four PFAS and delaying compliance for PFOA and PFOS until 2031. Attorney General Ellison has challenged it, and I'd support Minnesota keeping the 2024 standards, with state standards as a backstop.

    Second, I support Minnesota's 2023 law phasing out PFAS in consumer products by 2032, and would defend it. I'd ensure the MPCA has the resources to enforce manufacturer reporting, first due this July.

    Third, I'd fund affected communities. Treatment is expensive, and small systems shouldn't pass the cost to ratepayers. I'd prioritize Clean Water Fund dollars and federal infrastructure money for the 21 systems exceeding limits, along with expanded testing.

    Finally, polluters should pay for cleanup, not taxpayers. And yes, I'll always listen to Health Department and MPCA scientists.” 
    
    KEYWORDS: Responsibility. Accountability. Engagement.

- candidate_first_name: Karla
  candidate_last_name: Hult
  state: mn
  race: State Senate
  district: 50
  party: Democratic
  date: 2026-10-02
  question: mn-q4
  response: |
    “As a journalist, I believe data centers shouldn't be developed in secret. I would require meaningful community input, including public hearings, before incentives are approved. Transparency shouldn't end when a deal is signed: I support mandatory, ongoing public disclosure of energy use, water use, tax incentives, and community impacts.

    I will protect and strengthen Minnesota's guardrails against cost-shifting, so families, seniors, and small businesses never pay higher utility bills because of data centers. Reliable, affordable service must come first for people and businesses already here.

    Minnesota's clean water and natural resources make this a great place to live, work, and raise a family. Data centers should support, not undermine, our goal of 100% carbon-free electricity by 2040, so I would require them to use renewable energy.

    Economic development should benefit Minnesotans, not just Big Tech. Companies that build here should create good-paying local jobs, pay their fair share of infrastructure costs, and deliver clear public benefits that outweigh the costs.

    Importantly, this reflects my position on data center development and its impact. My concerns about AI generally are significant, so I support a state task force of scientists, utilities, local governments, and concerned residents for oversight.” 
    
    KEYWORDS: Transparency. Engagement. Evidence.

- candidate_first_name: Karla
  candidate_last_name: Hult
  state: mn
  race: State Senate
  district: 50
  party: Democratic
  date: 2026-10-02
  question: mn-q5
  response: |
    “I profoundly believe in the value of scientific investment to our economy and to our quality and sustainability of life. I know the cost of cutting research funding, in economic loss and in time lost to finding answers for overwhelming challenges, including Alzheimer's and other dementias, which my family knows well, and other chronic illnesses. Again, those $700 million in NIH awards supported over 7,000 Minnesota jobs, so this is an economic issue as much as a scientific one.

    Federally, I support:

    * Stable, predictable NIH funding, and opposition to arbitrary caps on indirect costs, which keep labs running. Minnesota joined other states in challenging the 15% cap.
    * Protecting peer review, so grants are awarded on scientific merit.
    At the state level, I support:
    * Sustained investment in the University of Minnesota, Mayo, and programs like MnDRIVE.
    * Bridge funding to keep researchers and jobs here when federal dollars are disrupted.
    * Partnerships between industry and universities to turn research into Minnesota jobs.

    Research funding isn't a cost; it's an investment that returns jobs, discoveries, and healthier lives. I will keep listening to scientists on what they need.” 
    
    KEYWORDS: Investment. Hope. Just good economics.

- candidate_first_name: Karla
  candidate_last_name: Hult
  state: mn
  race: State Senate
  district: 50
  party: Democratic
  date: 2026-10-02
  question: mn-q6
  response: |
    “I wish this devastating disparity were limited to overdose deaths. Alas, we see the same gap in other health outcomes, including Alzheimer's and other dementias, where I've been a strong public advocate. Black Americans are twice as likely to live with dementia, Hispanic Americans 1.5 times, and Indigenous Minnesotans even more so. These gaps are tied to systemic racism: unequal access to high-quality, safe, and trustworthy healthcare, education, housing, and even food, given food deserts.

    So I support thoughtful, consistent policies that address access and quality of life, paired with outreach that meets people where they are:

    * Keep naloxone widely available, free of stigma, and expand access to treatment and recovery services.
    * Direct opioid settlement dollars to the communities hit hardest, including Black- and Indigenous-led organizations and tribal nations, with transparency about where the money goes.
    * Fund culturally specific, community-led prevention and care.
    * Invest in healthcare access, nutrition, and education, which shape health outcomes long before a crisis.

    The 28% decline shows what's possible, but progress has leveled off recently, and that is no reason to ease up. We should meet this crisis in the communities most affected.” 
    
    KEYWORDS: Equity. Access. Outreach.

- candidate_first_name: Tracey
  candidate_last_name: Breazeale
  state: mn
  race: State House of Representatives
  district: 45A
  party: Democratic
  date: 2026-10-02
  question: mn-q1
  response: |
    “I believe good policy starts with balanced fact based information which means evaluating data and listening to the people who have spent their careers studying the problem. When a bill touches public health, clean water, our lakes and land, agriculture, energy, schools, or new technology, I want to hear directly from the experts who know the subject best: researchers, scientists, doctors, nurses, engineers, academic experts, etc. I'll read the research with a critical eye, look at reliable data, and ask the hard questions to arrive at solutions that are grounded in science. Minnesotans deserve leaders who make decisions based on facts, not politics or pressure from special interests.” 
    
    KEYWORDS: Fact-based, Independent, Balanced

- candidate_first_name: Tracey
  candidate_last_name: Breazeale
  state: mn
  race: State House of Representatives
  district: 45A
  party: Democratic
  date: 2026-10-02
  question: mn-q2
  response: |
    “Not all mines are created equal and there is a big difference between taconite mining and the copper-sulfide mining being proposed near the Boundary Waters Canoe Area. The Boundary Waters Canoe Area is a collection of highly interconnected lakes and rivers and it is simply not possible to limit pollution to any one area. Copper-sulfide mining is particularly toxic - when sulfur and water mix, an acid is released and history shows these types of mines leak and pollute the surrounding water. This type of damage cannot be fixed and therefore I will support the “Prove It First” legislation. “Prove It First”  would require copper-sulfide mining companies to demonstrate they can operate without polluting the local environment before they can receive a permit in Minnesota.” 
    
    KEYWORDS: Protect the BWCA

- candidate_first_name: Tracey
  candidate_last_name: Breazeale
  state: mn
  race: State House of Representatives
  district: 45A
  party: Democratic
  date: 2026-10-02
  question: mn-q3
  response: |
    “Every Minnesotan deserves to know the water coming from their tap is safe. As a member of the Minnetonka Beach City Council that approved a new water plant with PFAS treatment, I've seen this challenge up close. Minnetonka Beach is a small city of about 230 households, and building modern treatment was a major financial commitment. Residents shouldn't have to carry that cost alone. I support the use of state funds to help cities fund necessary investments in water infrastructure. PFAS contamination requires action at both ends: cleaning up existing pollution and preventing more forever chemicals from entering our water. I support strong, science-based drinking-water standards for PFAS, and helping communities test, treat, and remediate contaminated water without placing the burden on local taxpayers and ratepayers. I also support holding manufacturers and polluters responsible for cleanup costs when they caused the contamination. Minnesota is already leading through Amara's Law, which phases out nonessential uses of PFAS. I support building on it by reducing unnecessary PFAS use, requiring greater transparency from manufacturers, and investing in safer alternatives. We also need continued monitoring of public water systems and private wells, investment in effective treatment technologies, and aggressive cleanup of known contamination sites.” 
    
    KEYWORDS: Infrastructure, Clean Water

- candidate_first_name: Tracey
  candidate_last_name: Breazeale
  state: mn
  race: State House of Representatives
  district: 45A
  party: Democratic
  date: 2026-10-02
  question: mn-q4
  response: |
    “I support a moratorium on construction of hyper-scale data centers so we can develop legislation that protects local communities and consumers. It’s unclear how many will actually be needed and it’s important not to overbuild.  Legislation should include environmental review, water usage, energy usage and transparency.
    Environmental review: I support mandatory environmental review before construction. Data centers affect our water, air, and neighborhood noise levels, and current requirements don't cover all of that. We need a review designed specifically for data centers.
    Water:  Hyper-scale data centers can use a lot of water and we need to ensure they are using as little as possible, encouraging underground cooling so consumers and local businesses do not face water shortages or rate increases. 
    Energy and ratepayers:  I support requiring data centers to run on 100% new clean energy. Data centers should pay for the new generation and transmission they require, so families and small businesses aren't subsidizing big tech. 
    Transparency:  I support banning or strictly limiting non-disclosure agreements between local officials and tech developers. Public trust depends on transparency and residents deserve to know what's proposed, what it will cost them, and what protections are in place.” 
    
    KEYWORDS: Planful, Community Focused

- candidate_first_name: Tracey
  candidate_last_name: Breazeale
  state: mn
  race: State House of Representatives
  district: 45A
  party: Democratic
  date: 2026-10-02
  question: mn-q5
  response: |
    “I will be a vocal advocate against federal cuts that jeopardize our researchers, universities, hospitals, and the patients who depend on them. I would also work closely with our congressional delegation to help secure stable funding. At the state level, I would champion sustained investment in the University of Minnesota, Minnesota State, and our other public research institutions. That includes modernizing laboratories and research facilities and building partnerships that position Minnesota researchers to compete successfully for outside funding. I would also expand STEM education so that students can pursue rewarding careers in science, healthcare, and advanced manufacturing here at home.
    Equally important is the scientific expertise within our state agencies. When we confront emerging diseases, invasive species, agricultural challenges, or PFAS contamination, we depend on their knowledge. Eroding that capacity undermines our ability to protect public health and our natural resources.” 
    
    KEYWORDS: Science, Research, Jobs

- candidate_first_name: Tracey
  candidate_last_name: Breazeale
  state: mn
  race: State House of Representatives
  district: 45A
  party: Democratic
  date: 2026-10-02
  question: mn-q6
  response: |
    “Overdose deaths in Minnesota have fallen, but the work isn't finished until help reaches everyone who needs it. My approach is public health first: prevent addiction, make treatment easy to get, reduce the harm of use, and hold traffickers accountable.
    Naloxone should be available everywhere people gather, including schools, libraries, community groups, and clinics, with training so people can use it confidently. Treatment shouldn't be blocked by paperwork or cost. That means making medication-assisted treatment, counseling, peer support, and recovery housing available in rural areas and city neighborhoods alike. The gap for non-white Minnesotans is too large to ignore, and general programs won't close it.  Resources should follow the data and serve anyone who needs help. I also support improving prescription tracking, and teaching young people early about the risks. Lasting change depends on stable housing, mental health care, and economic security, too.” 
    
    KEYWORDS: Prevention, Treatment, Naloxone

- candidate_first_name: Tara
  candidate_last_name: Killen
  state: mn
  race: State Senate
  district: 10
  party: Democratic
  date: 2026-10-05
  question: mn-q1
  response: |
    “Science helps us understand what is happening, why, and what different choices may mean for people. I will consult scientists with relevant expertise when considering legislation involving healthcare, agriculture, water, energy, infrastructure, and emerging technology.
    I will seek input from researchers, state agency scientists, and other qualified experts through hearings and briefings. I will ask about evidence, methods, uncertainties, funding sources, and areas of agreement or disagreement. Different opinions deserve consideration in proportion to the evidence supporting them.
    My work in construction and compliance has taught me that the big picture and the details affect one another. I support protections where reliable scientific evidence establishes the need. I will also examine whether requirements are effective, practical, and affordable, especially for farmers, small businesses, and individuals. Protecting people includes considering unintended consequences and helping them meet necessary standards.
    I am responsible for my votes. I will consider affected communities’ experiences, explain my reasoning, and remain willing to change my position when reliable new evidence warrants it.” 
    
    KEYWORDS: Evidence, Balance, Accountability

- candidate_first_name: Tara
  candidate_last_name: Killen
  state: mn
  race: State Senate
  district: 10
  party: Democratic
  date: 2026-10-05
  question: mn-q2
  response: |
    “Minnesota needs good jobs, essential minerals, and clean water. Mining decisions must consider all three, including consequences that can last long after a mine closes.
    I oppose weakening protections for the Boundary Waters watershed. I would not support a mining project there unless rigorous scientific review demonstrates that it can meet protective standards without unacceptable long-term harm. A company’s assurances alone are not enough.
    As a state senator, I support strong water quality standards, thorough environmental review, independent monitoring, public findings, and meaningful government-to-government consultation with affected Tribal Nations. Review must address cumulative impacts, waste storage, accidents, and conditions after closure.
    I support requiring project owners to fund independent inspection and monitoring throughout the project and maintain financial assurance for reasonably foreseeable damage, cleanup, closure, and long-term care. Those requirements need regular review as risks and costs change, protecting taxpayers if an operator cannot meet its obligations.
    Requirements must be clear, proportionate to risk, and consistently enforced. Protecting this watershed also protects recreation and tourism livelihoods. If a project cannot meet protective standards, I would oppose its approval.” 
    
    KEYWORDS: Water, Evidence, Responsibility

- candidate_first_name: Tara
  candidate_last_name: Killen
  state: mn
  race: State Senate
  district: 10
  party: Democratic
  date: 2026-10-05
  question: mn-q3
  response: |
    “Safe drinking water is a basic need. Families deserve clear information about their water and practical help when contamination is found.
    I support continued PFAS testing, understandable public reporting, and enforceable drinking water protections informed by current science. I support funding and technical assistance for effective treatment, especially for small rural systems with limited resources. Private well owners also need testing, guidance, and assistance based on risk and need.
    Preventing contamination is essential. I support implementing Minnesota’s PFAS prevention law, known as Amara’s Law, with clear guidance, practical timelines, and assistance for businesses transitioning to safer alternatives. I will consider the availability, effectiveness, and cost of replacements. Exceptions for currently unavoidable uses need scientific justification and regular review.
    I support holding responsible polluters accountable for cleanup costs and pursuing available federal funding.
    Protecting health and keeping water affordable belong in the same conversation. Farmers, small businesses, and individuals need workable ways to meet necessary protections. Residents cannot be left to carry this burden alone.” 
    
    KEYWORDS: Prevention, Affordability, Accountability

- candidate_first_name: Tara
  candidate_last_name: Killen
  state: mn
  race: State Senate
  district: 10
  party: Democratic
  date: 2026-10-05
  question: mn-q4
  response: |
    “Data centers can bring investment, but communities need to understand their benefits, demands, and long-term costs before decisions are made.
    I support thorough environmental review of large data centers, including water use, electricity demand, backup generator emissions, noise, and cumulative effects. Review must consider drought conditions, grid reliability, and competing needs for water and energy.
    I support enforceable safeguards proportionate to demonstrated risks, including efficient water and energy use, ongoing monitoring, and public reporting. Residents and affected Tribal Nations need meaningful participation before commitments are finalized. Communities and businesses also need predictable rules and a permitting process that is thorough and timely.
    Data center owners must pay the costs attributable to serving their facilities, including necessary utility upgrades, with safeguards against shifting those costs to households and other businesses.
    I would evaluate tax incentives against measurable public benefits, including lasting jobs, local revenue, and infrastructure costs. Agreements need clear obligations and consequences when commitments are not met.
    Growth works best when communities share in its benefits and their essential resources remain protected.” 
    
    KEYWORDS: Resources, Transparency, Fairness

- candidate_first_name: Tara
  candidate_last_name: Killen
  state: mn
  race: State Senate
  district: 10
  party: Democratic
  date: 2026-10-05
  question: mn-q5
  response: |
    “Scientific research is an investment in people’s health, our workforce, and our ability to solve problems. Its value includes discoveries whose practical benefits may take years to emerge.
    As a state senator, I support stable funding for research and education at Minnesota’s public universities, including research infrastructure, training, and competitive grants with independent scientific review. I would consider both basic research and work addressing Minnesota’s needs, including rural healthcare, agriculture, clean water, and energy.
    I would advocate with our congressional delegation for reliable NIH and other federal research funding. State government cannot replace the federal research budget, but it can be a strong partner and voice for Minnesota.
    Public funding requires accountability through clear reporting, sound research practices, and evaluation appropriate to the work. Funding decisions need scientific merit and public benefit at their center, with protection from political interference.
    I also want research findings to reach communities, patients, farmers, and businesses, including practical solutions that help them protect health and natural resources while managing costs.” 
    
    KEYWORDS: Research, Investment, Independence

- candidate_first_name: Tara
  candidate_last_name: Killen
  state: mn
  race: State Senate
  district: 10
  party: Democratic
  date: 2026-10-05
  question: mn-q6
  response: |
    “Every overdose death is someone’s family member, friend, or neighbor. Progress matters, but it must reach communities experiencing the greatest losses.
    I support accessible naloxone and overdose response training, medications for opioid use disorder, timely treatment, and sustained recovery support. Rural residents need care they can reach and afford, including transportation and appropriate telehealth services.
    I support prevention education and services that connect people to care after an overdose, during hospital discharge, and when leaving incarceration. Housing and mental healthcare also affect a person’s ability to recover.
    I would work with Tribal Nations, Native-led organizations, Black community organizations, healthcare providers, and people with lived experience to fund and evaluate services designed around their communities’ needs. Tribal sovereignty and culturally responsive care belong at the center of those partnerships.
    I support transparent use of opioid settlement funds and public reporting on results, including whether disparities are narrowing. Funding and implementation need to account for rural providers’ limited staffing and resources.
    People need a path to safety and recovery, with dignity throughout that process.” 
    
    KEYWORDS: Prevention, Treatment, Dignity

