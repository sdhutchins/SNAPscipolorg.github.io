  response: |
    “Without independent cumulative-impact review, I will not support building new hyperscale data centers because their potential environmental impacts have not been adequately addressed. These facilities can place enormous demands on the electricity grid, potentially increasing costs for residents, requiring major new infrastructure, and complicating Minnesota’s transition to clean energy. They can also consume significant amounts of water for cooling, creating risks for drinking-water supplies and putting additional pressure on communities already facing water challenges.
    Before considering support for future projects, Minnesota should complete independent, cumulative-impact assessments of proposed and existing data centers, including their effects on electricity reliability, utility rates, greenhouse-gas emissions, groundwater, surface water, and drinking-water supplies. Developers should be required to disclose projected energy and water use, identify the sources of those resources, and pay the full cost of necessary infrastructure and environmental mitigation.
    Communities, tribal nations, utilities, and residents must have a meaningful voice in these decisions. Until Minnesota can ensure that data centers will not strain the grid, threaten drinking water, increase public costs, or undermine our climate goals, I will oppose their construction. Any future consideration should require enforceable protections, strong transparency, and clear evidence of a net public benefit.” 
    
    KEYWORDS: Grid protection; Drinking-water security; Environmental accountability

