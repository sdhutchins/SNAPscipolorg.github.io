    “As an environmental and air pollution scientist who has served at the EPA, FAA, USAID, and WHO, scientific integrity guides every decision I make. Good policy must be rooted in peer-reviewed evidence and public health consensus, not political expediency or corporate lobbying. In the Minnesota Legislature, I will ensure independent researchers have a direct seat at the policymaking table.

