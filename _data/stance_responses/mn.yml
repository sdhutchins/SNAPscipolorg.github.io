  response: |
    “If elected, I would seek scientific expertise whenever legislation involves public health, climate, environmental protection, agriculture, energy, transportation, or other issues where evidence should guide policy. I would consult independent researchers, Minnesota colleges and universities, state and federal scientists, professional associations, and nonpartisan analysts rather than relying solely on industry-funded or politically selective claims. I would also listen to the people most affected by a policy, including workers, farmers, patients, and community organizations, because scientific evidence must be understood in the context of lived experience.
    I would ask experts to explain both the strength and limits of the available evidence, the likely benefits and risks of different approaches, and the communities that could be disproportionately affected. When credible experts disagree, I would examine the quality of the evidence, disclose uncertainty, and avoid presenting speculation as fact. I would support transparent hearings, public access to research, and regular review of policies as new evidence emerges. Science should inform my decisions, while democratic accountability, equity, and constituent input help determine how that evidence is applied.” 
    
    KEYWORDS: Evidence-based decision-making; Independent expertise; Transparency

- candidate_first_name: Amáda Márquez
