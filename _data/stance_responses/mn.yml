    Having worked inside federal regulatory agencies, I know how corporate interests distort science. I will work with independent academic and state scientists to rigorously vet data, uncover conflicts of interest, and prevent biased legislation. Finally, I will collaborate with data scientists to embed evidence-based metrics into our laws, ensuring we continuously measure real-world outcomes for everyday Minnesotans.” 
    
