    First, we must safeguard everyday ratepayers and grid reliability through strict Public Utilities Commission standards, preventing utilities from shifting infrastructure and capacity costs onto residential and small-business customers. Operators must also achieve true clean energy additionality by bringing dedicated new wind, solar, and battery storage online to match their demand—rather than cannibalizing existing renewables or extending the lifespan of fossil-fuel plants.

    Second, because cooling server banks consumes millions of gallons daily, comprehensive hydrologic reviews must be required before granting high-volume water permits. This ensures facilities adopt closed-loop cooling and wastewater-reuse technologies over evaporative systems. Finally, we must end lavish state tax giveaways for multi-billion-dollar tech giants and ban municipal non-disclosure agreements that conceal resource impacts from local communities. Through rigorous oversight, we can ensure technology serves Minnesota families rather than exploiting them.” 
    
