    “Federal funding through the NIH is a vital economic and scientific engine for Minnesota, but we cannot rely on Washington alone to secure our state's innovation economy. I plan to support robust state-level policies that amplify these federal investments and protect our local research workforce.

    First, I will advocate for expanding state-backed matching funds—similar to the state’s bioinnovation and environmental trust funds—to help Minnesota universities and independent researchers bridge federal grant cycles. This ensures critical health and safety research never grinds to a halt due to federal gridlock. Second, I support aggressively investing in state higher education infrastructure to maintain world-class clinical, training, and laboratory spaces, keeping Minnesota competitive for top-tier scientific talent.

    Finally, I will fight to protect these research jobs from corporate exploitation, ensuring state funding prioritizes public-health and community-driven advancements rather than special-interest profits. By building a solid state-level foundation, we can shield our public universities, secure thousands of working-class tech and research jobs, and ensure Minnesota remains a global leader in scientific discovery that benefits everyday people.” 
    
    KEYWORDS: Public Health Prioritization

