  response: |
    “There are a lot of "forever" compounds in the environment that can and have been shown to be harmful such as mercury, PCBs, asbestos, and so forth.  PFAS are unusual in that they are man made and essentially inert and don't break down.  But they have the special property that we made them and we know who made them which makes them a target for legal actions.  Obviously, we need to be trying to identify point sources as well as major sources of contamination and mitigating these.  Science is pretty good at finding polluters who are dumping but struggles with green ideas like paper recycling regarding things like benzine picked up in the process.  Fortunately, we have experts, scientists, and professionals who have experience with these issues and we can cooperate as a team to get issues addressed and keep our environment clean and/or mitigate / remediate issues that exists.” 
    
    KEYWORDS: Clean Water, Clean Environment, remediation

