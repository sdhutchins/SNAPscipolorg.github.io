    “As an electrical engineer and project manager, I rely on facts, testing, and expert knowledge when making decisions. I would bring that same approach to the Minnesota Senate.

    I would consult scientists when considering policies involving public health, clean water, energy, agriculture, education, emerging technology, infrastructure, and environmental protection. This would include reviewing peer-reviewed research, requesting testimony from qualified experts, consulting Minnesota universities and state scientific agencies, and listening to scientists who live and work in affected communities.

    Scientists should help lawmakers understand the evidence, risks, costs, and likely outcomes of a proposal. Policymakers must also consider community experiences, economic effects, and ethical concerns. Science should not be ignored or manipulated for political convenience. I will support transparent, evidence-based policymaking that explains the facts and uncertainties to the public.” 
    
