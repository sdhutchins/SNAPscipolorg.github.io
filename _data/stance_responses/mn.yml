  state: mn
  race: State House of Representatives
  district: 32A
  party: Democratic
  date: 2026-08-31
  question: mn-q1
  response: |
    “Science should inform policymaking whenever a decision depends on questions of public health, environmental impact, technology, infrastructure, or other areas where specialized expertise matters. I would seek input from scientists, researchers, technical experts, state agencies, and affected communities, while also looking carefully at the quality of the evidence and areas where experts may disagree. Policymakers still have to weigh costs, benefits, values, and real-world impacts, but those decisions should begin with reliable evidence rather than ideology. As an attorney who works extensively with technology, privacy, cybersecurity, and artificial intelligence, I am accustomed to asking experts what the evidence actually tells us before deciding what we should do with it.” 
    
