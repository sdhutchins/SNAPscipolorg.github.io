  district: 39B
  party: Democratic
  date: 2026-09-10
  question: mn-q3
  response: |
    “PFAS contamination is a serious threat to public health, and no Minnesotan should have to worry that their drinking water contains chemicals linked to long-term health harms. I support strong, enforceable standards for PFAS in drinking water, regular testing and public disclosure of results, and rapid notification when contamination is detected.
    Minnesota should ensure that affected communities have the resources to install effective treatment systems, provide safe alternative drinking water when necessary, and monitor residents who may have experienced significant exposure. The state should also strengthen oversight of industrial discharges, landfills, firefighting-foam use, and other known sources of PFAS, while requiring polluters to pay for cleanup whenever responsibility can be established.
    I would support phasing out nonessential uses of PFAS, requiring manufacturers to disclose and reduce PFAS in products, and preventing regrettable substitutions with similarly hazardous chemicals. Small and rural water systems should receive technical and financial assistance so that the cost of compliance does not fall on residents through unaffordable rate increases. Finally, Minnesota should coordinate with federal, tribal, and local partners, invest in independent research, and use the best available science to update protections as new evidence emerges. Protecting clean water requires prevention, accountability, and sustained public investment.” 
    
    KEYWORDS: PFAS accountability; Clean water; Public health

