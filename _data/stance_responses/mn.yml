  response: |
    “Minnesota has been a national leader in addressing PFAS, and I want us to continue reducing these chemicals at the source while identifying and cleaning up contamination that already exists.

    I serve on the House Environment and Natural Resources Committee, where we have heard directly from scientists and state agencies about PFAS pollution, prevention and management. I have opposed efforts to weaken Minnesota's PFAS restrictions, including voting against legislation that would have created additional exemptions for commercial and industrial products. 

    Going forward, I support strong, science-based drinking-water standards, continued monitoring and testing, reducing unnecessary uses of PFAS before they enter our water, and making sure the companies responsible for contamination contribute to the cost of cleaning it up. Protecting Minnesotans from PFAS means addressing both the contamination we have inherited and preventing more of it from entering our water in the first place.” 
    
