    “Our environment and natural resources in Minnesota are extremely important and no mining operations have the right to contaminate or otherwise pollute our environment, our water supply, the BWCA, etc.  Minnesota has some of the nations largest deposits of Cobalt and Nickel. We also have very significant copper and platinum-group metal deposits.  Accessing resources is critical and necessary to development, our economy, and jobs.  Mining technology has advanced a great deal from the way it was years ago and technology, best practices, etc. have improved a great deal and we've figured out ways to much more safely extract the targeted minerals without otherwise impacting our environment.  Mining in any area (not just near the BWCA) needs to be watched carefully so that it isn't causing damage, but this is something we are much better able to do now. The jobs and investment - especially in northern Minnesota would be of huge value to our state.  We can come together as scientists and engineers and figure out ways to accomplish things and maintain our CRITICAL environmental resources such as the BWCA so these aren't damaged or polluted while getting the critical resources we need.” 
    
    KEYWORDS: Clean water, Responsible mining, environment protection

- candidate_first_name: Robert
