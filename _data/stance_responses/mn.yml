    “Congress needs to take a comprehensive approach to stop the sale of illicit drugs and compassionately treat addiction by bringing together medical professionals, addiction specialists, researchers, and law enforcement to implement evidence-based strategies. Criminalizing addiction, particularly through mandatory minimum sentencing policies, has failed to achieve that goal. I’ve previously helped lead the bipartisan Community Action Opioid Response Act to provide grants to local entities that are effectively working to address the root causes and consequences of addiction.” 
    
