- candidate_first_name: Jess
  candidate_last_name: Lewis
  state: mn
  race: State House of Representatives
  district: 43B
  party: Democratic
  date: 2026-10-02
  question: mn-q2
  response: |
    “I strongly oppose sulfide-ore copper mining in the Boundary Waters Canoe Area Wilderness watershed. 

    The passage of H.J. Res. 140—overturning the 20-year mineral withdrawal via the Congressional Review Act—was a devastating rollback driven by corporate lobbying. Sulfide mining carries severe risks of acid mine drainage, threatening this low-buffering aquatic ecosystem, Voyageurs National Park, and downstream Canadian waters with irreversible contamination.

    With federal protections abdicated, Minnesota must act as the ultimate backstop. In the Minnesota House, I will fight for robust state safeguards:

    Pass the Boundary Waters Permanent Protection Act: Champion legislation (H.F. 309 / S.F. 875) to permanently ban sulfide-ore mining in the Rainy River drainage basin under state law.

    Enforce Strict State Permitting: Demand the DNR and MPCA apply rigorous standards and deny permits whenever proposals risk toxic pollution or tailings failures. Federal leases are not a green light to dig.

    Mandate "Polluter Pays" Protections: Require 100% upfront, bankruptcy-proof financial assurances for full lifecycle remediation so taxpayers never shoulder cleanup costs.

    Respect Tribal Sovereignty: Ensure meaningful consultation and consent with Sovereign Tribal Nations to protect treaty-reserved rights, wild rice waters, and sacred resources.

    We can advance a clean-energy economy without sacrificing our most pristine wilderness.” 
    
    KEYWORDS: Conservation, stewardship, transparency

- candidate_first_name: Jess
