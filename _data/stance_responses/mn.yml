    “I support the schools using their land for generating income to fund teachers and students, build state of the art schools, and to educate our kids. At the heart of much of the debate is the millions of acres of valuable mining and timber land the schools own. For mining in any location, the mine must purchase an appropriate insurance bond to offset any environmental damage. If this is $5 billion dollars - then make them buy that size bond. The insurance company will have inspectors camped out 24/7 ensuring there is no damage to the environment. If the mining process is too risky to the environment, no insurance company will insure them. If approved, the mine owners will constantly work to improve the process to lower risk, and with it, the premiums paid for the bond. Additionally, the use of a private bond will ensure government bureaucrats are not paid off to look the other way. If we cannot mine here, under the strictest environmental standards in the world, we shouldn't be mandating electric vehicles where 65% of the battery is nickel and where it is destroying the environment for millions of people in developing nations.” 
    
    KEYWORDS: Responsibility Financial Accountability

