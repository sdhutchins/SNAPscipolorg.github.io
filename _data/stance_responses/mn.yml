    “I earned my biology degree from St. Olaf, so I was trained to start with the evidence: ask questions, understand what the data can and cannot tell us, and change course when the facts demand it. That is how I try to approach my work in the Legislature, too.

    Scientists and subject-matter experts are especially important when we are making decisions about public health, clean water, emerging technology and our natural resources. On the Environment Committee, I regularly hear from scientists, agency experts and people directly affected by the policies we are considering. Their expertise helps us understand the likely consequences of a decision and where uncertainty remains.

    Science does not make every policy choice for us. Legislators still have to weigh cost, implementation and the lived experiences of the people we represent. But good policy should begin with an honest understanding of the evidence.” 
    
    KEYWORDS: Evidence | Expertise | Informed Decisions

- candidate_first_name: Alex
  candidate_last_name: Falconer
  state: mn
  race: State House of Representatives
  district: 49A
  party: Democratic
  date: 2026-10-01
  question: mn-q2
  response: |
    “I spent nearly a decade professionally working to protect the Boundary Waters before I was elected, and my position has not changed: sulfide-ore copper mining does not belong in the Boundary Waters watershed.

    This is not about opposing mining everywhere. It is about recognizing that some places are too valuable and too vulnerable to put at risk. The Boundary Waters is a connected system of lakes, rivers and wetlands with water so clean we can drink straight from the source. Pollution upstream does not stay neatly contained at a mine site.

    That is why the first bill I introduced in the House was legislation to permanently protect the Boundary Waters watershed from sulfide-ore copper mining on state lands. I have also supported permanent federal protection, because protections that can be reversed from one administration to the next are not truly permanent.

    Minnesota has an obligation to honor our treaties with tribes, protect clean water, wild rice and the places we want our kids and grandkids to inherit. I will keep working for permanent protection at every level of government.” 
    
    KEYWORDS: Stewardship | Clean Water | Permanent Protection

- candidate_first_name: Alex
  candidate_last_name: Falconer
