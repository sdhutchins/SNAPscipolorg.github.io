    “Clean water is essential to the health, safety, and vitality of every Minnesota community. With PFAS and "forever chemicals" threatening local water systems, state policy must focus on prevention, infrastructure support, and accountability to protect residents without burdening ratepayers.

    First, we must support local communities by directing state clean water grants and bonding funds toward upgrading municipal filtration systems. Small towns and local water utilities should not have to bear the cost of expensive reverse osmosis or carbon filtration technologies alone. Additionally, we must ensure rural families on private wells have access to testing and filtration support.

    Second, we must stop contamination at the source. Supporting the phase-out of nonessential PFAS in consumer products under Amara’s Law will keep these chemicals out of our soil and water tables.

    Finally, polluters—not taxpayers—must be held responsible for remediation. Settlement funds and legal accountability must cover long-term cleanup and monitoring. By combining targeted infrastructure funding with strong state oversight, we can safeguard our drinking water, protect public health, and ensure our water infrastructure remains safe and sustainable for generations to come.” 
    
