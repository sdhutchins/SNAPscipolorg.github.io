  question: dc-q2
  date: 2026-10-09 
  primary_candidate: false 
  response: |
    DC residents should be able to rely on essential services and predictable budgets. The approximately $1 billion spending restriction raised last year concerned DC’s ability to spend locally raised revenue. That is distinct from reductions in federal research grants, and both require attention.

    As Delegate, I would work across party lines with congressional appropriators to protect DC’s ability to spend its approved local funds and oppose abrupt restrictions that disrupt public health, education, emergency services, and other essential functions. I would also advocate for research and public programs supported by credible evidence, with clear goals and regular evaluation.
 
    Accountability matters. We should examine whether programs deliver results, correct waste and duplication, and protect services people depend on. Budget decisions should consider the costs of interruption, including whether cutting prevention or abandoning research creates larger expenses later.

    Having helped review National Oceanic and Atmospheric Administration grant proposals at Commerce, I understand the importance of careful evaluation and responsible funding decisions. I would bring that experience to congressional oversight, asking agencies to explain funding changes and their consequences for research and essential services.

