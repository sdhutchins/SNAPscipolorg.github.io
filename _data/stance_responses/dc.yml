    I am fascinated by the term Agroecology. To learn how it functions as part science, part best practices & part social movement. It has given a name to my efforts to address the root causes of crime & violence scientifically. The fact it validates the necessity to optimize the interactions between plants, animals, humans & the environment while promoting social equity further justifies my analysis. DC has more police than any city in America. America has more prisoners than any country in the world. So clearly these ineffective tactics are just profitable management of the problems. The fact that children deprived of 4 key nutrients are 51% more prone to violent behavior, regulated to "live" in food desserts, no mandates to provide safe drinking water until 2037 & a federal court setting precedence that citizens have no constitutional right to water. Lead pipes are not only detrimental to cognitive function & development; it also is a marker for violent behavior. All this combined with a poverty rate 2x the national average, crack babies becoming chemically imbalanced parents, the proliferation of drugs & liquor stores, illiteracy rate 2x the national average, limited greenspace access are all precursors for the need of an Agroecological approach to public safety. 

    Keywords: Agroecology Public Safety

