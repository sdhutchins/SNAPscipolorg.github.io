  response: |
    My parents, Nigerian immigrants who met as students in Boston, instilled a love of science in me early. When a physics class steered me away from engineering, they introduced me to Black scientists and health professionals, and I found pharmacy. Volunteering at Turner and Malcolm X Elementary, I asked students running experiments to call each other "doctor," so they could see their potential. After working with more than 2,000 DC students, I know scientific talent exists in every ward. What the District lacks is a path that keeps it here.

    Research is part of DC's economic foundation and a public good. When grants are terminated, the postdoc can no longer cover rent, the lab technician leaves for another state, and residents lose the treatments and data that work would have produced.

    Keeping that talent starts with making DC affordable. I will push to make UDC tuition-free and grow it into a research anchor that trains DC residents for science careers. I will fight for social housing and rent stabilization capped at inflation so early career researchers are not priced out. I am proud to be endorsed by 314 Action, and I intend to be the ally scientists need on the Council.   

    Keywords: Talent Retention, Tuition-Free UDC, Affordable Housing

