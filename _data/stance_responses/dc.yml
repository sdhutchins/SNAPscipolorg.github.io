    There’s a theory termed the Washington Monument Syndrome. When National Park Service faces a budget cut, the agency doesn’t threaten to reduce hours at a national site in Middle America. Instead, they threaten to close the Washington Monument to affect all members of Congress in a highly visible way. In foreign policy, Israel is the Washington Monument. In both the House & Senate the two wings of the same bird all flap together to support continued unconditional aid to Israel. I would seek to hold up a mirror of benign neglect that reflects some of the vast similarities with DC residents & those in Palestine. Like the fact that DC is the most dangerous city in America for a Black woman of any socio-economic background to give birth. While Palestine has the dubious distinction of being the most dangerous place in the world for children. US taxpayers give Israel more foreign aid than Sub-Saharan Africa & Latin America combined with billions of dollars annually. They provide their citizens with free healthcare while DC residents pay billions in taxes annually, more per capita than anyone in USA, while being denied representation as the only US territory that pays federal taxes at all.

    Keywords: Washington Monument Syndrome

