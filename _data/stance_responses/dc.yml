    For six years as DC's Shadow Representative, I have lobbied members of a Congress in which 700,000 residents have no vote. Last year's proposed $1 billion reduction showed what that means in practice. Those were DC's own tax dollars, frozen by people DC did not elect.

    Statehood is the only permanent protection, and I will keep pressing for it from the Council. Until then, the District has to reduce its exposure. I will push for progressive revenue such as a Business Activity Tax on large firms using a federal loophole, so DC has room to absorb federal interference without cutting services. I will use Council oversight to stop raids on dedicated funds like the Sustainable Energy Trust Fund and the Anacostia River Cleanup Fund, which pay for evidence-based programs residents can measure in cleaner air and water. And I will defend Medicaid and the DC Healthcare Alliance, because cutting coverage does not remove the cost. It moves that cost into emergency rooms.

    Keywords: Statehood, Budget Autonomy, Progressive Revenue

