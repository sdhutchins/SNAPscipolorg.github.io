    Vaccine guidelines should reflect rigorous scientific evidence, transparent review, and clear communication about benefits and risks. Vaccines have an important role in preventing serious illness, and residents should have reliable access to them and trustworthy advice from their healthcare providers.  I would support DC developing supplemental guidance when needed to maintain access and address local public-health conditions, provided that guidance is developed by qualified medical experts, explains its evidence, and is regularly reviewed. Any differences from federal recommendations should be clearly explained so patients and clinicians are not left confused.  I also support informed consent and individualized discussions between patients, parents, and healthcare providers. As Delegate, I would advocate for vaccine access and coverage, independent safety monitoring, and public accountability for the evidence behind recommendations.  Q4 Keywords: Scientific evidence; vaccine access; transparency; informed consent; medical expertise; safety monitoring.  Town hall participation: Yes.  Internal comments: Thank you for inviting me to participate. I welcome a discussion with scientists, researchers, healthcare professionals, and residents about retaining talent in DC, protecting essential services, and making policy that delivers measurable results.
