  response: |
    Research should be a major part of DC’s economy. Scientists and researchers advance medicine, public health, energy, cybersecurity, and national security while creating jobs and opportunities for students.

    At the Department of Commerce’s innovation program, I helped review grant proposals for the National Oceanic and Atmospheric Administration. As a Census recruiter, I recruited candidates in science, technology, engineering, and mathematics. These experiences gave me firsthand insight into evaluating proposals and attracting skilled talent.

    As Delegate, I would advocate for stable, competitive research funding based on scientific merit, transparent review, and responsible use of taxpayer dollars. Agencies should explain grant terminations and provide timely review of disputed decisions, considering the consequences for ongoing research and the workforce.

    I would help universities, hospitals, and businesses develop partnerships that turn research into local companies and jobs. Faster permitting, accessible laboratory space, and paid training opportunities can help retain talent and bring more industry to DC. My proposal to end federal income taxation for DC residents would also make the city more attractive to researchers who choose to live here.

- candidate_first_name: Denise
  candidate_last_name: Rosado
  state: dc
  race: US House of Representatives Non-Voting Delegate
