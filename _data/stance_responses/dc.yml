    For a senior who relies on refrigerated insulin or an oxygen concentrator, a power shutoff is a health emergency. That is why I will push to end utility shutoffs for residents who cannot pay and to create utility debt relief for households already behind. I Will also ensure no utilities are cut off during extreme weather events. Those steps stop the immediate harm.

    The longer answer is lowering what families use and changing who the grid answers to. I support the Healthy Homes Act to provide electric appliances at no cost to low-income residents, a Clean Heat Standard, and protecting the Sustainable Energy Trust Fund from budget raids. I oppose expanding fossil gas infrastructure that locks ratepayers into decades of rising costs. I also want DC to seriously evaluate public power, because a utility answerable to shareholders will always weigh returns against residents.

    On data centers, the principle is simple. Companies driving new demand on the regional grid should pay for the capacity they need, and DC residents should not subsidize that growth through their monthly bills. I will use Council oversight of the Public Service Commission to hold that line.

    Keywords: No Utility Shutoffs, Clean Energy, Ratepayer Protection

