    My goal would be to place the burden back on the organizations using the resources. 

    In Congress, there is legislation that is coming out of both chambers allowing this to be a bipartisan conversation. Data center in and around DC should first and foremost be required to provide accurate measures of energy consumption and heavy water intake so that we have a real understanding of what the centers are responsible for in comparison to the people of DC.

    Some of the Congressional legislation states that if a data center uses 100 megawatts or energy or more, they should be responsible for covering the cost of what the center consumes. 

    My goal would be to establish similar legislation within the bounds of DC to protect our citizens. We cannot wait for Congress to act so this would have to be a priority in the Council. Once the Council completes this legislation, I would call on Congress to do just the same for a federal level protection.

    Keywords: Congressional Action; Bipartisan

