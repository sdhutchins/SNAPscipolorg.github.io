    As a former AIDS Clinical Vaccine trial participant, I was in support of the NIH's work when I lost family members during the AIDS epidemic in DC where we had 12x the AIDS infection rate due to congressional interference that barred DC residents from using our tax money to fund needle exchange programs that were responsible for 30% of all cases. I was told that the money is not in a cure, it is in “treatment.” I was introduced to the conflicting concepts of “following the science" & "following the money" which represent two different lenses for evaluating truth: one focuses on empirical methodology, while the other examines economic or political incentives.

    So I have sacrificed my body & risked my health to the search for an AIDS vaccine. But I do not believe all vaccines are created equal. Therefore, I am against Vaccine mandates in the only industrialized country in the world that denies healthcare to all its citizens. Spain has one of the highest vaccination rates in the world w/o mandates. The United States & New Zealand are the only two countries in the world that legally allow pharmaceutical companies to market prescription drugs directly to consumers with product claims.

    Keywords: No Vaccine Mandates

