    Data centers should pay their own way. Residents should not face higher utility bills because large technology companies need enormous amounts of electricity and water.  I would advocate for requirements that data centers finance the additional power generation, transmission infrastructure, and water capacity their operations require. They should develop or contract for dedicated new energy supplies, including safely licensed advanced nuclear energy, such as small modular reactors where feasible. Until that capacity is available, they should cover the full additional costs they impose on the existing system.  I would also pursue enforceable agreements requiring data-center developers to contribute toward lowering residents’ electricity bills through bill credits or a resident energy fund. Any incentives offered to these companies should deliver measurable benefits to the community.  As Delegate, I would work with federal energy regulators and regional and DC officials to advance these protections. The goal is reliable power, fair allocation of costs, and lower bills for residents. Technology companies should finance their growth and contribute to the communities supporting it.

