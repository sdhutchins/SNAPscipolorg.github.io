    “Ai is 10x bigger & 10x faster than the impact of the industrial revolution.” - Bernie Sanders 

    Geoffrey Hinton “Godfather of artificial intelligence” says there is a 20% chance Ai will lead to human extinction in 3 decades. In April of this year at the US Capitol, I attended Bernie Sander’s “Existential Threat of Ai & the need for International Cooperation.” I learned there has been no serious effort to regulate Ai like was done to regulate nuclear weapons. The wealthiest people in the world are building a runaway train with no brakes & no guardrails. 

    Being based in the nation’s capital, I am particularly excited by the prospect of organizing broad based grassroots support towards an exit strategy. The perils of Ai using as much water as the bottled water industry, producing more carbon than NYC 
    eliminating millions of jobs in 10 years along with all privacy by monitoring every single transaction, email, post, text, call, etc., & the prospect of super-intelligent systems operating outside the bounds of its designer’s instructions all confirms the immediate need for brakes & guardrails. If the general public knew all this, they would take the fastest route to a moratorium on Data Centers & rapidly expand energy grid modernization.

