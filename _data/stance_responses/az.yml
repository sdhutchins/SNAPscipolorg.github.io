    I've been advocating for properly funding public education for nearly two decades. The statistics quoted above are an embarrassment for Arizona. Unfortunately, our current Republican-controlled legislative majority has set this course for several years. During the 2009 recession, Arizona lawmakers decided to balance the budget on the backs of public schools and we haven’t recovered yet. The legislature has prioritized private schools for far too long. They’ve refused to renew major sources of education funding (Prop 123). They refuse to address a 40+ year old spending limit for public district schools, causing districts to not know if they are able to spend the money that they’ve already received. Meanwhile, the Empowerment Scholarship Account program redirects state funds to private schools/homeschools, reduces the general fund, and subsidizes families that were already sending their children to private schools. Additionally, there are no requirements regarding what is being taught in these schools, and no state testing requirements. We don’t know what is being taught or how well it is being learned. 
    Science is an absolutely necessary subject that must be taught in K-12 education. The important element of teaching facts has become very important in these uncertain times. Teaching facts and explaining the scientific method for testing hypotheses are crucial concepts that need to be taught. Again, this has become even more important when ESA requests include purchasing flat earth curriculum. This is a frightening thought. We need good, dedicated science teachers teaching our students real scientific laws and theories.
