    Arizona’s extreme heat, mining waste, and water scarcity are symptoms of treating the desert as an unlimited resource for extraction and growth. AI data centers that consume vast amounts of water and electricity only intensify the problem.

    I support a steady-state approach based on ecological limits. That means strong protections for public lands, strict limits on new mining that contaminates water and leaves toxic waste, and full cleanup liability for existing operations. Water must be allocated according to science and long-term sustainability, not short-term industrial demand. Data centers and other heavy water users should face strict efficiency standards, public disclosure of consumption, and preference for locations and technologies that minimize desert impact - or be required to fund water-saving offsets.

    Carbon and pollution taxes that reflect true environmental costs would discourage wasteful energy use and encourage renewables and efficiency. Federal policy should prioritize restoring watersheds, protecting aquifers, and funding community-scale adaptation to heat rather than subsidizing more extraction.

    The Green pillars of ecology and social justice require us to stop externalizing costs onto the land, Indigenous communities, and future generations. Growth that depletes finite water and heat-stressed ecosystems is not progress. We need policies grounded in the reality of a desert climate, not the fantasy of endless expansion.

