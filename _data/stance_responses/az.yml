    The clearest way to free up resources is to cut the military budget by 90 percent, as I have long advocated, and redirect those funds toward civilian science and green technology. We do not need more advanced weapons systems; we need breakthroughs that help us live within planetary limits. I would prioritize competitive grants to universities, national labs, and independent researchers over no-bid contracts to large defense contractors. Public funding should come with open-data requirements and limits on exclusive private patents so the benefits are widely shared.

    I oppose using science budgets as corporate welfare. Innovation thrives when researchers can follow the evidence without political or donor pressure. That means protecting agency scientists, expanding peer-reviewed grant programs, and supporting collaborative international research on climate and biodiversity.

    A steady-state economy needs smart technology, not endless growth. Federal investment should focus on solving concrete problems - clean water, carbon reduction, habitat protection - rather than subsidizing industries that externalize their costs. Redirecting resources from militarism to science is both practical and necessary.

