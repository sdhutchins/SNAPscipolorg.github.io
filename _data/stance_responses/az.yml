    Public education is non-negotiable.

    Arizona’s public schools remain underfunded while billions of taxpayer dollars are being directed to Education Savings Accounts (ESAs). I will continue fighting to restore funding for neighborhood schools, strengthen oversight of ESA spending, and ensure every child—regardless of ZIP code—has access to a quality education.

    I support stronger guardrails for ESA funds, including closing unused accounts and returning those funds to public schools, appropriate eligibility requirements, restrictions on luxury purchases, and meaningful financial accountability. Taxpayer dollars should be used to educate Arizona’s children, not be vulnerable to waste or abuse.

    The study of science is equally essential—to a person’s education, to a healthy society, and to our ability to respond to the grave environmental and technological challenges we face.

    Science education should teach students how to think critically: how to ask questions, evaluate evidence, test ideas, understand uncertainty, and distinguish reliable information from unsupported claims. Science should be taught based on evidence and the scientific method, not political ideology.

    This is particularly important in Arizona, where our children will confront challenges including extreme heat, water scarcity, drought, pollution, public health, and emerging technologies such as artificial intelligence.

    Every Arizona student deserves a strong foundation in science, technology, engineering, and mathematics, preparing them not only for the jobs of today, but to understand and solve the challenges of tomorrow.

