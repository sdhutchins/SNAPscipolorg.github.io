   As a college professor and retired counseling psychologist with a Ph.D., I have spent nearly three decades trained to weigh evidence before drawing conclusions. That discipline will define how I legislate.

   First, I will establish a nonpartisan Science and Data Advisory Council for LD1, drawing on university researchers (including from the U of A system, NAU, and Yavapai College), public health professionals, water and land management experts, and healthcare providers, to review proposed legislation with a direct impact on public health, water security, education, or the environment.

   Second, I will require that any bill I sponsor affecting water policy, healthcare, education, or environmental regulation include a cited evidence summary, peer-reviewed research, agency data, or expert testimony, attached to the bill file for public review, not just committee testimony.

   Third, I will hold regular open office hours and town halls specifically inviting scientists, educators, healthcare workers, and researchers in LD1 to bring concerns and data directly to me, ensuring rural voices in STEM and healthcare fields aren't drowned out by Phoenix-centric lobbying.

   Fourth, I will support restoring and strengthening legislative staff capacity for independent research and fiscal/scientific analysis, rather than relying solely on industry-funded studies.

   Finally, I commit to transparency: when evidence conflicts with political convenience, I will say so publicly and explain my reasoning. Arizona's water crisis, wildfire risk, and public health challenges are too urgent for policymaking driven by ideology over evidence. My professional life has been built on evaluating evidence rigorously and honestly and that's exactly the standard I will bring to the Senate.  

