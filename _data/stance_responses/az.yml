    Arizona's environmental future depends on treating water, heat, and mining as connected problems with shared root causes: outdated regulation and a lack of independent scientific oversight.

    On water, my focus is rural equity: expanding meaningful groundwater accountability tools to areas like the Verde Valley that remain outside Active Management Areas, so rural aquifers aren't quietly drained while attention stays on Phoenix and Tucson. For large new water users, especially AI data centers, I support requiring public disclosure of projected water and energy draw before permitting, giving local communities a real say rather than facing decisions after infrastructure is already built.

    On extreme heat, I support directing state resources toward the communities with the least capacity to adapt, funding cooling centers, weatherization assistance, and enforceable heat-safety protections for agricultural and outdoor workers, based on tracked heat-illness and mortality data rather than statewide averages that obscure who's actually at risk.

    On mining, I support requiring independent, third-party water-quality monitoring near extraction sites, not self-reported industry data, and holding companies financially accountable for reclamation before permits are approved, not after damage occurs.

    What ties this together is process: I don't believe Arizonans should be told to trust that industry or agencies are managing these risks responsibly. I believe in independent verification, public transparency, and giving rural communities like LD1 a seat at the table before major water or land decisions are made, not after.

