    I believe good policymaking starts with good information. My academic training taught me to value the scientific method: ask clear questions, examine the evidence, test assumptions, recognize limitations, and be willing to change course when better information becomes available.

    In Congress, I would seek regular input from nonpartisan scientific and technical experts, researchers, federal scientific agencies, universities, and professionals working directly in the fields affected by legislation. For complex issues, I would support advisory groups that include subject-matter experts with diverse professional perspectives and clear conflict-of-interest standards.

    I would also expect my office to evaluate the quality of the evidence behind policy proposals, including whether findings have been peer reviewed, replicated, and supported by a broader body of research rather than relying on a single study or politically convenient statistic.

    Scientific evidence should not be selectively used to justify a predetermined position. When the evidence is uncertain or evolving, policymakers should be transparent about that uncertainty. And when new evidence shows that a policy is not working as intended, we should be willing to reassess it.

    Science will not answer every value judgment Congress has to make, but it should help establish the facts from which those decisions are made.

