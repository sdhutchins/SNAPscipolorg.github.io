    Arizona's public school funding crisis is well documented, and I take it seriously both as a candidate and as someone who values evidence based decision making. According to a 2025 Consumer Affairs analysis, Arizona ranked dead last in the nation for public school funding and 49th for student performance, with an average student to teacher ratio of 23 to 1, the highest in the country, and a high school graduation rate around 78 percent, also the lowest nationally. State data show Arizona spent about 12,371 dollars per student in fiscal year 2024, well below the national average and far below top spending states like New York. I believe adequate, sustained public school funding is a prerequisite for improving outcomes, and I support increasing per pupil funding, addressing teacher shortages through competitive pay, and reversing the trend of expanding voucher spending, which reached roughly 1 billion dollars last year, without a corresponding increase in public school investment. On science education specifically, my own background in biochemistry has shown me how early exposure to hands on, inquiry based science instruction shapes whether students pursue STEM fields later in life. I support restoring and expanding funding for K through 12 science lab equipment, teacher training in science curriculum, and partnerships between public schools and Arizona's research universities, so that students in Legislative District 25 have access to quality science education comparable to better funded districts elsewhere in the state.

