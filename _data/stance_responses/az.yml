    Yes. As a psychologist who has spent nearly three decades studying human development and behavior, I take the impact of social media on young people seriously, both the mental health effects and the way platforms can spread misinformation about science, health, and civic matters faster than accurate information can catch up.

    I support age-appropriate design and safety standards for platforms accessible to minors, including limits on manipulative engagement features, like infinite scroll and autoplay, that are specifically engineered to maximize compulsive use in developing brains, based on research these companies' own internal studies have confirmed.

    I support requiring greater transparency from platforms about how content is algorithmically promoted to minors, particularly around health and science misinformation, so parents, schools, and regulators can understand what's actually being amplified to kids.

    I support funding media literacy and scientific literacy education in Arizona schools, so students are equipped to critically evaluate what they encounter online rather than relying solely on platform-side fixes.

    I support stronger data privacy protections for minors, limiting what platforms can collect and monetize from young users.

    At the same time, any regulation must be written carefully to withstand First Amendment scrutiny and avoid outright bans that push kids toward less regulated corners of the internet or cut off legitimate access to information. My approach is evidence-based: age-appropriate design and transparency requirements, not blanket prohibition, paired with genuinely investing in kids' ability to think critically about what they see.

