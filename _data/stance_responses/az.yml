    Public health decisions must follow evidence, not ideology or politics. The measles outbreak in Arizona last year was preventable. Measles is highly contagious and dangerous, and the vaccine is safe and effective according to decades of scientific data.

    I support maintaining high vaccination rates through accessible, science-based immunization programs, strong public-health infrastructure, and clear communication grounded in evidence rather than misinformation. That includes adequate funding for state and local health departments, rapid outbreak response capacity, and protecting the ability of public-health agencies to act on the best available data without political interference.

    Broader access to care also matters. Medicare for All would remove financial barriers that keep people from preventive services, including vaccines and routine check-ups. Healthy communities are more resilient when everyone can get care without worrying about cost.

    I would oppose efforts to weaken vaccine requirements or undercut scientific agencies for political reasons. At the same time, public trust depends on transparency: open data, honest discussion of risks and benefits, and accountability when systems fail. Prevention works best when it is rooted in evidence, equity, and community confidence rather than coercion or corporate influence.

    Ecology and social justice are linked here too - healthy people need healthy environments and reliable public systems.

