    As a state senator, I would not control federal appropriations directly, but I can use the office to advocate for Arizona's research institutions and to protect state level investments that complement federal funding. In fiscal year 2026, Congress rejected the White House's proposed cuts to the National Institutes of Health and the National Science Foundation, instead increasing NIH funding by 415 million dollars and reducing the NSF budget by only 310 million dollars rather than the proposed 5 billion dollar cut. I will use my position to formally communicate with Arizona's congressional delegation, urging them to continue rejecting deep cuts to NIH, NSF, NASA, and Department of Energy Office of Science budgets in future appropriations cycles, since Arizona's universities and hospitals rely heavily on these grants for research jobs and student training. At the state level, I will support increased funding for the Arizona Board of Regents research initiatives, including efforts like the University of Arizona's Tailings Center, which is using a 3.6 million dollar ABOR funded grant to study whether the state's mine waste can be reprocessed for critical minerals. I will also support state matching grant programs that help Arizona institutions compete for federal research dollars and workforce development funding tied to STEM fields. Protecting graduate fellowship and research assistant pipelines matters directly to Arizona's economy, since our universities depend on a stable federal and state funding relationship to retain talent and remain competitive nationally.

