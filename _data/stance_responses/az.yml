  question: az-q6
  date: 2026-09-21
  response: |
    Arizona must do better for our students. Our own state budget documents acknowledge that Arizona ranks near the bottom nationally in education funding effort, and Arizona’s four-year graduation rate remains a serious concern.

    As Governor, I support increasing investment in K-12 public education while also ensuring that education dollars are transparent, accountable, and reaching classrooms. I want to improve teacher pay and retention, reduce class sizes, strengthen special education resources, and ensure students have access to quality educational opportunities regardless of their ZIP code. I also support school choice and believe families should be able to choose public, charter, online, private, or homeschool options that best meet their children's needs.

    Science must remain an important part of K-12 education. Arizona already has statewide science standards spanning kindergarten through high school that incorporate science and engineering practices. I want students learning not only scientific facts, but how to ask questions, evaluate evidence, test ideas, understand data, and distinguish credible information from unsupported claims.

    Arizona’s future workforce will increasingly depend on STEM skills. We should expand hands-on science, technology, engineering, mathematics, computer science, and career-technical opportunities while creating stronger partnerships between schools, universities, community colleges, and Arizona employers.

    Education should prepare students to think critically—not tell them what to think.

