      I would like to see a moratorium on all data centers in Tennessee. Over half of our waterways are already impaired and it is imperative that we protect our resources for future generations. When elected I will have to work with the GOP, who is pushing data centers. I will do everything I can to curb the growth of them in our state and protect our natural resources. I will also introduce amendments to any bills allowing data centers that will require any costs for energy and infrastructure requirements including water treatment be paid for by the data centers to ensure those costs are not passed on to hardworking Tennesseans and our resources are protected.

