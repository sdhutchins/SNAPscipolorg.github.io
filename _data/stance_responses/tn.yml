  response: |
      A1: Protecting Tennessee’s Electricity, Water, and Air Quality

      I support an immediate moratorium on new data center development and major expansions until independent, comprehensive research can determine their long-term effects on our electricity bills, water supply, public health, and environment.

      My position is simple: Tennessee’s natural resources must serve the people of Tennessee first, not be sacrificed for the profits of large technology corporations.

      I would support the following policies:

      1. Protect ratepayers. Require data center operators to pay the full cost of the electricity, transmission infrastructure, and grid upgrades their facilities require. Residential customers should not be forced to subsidize these corporations through higher utility bills.
      2. Protect our water supply. Require independent assessments of water consumption, groundwater and river impacts, drought risks, and future community needs before any project is approved. No data center should be permitted to consume water at a level that threatens residents, farmers, or local businesses. Require water conservation, recycling, and transparent reporting.
      3. Protect our air quality. I oppose unchecked reliance on gas turbines and other fossil-fuel-powered generation that increases pollution and greenhouse gas emissions. All power sources must meet strict environmental standards, with enforceable emissions limits, independent monitoring, and meaningful penalties for violations.
      4. Protect our climate and public health. Require a full environmental impact assessment that examines carbon emissions, air pollution, water use, noise, and cumulative impacts on surrounding communities. We must prioritize energy efficiency, responsible renewable energy development, and cleaner power solutions that protect public health without compromising grid reliability.
      5. Require transparency and public accountability. Before approving new projects, require independent studies, public hearings, and full disclosure of projected electricity and water consumption, pollution levels, and infrastructure costs. Communities deserve a meaningful voice in decisions that affect their health and future.

      My moratorium would remain in place until the necessary research is completed, the public has had an opportunity to participate, and enforceable safeguards are established. I will not support allowing development to move forward simply because a corporation promises jobs or economic growth.

      Innovation should improve our quality of life, not threaten our access to affordable electricity, clean air, and safe water. Tennessee’s people and environment must come first.
    
    
