      Tropical Storm Helene showed us the devastating consequences of severe weather, and the winter storms that followed reinforced how vulnerable our infrastructure can be. In East Tennessee, preparing for the next disaster means investing in systems that protect lives before a storm hits, not just responding after tragedy strikes.

      First, I would pursue an automated flood-warning system for vulnerable communities. In rural areas of our district, entire communities have little or no cellular service, and falling trees can knock out electricity and this outside communication. Residents cannot depend on phone alerts when they have no signal or power. I would support installing water-level sensors at flood-prone creeks, rivers, and other critical locations that automatically activate outdoor sirens and visual warning signals when water reaches predetermined danger levels. These systems should have battery or solar backup, routine testing, and redundant communication methods so they can operate during power and cellular outages. Warnings should not depend solely on someone noticing rising water and reporting it. Seconds matter when flash flooding strikes.

      Second, I would invest in stronger electrical infrastructure. I would push for targeted undergrounding of power lines where practical, improved vegetation management along utility corridors, stronger poles and equipment, and upgrades to vulnerable substations. I would also support public grid-resilience plans that identify repeat outages, prioritize the most vulnerable communities, and establish clear restoration and accountability measures. We should use available state and federal resilience grants to help local utilities make these improvements.

      Third, I would expand reliable telecommunications in rural communities. I would work to expand broadband and cellular coverage while requiring emergency communications planning to account for outages. Critical facilities, including emergency shelters, hospitals, and emergency management offices, should have backup power and redundant communications. Rural residents should also have access to NOAA Weather Radios and other warning methods that do not depend on a cell phone.

      Fourth, I would strengthen local disaster preparedness and recovery. I would support better coordination between TEMA, local emergency management agencies, utilities, and first responders; regular community evacuation and warning-system drills; and emergency plans for residents who need transportation or assistance evacuating. I would also push for timely recovery funding and rebuilding infrastructure to withstand future storms rather than simply replacing what failed.

      I grew up here, and I know our mountain communities. We cannot prevent every storm, but we can make sure our people have a better chance of surviving one. No community should be left without a warning simply because it lives in a rural hollow with no cell service. Preparing for disaster is not just about repairing roads and restoring electricity. It is about making sure people get home safely to their families.
       
