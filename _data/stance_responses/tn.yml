  response: |
      Teachers leave over pay, workload, and support, and science teachers have the most options. I support these four policies, all paid for by ending vouchers and returning that $304 million a year to public schools.
      
      First, pay. Tennessee's $50,000 floor is now law, but I'd index it to inflation so it doesn't erode.
      
      Second, workload. Teachers tell me they're doing the jobs of counselors and social workers. I project we can hire up to ~800 of them toward the recommended 250-to-1 ratio, starting in the schools with the highest combined vacancy and emergency-credential rates.
      
      Third, support. I'd fund two full years of trained coaching for every beginning teacher. The largest trial of teacher induction found that support through the second year was essential for student achievement, so that's what we'll fund.
      
      Fourth, retention. Tennessee's own $5,000 Priority-school bonus worked for top-rated teachers in tested subjects, but nowhere else. So I'd pay it there, and keep paying it for three years if the school exits Priority status so success doesn't lead to a pay cut.
      
      I'm open to a science-specific differential if districts show it closes vacancies.

