      I believe scientific research is essential to America’s future, and I support responsible federal investment in institutions such as Oak Ridge National Laboratory, the University of Tennessee, Vanderbilt University, and other research institutions throughout our nation.

      My priority would be to ensure that research funding benefits Americans at every level—not just large universities, major laboratories, or corporations. Scientific discovery should create opportunities for rural communities, historically underserved populations, small colleges, local healthcare facilities, farmers, and the next generation of scientists and skilled workers.

      I would support funding for the Department of Energy, the National Institutes of Health, and the National Science Foundation when investments advance medical breakthroughs, improve energy efficiency, strengthen national security, protect our environment, and create good-paying American jobs. I particularly believe we should invest more in finding cures for diseases such as Alzheimer’s and other conditions that place enormous burdens on families and our healthcare system.

      At the same time, federal research dollars must be distributed fairly, spent responsibly, and subject to transparency and accountability. I would support expanding access to grants, apprenticeships, internships, and workforce training so that students and working people across Tennessee can participate in the benefits of scientific advancement.

      Research is good, but it should happen at every level and benefit every community. My goal is to ensure that federal science funding produces meaningful results for everyday Americans, strengthens Tennessee’s economy, and helps us build a healthier, safer, and more prosperous future for everyone.


