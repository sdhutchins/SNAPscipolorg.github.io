      Q5: Trust in Science — Transparency, Integrity, and Accountability

      I believe science is essential to making sound public policy. Science may not have been one of my strongest subjects in school, but I understand its importance in helping us make informed decisions that affect people’s lives, our economy, our environment, and our future. As a policymaker, I do not have to be the scientist in the room, but I do have a responsibility to listen to qualified experts, examine the evidence, ask questions, and make decisions that serve the public interest.

      I believe restoring trust in science begins with honesty, transparency, accuracy, and accountability. Scientists and policymakers must work together, but that relationship must be built on credible research rather than political pressure, corporate interests, or personal agendas.

      First, I believe scientists must communicate their findings in language that everyday people can understand. Research should not be limited to academic journals, university laboratories, or government reports that the average person may never read. When scientific findings affect our drinking water, electricity bills, healthcare, food supply, air quality, or children’s safety, the public deserves clear explanations of what the research shows, what it does not show, and how those findings may affect their lives.

      Second, I believe scientific research must be accurate, independent, and free from manipulation. There should be no room for changing data, concealing unfavorable findings, exaggerating results, or presenting incomplete information simply because someone wants the public to believe a particular narrative. Research should be evaluated on its methods, evidence, and results—not on whether it supports a Republican or Democratic agenda, benefits a corporation, or advances an individual’s political position. Scientists must be free to report their findings honestly, even when those findings are inconvenient to people in power.

      Third, I believe policymakers must be willing to listen to scientists while also asking responsible questions. Trust does not mean blindly accepting every claim made by someone with a scientific title. It means examining the quality of the evidence, understanding the limitations of a study, considering whether independent researchers can reproduce the results, and being willing to correct our decisions when new evidence becomes available. Science is a process of investigation and learning. When evidence changes, responsible policy should be able to change with it.

      Fourth, I support greater collaboration between scientists, policymakers, and the communities affected by government decisions. We should establish opportunities for independent experts to brief lawmakers, hold public forums, explain emerging research, and answer questions directly from residents. Community members should also have opportunities to raise concerns and learn how scientific evidence was used to reach a policy decision. This is particularly important in underserved and rural communities, where people may feel that decisions are made about them without their participation.

      Fifth, I believe federal research funding must be protected from political interference while remaining accountable to taxpayers. Agencies such as the National Institutes of Health, the National Science Foundation, and the Department of Energy should be able to support credible, independent research based on scientific merit and public need. Funding decisions should be transparent, conflicts of interest should be disclosed, and research misconduct should have consequences. At the same time, the public deserves to know how its tax dollars are being spent and what benefits the research is expected to provide.

      Finally, I believe we must teach scientific literacy and critical thinking from an early age. Our children should learn how to distinguish credible evidence from misinformation, understand the difference between a scientific finding and an opinion, and ask thoughtful questions without being discouraged from learning. An informed public is better equipped to participate in democracy and hold elected officials accountable.

      My position is simple: science should inform public policy, evidence should guide our decisions, and integrity must never be sacrificed for political convenience. I respect the work of scientists, but I also believe their research must withstand independent scrutiny. There is no place for deliberate manipulation when people’s health, safety, livelihoods, and futures are at stake.

      As a member of Congress, I would work to build a stronger partnership between the scientific community and the public we serve. We may not all have scientific degrees, but we all deserve access to accurate information and the opportunity to understand the decisions that affect our lives. Restoring trust requires scientists who communicate honestly, policymakers who listen responsibly, and a government that puts truth and the public interest above politics.

