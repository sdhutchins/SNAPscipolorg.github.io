      Policymakers, state legislators included, should not be adding fuel to the fire here. Science has become politicized, which puts the health of our people and planet at risk. State legislators should not be furthering this divide by introducing bills such as Bulso's House Joint Resolution 28 that would further decrease the rate of vaccination in TN. Legislators should be relying on the scientific community to provide the state with the data we need to make good policy that preserves the physical welfare of our state and our local ecosystems. Scientists and policymakers can collaborate to educate the public in ways that are fun and engaging to repair public trust in science.
