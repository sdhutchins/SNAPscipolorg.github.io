      I want Tennessee to help build an age of intelligence whose prosperity reaches the people powering it. I would propose an AI Prosperity Fund: companies receiving state incentives would negotiate enforceable contributions, with a portion of net proceeds reserved for a resident dividend. I would also pilot voluntary computing nodes in homes and businesses, allowing participants to earn revenue from useful computing work after electricity and equipment costs. We would test these models openly before expanding them. Over time, shared ownership and revenue could help lay a foundation for broadly shared income as automation changes work. That future must begin with sound infrastructure. I would work with TVA and utilities on contracts requiring data centers to cover their additional grid costs, provide financial guarantees, and shift flexible workloads during peak demand. Turbines would need rigorous emissions controls and neighborhood monitoring; communities would retain meaningful siting authority. Success means residents gaining income while their electricity remains affordable and their air remains healthy. A child growing up beside this industry should inherit a share of its opportunity.

