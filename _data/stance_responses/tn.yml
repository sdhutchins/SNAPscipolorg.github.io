      A3: Flooding and Extreme-Weather Resilience — Investing in Tennessee’s Future

      I believe Tennessee must take a balanced, practical approach to preparing our communities for severe weather. We cannot prevent every storm, but we can invest in stronger infrastructure, improve maintenance, and prepare our communities to recover more quickly.

      First, I support increased investment in our roads, bridges, drainage systems, stormwater infrastructure, and electrical grid. Too much of Tennessee’s infrastructure is aging and deteriorating, particularly in Memphis, where improvements are needed to protect neighborhoods from flooding and ensure reliable public services. We must prioritize repairing crumbling infrastructure before it becomes an even more expensive emergency.

      Second, we must do a better job maintaining our existing utility systems. Overgrown brush, dead trees, and unsafe limbs near power lines can contribute to outages during high winds and ice storms. I support regular vegetation management and responsible tree trimming by utility companies, with appropriate environmental safeguards and professional oversight. Preventive maintenance is often less expensive than restoring power after a disaster.

      Third, I support strengthening flood-control systems, improving stormwater drainage, protecting vulnerable neighborhoods, and ensuring that new development does not unnecessarily increase flood risks. Communities recovering from devastating storms deserve the resources and technical assistance needed to rebuild more safely and resiliently.

      Finally, I would work to improve emergency preparedness, coordinate state and local response efforts, and ensure that seniors, people with disabilities, rural residents, and low-income families are not left behind during prolonged power outages. We must also explore practical ways to strengthen grid reliability and diversify energy resources so Tennessee can better withstand severe weather.

      My approach is simple: invest in our infrastructure, maintain what we already have, and prepare before disaster strikes. Responsible planning and preventive maintenance can save taxpayer money, protect lives, and help Tennessee communities recover faster when severe weather comes.


