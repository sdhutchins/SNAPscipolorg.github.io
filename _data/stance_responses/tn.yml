  response: |
      Every year we wait on climate action, storms like Helene get more expensive. That's why it's the centerpiece of my plan. Here are three ways to address climate resilience.
      
      First, we need to harden our water systems. Helene disrupted 24 drinking water facilities in East Tennessee. I'd retrofit them to withstand the next flood, obligate the $202.5 million in federal lead pipe money Tennessee is sitting on before the 2027 deadline, and backfill expiring federal loan forgiveness so small water systems aren't stranded.
      
      Second, we need to harden the grid. Every major storm knocks out power to hundreds of thousands of homes, and we rebuild the same lines. I'd start burying power lines in the highest-damage corridors with a pilot funded half by federal grid resilience grants, track outage data, and expand on the evidence.
      
      Third, we need to get warnings into homes. The Cookeville tornado and the Waverly flood killed people who never got the alert. I'd run a 95-county emergency management assessment, pilot last-mile warnings so the state's new mesonet reaches people at 2 a.m., and build a live shelter inventory families can check before the storm.

  
