  did_not_respond: false # optional, default false; true = never responded at all. Must be the same on every row for a given candidate
  response: |
      I’m in favor of regulations, no matter how strict, that actually protect our people, our land, and our pocketbook from the harmful effects of data centers. If a company wants to build data centers are to be built in Tennessee, they have to offer proof that the facilities will have no ill affect on air quality, water quality/availability, or power availability. They also have to provide proof that light and noise/vibration pollution will not extend past a designated point from their facility. If regulations are not adhered to, there is clear shutdown authority. Facilities would not be permitted to operate if there are negative impacts like those listed above, and the owning companies would be responsible for full decommissioning and cleanup of the site. Independent studies from groups chosen by municipal or state officials and funded by the company should be conducted beforehand to ensure that the power grid can handle the projected load of the data center. Any necessary improvements to the grid will be paid for by the company before construction of the data center.

