      The onus should be on tech companies to use closed-loop systems that do not pass costs and environmental downsides on to Tennessee residents and wildlife. We need regulations on the federal, state, and local level to ensure that data centers are implementing renewable energy sources whenever possible and using emissions capture and filtration wherever there is significant risk of air pollution to surrounding communities or ecosystems. 

      We also need a broad  set of overhauls of our energy systems in general, like those introduced in the Inflation Reduction Act. As is being illustrated by our current economy, we need to be relying on energy sources that aren't subject to wild fluctuations due to fuel costs.

