      A2: Childhood Vaccination — Protecting Parental Rights, Religious Freedom, and Public Health

      I believe parents should have the right to make informed decisions about their children’s healthcare without government tyranny or unnecessary government interference. I am not against vaccinations. I recognize that vaccines have played an important role in preventing serious diseases, and vaccines such as those for measles, mumps, and rubella have a substantial body of scientific evidence supporting their safety and effectiveness.

      However, I also believe that public trust in medicine must be earned through transparency, honest communication, and respect for individual freedom.

      I support a parent’s right to make informed vaccination decisions based on their child’s medical needs, family circumstances, religious convictions, and cultural beliefs. Public health policies must recognize that Tennessee is home to diverse communities with different traditions, values, and concerns. Those beliefs should be heard and considered rather than dismissed.

      I would support independent scientific research, transparent reporting of vaccine benefits and risks, accessible healthcare consultations, and public education that helps families make informed choices. I would also support reviewing vaccine requirements and exemptions to ensure that policies are medically justified, fairly administered, and respectful of constitutional and parental rights.

      When disease outbreaks occur, the government should prioritize accurate information, voluntary testing, access to treatment, and community-based public health responses. Any restrictions on individual liberty should be carefully justified, proportionate to the actual risk, and subject to appropriate legal safeguards.

      My position is not anti-vaccine; it is pro-choice, pro-parent, and pro-transparency. I believe science should inform our decisions, but government should not silence questions or treat parents as incapable of making responsible decisions for their children. We can protect public health while respecting parental authority, religious freedom, cultural diversity, and individual liberty.

      The goal should be to build trust between families, healthcare professionals, and public health agencies—not to govern through fear or coercion.


