      As a healthcare professional, I believe vaccines are an important tool for preventing serious illness and protecting public health. At the same time, I believe parents have the ultimate say in making medical decisions for their children.

      I would support specific measures to improve vaccination rates without abandoning that principle. These include expanding access to affordable vaccines through rural health departments and mobile clinics, funding evidence-based public education, strengthening immunization recordkeeping, and ensuring local health departments have the resources to investigate and respond quickly to outbreaks.

      I support maintaining Tennessee’s existing school immunization requirements and legitimate medical exemptions, while respecting parents’ rights under current law. During an outbreak, public health officials should have the resources to provide timely warnings, identify exposures, and implement appropriate measures to protect vulnerable people.

      I would also support publishing accurate county-level vaccination data to identify gaps and direct resources where they are most needed. The goal should be to build trust, remove barriers to vaccination, and prevent avoidable illness and deaths, not shame families or turn healthcare into a political fight.

      As a respiratory therapist, I have seen how serious illness affects patients and their families. I believe we can respect parental decision-making while taking evidence-based steps to protect Tennessee’s children and communities from preventable diseases.

