      I would also support partnerships between Tennessee colleges and local school districts to create affordable pathways into teaching, paid teacher residency programs, competitive salaries, mentorship, and better funding for classroom supplies and science labs. Emergency credentials may fill an immediate vacancy, but they should not become a permanent solution to teacher shortages.

      Finally, I would push for transparent, district-level reporting on vacancies and turnover so state funding reaches the schools that need it most. Our rural students deserve the same opportunities as everyone else, and that starts with investing in the teachers who prepare them for the future.

- candidate_first_name: Sheila
  candidate_last_name: Mcmahan
  state: tn
  race: State House of Representatives
  district: 11
  party: Democratic
  question: tn-q6
  date: 2026-10-16
  primary_candidate: false
  response: |
      I believe scientists and policymakers need to work together through open communication, transparency, and public education. I would support partnerships between Tennessee universities, healthcare professionals, and state agencies to make scientific research more accessible and explain how it affects everyday Tennesseans, from public health and clean water to agriculture and severe weather preparedness.

      Policymakers should make decisions based on credible, peer-reviewed evidence while remaining willing to ask questions and hear from the communities affected. Scientists should communicate findings in plain language, acknowledge uncertainty, and make their research accessible to the public.

      As a respiratory therapist, I see how important evidence-based information is to people's health and well-being. Science should not be a partisan issue. We may disagree on policy, but we should be able to agree that decisions affecting people's health, safety, and future should be informed by reliable evidence, not political pressure or misinformation.


