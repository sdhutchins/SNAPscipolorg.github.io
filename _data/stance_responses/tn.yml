  response: |
      I do not support data centers moving into our rural communities, taking advantage of tax breaks, straining our electric grid, and putting our environment and public health at risk. These facilities can consume enormous amounts of electricity while creating relatively few permanent jobs. I question whether the benefits justify the costs our communities are being asked to bear.

      Protecting electricity bills and grid reliability: I would support strengthening Tennessee’s existing data center infrastructure law, Public Chapter 961, to ensure companies pay the full cost of the additional generation, transmission lines, substations, and other infrastructure they require. I would also introduce an “If You Break It, You Buy It” resolution to advance enforceable protections requiring data centers to demonstrate grid readiness before beginning operations. If inadequate planning leads to grid failures, emergency repairs, or additional infrastructure costs, the company responsible should pay instead of passing those costs on to ratepayers and taxpayers. I would push for independent grid-impact assessments, public reporting, and enforceable reliability requirements before these projects are allowed to proceed.

      Protecting our air and public health: As a respiratory therapist, I know firsthand how respiratory illness affects patients and families. The gas turbines powering data centers in the Memphis area have raised serious concerns about nitrogen oxide emissions, ozone formation, and respiratory health after increasing asthma/COPD exacerbations. I would push for stricter emissions oversight, comprehensive permitting, continuous emissions monitoring where appropriate, public access to emissions data, and meaningful penalties for violations. I would also support closing loopholes that allow large-scale power generation to escape appropriate scrutiny simply because companies characterize their turbines as temporary or emergency equipment. Our environmental standards must protect people, not bend to accommodate corporations.

      Protecting taxpayers and local communities: I would scrutinize tax abatements and other public incentives, require transparent reporting of promised versus actual permanent jobs, and support ending subsidies for projects that fail to deliver their promised public benefits. Rural communities should have meaningful input into land-use decisions, and I would support stronger safeguards against approving projects that threaten local water resources, infrastructure, or quality of life.

      I recognize that Tennessee has already taken steps to address some of these concerns, and I would build on those protections rather than pretend the work is finished. I would also work with TVA, local utilities, environmental regulators, and local governments to ensure that growth does not come at the expense of the people who already call these communities home.

      Our rural communities are not sacrifice zones. I will not support handing corporations tax breaks while our people are left with higher bills, unreliable electricity, polluted air, and the health consequences. If a company wants to operate here, it should be responsible for the costs and consequences of its own operations. Our people and our future must come first.
    
