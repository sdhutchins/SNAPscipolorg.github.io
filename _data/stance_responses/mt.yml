    As an Independent candidate for office, I favor technology-neutral policies that encourage innovation. I will support federal research into emerging technologies, faster permitting for responsible energy and transmission projects, and policies that boost new development, strengthens grid reliability and protects against consumer cost increases. **Climate Change is Real**

    America needs a diverse, reliable, and increasingly clean energy system. As electricity demand grows, nuclear power and renewable energy should play a much larger role in meeting that demand. I support expanding nuclear power because it provides reliable and clean power, that once built will produce for decades at very low generation costs. We need to modernize and streamline federal nuclear permitting while maintaining strong safety standards, and invest widely in small modular reactors.

    I do support significant growth in wind, solar and geothermal energy, along with battery storage and other technologies that make renewable power more reliable. Montana has enormous potential for renewable and clean energy, creating opportunities for investment, jobs, and rural communities.

    In the end, I believe that we need to increase American energy production, reduce emissions, strengthen energy independence, protect national security, and keep electricity reliable and affordable. We can and must act responsibly, to protect both America's energy future and our environment.

    Keywords: Small Modular Nuclear, Renewable Energy, Innovation, Research, Climate Change is Real

