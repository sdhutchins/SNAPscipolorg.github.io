  response: |
    Pesticide policy must be based upon sound science, transparent evidence, and a balanced assessment of agricultural productivity and public health. Montana farmers need effective tools to protect crops and maintain food production, but those tools must not pose unacceptable risks to people or the environment.

    As an Independent Representative, I will support targeted restrictions when credible scientific evidence demonstrates unacceptable risks, rather than blanket bans without adequate justification.

    As a trained physician and science-based thinker in Congress, I will examine:
    • Human health: Peer-reviewed studies examining cancer, reproductive effects, neurological impacts, and risks to children and agricultural workers.
    • Environmental impacts: Monitoring of pesticide residues in food and drinking water, soil persistence, runoff, and effects on pollinators, wildlife, and aquatic ecosystems.
    • Agricultural and economic effects: Data on crop yields, pest resistance, production costs, and food prices, particularly for Montana’s wheat, barley, soybean and pulse crops.
    • Independent scientific reviews: Findings from the EPA, universities, expert testimonials and agricultural research institutions – including uncertainties and gaps in available evidence.

    My goal is to protect public health while preserving Montana agriculture’s competitiveness, and our long-term public health. Farmers deserve practical, affordable options, and consumers deserve confidence in their food and water.

    Keywords: Public Health, Ag Economy, Ag Productivity, Pesticide Safety

