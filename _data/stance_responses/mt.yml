    Absolutely, yes. K–12 schools, community colleges, tribal colleges, and Montana’s universities can and should play a critical role in strengthening science, technology, engineering, mathematics, and research across our state. They are also essential to developing the workforce Montana needs for the future.

    As an Independent Representative in Congress, I will support legislation to:
    • Expand STEM education in rural and underserved schools, including modern laboratories, equipment, robotics, and computer science.
    • Strengthen career and technical education and dual-enrollment programs so students can earn college credit and industry credentials while in high school.
    • Expand partnerships among schools, community colleges, universities, businesses, national laboratories, and Montana’s agricultural, energy, technology, and healthcare industries.
    • Increase research opportunities at community colleges and regional institutions, particularly research addressing Montana priorities such as agriculture, energy, water, forestry, mining, and rural healthcare.
    • Support STEM teachers and instructors through scholarships, professional development, and incentives for rural service.
    • Expand apprenticeships, internships, and paid research opportunities for Montana students.
    • Promote broad-band access everywhere in Montana.

    Federal funding should be competitive, accountable, and focused on measurable outcomes. Together, our goal must be to keep Montana students in Montana, prepare them for good-paying careers, strengthen our research capacity, and build the scientific and technical workforce necessary for Montana’s economic security.

    Keywords: STEM, Partnerships, Research, Invest in MT Students

- candidate_first_name: Michael D.
  candidate_last_name: Eisenhauer, MD
  state: mt
