  response: |
    I spent a career building cases, so my instinct is to ask what the evidence actually shows rather than what either side wants it to show. On pesticides I would start with the peer-reviewed record and the agencies' own data: EPA registration reviews, USGS water monitoring, USDA and NIH research, and the residue testing already underway.

    Where the science is contested I want to know who funded the study, what the exposure route was, and whether farmworkers and applicators were included, because they carry the highest exposure and are most often left out of the analysis.

    Two things I will not do. I will not set policy on a chemical because the company selling it wrote the summary. And I will not dump the cost of uncertainty on a family operation that followed the label in good faith: if a product has to come off the market, transition support and research into alternatives come with it.

    Montana's water is not for dumping. Where contamination traces to a responsible party, that party pays for the cleanup, not the neighbors downstream.

    Keywords: peer review, applicator exposure, polluters pay

