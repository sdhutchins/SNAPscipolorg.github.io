  question: mt-q3
  date: 2026-10-12
  primary_candidate: false
  response: |
    Montana’s wildfire policy must focus on prevention, responsible land management, rapid response, and community protection. Large fires threaten lives, homes, wildlife and wilderness areas, watersheds, domestic herds, and local economies. We must invest into reducing risks before fires start, but also ensure firefighters have the resources to respond effectively.

    As an Independent Representative in Congress, I will support federal legislation to:
    • Strengthen federal-state partnerships: Improve coordination among the U.S. Forest Service, Montana DNRC, tribal governments, counties, and private landowners to manage fire risks across property boundaries.
    • Improve accountability: Prioritize federal funding for projects that demonstrate measurable reductions in fire risk and protect lives, infrastructure, and forest health.
    • Reduce hazardous fuels: Expand targeted forest thinning, prescribed burns, and removal of excess dead vegetation while protecting air quality, watersheds and wilderness areas.
    • Support rural fire departments: Invest in equipment, training, staffing, communications, and rapid initial response, particularly in remote areas.
    • Protect homes and communities: Support state-based projects for defensible space, fire-resistant construction, and community wildfire protection projects.

    We must move from a reactive approach to a proactive strategy that reduces risk. Montana families, ranchers, firefighters, and communities deserve more than promises —they deserve action, preparation, and responsible stewardship of our land before the next wildfire begins.

    Keywords: Federal-State Partnerships, Proactive Strategy, Stewardship, Wilderness protection, Risk Mitigation

- candidate_first_name: Michael D.
  candidate_last_name: Eisenhauer, MD
