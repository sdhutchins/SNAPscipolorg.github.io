- candidate_first_name: Alani
  candidate_last_name: Bankhead
  state: mt
  race: US Senate
  party: Democratic
  question: mt-q1
  date: 2026-10-02
  primary_candidate: false
  response: |
    Montana should build the energy that lowers bills and keeps the money here. I would restore the clean-energy tax credits Congress cut short in 2025 and protect the direct-pay option that lets our rural electric co-ops actually use them for solar and storage. Incentives, never mandates: a co-op or a landowner should choose what pencils out rather than be told.

    The pressure on our grid is not coming from households. Roughly 1,400 megawatts of data-center load has already been signed in this state. My rule is that new large loads pay 100 percent of their own grid upgrades, through the FERC large-load rulemaking in Docket RM26-4, and buy their own power instead of islanding off a grid Montana families paid for.

    I would steer federal energy and workforce dollars to our public universities, community colleges and tribal colleges, and guarantee research computing for Montana institutions and startups rather than shipping that value out of state.

    On new nuclear in Montana I want the cost, water and waste questions answered in public, with the numbers on the table, before I commit to a position I would have to defend for a decade.

    Keywords: co-ops, cost-shifting, research capacity

- candidate_first_name: Alani
  candidate_last_name: Bankhead
  state: mt
  race: US Senate
  party: Democratic
  question: mt-q2
  date: 2026-10-02
  primary_candidate: false
  response: |
    Yes, and right now Montana is starving the institutions that would do it. Our starting teacher pay is about $36,682, dead last in the nation. You cannot ask a school to build the next generation of scientists while paying the person at the front of the room less than any other state does. Raising that floor is where science education in Montana starts.

    Beyond pay, I would protect the federal programs that put working labs and current equipment in rural schools, and fund dual-enrollment and career-technical pathways so a student in a small town can take real college science before graduating.

    Our community colleges and tribal colleges are the most underused assets we have. For a lot of Montanans they are where research first becomes something you can touch.

    I would also make the companies that want Montana's power and water pay into this. Every data-center project should put a set share into local education, research and nonprofits, and partner with our universities, community colleges and tribal colleges to train a homegrown technical workforce.

    Keywords: teacher pay, tribal colleges, dual enrollment

- candidate_first_name: Alani
  candidate_last_name: Bankhead
  state: mt
  race: US Senate
  party: Democratic
  question: mt-q3
  date: 2026-10-02
  primary_candidate: false
  response: |
    Protect the home and the town first. More than half of Montana's properties are vulnerable to wildfire, second-highest in the nation, and families in fire country are losing insurance coverage over it.

    So fund the work closest to the house first: home hardening and defensible space, including grants that reach renters and families who cannot front the cost. Then fuels treatment in the buffer zones between towns and the backcountry. Real thinning takes out the small crowded trees and the brush that let a ground fire climb into the crowns, and leaves the big ponderosa and larch that have already shrugged off fire standing.

    Fund science-based fuels reduction and prescribed fire to head off high-intensity megafire, and defend the Roadless Rule rather than bulldozing roads into backcountry under a wildfire banner. Intact backcountry burns less severely, and every new road is one more place a fire starts.

    Prescribed fire done right means burning under the right conditions of weather and ground, and never lit and left. That is how the tribes have always done it, and I would back tribal-led fire work.

    More than eight in ten Montana fire departments are all-volunteer. Pay and protect the people who show up.

    Keywords: home hardening, good fire, volunteer firefighters

- candidate_first_name: Alani
  candidate_last_name: Bankhead
  state: mt
  race: US Senate
  party: Democratic
  question: mt-q4
