- candidate_first_name: Christopher
  candidate_last_name: Baumgartner
  state: sd
  race: State Senate
  district: 33
  party: Democratic
  question: sd-q6
  date:
  response: |
    "Honestly, If data centers are somehow built here, they belong along the Missouri River, where cooler conditions and hydropower can support them.
    
    These rules must be state law. One community can ban data centers while another a few miles away signs a deal that raises everyone's power rates and drains shared water. First, they pay their own way. Big users must cover new power lines and generation so families don't see higher bills.
    
    Second, protect our water. Projects must use closed loop or low water cooling and report usage publicly.
    
    Third, keep the grid reliable. Regulators must confirm a project won't strain the system in extreme heat or cold before approval.
    
    Fourth, no handouts. No tax breaks or TIF districts. They pay their fair share.
    
    Fifth, full bonding. Every data center must be fully bonded for decommissioning and cleanup, so taxpayers never inherit a Superfund site.
    
    Finally, no secret deals. Ban nondisclosure agreements that keep officials and residents in the dark.
    
    Growth should work for all of South Dakota, not just one town's bottom line."

    KEYWORDS: 

- candidate_first_name: Christopher
  candidate_last_name: Baumgartner
  state: sd
  race: State Senate
  district: 33
  party: Democratic
  question: sd-q7
  date:
  response: |
    "I support smart guardrails that protect people without stifling innovation.
    
    First, protect our elections. AI generated deepfakes of candidates must be clearly labeled, with real penalties for deceiving voters.
    
    Second, protect kids. AI generated sexual images of minors and nonconsensual deepfakes of anyone should be crimes, period. Third, protect learning. Critical thinking is a student's most important skill. We've all been fooled by AI videos, and today's kids will face AI their entire lives. In K through 12 schools, AI should be limited to computer courses and lessons about AI, not math, English, or social studies or other coursework.
    
    Fourth, keep a human in the loop. When AI helps decide who gets a loan, a job, insurance, or medical care, people deserve the right to appeal to a real person.
    
    Fifth, protect privacy. South Dakotans should control their personal data and know when they're talking to a machine.
    
    Sixth, lead by example. State agencies using AI should disclose how and why.
    
    Where do I draw the line? We should regulate harmful uses, not the technology itself. A small business using AI to manage inventory shouldn't face a mountain of paperwork.
    
    Done right, oversight builds the trust that lets innovation grow."

    KEYWORDS: 
