  question: sd-q3
  date:
  response: |
    "Our state is home to 9 sovereign nations, and we know their knowledge of this land and water goes back generations. Strengthening tribal capacity is good for everyone downstream across the state, so as Governor, I’d start by treating our tribes as partners, instead of an afterthought, with real government relationship before state decisions on water, land, and resource development, not after. I’d support state partnerships that help tribes secure and manage federal funding for water monitoring, wetland and grassland restoration, and drinking water infrastructure, including technical assistance so smaller tribal environmental offices aren’t shut out by complex grant applications. I’d invest in tribal colleges like Oglala Lakota College, Sinte Gleska University, and Sisseton Wahpeton College, and build research partnerships between them and our state universities so tribal students can train for careers in environmental science and natural resource management at home. Our environment doesn’t stop at reservation boundaries. When tribal nations have the resources to protect their land and water, all South Dakotans benefit, and we honor commitments the state has too often fallen short on."

    KEYWORDS: Commitment, Access, Respect
    
- candidate_first_name: Dan
  candidate_last_name: Ahlers
  state: sd
  race: Governor
  district: 
  party: Democratic
  question: sd-q4
  date:
  response: |
    "Agriculture is South Dakota’s backbone, and our farmers and ranchers are dealing with more risk than ever, from drought and severe weather to volatile input costs and trade disputes they didn’t start. As governor, I’d fully fund SDSU Extension and the Agricultural Experiment Station, because research on drought-tolerant crop varieties, soil health, and water management only helps if it reaches producers in the field. I’d support cost-share programs for conservation practices like cover crops and no-till that build resilience and cut input costs over time. 
    
    I’d expand access to precision agriculture tools and rural broadband so farmers of every size can use the technology, and I’d back right-to-repair so they aren’t stuck waiting on a dealer during planting season. To protect against market swings, I’d grow value-added processing here at home, from soybean crushing to biofuels and meatpacking, and push for trade policies that open markets rather than close them, such as a “South Dakota Beef” label. I’d also invest in beginning farmer programs so the next generation can afford to get started. Science and innovation give our producers the edge to stay competitive, and keeping more of the value chain in South Dakota keeps more money in our rural communities."

    KEYWORDS: New Markets, Stabilization, Technology

- candidate_first_name: Dan
  candidate_last_name: Ahlers
  state: sd
  race: Governor
  district: 
  party: Democratic
  question: sd-q5
  date:
  response: |
    "Too many South Dakotans drive hours to see a specialist, and too many small towns are one retirement away from losing their only doctor. As governor, I’d protect the Medicaid expansion voters approved, because it keeps rural hospitals and clinics viable financially. A great deal of our students in our universities leave our state. I’d expand loan repayment and recruitment incentives for doctors, nurses, dentists, and mental health professionals who commit to serving rural and tribal communities, and I’d grow programs like USD’s Frontier and Rural Medicine track that train students in the places that need them most. Because people tend to practice where they train, I’d invest in more residency slots here at home. I’d also let nurse practitioners, pharmacists, and community health workers practice to the full extent of their training. Technology has to be part of the answer. 
    
    South Dakota is already a national leader in telemedicine through systems like Avera eCARE, and I’d build on that by securing permanent telehealth coverage, closing broadband gaps, and supporting remote monitoring tools that let patients manage chronic conditions from home. Where you live shouldn’t determine whether you can get care, and smart investment in people and technology can make sure it doesn’t."

    KEYWORDS: Investment, Telehealth, Support

- candidate_first_name: Dan
  candidate_last_name: Ahlers
  state: sd
  race: Governor
  district: 
  party: Democratic
  question: sd-q6
  date:
  response: |
    "First, data centers should pay their own way. The cost of new transmission lines and power plants built to serve them shouldn’t be shifted onto residential ratepayers through higher electric bills. Second, water is too precious to give away. I’d require large facilities to disclose their water use up front, prioritize closed-loop cooling, and stay out of aquifers that farms and towns depend on, especially during drought. Third, new demand should come with new generation, so these projects strengthen our grid instead of straining it on the coldest winter nights. I support the 1-year moratorium on data center development. And if they do come to our state, I’d encourage pairing them with in-state renewables and storage. Finally, communities deserve a voice in decisions, and any tax incentives should be tied to real local jobs, with clawbacks if companies don’t deliver."

    KEYWORDS: Moratorium, Responsibility, Consumer First
    
- candidate_first_name: Dan
  candidate_last_name: Ahlers
  state: sd
  race: Governor
  district: 
  party: Democratic
  question: sd-q7
  date:
  response: |
    "I support regulation focused on specific harms rather than the technology itself. That means clear disclosure when AI is used in political ads, strong penalties for deepfakes used to defraud people or exploit children, and protections against AI making unchecked decisions about someone’s insurance claim, loan, job application, or benefits without a human to appeal to. I’d require state agencies to be transparent about how they use AI and to test those systems for accuracy and bias before relying on them. I’d also pass a basic data privacy law so families know what’s collected about them and can say no. Where I’d draw the line is burdensome, one-size-fits-all rules that only the largest tech companies can afford to comply with. Heavy licensing requirements and vague liability standards would shut out the startups, farmers, clinics, and researchers at our universities who are using these tools to solve local problems."

    KEYWORDS: Harm Reduction, Human First, Privacy
    
