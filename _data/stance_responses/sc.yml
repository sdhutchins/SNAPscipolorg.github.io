    Data centers and their impact on our natural resources and utility costs are issues I have already been addressing during my campaign. I support responsible economic development, but I do not believe South Carolina should rush to approve large-scale data centers without clear regulations and a full understanding of their long-term effects on surrounding communities.

    Before these projects move forward, we need to know how much electricity and water they will require, whether existing infrastructure can support that demand, what environmental and public-health impacts may result, and who will ultimately pay for the infrastructure necessary to support them.

    Working families and small businesses should not be expected to absorb higher utility costs while large corporations receive substantial incentives. I support greater transparency regarding tax incentives, energy and water consumption, infrastructure costs, environmental impacts, and the long-term economic benefits promised to the community. Residents should also have a meaningful opportunity to participate in decisions that directly affect their communities.

    My approach is straightforward: establish clear rules, protect our natural resources and existing ratepayers, ensure our infrastructure can support the development responsibly, and pursue investments that provide measurable benefits to the communities hosting them.

    Economic development should strengthen a community, not shift its costs onto the people who already call it home.

