    I speak to various groups throughout several counties regarding the impact of AI Hyperscale Data Centers and their rapid proliferation. When elected to the State House, I will immediately introduce a bill prohibiting the state and all counties, municipalities or political subdivisions within the state, from accepting or taking any action on permits or applications for "data centers" until the General Assembly establishes a comprehensive oversight and approval process for new data centers in the state that have a peak demand of 5MW or more. The public's health and environmental impacts are my primary concerns. Air pollution, sound pollution (including infra audible sounds which negatively impact crops and wildlife), water pollution and aquifer drain, among many other impacts need evaluation for restriction, limits, and/or mitigation. Economically, these businesses need to pay their own way - no tax abatements like FILOTs or MCIPs or tax incentives (since we're not creating a long term work force). They would be responsible for the cost of any required infrastructure upgrades—such as the electrical grid, substations, pumps, and emergency services—and also pay a fair price per kWh so that the residential users aren't subsidizing their massive energy use.

