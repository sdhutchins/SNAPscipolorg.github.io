  question: sc-q1
  date: 2026-09-10
  primary_candidate: false
  response: |
    I support an immediate moratorium on the approval and construction of new data centers until South Carolina establishes strong protections for residents, ratepayers, and natural resources. The rapid expansion of AI and its supporting infrastructure has created significant uncertainty about long-term demands on our electrical grid and water supply. We cannot afford to wait until communities face higher utility bills, resource shortages, or lasting environmental harm before taking action.

    Existing data centers must operate under clear regulatory safeguards. Residential and essential community needs should take priority whenever electricity or water supplies are strained. Data centers should also bear the full cost of the energy they consume and the infrastructure upgrades their operations require. Families and small businesses should not be forced to subsidize these facilities through higher utility rates.

    Any future consideration of data-center development must include independent assessments of its economic, public-health, and environmental effects; meaningful public input; transparent reporting of water and energy consumption; and enforceable limits that protect grid reliability and local resources. If a proposed facility cannot operate without increasing costs or risks for the surrounding community, it should not be approved.

- candidate_first_name: Byron
