    Public trust begins with transparency and communication.

    Elected officials should be willing to listen to scientists, researchers, healthcare professionals, educators, and other subject-matter experts, including when the evidence challenges an existing political position. Science should not be accepted when it is politically convenient and dismissed when it is not.

    At the same time, scientific information must be communicated in ways people can understand. The public deserves to know what the evidence shows, how conclusions were reached, what remains uncertain, and when new information changes our understanding of an issue.

    I also believe experts should be involved earlier in the policymaking process. Lawmakers should seek reliable evidence before writing legislation and making major decisions, rather than searching for information afterward to justify a decision already made.

    Building trust also requires listening to the public. Asking questions or expressing concerns should not automatically get someone dismissed as anti-science. People are more likely to trust institutions when they feel heard and when information is presented openly and respectfully.

    Science should help us ask better questions, understand the consequences of our decisions, and develop better solutions. It should never become another political team.

