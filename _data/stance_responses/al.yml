    As a frontline nurse, I’ve seen firsthand how scientific research isn’t an abstract academic exercise—it is the direct catalyst for lifesaving therapies, clinical breakthroughs, and everyday economic survival. Alabama’s universities, research hospitals, and biotech corridors don’t just drive medical innovation; they serve as critical economic anchors, providing thousands of quality jobs for working families across our state.

    Cutting federal research funding is short-sighted and reckless. In Congress, I will actively champion robust, forward-looking policies to protect and expand Alabama’s scientific enterprise:

    Reversing Federal Research Funding Cuts: I will fight to reverse proposed cuts to key federal granting agencies, including the National Institutes of Health (NIH), the National Science Foundation (NSF), and the Department of Energy. Sustained, predictable multi-year federal funding is essential so our researchers aren't forced to abandon critical clinical trials or lose top-tier talent to other states.

    Expanding Rural Health & Translational Clinical Research: Research breakthroughs shouldn't remain trapped in elite laboratory corridors. I will advocate for dedicated federal funding streams to support translational research that bridges the gap between major university medical centers and rural healthcare networks across North Alabama, directly addressing health disparities in chronic illness, maternal health, and occupational disease.

    Strengthening Workforce Pipelines in STEM and Biomedical Trades: Federal research dollars must translate into local economic mobility. I support expanding federal grants and partnerships with regional community colleges and public universities, ensuring Alabama students from working-class backgrounds have direct pathways into high-paying biotech, clinical research, and advanced laboratory technician careers.

    Fostering Public-Private Innovation in Clean Technology and Agriculture: Science must also tackle our region’s physical and agricultural challenges. I will push for targeted federal research allocations toward resilient agricultural technology, soil health, and decentralized clean energy development, helping our family farmers and rural economies thrive in a changing climate.

    Investing in science is an investment in Alabama’s health, workers, and future. We cannot afford leaders who treat research as expendable when our communities’ lives and livelihoods depend on it.

