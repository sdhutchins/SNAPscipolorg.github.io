    As a frontline nurse, I evaluate community health and economic development through a basic standard: does an investment strengthen everyday families, or does it leave them footing the bill for corporate profit?

    The multi-billion-dollar data center boom is driving a national technological transition, but in Alabama, we cannot afford to let corporate hype obscure the real costs to our working families, energy grid, and natural resources.

    Protecting Household Utility Bills and Grid Capacity: Alabama families already face some of the highest monthly energy burdens in the nation. Hyperscale data centers require immense, round-the-clock power. Without strict regulatory safeguards, utility monopolies will build out costly new transmission and generation capacity and pass those capital expenditures directly onto residential ratepayers. Big Tech must pay for its own infrastructure and procure dedicated clean energy generation so working families aren't subsidizing billionaire server farms.

    True Job Creation vs. Massive Corporate Subsidies: State and local governments routinely hand out hundreds of millions of dollars in tax abatements to lure data centers that create substantial temporary construction work, but often only a few dozen permanent jobs once operational. Public tax incentives should prioritize long-term, high-wage local employment, project labor agreements, and union jobs that genuinely lift rural working-class communities out of poverty.

    Safeguarding Water Tables and Farmland: Cooling these facilities demands millions of gallons of water daily, putting dangerous pressure on local municipal utilities and agricultural water tables. In rural areas where family farmers depend on stable irrigation and clean groundwater, unchecked resource extraction risks both our food systems and public health. We need binding environmental standards that mandate closed-loop cooling and water-recycling technologies.

    Economic modernization should never come at the expense of our neighbors' kitchen-table security. In Congress, I will fight for federal guardrails that ensure new technological infrastructure serves the public interest, respects our natural environment, and protects working people from bearing the brunt of corporate expansion.
