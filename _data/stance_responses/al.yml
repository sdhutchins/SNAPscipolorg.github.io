    As a frontline nurse, I approach public health with a fundamental truth: you cannot have healthy communities without clean, safe water. Alabama is blessed with some of the richest aquatic biodiversity and most vital river basins in North America, but for decades, corporate polluters have treated our waterways like private dumping grounds while working families shoulder the cost and the health risks.

    In Congress, I will treat the protection of Alabama’s lakes and rivers as both a vital public health priority and an economic necessity:

    Strict Chemical Standards and Polluter Accountability: I support enacting strict statutory limits on toxic synthetic chemicals like PFAS/PFOS in public drinking water sources. Major industrial and processing facilities should not be allowed to externalize cleanup costs onto local taxpayers. We need real-time digital discharge monitoring and steep penalties for unpermitted pollution to safeguard critical waterways like the Locust Fork and the Black Warrior River basin.

    Cleaning Up Legacy Mining Waste: Decades of coal extraction across North Alabama have left millions of cubic yards of waste piles leaching toxic acid drainage into our riverbanks and groundwater. I will fight to expand the enforcement authority and funding of the Office of Surface Mining Reclamation and Enforcement (OSMRE) to remediate high-risk sites and close corporate bankruptcy loopholes that let polluters walk away from their environmental obligations.

    Protecting Agricultural Watersheds: Working with our family farmers—not penalizing them—is essential to stopping nutrient runoff. I will champion federal matching grants for agricultural cooperatives to adopt advanced subsurface-banding technology, preventing phosphorus and heavy metal runoff from washing into local creeks and reservoirs.

    Investing in Rural Water Infrastructure: Clean water is a basic human right. Through the Drinking Water State Revolving Fund and USDA Rural Development programs, I will push for targeted capital injections to modernize rural treatment facilities, help local authorities extend municipal lines into underserved areas, and ensure no family is left drinking contaminated well water.

    Protecting our waterways means safeguarding Alabama’s health, economy, and natural heritage for generations to come.

