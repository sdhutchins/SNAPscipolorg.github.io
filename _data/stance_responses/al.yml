    As a nurse, I’ve spent my career understanding that preventative care is far cheaper and more effective than emergency intervention after a crisis strikes—and that exact principle applies to Alabama’s infrastructure and climate resilience.

    Even though District 4 is inland, what affects our coast affects every single taxpayer and worker across Alabama. Rising insurance premiums aren’t just a localized inconvenience; they represent a broken system where working families bear the financial brunt of corporate price gouging and underfunded public infrastructure while leaders look away.

    If elected to Congress, I would pursue a proactive, community-first approach to protect coastal regions like Dauphin Island:

    Invest Directly in Nature-Based Solutions: Living shorelines, coastal wetlands, and barrier island replenishment are proven, cost-effective defenses against storm surges. I will advocate for expanding federal grant funding through NOAA and the National Fish and Wildlife Foundation, ensuring funds go directly toward local shoreline restoration projects rather than stalling in bureaucratic red tape.

    Reform Disaster Mitigation & Insurance Burdens: We cannot simply wait for a storm to hit and leave working families stranded with unaffordable flood insurance rates. I support reforming federal flood mitigation programs—like FEMA’s Building Resilient Infrastructure and Communities (BRIC) program—so federal dollars actively reward proactive resiliency planning and bring insurance costs down for everyday homeowners.

    Prioritize Local Workers and Ecosystems: Federal investments in coastal resilience must prioritize local maritime labor and community input. Restoration projects should create durable union jobs while protecting commercial fishing, tourism, and marine biodiversity that Alabama’s economy relies upon.

    Leadership means protecting communities before disaster strikes. Investing in natural buffers and climate-resilient infrastructure is a commonsense safeguard for Alabama's families, economy, and future.

