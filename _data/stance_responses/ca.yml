    "The proliferation of data centers has greatly outpaced our state’s capacity for meaningful oversight. Their rapid expansion, particularly with the growth of artificial intelligence, raises serious questions about energy demand, water consumption, noise, and impacts on surrounding communities. I support a moratorium on new large-scale AI data centers until California establishes clear standards to address those impacts and ensures that their growth does not undermine our climate and clean-energy goals.

    Existing facilities should be subject to greater transparency regarding their energy and water use and held to strong environmental and public health standards. California should also ensure that data centers are not increasing electricity costs for working families or placing additional strain on communities already facing water or energy challenges.

    This is not about rejecting technology or innovation. It is about making sure California understands the consequences of this rapidly growing industry and implements policies that work for our state before allowing unchecked expansion. Any future data center development should show it can operate responsibly and efficiently, protecting our natural resources, our electrical grid, and the communities where these facilities are located. Stakeholders from all sides of this conversation need to be at the table to ensure we get this right."
    
    KEYWORDS: AI Oversight, Resource Sustainability, Community Protection

