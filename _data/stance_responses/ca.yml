    "I believe healthcare is a human right, and I support moving California toward universal, single-payer healthcare through CalCare so access to care is based on need, not income or employment. Until we achieve that goal, we must protect and strengthen Medi-Cal, expand coverage, reduce out-of-pocket costs, and ensure Californians can access mental health, reproductive, preventive, and primary care.

    We also need to address our healthcare workforce shortage. I support strong staffing standards, investments in healthcare education and training, and efforts to recruit and retain providers in rural and underserved communities. Healthcare workers should have the staffing, protections, and working conditions necessary to provide quality care.

    Public health also extends beyond the healthcare system. Clean air, safe drinking water, healthy housing, and protection from toxic pollution directly affect health outcomes. California should continue holding polluters accountable and investing in communities that have experienced disproportionate environmental and public health burdens.

    Our goal should be a healthcare system that puts patients and public health ahead of profit and ensures quality care is accessible to every Californian."
    
    KEYWORDS: Universal Healthcare, Healthcare Workforce, Health Equity
    
