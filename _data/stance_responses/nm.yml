  response: |
      Water security is essential to New Mexico’s health, agriculture, jobs, and future growth. I would prioritize protecting existing supplies and making every public dollar produce measurable results. 
    
      My first priorities would be repairing leaking water lines, modernizing aging drinking-water and wastewater systems, and improving storage and delivery infrastructure. I would support voluntary agricultural conservation programs developed with farmers, ranchers, and acequia communities, while respecting tribal sovereignty and existing water rights. 
    
      I would invest in groundwater mapping, monitoring wells, watershed restoration, and research on drought, aquifer recharge, and reservoir evaporation. Promising technologies include leak-detection sensors, precision irrigation, and safely treated municipal wastewater reuse. New treatment technologies should demonstrate safety, affordability, and reliable performance before expansion. 
    
      Every funded project should establish a baseline, measurable targets, and public reporting. I would track verified acre-feet conserved or added annually, reductions in water-system leakage, groundwater levels, water quality, service reliability, and cost per acre-foot. Evaluations should account for drought conditions and distinguish reduced withdrawals from actual reductions in water consumption. 
    
      I would bring local utilities, scientists, tribal governments, agricultural producers, and communities together to select projects that protect affordable access to clean water and deliver lasting benefits.

