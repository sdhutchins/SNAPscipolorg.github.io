      As a board-certified hospice chaplain, I see how distance, provider shortages, and financial barriers affect patients and families. Access to timely care is a central priority of my campaign. 
    
      I would support sustainable Medicaid reimbursement, make the Torte Reform similar to Texas as that’s where our healthcare professionals go, timely provider payments, targeted support for rural hospitals and clinics, and medical liability reforms that preserve patient accountability while helping retain providers. Medicare payment changes require federal action, and I would advocate with our congressional delegation. 
    
      I would expand rural training placements, service-linked loan repayment for serving 5-10 years, community health workers, mobile clinics, transportation assistance, and reliable broadband for telehealth. Priorities should include primary care, maternity services, behavioral health, and hospice and palliative care. 
    
      I would work directly with tribal governments through regular government-to-government consultation, allowing each community to identify its priorities. Partnerships with tribal health programs and the Indian Health Service should respect tribal sovereignty, cultural practices, and control over health data. 
    
      Progress should be measured through appointment wait times, travel distances, provider vacancies and retention, service availability, completed referrals, preventable hospitalizations, and patient experience. Measures should be developed with participating communities and reported with privacy protections. 
    
      My goal is dependable care closer to home, with resources directed toward demonstrated needs and measurable improvements.
    
