      1.        Allows use of produced water in New Mexico.
      2.        Provides standards for water quality for human and agricultural use. Such standards already exist for potable water, but need to be applied in this unique situation.
      3.        Supports private efforts to treat and distribute produced water. The state only needs to provide sensible guidelines.
