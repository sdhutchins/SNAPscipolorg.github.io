- candidate_first_name: Grace  # this is Bryce's cat. titles and middle names go here
  candidate_last_name: Nagamine # used for alphabetical sorting
  state: nm
  race: State House of Representatives # must match one of the options!
  district: 51 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Independent # must match one of the options!
  question: nm-q1
  date: 2026-10-05 # optional
  primary_candidate: false # optional, default false; true = ran in the primary but did not advance. Must be the same on every row for a given candidate
  did_not_respond: false # optional, default false; true = never responded at all. Must be the same on every row for a given candidate
  response: |
      In House District 51, water is everything. Alamogordo depends on mountain surface water, and well owners near Holloman have lived with PFAS contamination since 2016.

      Oil and gas jobs matter to New Mexico families, and I want that industry to succeed. Recycling produced water inside the oilfield is a win for everyone, saving fresh water for homes and farms.

      Outside the oilfield, my standard is the one I gave the Sierra Club, which has endorsed my campaign: prove it is safe first. No reuse until independent scientists with no financial tie to the industry confirm treatment removes salts, chemicals, and radioactive materials. Even then, I would limit it to industrial uses, never drinking water or agriculture.

      I would also support:

      Public monitoring of disposal wells, spills, and seismic activity
      Independent water testing, toxicology studies, and pilot data, made public
      Financial assurance so ratepayers never pay for cleanup

      My opponent's biggest donor is the oil and gas industry. My donations come from individuals in this district, so I can respect the industry and its workers while answering only to the people who drink this water.

- candidate_first_name: Grace
  candidate_last_name: Nagamine
  state: nm
  race: State House of Representatives
  district: 51
  party: Independent
  question: nm-q2
  date: 2026-10-05
  primary_candidate: false
  response: |
      Alamogordo has already shown what conservation can do, cutting per-person water use from 260 to 165 gallons a day. But conservation alone cannot fix 70-year-old pipes or replace a reservoir lost to wildfire, as Bonito Lake was in 2012.

      My priorities:

      Fix leaks first. Fund replacement of aging water mains so treated water reaches homes instead of soaking into the ground.
      Conservation and reuse. Expand conservation programs and municipal wastewater reuse, proven and lower-cost sources of supply.
      Finish desalination. Complete the pipeline for Alamogordo's brackish groundwater project, a drought-resistant new supply.
      Protect watersheds. Invest in forest thinning and wildfire prevention above our surface water sources.
      Know what we have. Fund aquifer mapping, groundwater monitoring, and the State Engineer's office so decisions rest on data.
      Reform capital outlay. Billions in approved infrastructure dollars sit unspent statewide. Fund ready projects and help small communities win Water Trust Board and Colonias funds.

      I would measure success with public numbers: annual water-loss audits, main breaks per mile, gallons used per person, acre-feet of new supply delivered, aquifer levels, and how quickly state dollars become finished projects.

- candidate_first_name: Grace
  candidate_last_name: Nagamine
  state: nm
  race: State House of Representatives
  district: 51
  party: Independent
  question: nm-q3
  date: 2026-10-05
  primary_candidate: false
  response: |
      New Mexico is still living with the last uranium boom. Hundreds of abandoned mines remain on or near the Navajo Nation, and the companies that profited never paid the full cost of cleanup.

      Here in the Tularosa Basin, we know this story. Downwinder families waited generations for recognition after the Trinity test. I stand with them and will advocate for the compensation and health care they are owed.

      My position is the one I gave the Sierra Club, which has endorsed my campaign:

      Clean up first. I support state funding to speed remediation and pressing the federal government and responsible companies to pay, not taxpayers.
      No new mines until the old bill is settled. I will not support new uranium mining until legacy contamination is addressed and independent review, not industry-funded review, confirms water and public health are protected.
      Consent of affected communities. Tribal governments are sovereign. No project should move forward over the objection of the communities it affects.

      Science should decide the safety questions: independent groundwater monitoring, health studies, and water-use data, all made public. I support nuclear energy and its jobs, but not at the expense of families' water.

- candidate_first_name: Grace
  candidate_last_name: Nagamine
  state: nm
  race: State House of Representatives
  district: 51
  party: Independent
  question: nm-q4
  date: 2026-10-05
  primary_candidate: false
  response: |
      Space is part of who we are in Otero County. I attended the New Mexico Museum of Space History's 50th anniversary celebration in Alamogordo, and it reminded me how deeply space and Holloman Air Force Base are woven into our community and economy. I am proudly pro-military and pro-space, and I want New Mexico to lead in commercial aerospace.

      I would support future state investment with clear conditions:

      Public dollars, public returns. Tie funding to measurable benchmarks: jobs for New Mexicans, local contracts, and lease revenue, with repayment if commitments are missed.
      Fair cost sharing. The state builds shared infrastructure such as roads and utilities. Private operators pay their own operating costs, insurance, debris recovery, and environmental cleanup.
      Protect the mission. Commercial activity must be coordinated with Holloman and White Sands Missile Range so it never compromises airspace or military readiness.
      Safety first. Require wildfire prevention plans, debris response plans, and financial assurance before launch.

      I would evaluate benefits with an independent annual report: taxpayer dollars in, jobs and revenue out, alongside incidents, wildfire risk, and community concerns. We lost Bonito Lake to wildfire once. Growth and safety have to go together.

- candidate_first_name: Grace
  candidate_last_name: Nagamine
  state: nm
  race: State House of Representatives
  district: 51
  party: Independent
  question: nm-q5
  date: 2026-10-05
  primary_candidate: false
  response: |
      WIPP serves a national defense mission, and it provides good jobs for southeastern New Mexico families. I respect that work and want it done safely.

      But New Mexico already carries more than its share of the nation's nuclear waste. My position is the one I gave the Sierra Club, which has endorsed my campaign: I oppose bringing additional high-level waste to our state.

      For WIPP, that means:

      Keep the mission as promised. WIPP was built for defense-related transuranic waste within limits set by law. I would oppose expanding the types or amount of waste without independent scientific review, state consent, and public input.
      Strong state oversight. Fully fund the Environment Department's permitting and inspection role so the state is never just a bystander.
      Safe transportation. Fund training and equipment for first responders along shipping routes.
      Protect workers. The 2014 fire and radiation release closed WIPP for nearly three years. Workers deserve strong safety standards and whistleblower protection.

      I would measure effectiveness with public data: shipment incidents, worker exposure records, independent air and groundwater monitoring, and inspection results, reported every year.

- candidate_first_name: Grace
  candidate_last_name: Nagamine
  state: nm
  race: State House of Representatives
  district: 51
  party: Independent
  question: nm-q6
  date: 2026-10-05
  primary_candidate: false
  response: |
      In the desert, water and affordable power come first. I am not calling for a ban, but a data center proposal must meet three conditions or it should not be considered:

      Closed-loop water that does not draw on local aquifers or water-short areas.
      Its own power, separate from the grid, with no effect on electric rates for residents or small businesses.
      A noise mitigation plan that protects neighbors.

      Costs should follow the project. If a data center needs new power plants, grid upgrades, roads, or water lines, the company pays, not households.

      Residents deserve a real voice: public hearings before approval and full disclosure of water and energy use.

      I would judge promises against evidence: independent audits of water and power use, verified local job counts, and tax revenue actually received, with incentives tied to results.

      I have put my conditions in writing. My opponent has not stated a position in his own name, while the news site he founded and edits has welcomed Project Jupiter and criticized those who want to slow it down.

- candidate_first_name: Grace
  candidate_last_name: Nagamine
  state: nm
  race: State House of Representatives
  district: 51
  party: Independent
  question: nm-q7
  date: 2026-10-05
  primary_candidate: false
  response: |
      I worked as a certified nursing assistant and cared for family at home, so I know what distance costs rural families: missed work, missed appointments, and care that comes too late.

      I would support:

      Workforce first. Better pay and training for CNAs, nurses, and direct-care workers, loan repayment for providers who serve rural areas, and a stronger healthcare pipeline at NMSU-Alamogordo.
      Faster licensing. License portability so military spouses and out-of-state professionals can start work quickly.
      Care closer to home. Telehealth with reliable rural broadband, home- and community-based care for seniors, and transportation to appointments and pharmacies.
      Behavioral health. More rural treatment capacity and crisis teams that pair officers with mental health professionals.

      Tribal governments are sovereign partners, including our neighbors in the Mescalero Apache Tribe. I would start by listening, consult government to government before legislation is drafted, and support Tribal priorities for funding and facilities instead of substituting my own.

      I would measure progress with public numbers: travel time to care, appointment wait times, provider vacancies, and preventable emergency room visits, reported by county and Tribal community so rural areas are not hidden in statewide averages.


