  response: |
      I would support WIPP continuing its authorized mission of disposing of defense-related transuranic waste, provided it meets rigorous safety standards and protects workers, nearby communities, and water resources. 
    
      I would oppose expanding WIPP to accept commercial spent nuclear fuel or high-level radioactive waste. Proposals to change accepted waste types or increase disposal amounts should require independent scientific review, transparent public hearings, applicable legal approvals, and meaningful consultation with affected tribal governments and communities. Economic benefits should be evaluated alongside long-term risks and costs. 
     
      I would support strong state permitting and federal oversight, independently verified waste characterization, certified shipping containers, vehicle inspections, shipment tracking, and federally funded emergency training and equipment for communities along transportation routes. 
    
      Worker protections should include radiation exposure monitoring, effective ventilation and fire protection, regular training, confidential reporting, protection against retaliation, and authority to stop unsafe work. Environmental monitoring results should be publicly available. 
    
      I would evaluate effectiveness through worker radiation doses, environmental measurements compared with baseline levels, transportation incidents and near misses, emergency drill performance, inspection findings, and timely correction of violations. Long-term assessments must also address containment after closure. 
    
      My priority is responsible stewardship: meeting national obligations while protecting New Mexicans today and future generations.
    
