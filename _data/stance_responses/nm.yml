  response: |
      New Mexico needs dependable energy, good jobs, and clean water. I support responsible oil and gas production alongside science-based safeguards that protect public health and our limited freshwater supplies. 
    
      I would support recycling produced water within oil and gas operations, independent treatment research, and carefully controlled pilot projects evaluating reuse outside the industry. Any expanded use should require evidence that treatment consistently meets health and environmental standards for the specific application. 
    
      I would support comprehensive contaminant testing, groundwater monitoring, publicly accessible results, safe disposal of treatment residues, and enforceable industry responsibility for spills and cleanup. Disposal wells should have seismic monitoring and clear thresholds requiring reduced injection or shutdown when earthquake risks increase. 
    
      My position would be informed by peer-reviewed research, independent laboratory testing, long-term toxicity studies, and field demonstrations measuring treatment reliability, groundwater impacts, and actual freshwater savings. Researchers should disclose funding and conflicts of interest. 
    
      I would not support using produced water for drinking supplies or food-crop irrigation without compelling, independently verified safety evidence and enforceable protections. I would listen to scientists, communities, tribal governments, and industry, and update my position as reliable evidence develops.
    
